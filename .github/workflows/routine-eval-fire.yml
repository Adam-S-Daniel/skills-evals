name: Fire eval routine

# Fires the eval runner routine (ADR 0010, "Smallest next PRs" item 2):
# https://claude.ai/code/routines/trig_014cqgegCtJUqXYjAKmkr4J5
#
# * `workflow_dispatch` ONLY. The weekly caller dispatches eval mode; #71's
#   three-PR gate (ADR 0010, decision 4) keeps the improvement loop off the
#   schedule until three human-reviewed loop PRs have merged. No pull_request
#   or push: a pull_request job would
#   have to be a required check, and nothing here should run, or spend
#   subscription usage, because a pull request changed.
# * Every dispatch input is read from $GITHUB_EVENT_PATH as data, never
#   interpolated into a `run:` block (the rendered command is echoed into a
#   public log), and validated before the bearer is ever in a step's env.
# * Three routine modes and a sentinel (Adam, 2026-10-06, scaffold mode: "New fire-workflow input
#   (Recommended)"). `eval`, the default, sends exactly five fields: mode,
#   run_id, fixture, arms, trials, then `model` only when that input is set
#   (#68, #372 U4; see below), and last `vouch_nonce` (#70, see below). `scaffold` sends exactly four: mode,
#   run_id, candidate (a miner key, OWNER__REPO__PR) and issue_snapshot, and
#   the routine turns that one candidate into one draft real-work fixture on
#   its own branch.
#   `improve` (ADR 0005, "Routine improve mode addendum") sends exactly
#   five: run_id, mode, skill, trials and holdout (null when empty), and
#   the routine runs the improvement loop on that skill. `skill` must pass
#   the loop's own fixture resolution (`scripts/improve_gate.py
#   fire-check`): nested evals/<skill>/<name> fixtures that all name it and
#   adam-agentskills, at least the loop's minimum of them, and `holdout`
#   empty or one of their names. Each mode's own text inputs must
#   be empty in the others (`candidate` and `skill`/`holdout` in eval mode,
#   `fixture` and `skill`/`holdout` in scaffold mode, `fixture` and
#   `candidate` in improve mode), so no input is silently ignored except
#   arms and trials, which are choices; arms is sent in eval mode only and
#   trials in eval and improve. The routine treats the payload as
#   untrusted, and so does this workflow when it builds it: jq encodes
#   every value.
# * `model` (#68's first slice, #372 U4) is valid in eval mode only, and
#   required there (#70, round 8, R8-3): the sweep dispatches each fixture
#   once per roster arm. It must be the `id` of an arm in evals/roster.yml
#   on the default branch, checked by scripts/roster_arm.py, which parses
#   the YAML with the harness's own reader; the judge is not an arm. A
#   refusal is a fixed message that never echoes the input. An eval payload
#   always carries `model`, after `trials` and before `vouch_nonce`.
#   `run-name` is rendered from the inputs alone, so requiring it is what
#   makes every eval fire's title name the cell it is for
#   (scripts/compute_gates.py); the weekly caller (routine-eval-weekly.yml)
#   resolves it (`roster_arm.py --resolve`: the fixture's pin, else the
#   roster's first arm) and passes it. The routine's saved prompt turns the
#   payload's `model` into the runner's model flag; that prompt is not in
#   this repo.
# * `sentinel` mode (#70, round 8, R8-1) validates (every text input
#   empty), then checks out nothing more, skips the allowance guard and the
#   fire step, and succeeds: no curl, no nonce, nothing sent to the routine.
#   Its run is the retirement gates' high-water mark: part 2 dispatches one
#   and waits for it to succeed before computing, and compute_gates reads
#   every run number below the first trusted sentinel created at or after
#   `--as-of`, so deleting the newest fires leaves a gap. Its title says
#   `mode=sentinel`; scripts/allowance_guard.py counts no sentinel as a
#   pending fire.
# * Scaffold mode's issue snapshot (Adam, 2026-10-06: "Fire workflow
#   precomputes (Recommended)"): a routine session refuses GitHub GraphQL,
#   and an issue's body revisions have no REST read, so after validation,
#   with the bearer in no step's env, the snapshot step runs
#   `scripts/scaffold_real_work.py snapshot` with the job's read-only token:
#   the closing issue's title and body as they stood before the pull
#   request's first commit, with the three provenance times, or null when
#   it closes no issue. The candidate must be a fleet repository (owner in
#   SYNC_OWNERS, name in cron_coverage.fleet, from _agent-guidance's default
#   branch; Adam, 2026-10-06: "Pin to fleet owners (Recommended)") whose
#   GitHub full_name is the key's. Several closing issues (Adam,
#   2026-10-06: "Keep refusing (Recommended)"), or any failed read, stop the
#   run before the fire. routine-scaffold-gate.yml recomputes the same
#   snapshot and rejects a branch whose copy differs.
# * The fire API caps `text` at 65,536 characters
#   (https://platform.claude.com/docs/en/api/claude-code/routines-fire; 400
#   above it). The payload's UTF-8 bytes, never fewer than its characters by
#   any count, are checked against that before the call, and a larger
#   payload is refused, never truncated.
# * The fire bearer (EVAL_ROUTINE_FIRE_BEARER, a repository secret per ADR
#   0010 decision 5) reaches only the fire step, via `env`, and goes to curl
#   on stdin, never in argv. The HTTP response body is never printed: the
#   log names the status code and the run id, and the session URL goes to the
#   job summary only after it matches the documented shape.
# * The weekly allowance guard (#68; Adam, 2026-10-10: all automated evals
#   within 30% of the weekly allowance): after validation and before the
#   fire, in every mode but sentinel, scripts/allowance_guard.py check
#   reads the ingested runs of the last seven days from a read-only checkout
#   of persistent/eval-results, counts this workflow's successful runs in the
#   same window (sentinels aside) with the job's token (hence `actions:
#   read`), and refuses the
#   fire unless spent + pending + this run's reservation stays within
#   evals/budget.yml's weekly_cap. An API error refuses too (fail closed). Its
#   log line is numbers only. See docs/how-it-works.md, "The weekly allowance
#   guard".
# * No retry: the fire API has no idempotency key, so a retry after a lost
#   response would start a second session (and spend a second fire).
# * Results land on `claude/eval-<run id>`, pushed by the routine; the
#   validator and ingester for that branch is a separate workflow (ADR 0010,
#   decision 2). A scaffold run pushes `claude/scaffold-<fixture id>`
#   instead, which its own gate validates, and an improve run pushes
#   `claude/eval-improve-<run id>` only for an accepted candidate, which
#   routine-improve-gate.yml validates. Nothing here writes to the
#   repository.
#
# API: https://platform.claude.com/docs/en/api/claude-code/routines-fire
#
# * `run-name` (#70) carries the inputs the retirement gates need, since
#   the Actions runs API does not return dispatch inputs:
#   scripts/compute_gates.py reads a fire's mode, fixture, model, arms and
#   trials from its display title (`FIRE_TITLE_RE`) to vouch for the
#   routine run it started. It is not a shell, so this is not the `run:`
#   interpolation case; an unexpected value only makes a title that vouches
#   for nothing.
# * The vouch nonce (#70, rounds 4 and 5): in eval mode the fire step
#   derives nonce = HMAC-SHA256(VOUCH_KEY, run id) as hex (the repository
#   secret VOUCH_KEY; scripts/write_vouch.py's `derive_nonce`), masks it,
#   and sends it to the routine as the payload's one optional key
#   `vouch_nonce` (the bare 64 lowercase hex, nothing else). It is never
#   printed and NOTHING about it is published: not the nonce, not a hash of
#   it. The routine pipes it to scripts/write_vouch.py, which writes
#   `eval-results/<run id>/vouch.json` = {"mac": HMAC(nonce, manifest of its
#   results)}; that is in the routine's prompt, not in fire text, which the
#   routine treats as untrusted data. routine-eval-ingest.yml re-derives the
#   nonce from VOUCH_KEY and ingests nothing whose MAC does not verify. The
#   step still emits `::notice title=routine-vouch::run_id=<run id>`, which
#   part 2 reads from the run's annotations into compute_gates' `--fires`.
#   Without VOUCH_KEY the payload has no `vouch_nonce` and the eval still
#   runs, but its results cannot be ingested.
#   The request body goes to curl from a file (`--data-binary @file`), and
#   the nonce to jq through its environment, so neither is in any argv.
#   MERGE ORDER: the routine's prompt refuses an eval payload with any key
#   outside its list. BEFORE this workflow change merges, the routine
#   prompt must accept `vouch_nonce` and run scripts/write_vouch.py, and
#   the VOUCH_KEY repository secret must exist; otherwise every eval fire
#   is refused, or no eval result can be ingested. The prompt's two lines:
#     Accept the optional eval payload key `vouch_nonce` (exactly 64
#     lowercase hex); never print, log, echo or commit it.
#     The moment the harness exits, before reading any report, trace or
#     other arm output, run `printf %s "$VOUCH_NONCE" | python3
#     scripts/write_vouch.py eval-results/<run id>`, then unset VOUCH_NONCE,
#     and commit the vouch.json it wrote with the results.
#   Running write_vouch first keeps the nonce out of the routine's context
#   once it reads output an agent arm could have shaped (round 6, R6-3).

run-name: >-
  Fire eval routine: mode=${{ inputs.mode }} fixture=${{ inputs.fixture }} model=${{ inputs.model }} arms=${{ inputs.arms }} trials=${{ inputs.trials }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          eval runs a fixture; scaffold turns one miner candidate into a
          draft real-work fixture; improve runs the improvement loop on
          one skill; sentinel validates and fires nothing (the retirement
          gates' run-number high-water mark).
        required: true
        type: choice
        options: [eval, scaffold, improve, sentinel]
        default: eval
      candidate:
        description: >-
          Scaffold mode only (leave empty for eval): the miner key,
          OWNER__REPO__PR, e.g. Adam-S-Daniel__skills-evals__123.
        required: false
        type: string
      fixture:
        description: >-
          Eval mode only (leave empty otherwise): fixture directory under
          evals/, e.g. evals/writing-adrs/bootstrap. Must be a committed
          evals/**/fixture.yaml directory on the default branch.
        required: false
        type: string
      skill:
        description: >-
          Improve mode only (leave empty otherwise): the skill name, e.g.
          writing-adrs. evals/<skill>/ must hold at least three committed
          fixtures on the default branch.
        required: false
        type: string
      holdout:
        description: >-
          Improve mode only, optional: one fixture name under
          evals/<skill>/ to hold out, e.g. supersede. Empty means none.
        required: false
        type: string
      model:
        description: >-
          Eval mode only, required there (leave empty otherwise): the id
          of one arm in evals/roster.yml, e.g. claude-opus-5-5.
        required: false
        type: string
      arms:
        description: Which arms to run.
        required: true
        type: choice
        options: [both, with, without]
        default: both
      trials:
        description: Trials per arm (1-3).
        required: true
        type: choice
        options: ["1", "2", "3"]
        default: "1"

permissions:
  contents: read
  # The allowance guard counts this workflow's own successful runs (#68).
  actions: read

jobs:
  fire:
    # The secret is repository-wide, so refuse a dispatch of this file from
    # any other branch: only the default branch's copy may fire the routine.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Pinned, not the runner's system Python (WorkflowPinnedPythonTests):
      # the validation step lists committed fixtures with
      # scripts/plan_scheduled_evals.py and, in improve mode, runs
      # scripts/improve_gate.py fire-check.
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # fire-check loads fixture.yaml files: the gate workflows' PyYAML pin.
      - name: Install PyYAML
        run: python3 -m pip install pyyaml==6.0.3

      - name: Validate the dispatch inputs
        id: validate
        run: |
          set -euo pipefail
          export LC_ALL=C
          event="${GITHUB_EVENT_PATH:?}"
          # NUL first, on the event file itself: bash's $( ) drops a NUL, so
          # every check below would otherwise judge a different string than
          # the dispatcher sent. No rejection echoes the value back.
          # `fixture`, `candidate`, `skill`, `holdout` and `model` are
          # optional strings (each is used in one mode only), so an absent
          # one reads as empty.
          if jq -e '[.inputs.mode, .inputs.arms, .inputs.trials,
                     (.inputs.fixture // ""), (.inputs.candidate // ""),
                     (.inputs.skill // ""), (.inputs.holdout // ""),
                     (.inputs.model // "")]
                    | any(type != "string" or test("\u0000"))' \
               "$event" >/dev/null; then
            echo "::error::a dispatch input is missing, not a string, or contains a NUL byte"
            exit 1
          fi
          # Also on the event file: $( ) strips trailing newlines, so a
          # value ending in one would otherwise pass the pattern below.
          if jq -e '[.inputs.mode, (.inputs.candidate // ""),
                     (.inputs.skill // ""), (.inputs.holdout // ""),
                     (.inputs.model // "")]
                    | any(test("[\u0000-\u001f\u007f]"))' \
               "$event" >/dev/null; then
            echo "::error::input 'mode', 'candidate', 'skill', 'holdout' or 'model' contains a control character"
            exit 1
          fi
          mode="$(jq -r '.inputs.mode' "$event")"
          candidate="$(jq -r '.inputs.candidate // ""' "$event")"
          fixture="$(jq -r '.inputs.fixture // ""' "$event")"
          skill="$(jq -r '.inputs.skill // ""' "$event")"
          holdout="$(jq -r '.inputs.holdout // ""' "$event")"
          model="$(jq -r '.inputs.model // ""' "$event")"
          arms="$(jq -r '.inputs.arms' "$event")"
          trials="$(jq -r '.inputs.trials' "$event")"

          case "$arms" in
            both|with|without) ;;
            *)
              echo "::error::input 'arms' must be both, with or without"
              exit 1 ;;
          esac
          case "$trials" in
            1|2|3) ;;
            *)
              echo "::error::input 'trials' must be 1, 2 or 3"
              exit 1 ;;
          esac

          case "$mode" in
            eval|scaffold|sentinel)
              if [ -n "$skill" ] || [ -n "$holdout" ]; then
                echo "::error::inputs 'skill' and 'holdout' must be empty unless the mode is improve"
                exit 1
              fi ;;
          esac
          case "$mode" in
            scaffold|improve|sentinel)
              if [ -n "$model" ]; then
                echo "::error::input 'model' must be empty unless the mode is eval"
                exit 1
              fi ;;
          esac
          case "$mode" in
            eval)
              if [ -n "$candidate" ]; then
                echo "::error::input 'candidate' must be empty in eval mode"
                exit 1
              fi ;;
            scaffold)
              if [ -n "$fixture" ]; then
                echo "::error::input 'fixture' must be empty in scaffold mode"
                exit 1
              fi
              # The miner key pattern the routine re-checks. The repository
              # part admits `_`, so a repository named `_x` still has a key.
              if ! [[ "$candidate" =~ ^[A-Za-z0-9-]+__[A-Za-z0-9._-]+__[1-9][0-9]{0,6}$ ]]; then
                echo "::error::input 'candidate' is empty or is not a miner key (OWNER__REPO__PR)"
                exit 1
              fi ;;
            improve)
              if [ -n "$fixture" ] || [ -n "$candidate" ]; then
                echo "::error::inputs 'fixture' and 'candidate' must be empty in improve mode"
                exit 1
              fi
              # The skill-name pattern the routine re-checks.
              if ! [[ "$skill" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
                echo "::error::input 'skill' is empty or is not a skill name"
                exit 1
              fi
              # The holdout is a single fixture name, no path; fire-check
              # below checks it is one of the skill's fixtures.
              if [ -n "$holdout" ] && ! [[ "$holdout" =~ ^[A-Za-z0-9._-]{1,128}$ ]]; then
                echo "::error::input 'holdout' is longer than 128 characters or has characters outside [A-Za-z0-9._-]"
                exit 1
              fi ;;
            sentinel)
              # Every text input empty (checked above for skill, holdout
              # and model), so its title carries no fixture or model.
              if [ -n "$fixture" ] || [ -n "$candidate" ]; then
                echo "::error::inputs 'fixture' and 'candidate' must be empty in sentinel mode"
                exit 1
              fi ;;
            *)
              echo "::error::input 'mode' must be eval, scaffold, improve or sentinel"
              exit 1 ;;
          esac

          if [ "$mode" = eval ]; then
            case "$fixture" in
              *[!A-Za-z0-9/_.-]*|'')
                echo "::error::input 'fixture' is empty or has characters outside [A-Za-z0-9/_.-]"
                exit 1 ;;
            esac
            case "/$fixture/" in
              */../*|*/./*|*//*)
                echo "::error::input 'fixture' has an empty, '.' or '..' path segment"
                exit 1 ;;
            esac
            case "$fixture" in
              evals/*) ;;
              *)
                echo "::error::input 'fixture' is not under evals/"
                exit 1 ;;
            esac
            # Exact, whole-line match against git's index of committed
            # fixtures: a here-string, never a pipe into an early-exit grep.
            committed="$(python3 scripts/plan_scheduled_evals.py --committed)"
            if ! grep -Fxq -- "$fixture" <<<"$committed"; then
              echo "::error::input 'fixture' names no committed fixture on the default branch"
              exit 1
            fi
            # An arm id from the committed roster, parsed as YAML. The shape
            # check comes first so no value with a leading `-` reaches a
            # command line; the script reads its first argument literally
            # too, and its own refusal is the same fixed text.
            # Required (#70, round 8, R8-3): `run-name` is rendered from the
            # inputs alone, so only a dispatch that names its model has a
            # title that says which cell its results are for.
            if [ -z "$model" ]; then
              echo "::error::input 'model' is required in eval mode (an arm of evals/roster.yml)"
              exit 1
            fi
            if ! [[ "$model" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]] \
               || ! python3 scripts/roster_arm.py "$model"; then
              echo "::error::input 'model' is not an arm of the committed evals/roster.yml"
              exit 1
            fi
          fi

          if [ "$mode" = improve ]; then
            # The loop's own resolution, read-only and offline: the nested
            # evals/<skill>/<name> fixtures must all name this skill and
            # one registry, harness/registries.yml must map it to
            # adam-agentskills (the one registry the routine checks out),
            # there must be at least the loop's MIN_FIXTURES, and a holdout
            # must be one of them. Only the registry-side SKILL.md lookup,
            # which needs the registry checkout, is left to the routine.
            # Its refusals are fixed text and never echo the input.
            # `--holdout=VALUE` is one word: a holdout with a leading `-`
            # (its pattern allows one) is read as a name, never as a flag.
            if ! python3 scripts/improve_gate.py fire-check "$skill" --holdout="$holdout"; then
              echo "::error::input 'skill' or 'holdout' is refused by the improvement loop's fixture check"
              exit 1
            fi
          fi

          run_id="$(date -u +%Y%m%dT%H%M%SZ)-$(od -An -N3 -tx1 /dev/urandom | tr -d ' \n')"
          if ! [[ "$run_id" =~ ^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{6}$ ]]; then
            echo "::error::generated run id has an unexpected shape"
            exit 1
          fi

          {
            echo "mode=${mode}"
            echo "candidate=${candidate}"
            echo "fixture=${fixture}"
            echo "skill=${skill}"
            echo "holdout=${holdout}"
            echo "model=${model}"
            echo "arms=${arms}"
            echo "trials=${trials}"
            echo "run_id=${run_id}"
          } >> "$GITHUB_OUTPUT"
          echo "run id: ${run_id}"
          if [ "$mode" = scaffold ]; then
            echo "mode: scaffold, candidate: ${candidate} (arms and trials are not sent)"
          elif [ "$mode" = improve ]; then
            echo "mode: improve, skill: ${skill}, trials: ${trials}, holdout: ${holdout:-none} (arms is not sent)"
          elif [ "$mode" = sentinel ]; then
            echo "mode: sentinel (nothing is checked out, charged or sent)"
          else
            echo "mode: eval, fixture: ${fixture}, arms: ${arms}, trials: ${trials}, model: ${model:-none}"
          fi

      # The ingested routine runs the allowance guard charges (#68). Data
      # only: the bot-written branch is untrusted, nothing from it runs, and
      # only routine-results/ is checked out.
      - name: Check out persistent/eval-results (the ingested runs)
        if: steps.validate.outputs.mode != 'sentinel'
        uses: actions/checkout@v7.0.1
        with:
          ref: persistent/eval-results
          path: eval-results-branch
          persist-credentials: false
          sparse-checkout: routine-results

      # Every mode but sentinel, before the fire: refused (exit 1, numbers-only log) when
      # this run's reservation would take the last seven days past the weekly
      # cap, or when the spend cannot be read. The job's read-only token,
      # never the bearer.
      - name: Check the weekly allowance
        id: allowance
        if: steps.validate.outputs.mode != 'sentinel'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/allowance_guard.py check --results-tree eval-results-branch

      # The fleet pin (Adam, 2026-10-06: "Pin to fleet owners (Recommended)"):
      # the candidate's owner must be in SYNC_OWNERS and its name in
      # cron_coverage.fleet, read from _agent-guidance's default branch as the
      # miner reads them. A public repository; no credentials are kept.
      - name: Check out _agent-guidance (the fleet registry)
        if: steps.validate.outputs.mode == 'scaffold'
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/_agent-guidance
          path: _agent-guidance
          persist-credentials: false

      # Scaffold mode only. The job's read-only token, never the bearer: the
      # snapshot refuses a candidate outside the fleet, or whose repository
      # GitHub names differently (a rename redirect), before it reads GitHub
      # (REST for the pull request, GraphQL for its closing issue and the
      # issue's revisions), and its log line is a
      # status, never the issue's text.
      - name: Compute the issue snapshot
        id: snapshot
        if: steps.validate.outputs.mode == 'scaffold'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ steps.validate.outputs.candidate }}
          FLEET_REGISTRY: _agent-guidance/repos.yml
          FLEET_SYNC_WORKFLOW: _agent-guidance/.github/workflows/sync.yml
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP:?}/issue-snapshot.json"
          python3 scripts/scaffold_real_work.py snapshot --candidate="$CANDIDATE" --out "$out" \
            --registry "$FLEET_REGISTRY" --sync-workflow "$FLEET_SYNC_WORKFLOW"
          echo "file=${out}" >> "$GITHUB_OUTPUT"

      - name: Fire the eval routine
        # A sentinel ends here, a success that sent nothing (#70, round 8).
        if: steps.validate.outputs.mode != 'sentinel'
        env:
          FIRE_URL: https://api.anthropic.com/v1/claude_code/routines/trig_014cqgegCtJUqXYjAKmkr4J5/fire
          EVAL_ROUTINE_FIRE_BEARER: ${{ secrets.EVAL_ROUTINE_FIRE_BEARER }}
          RUN_ID: ${{ steps.validate.outputs.run_id }}
          FIXTURE: ${{ steps.validate.outputs.fixture }}
          ARMS: ${{ steps.validate.outputs.arms }}
          TRIALS: ${{ steps.validate.outputs.trials }}
          MODE: ${{ steps.validate.outputs.mode }}
          CANDIDATE: ${{ steps.validate.outputs.candidate }}
          SKILL: ${{ steps.validate.outputs.skill }}
          HOLDOUT: ${{ steps.validate.outputs.holdout }}
          MODEL: ${{ steps.validate.outputs.model }}
          ISSUE_SNAPSHOT_FILE: ${{ steps.snapshot.outputs.file }}
          VOUCH_KEY: ${{ secrets.VOUCH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${EVAL_ROUTINE_FIRE_BEARER:-}" ]; then
            echo "::error::repository secret EVAL_ROUTINE_FIRE_BEARER is not set"
            exit 1
          fi
          # The payload is the routine's untrusted input: each mode's fields
          # and nothing else, every value encoded by jq. Any other mode
          # stops here, before the API is called.
          case "${MODE:-}" in
            scaffold)
              # Exactly one JSON value, an object or null, as the snapshot
              # step wrote it; it is sent as data, never read by the shell.
              if [ -z "${ISSUE_SNAPSHOT_FILE:-}" ] || ! jq -e -s \
                   'length == 1 and (.[0] | type == "object" or type == "null")' \
                   "$ISSUE_SNAPSHOT_FILE" >/dev/null 2>&1; then
                echo "::error::the scaffold issue snapshot is missing or is not one JSON object or null"
                exit 1
              fi
              body="$(jq -n -c \
                --arg run_id "$RUN_ID" --arg candidate "$CANDIDATE" \
                --slurpfile snapshot "$ISSUE_SNAPSHOT_FILE" \
                '{text: ({mode: "scaffold", run_id: $run_id, candidate: $candidate,
                          issue_snapshot: $snapshot[0]} | tojson)}')" ;;
            eval)
              # The vouch nonce: HMAC-SHA256(VOUCH_KEY, run id), masked, sent
              # in the payload only (to jq through its environment, never
              # argv), never printed, and nothing about it published.
              nonce=""
              if [ -n "${VOUCH_KEY:-}" ]; then
                nonce="$(python3 -c 'import hashlib, hmac, os
          print(hmac.new(os.environ["VOUCH_KEY"].encode(), os.environ["RUN_ID"].encode(),
                         hashlib.sha256).hexdigest())')"
                if ! [[ "$nonce" =~ ^[0-9a-f]{64}$ ]]; then
                  echo "::error::the vouch nonce has an unexpected shape"
                  exit 1
                fi
                echo "::add-mask::${nonce}"
              else
                echo "::warning::repository secret VOUCH_KEY is not set: this eval runs, but its results cannot be ingested"
              fi
              body="$(VOUCH_NONCE="$nonce" jq -n -c \
                --arg run_id "$RUN_ID" --arg fixture "$FIXTURE" \
                --arg arms "$ARMS" --argjson trials "$TRIALS" \
                --arg model "${MODEL:-}" \
                '{text: ({mode: "eval", run_id: $run_id, fixture: $fixture, arms: $arms, trials: $trials}
                         + (if $model == "" then {} else {model: $model} end)
                         + (if $ENV.VOUCH_NONCE == "" then {} else {vouch_nonce: $ENV.VOUCH_NONCE} end)
                         | tojson)}')"
              unset nonce
              echo "::notice title=routine-vouch::run_id=${RUN_ID}" ;;
            improve)
              # Exactly five keys; an empty holdout is null, never "".
              body="$(jq -n -c \
                --arg run_id "$RUN_ID" --arg skill "$SKILL" \
                --argjson trials "$TRIALS" --arg holdout "$HOLDOUT" \
                '{text: ({run_id: $run_id, mode: "improve", skill: $skill, trials: $trials,
                          holdout: (if $holdout == "" then null else $holdout end)} | tojson)}')" ;;
            *)
              echo "::error::mode must be eval, scaffold or improve"
              exit 1 ;;
          esac
          # The fire API's documented cap on `text`: 65,536 characters. Its
          # UTF-8 bytes are never fewer, so cap those; refuse, never truncate.
          if ! jq -e '.text | utf8bytelength <= 65536' <<<"$body" >/dev/null; then
            echo "::error::the routine payload is over the fire API's 65,536-character text cap; nothing was sent"
            exit 1
          fi
          response="$(mktemp)"
          body_file="$(mktemp)"
          trap 'rm -f "$response" "$body_file"' EXIT
          # The body (which can hold the vouch nonce) goes to curl from a
          # file, never argv (#70, round 5, N6).
          printf '%s' "$body" > "$body_file"
          # The bearer goes to curl on stdin (`-H @-`), so it is never in
          # argv, where any process on the runner could read it.
          status="$(printf 'Authorization: Bearer %s\n' "$EVAL_ROUTINE_FIRE_BEARER" \
            | curl --silent --proto '=https' --max-time 60 \
                --request POST "$FIRE_URL" \
                --header @- \
                --header 'anthropic-version: 2023-06-01' \
                --header 'Content-Type: application/json' \
                --data-binary "@${body_file}" \
                --output "$response" --write-out '%{http_code}')" || status="000"
          echo "fire API status: ${status}"
          if [ "$status" != "200" ]; then
            echo "::error::the fire API answered ${status}; the response body is not printed"
            exit 1
          fi
          # On a refused 200, say what SHAPE the body had without printing
          # any of it. Every value comes from a fixed vocabulary or is an
          # integer; the only text taken from the body is an id prefix that
          # already matched ^[a-z]{1,10}_, anything else prints as "other".
          describe_shape() {
            if ! jq empty "$response" >/dev/null 2>&1; then
              echo "response shape: body_is_json=no"
              return 0
            fi
            jq -rn 'input
              | (if type == "object" then . else {} end) as $o
              | $o.claude_code_session_id as $id
              | $o.claude_code_session_url as $url
              | "response shape: body_is_json=yes"
                + " top_level_type=\(type)"
                + " type_is_routine_fire=\(
                    if ($o | has("type")) | not then "missing"
                    elif $o.type == "routine_fire" then "yes" else "no" end)"
                + " id_type=\($id | type)"
                + " id_length=\(if ($id | type) == "string" then ($id | length) else 0 end)"
                + " id_prefix=\(
                    if ($id | type) != "string" then "none"
                    elif ($id | test("^[a-z]{1,10}_")) then ($id | capture("^(?<p>[a-z]{1,10}_)") | .p)
                    else "other" end)"
                + " url_starts_with_claude_code=\(
                    if ($url | type) == "string" and ($url | startswith("https://claude.ai/code/"))
                    then "yes" else "no" end)"
                + " url_equals_code_plus_id=\(
                    if ($id | type) == "string" and ($url | type) == "string"
                       and $url == ("https://claude.ai/code/" + $id)
                    then "yes" else "no" end)"
                + " url_equals_code_session_suffix=\(
                    if ($id | type) == "string" and ($url | type) == "string"
                       and $url == ("https://claude.ai/code/session_" + ($id | sub("^[a-z]{1,10}_"; "")))
                    then "yes" else "no" end)"
                + " top_level_keys=\(if type == "object" then length else 0 end)"
                + " has_wrapper_key=\(
                    if type == "object" and (has("data") or has("result") or has("response"))
                    then "yes" else "no" end)"' \
              "$response" 2>/dev/null || echo "response shape: unavailable"
          }
          # Fail closed on any response shape the docs do not describe. The
          # docs show `session_<X>` for the id and a URL of
          # `https://claude.ai/code/` + id. The real response (re-fire run
          # 37521038032, shape line only) has a `cse_<24 chars>` id and a URL
          # that is NOT `.../code/session_<X>`. The list_runs API shows the
          # first run (37518720233) as `cse_<X>` with its URL on
          # `session_<X>`. So accept either id prefix and a URL that is the
          # documented `https://claude.ai/code/` + id, or `.../code/session_`
          # + the same <X>. The accepted URL is rebuilt from the validated
          # id, never copied from the body.
          if ! session_id="$(jq -er '
                select(.type == "routine_fire")
                | .claude_code_session_id
                | select(type == "string" and test("^(session|cse)_[A-Za-z0-9]{1,128}$"))' \
                "$response" 2>/dev/null)"; then
            echo "::error::the fire API answered 200 with an unrecognized body; it is not printed"
            describe_shape
            exit 1
          fi
          session_key="${session_id#*_}"
          if jq -e --arg id "$session_id" \
               '.claude_code_session_url == ("https://claude.ai/code/" + $id)' \
               "$response" >/dev/null 2>&1; then
            session_url="https://claude.ai/code/${session_id}"
          elif jq -e --arg key "$session_key" \
               '.claude_code_session_url == ("https://claude.ai/code/session_" + $key)' \
               "$response" >/dev/null 2>&1; then
            session_url="https://claude.ai/code/session_${session_key}"
          else
            echo "::error::the fire API's session URL does not match its session id; the body is not printed"
            describe_shape
            exit 1
          fi
          echo "run id: ${RUN_ID}; session link is in the job summary"
          if [ "$MODE" = scaffold ]; then
            {
              echo "### Eval routine fired (scaffold mode)"
              echo
              echo "- Run id: \`${RUN_ID}\`"
              echo "- Candidate: \`${CANDIDATE}\`"
              echo "- Session: ${session_url}"
              echo "- Branch: \`claude/scaffold-<fixture id>\`, pushed by the routine; its gate opens the draft PR"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$MODE" = improve ]; then
            {
              echo "### Eval routine fired (improve mode)"
              echo
              echo "- Run id: \`${RUN_ID}\`"
              echo "- Skill: \`${SKILL}\`, trials: \`${TRIALS}\`"
              if [ -n "$HOLDOUT" ]; then
                echo "- Holdout: \`${HOLDOUT}\`"
              else
                echo "- Holdout: none"
              fi
              echo "- Session: ${session_url}"
              echo "- Results branch: \`claude/eval-improve-${RUN_ID}\`, pushed only on an accepted candidate; routine-improve-gate.yml validates it and opens the draft PR"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Eval routine fired"
              echo
              echo "- Run id: \`${RUN_ID}\`"
              echo "- Fixture: \`${FIXTURE}\`, arms: \`${ARMS}\`, trials: \`${TRIALS}\`"
              if [ -n "${MODEL:-}" ]; then
                echo "- Model: \`${MODEL}\`"
              fi
              echo "- Session: ${session_url}"
              echo "- Results branch: \`claude/eval-${RUN_ID}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
