name: Scope the evals

# Adam, 2026-11-03: decide automatically, and often, which fixtures are worth
# running evals on. scripts/eval_scope.py holds the rules (ceiling, floor,
# zero-use, resume; see docs/how-it-works.md "The eval scope pass"). This
# workflow runs it after every ingest of routine results (new runs are what
# move a ceiling or floor), once a day (usage and fixture changes move the
# rest), and on dispatch.
#
# `plan` reads main, `persistent/eval-results` (the explorer document and the
# local usage census, both data) and adam-agentskills' plugin layout, and
# uploads the plan; its job summary lists every change with its reason.
# `propose` applies a non-empty plan on `eval-scope/<run id>` and opens one
# DRAFT pull request (no auto-merge until a repo-settings ADR declares this
# lane, per ADR 0001), using the roster App token
# the fixture-promotion job in routine-fixture-supply.yml uses. At most one
# `eval-scope/` pull request is open at a time, and no token means nothing is
# pushed: the next run tries again.
#
# No push or pull_request trigger, so no `paths:` filter; no concurrency group
# (a second run finds the first's open pull request and stands down). The App
# key is read only by the mint step of `propose`.

on:
  workflow_run:
    workflows: [Ingest routine eval results]
    types: [completed]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  plan:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      # Full history: a fixture's last commit time is read with git log.
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml==6.0.3
      - name: Check out persistent/eval-results (data)
        uses: actions/checkout@v7.0.1
        with:
          ref: persistent/eval-results
          path: eval-results-branch
          persist-credentials: false
          sparse-checkout: |
            explorer
            usage
      - name: Check out adam-agentskills (the plugin layout)
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: ctx/adam-agentskills
          persist-credentials: false
          sparse-checkout: scripts/plugin_layout.json
          sparse-checkout-cone-mode: false
      - name: Plan the scope changes
        id: plan
        run: |
          set -euo pipefail
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 scripts/eval_scope.py plan --repo-root . \
            --explorer eval-results-branch/explorer/latest.json \
            --usage eval-results-branch/usage/weekly-local.json \
            --registry-layout ctx/adam-agentskills/scripts/plugin_layout.json \
            --now "$now" --out "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/plan.out"
          cat "$RUNNER_TEMP/plan.out" >> "$GITHUB_OUTPUT"
          {
            echo "## Eval scope plan"
            echo
            python3 scripts/eval_scope.py summary --plan "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/plan.md"
            if [ -s "$RUNNER_TEMP/plan.md" ]; then
              cat "$RUNNER_TEMP/plan.md"
            else
              echo "No change: every scheduled fixture stays in scope."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the plan
        uses: actions/upload-artifact@v7.0.2
        with:
          name: eval-scope-plan
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error

  propose:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml==6.0.3
      - name: Download the plan
        uses: actions/download-artifact@v8.0.2
        with:
          name: eval-scope-plan
          path: ${{ runner.temp }}/plan
      - name: Mint the roster App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.ROSTER_APP_CLIENT_ID }}
          private-key: ${{ secrets.ROSTER_APP_PRIVATE_KEY }}
          owner: Adam-S-Daniel
          repositories: skills-evals
          permission-contents: write
          permission-pull-requests: write
      - name: Open the scope pull request as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          app_token=""
          case "${APP_TOKEN:-}" in
            ''|*[!A-Za-z0-9_.-]*) : ;;
            *) app_token="$APP_TOKEN" ;;
          esac
          if [ -z "$app_token" ]; then
            echo "::warning::the roster App token is unavailable; nothing is published, and the next run tries again"
            exit 0
          fi
          app_gh() {
            GH_TOKEN="$app_token" GITHUB_TOKEN="" gh "$@"
          }
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::the run id has an unexpected shape"
            exit 1
          fi
          open="$(gh api "repos/${REPO}/pulls?state=open&base=${BASE}&per_page=100" \
            --jq '[.[] | select(.head.ref | startswith("eval-scope/"))] | length')" || open=""
          case "$open" in
            0) ;;
            [1-9]*)
              echo "a scope pull request is already open; it holds the slot"
              exit 0 ;;
            *)
              echo "::error::could not tell whether a scope pull request is open"
              exit 1 ;;
          esac
          plan="$RUNNER_TEMP/plan/plan.json"
          python3 scripts/eval_scope.py apply --plan "$plan" --repo-root .
          # Only the files the pass writes.
          git add -A -- evals
          count=0
          while IFS= read -r changed; do
            case "$changed" in
              evals/scheduled.yml|evals/unscheduled.yml|evals/scope-auto.yml) count=$((count + 1)) ;;
              *)
                echo "::error::the scope pass changed a file it does not write"
                exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          if [ "$count" = 0 ]; then
            echo "the plan changed nothing"
            exit 0
          fi
          branch="eval-scope/${RUN_ID}"
          git -c core.hooksPath=/dev/null \
            -c user.name="skills-evals real-eval bot" \
            -c user.email="skills-evals@users.noreply.github.com" \
            commit -q -m "Rescope the evals (run ${RUN_ID})"
          sha="$(git rev-parse HEAD)"
          # The App token as an HTTP header in the environment, never argv.
          header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$app_token" | base64 -w0)"
          if ! GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
               GIT_CONFIG_VALUE_0="$header" \
               git -c core.hooksPath=/dev/null push -q origin "HEAD:refs/heads/${branch}" 2> /dev/null; then
            echo "::error::could not push ${branch}"
            exit 1
          fi
          tip="$(gh api "repos/${REPO}/git/ref/heads/${branch}" --jq '.object.sha')" || tip=""
          if [ "$tip" != "$sha" ]; then
            echo "::error::${branch} is not the commit this run pushed"
            exit 1
          fi
          body="$RUNNER_TEMP/body.md"
          {
            echo "## TLDR"
            echo
            echo "Pauses or resumes scheduled eval fixtures by rule, so the weekly allowance goes to fixtures that can still show a gain."
            echo
            python3 scripts/eval_scope.py summary --plan "$plan"
            echo
            echo "Rules and thresholds: \`scripts/eval_scope.py\` and docs/how-it-works.md, \"The eval scope pass\". Each pause is recorded in \`evals/scope-auto.yml\` with what its resume needs. Opened by eval-scope.yml as a draft: auto-merge waits for a repo-settings ADR that declares this lane."
            echo
            echo "<sub>🤖 Written by Claude Code on behalf of @Adam-S-Daniel</sub>"
          } > "$body"
          url="$(app_gh pr create --repo "$REPO" --base "$BASE" --head "$branch" \
            --title "Rescope the evals" --body-file "$body" --draft)"
          number="${url##*/}"
          if ! [[ "$number" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::could not read the new pull request's number"
            exit 1
          fi
          echo "opened draft #${number} at ${sha}"
