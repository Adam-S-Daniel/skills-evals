name: Rules consistency
# Daily: do the fleet's public repositories restate a rule value (a keep,
# removal, pause or re-check number) that disagrees with docs/rules.json,
# generated from evals/*-policy.yml? The repositories come from
# evals/rules-consistency.yml alone. Each is shallow-cloned read-only with no
# token, scripts/check_rule_restatements.py reads them, and one issue,
# "Rule restatements disagree with docs/rules.md" (label agent-ready), lists
# the file:line findings and nothing else; it is closed on a clean run. This
# repository's own tree is checked by ci.yml on every pull request. Not a
# required check: it has no pull_request or push trigger.

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out skills-evals
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python3 -m pip install pyyaml==6.0.3
      - name: Clone the listed repositories
        id: clone
        run: |
          set -euo pipefail
          # One "<owner>/<repo>" per line, checked, from evals/rules-consistency.yml.
          python3 - > "$RUNNER_TEMP/repos.txt" <<'PY'
          import re, sys, yaml
          doc = yaml.safe_load(open("evals/rules-consistency.yml", encoding="utf-8"))
          rows = doc.get("repos") if isinstance(doc, dict) else None
          if not isinstance(rows, list) or not rows:
              sys.exit("evals/rules-consistency.yml must list at least one repo under `repos:`")
          for row in rows:
              name = row.get("repo") if isinstance(row, dict) else None
              if not isinstance(name, str) or not re.fullmatch(r"[A-Za-z0-9-]+/[A-Za-z0-9._-]+", name):
                  sys.exit(f"evals/rules-consistency.yml: bad repo entry {row!r}")
              for glob in row.get("exclude") or []:
                  if not isinstance(glob, str) or "\n" in glob:
                      sys.exit(f"evals/rules-consistency.yml: bad exclude for {name}")
              print(name)
          PY
          mkdir -p "$RUNNER_TEMP/clones"
          while IFS= read -r repo; do
            dir="$RUNNER_TEMP/clones/${repo#*/}"
            ok=""
            for attempt in 1 2 3; do
              if git clone --quiet --depth 1 "https://github.com/$repo.git" "$dir"; then ok=1; break; fi
              rm -rf "$dir"; sleep $((attempt * 10))
            done
            [ -n "$ok" ] || { echo "::error::could not clone $repo"; exit 1; }
          done < "$RUNNER_TEMP/repos.txt"
      - name: Check the clones against docs/rules.json
        id: check
        run: |
          set -uo pipefail
          args=()
          while IFS= read -r repo; do
            args+=(--root "$RUNNER_TEMP/clones/${repo#*/}")
          done < "$RUNNER_TEMP/repos.txt"
          # Each repo's excludes, relative to its own root.
          while IFS= read -r glob; do
            [ -n "$glob" ] && args+=(--exclude "$glob")
          done < <(python3 -c 'import yaml; [print(g) for r in yaml.safe_load(open("evals/rules-consistency.yml"))["repos"] for g in (r.get("exclude") or [])]')
          python3 scripts/check_rule_restatements.py --rules docs/rules.json "${args[@]}" \
            > "$RUNNER_TEMP/findings.txt"
          code=$?
          if [ "$code" -gt 1 ]; then echo "::error::the checker failed (exit $code)"; exit "$code"; fi
          echo "findings=$code" >> "$GITHUB_OUTPUT"
          echo "Findings: $(grep -c . "$RUNNER_TEMP/findings.txt" || true)" >> "$GITHUB_STEP_SUMMARY"
      - name: Open, update or close the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.check.outputs.findings }}
        run: |
          set -euo pipefail
          title="Rule restatements disagree with docs/rules.md"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label agent-ready \
            --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty") || number=""
          if [ "$FINDINGS" = "0" ]; then
            if [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --comment "No restatement disagrees with docs/rules.md as of this run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            fi
            exit 0
          fi
          {
            echo "These lines restate a rule value that disagrees with [docs/rules.md]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/docs/rules.md) (\`scripts/check_rule_restatements.py\`, run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Fix each in its repository by deleting the number or linking docs/rules.md; never change the rule to match. The repositories checked are listed in \`evals/rules-consistency.yml\`."
            echo
            echo '```'
            head -c 60000 "$RUNNER_TEMP/findings.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$number" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label agent-ready \
              --body-file "$RUNNER_TEMP/body.md"
          fi
