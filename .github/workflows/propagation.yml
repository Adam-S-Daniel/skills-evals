# Propagation probes — does every delivery channel still deliver the right
# skills? Tier 2 of skills-evals#17.
#
# SECURITY / COST POSTURE — the whole point, read before changing anything:
#
# * NO credential, NO `id-token`, NO API call, NO spend. The probe reads the
#   `system/init` event, which the Claude Code CLI computes locally before its
#   first request, against `ANTHROPIC_BASE_URL=http://127.0.0.1:9`; the child
#   is killed the moment that event arrives. `permissions: contents: read` is
#   the whole privilege set. If this workflow ever needs a secret, the design
#   has broken — do not add one, work out what changed.
#
# * That is exactly why this is NOT in eval.yml. eval.yml's OIDC subject is
#   pinned to `refs/heads/main`, so a branch dispatch dies at token exchange
#   and a red run tells you nothing about the probe. Here a red run means red.
#   It follows that these assertions can be a pull-request gate rather than a
#   scheduled job, which is what makes them iterable.
#
# * The `schedule:` REPORTS ITSELF. A scheduled run that fails notifies nobody,
#   and this fleet has already lost a week to a daily audit running red
#   unwatched — so the `report` job below opens one tracking issue rather
#   than trusting someone to read the Actions tab, idempotently, because a
#   steady-state red would otherwise file a fresh issue every morning. #17
#   specifies Tier 2 as scheduled for a reason the arms make concrete: their
#   one unpinned input is the adam-agentskills registry at `main`, so real
#   delivery can break with no commit in this repo, and pull requests here are
#   too infrequent to find out.
#
#   This workflow used to carry a Tier 3 as well: a freshness gate that read a
#   claude.ai Routine's published account-store audit and reddened when the
#   Routine went quiet. The owner deleted that Routine on 2026-09-28 along
#   with the claude.ai ZIP-upload channel it audited (adam-agentskills#23) —
#   retiring the uploads meant nothing kept re-populating what the audit
#   checked, so the audit was retired in the same change. `gate` is now the
#   hermetic mutation suite alone. See evals/propagation/ROUTINE.md, now
#   marked HISTORY, for what that layer did and why.
#
# * DELIBERATELY NO `paths:` filter, contrary to the fleet's usual rule. The
#   arms probe an unpinned upstream registry — adam-agentskills at `main` —
#   so a pull request that touches nothing here can still be the first place
#   real delivery drift shows up; filtering this workflow to its own paths
#   would mean that drift only surfaces at the next 05:41 schedule. `gate`'s
#   mutation suite is hermetic Python with no CLI to install, so it stays
#   cheap and always-present on the same trigger rather than being split onto
#   a filtered one of its own.

name: Propagation

on:
  pull_request:
  push:
    branches: [main]
  # :41 rather than :00 because GitHub queues the whole platform's cron on the
  # hour and delays it, and staggered off adam-agentskills' 06:17 census so
  # the fleet's daily audits do not all land at once.
  schedule:
    - cron: "41 5 * * *" # daily, 05:41 UTC
  # A probe you cannot run on demand is a probe you cannot VERIFY on demand. A
  # fix to the arms merged and there was no way to confirm it: a dispatch came
  # back `422 Workflow does not have 'workflow_dispatch' trigger`, so checking
  # it meant waiting for the next push or the 05:41 cron. That is the worst
  # property to leave on the workflow whose whole job is detecting drift.
  #
  # Safe to add only because the concurrency group above keys on
  # github.event_name: a manual run lands in its own group, so it can neither
  # cancel the scheduled run nor be cancelled by it. Two dispatches on one ref
  # do share a group and the older is cancelled — the cheap-iteration half of
  # that same rule — and nothing this workflow publishes is a required
  # context — the repo's required check is ci.yml's `test` (cms-platform#437)
  # — and it must stay that way while this workflow keeps a
  # `cancel-in-progress` group, `timeout-minutes` walls and matrix context
  # names; the Dependabot sweep still waits for these jobs, so a cancelled
  # run stalls a Dependabot PR with a named skip rather than merging over it.
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Run the probes but leave the tracking issue alone — print what would
          have been opened or commented instead of writing it.
        # DEFAULT TRUE, unlike the schedule. A dispatch exists to verify a
        # change; a verification run that files a real tracking issue leaves a
        # human tidying up after the tool they reached for to save work. The
        # schedule keeps the write path unconditionally — a dispatch has to
        # ask for it.
        #
        # A real `boolean`, NOT the `string` + fromJSON shape
        # scheduled-run-health.yml uses. That workaround exists solely because
        # a typed boolean dispatch input is handed to a REUSABLE's `with:` as
        # a string, which the reusable's boolean input rejects, startup-failing
        # the run before any job. Nothing here crosses a workflow_call
        # boundary, so the plain type is the correct one — do not "fix" it in
        # either direction.
        type: boolean
        default: true

permissions:
  contents: read

# The event name is in the group because a scheduled run and a push to main
# share a ref: without it they cancel each other, and a cancelled run is not
# failure(), so `report` would stay silent about a day's probe never having
# run. Two pushes to the same pull request still share a group, which is what
# keeps iteration cheap.
concurrency:
  group: propagation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hermetic: the mutation suite. Needs no Claude Code CLI at all, so it
  # still reports even when a CLI release breaks the arms.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out skills-evals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: skills-evals
          persist-credentials: false

      - name: Check out adam-agentskills registry (side-by-side)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: adam-agentskills
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: pip install pyyaml

      - name: Mutation suite (hermetic — no CLI, no network, no clock)
        working-directory: skills-evals
        # $AGENTSKILLS_DIR lets the one registry-dependent test actually run
        # here (it binds this harness's digest to the registry's own
        # generator) instead of skipping.
        env:
          AGENTSKILLS_DIR: ${{ github.workspace }}/adam-agentskills
        run: python3 test/test_propagation.py

  # The live arms, one CI job each so a red arm names itself in the checks list
  # and one broken channel never hides another.
  arms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [clean-room, project-mirror, plugin-marketplace, bootstrap-hook,
              collision-guard]
    steps:
      - name: Check out skills-evals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: skills-evals
          persist-credentials: false

      - name: Check out adam-agentskills registry (side-by-side)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          # Full history: the bootstrap-hook arm clones this checkout at the
          # commit skills.lock pins, which a shallow clone may not contain.
          fetch-depth: 0
          path: adam-agentskills
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install Claude Code CLI
        # NOT PINNED, and ALWAYS THE LATEST (the owner's decisions of
        # 2026-09-27, #202, and 2026-09-28, #203): every run installs the
        # newest Claude Code release npm reports, never reusing one already
        # on the runner, and fails if another `claude` on PATH shadows it.
        # The arms assert on the SHAPE of the stream-json init event, so a new
        # CLI can change what they read — the --self-test below is what
        # catches a release that silently blinded the assertions, and the
        # version actually used is recorded per run: here in the step summary
        # and, per arm, as `harness_version` (with the init event's `model`)
        # in the --json run record. This job holds no credential at all (see
        # the posture note at the top), and the install runs before any step
        # that could be given one.
        #
        # `claude --version` is captured whole and cut to its first line in
        # the shell, not piped through `head`: under pipefail a `head` that
        # exits first can fail the step on the CLI's SIGPIPE. A failing or
        # empty version, an unusable npm answer, or a shadowing CLI fails the
        # step by name.
        run: |
          set -euo pipefail
          latest="$(npm view @anthropic-ai/claude-code version)" || { echo "::error::could not resolve the latest Claude Code version"; exit 1; }
          # A plain MAJOR.MINOR.PATCH and nothing else: a prerelease, an error
          # page, an empty answer or two lines is refused, never stripped
          # into something that looks like a version.
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::npm reported no usable latest Claude Code version"; exit 1; }
          npm install -g "@anthropic-ai/claude-code@${latest}"
          version="$(timeout -k 10 60 claude --version)" || { echo "::error::claude --version failed"; exit 1; }
          # First line only, and only characters a version string needs: this
          # lands in a markdown code span in the step summary.
          version="${version%%$'\n'*}"
          version="${version:0:80}"
          version="${version//[^A-Za-z0-9._() -]/}"
          [[ -n "$version" ]] || { echo "::error::claude --version printed no version"; exit 1; }
          # A different claude earlier on PATH would shadow the one just
          # installed. Exact on the first token: a prefix match would pass a
          # stale 2.1.30 for a latest of 2.1.3.
          [[ "${version%% *}" == "$latest" ]] || { echo "::error::claude on PATH is not the npm latest just installed"; exit 1; }
          echo "harness: Claude Code ${version} (npm latest)"
          { echo "### Harness"; echo "Claude Code \`${version}\` (npm latest)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: pip install pyyaml

      - name: Probe the arm
        working-directory: skills-evals
        # The arm name arrives through the environment rather than being
        # interpolated into the script — house habit, and it keeps the rendered
        # command out of the log.
        #
        # --self-test proves, on the real binary, that the assertion layer can
        # still FAIL: it re-runs the plugin arm against a lock naming a skill
        # the registry does not ship and requires a red. Without it, a CLI that
        # stopped emitting what this harness reads would look like five green
        # arms. It rides the plugin job because that is the arm it exercises.
        env:
          ARM: ${{ matrix.arm }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$ARM" = "plugin-marketplace" ]; then extra=(--self-test); fi
          python3 harness/run_propagation.py evals/propagation \
            --arm "$ARM" --registry ../adam-agentskills \
            --json "$RUNNER_TEMP/propagation.json" "${extra[@]+"${extra[@]}"}"

      - name: Upload the run record on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: propagation-${{ matrix.arm }}
          path: ${{ runner.temp }}/propagation.json
          if-no-files-found: ignore

  # How the schedule reports itself — and how it stops reporting. A job rather
  # than a step in `arms`: that is a five-leg matrix, and a step there would file
  # up to five issues for one bad run. `issues: write` is raised HERE AND NOWHERE
  # ELSE, so the probes keep the read-only privilege set the posture note at the
  # top depends on.
  #
  # `gh` is preinstalled on the runner, so this needs no new `uses:`, no
  # third-party pin and no cooling-off period. It passes --repo rather than
  # letting gh infer one from the workspace: this job checks nothing out, and it
  # also runs when a CHECKOUT is what failed, so there may be no git repo to
  # infer from — the step guarding against silent failure must not have a silent
  # failure of its own.
  #
  # Everything the script reads arrives through env:, and the only workflow
  # expressions are github.server_url/repository/run_id and the two
  # needs.*.result words. Nothing off the event payload and nothing a probe
  # printed is interpolated into the run: body, where it would be echoed into a
  # public log and evaluated as shell.
  report:
    needs: [gate, arms]
    # THIS RUNS ON GREEN TOO, and that is a close path rather than a widening of
    # the report. With `failure()` alone nothing in this repo ever closed the
    # tracking issue: a repaired probe left it open until a human noticed, so the
    # issue's existence stopped meaning "broken now" and came to mean "broke
    # once" — which is the same death as never filing it. `success() ||
    # failure()` rather than `always()`, because a CANCELLED upstream job
    # measured nothing at all, and closing a live finding on the strength of a
    # run that never completed is the one write here that cannot be taken back
    # by the next morning's run.
    #
    # workflow_dispatch is named here so `dry_run` is wired to something.
    # Without it a manual run could never reach the write path and the input
    # would be a knob connected to nothing — which reads as coverage and is
    # not. A dispatch left at the default now exercises this job all the way
    # through the dedupe lookup and stops one line short of the write.
    #
    # Admitting the dispatch here does NOT admit it to the CLOSE call: the
    # shell below fences that to `schedule`, because only a `schedule` trigger
    # is guaranteed to be testing `main` — GitHub runs a scheduled workflow
    # against the default branch and nothing else, while `workflow_dispatch`
    # can target any ref. A green dispatch from a branch whose fix has not
    # merged yet would retract a finding that the next morning's schedule —
    # still red on the unfixed `main` — immediately re-files, stranding the
    # comment history the close path exists to keep. The asymmetry belongs in
    # the shell rather than in this `if:` — a dispatch still has to reach the
    # job to file, to comment, and to dry-run.
    if: >-
      (success() || failure())
      && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the tracking issue (a dry run prints instead)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: Scheduled propagation probes are failing
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # WHICH HALF FAILED, carried in as DATA so the body can state it
          # without a shell branch. Printing both rather than diagnosing one
          # from the other is deliberate: a red **gate** (the hermetic
          # mutation suite) and a red **arm** (usually the adam-agentskills
          # registry moving under an unpinned checkout) are different faults
          # in different places, and a body that picked one to blame risks
          # sending the reader to audit whichever half it guessed wrong on.
          # Before 2026-09-28 `gate` also carried a freshness check on a
          # claude.ai Routine, and every one of this workflow's five scheduled
          # failures up to then was that check tripping with every arm green
          # (run 32452792300 among them) — the measurement that first proved a
          # single-cause body would mislead (see evals/propagation/ROUTINE.md,
          # now HISTORY). That check is gone, but the lesson — report both,
          # guess neither — still holds for the two causes that remain. These
          # two words are printed verbatim and the prose below describes both
          # halves, so it cannot be wrong in that way and costs no statement
          # above the dry-run bail-out.
          GATE_RESULT: ${{ needs.gate.result }}
          ARMS_RESULT: ${{ needs.arms.result }}
          # A BARE input reference, and the flag is built from it in SHELL
          # below — never inline as `${{ inputs.dry_run && 'x' || 'y' }}`.
          # That form is not a ternary, it is two operators: GitHub returns
          # the `||` branch whenever the `&&` branch is falsy, and an EMPTY
          # STRING is falsy. cms-platform wrote a push-scan opt-out that way
          # with the empty string on the truthy side, so the opt-out fired
          # UNCONDITIONALLY: run 32280743541 was dispatched with the scan on,
          # skipped it entirely, and still printed "0 failing push run(s)"
          # from a static default rather than from any API call. A silent
          # no-op that reports healthy is worse than a crash — nothing goes
          # red, so nothing draws attention.
          #
          # `inputs` is empty on every event but workflow_dispatch, so this
          # renders as '' on the schedule. That is deliberate and is what
          # keeps the scheduled run on the write path with no second
          # condition: only the literal string "true" withholds the write.
          PROBE_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/propagation-failure.md" <<EOF
          The scheduled propagation probes failed: $RUN_URL

          Job results — **gate: $GATE_RESULT**, **arms: $ARMS_RESULT**. Read those
          two before looking anywhere else: they fail for different reasons.

          A failing **gate** is a fault in this repository. Its one step is the
          hermetic mutation suite (test/test_propagation.py), so a red gate
          means the propagation harness's own logic broke — nothing external
          caused it and nothing external can repair it.

          A failing **arm** is usually caused by something outside this
          repository. The arms have two unpinned inputs: the adam-agentskills
          registry, which they check out at main, and the Claude Code CLI,
          which every run installs at the npm latest tag and records in the
          step summary. A red arm most likely means a change in one of those
          rather than a change here; compare the CLI version the failing run
          recorded with the last green run's.
          EOF
          cat > "$RUNNER_TEMP/propagation-recovered.md" <<EOF
          The scheduled propagation probes are green again — gate: $GATE_RESULT,
          arms: $ARMS_RESULT — so this tracking issue closes itself: $RUN_URL

          A new episode gets a new issue rather than a reopened one carrying weeks
          of stale run links above the live finding.
          EOF
          # --search is full text, so it can return near-misses; the title is
          # re-checked EXACTLY before this concludes a duplicate already exists.
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$ISSUE_TITLE in:title" --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          # The dedupe LOOKUP above runs in a dry run too, deliberately. A dry
          # run that bailed before it would prove only that the flag works —
          # never that the full-text search still recognises an existing issue,
          # which is the half of this step that has ever been wrong. Detection
          # runs; only the WRITE is withheld, and everything below this block is
          # a write, so this is the one line that has to stay above them.
          #
          # It prints the raw facts — both job results and whether an issue is
          # open — rather than a sentence naming one action. Now that a green
          # run closes and a red one files, a single "would comment / would
          # open" line has to guess which of three outcomes applies, and a dry
          # run that guesses wrong is worse than one that shows its inputs.
          # Both bodies are printed for the same reason: whichever way the real
          # run would go, the text it would have posted has been seen.
          if [ "$PROBE_DRY_RUN" = "true" ]; then
            echo "DRY RUN: event=$GITHUB_EVENT_NAME gate=$GATE_RESULT arms=$ARMS_RESULT open-issue=${number:-<none>}"
            echo "--- body it would have posted had the probes failed ---"
            cat "$RUNNER_TEMP/propagation-failure.md"
            echo "--- comment a green SCHEDULED run would have posted, closing it ---"
            cat "$RUNNER_TEMP/propagation-recovered.md"
            exit 0
          fi
          if [ "$GATE_RESULT" = "success" ] && [ "$ARMS_RESULT" = "success" ]; then
            # Closed, never commented-and-left-open. `--state open` in the lookup
            # means a closed issue is never found again, so the next failure
            # files a fresh issue instead of reopening one under a month of
            # resolved history — and an issue list that only holds live findings
            # is the only kind anyone keeps reading.
            #
            # AND THE CLOSE IS SCHEDULE-ONLY, because `schedule` is the only
            # trigger guaranteed to be testing `main`. A `workflow_dispatch`
            # can run against any branch, so a green dispatch from one that
            # fixes the gate or an arm but has not merged yet would retract a
            # finding that the next morning's schedule — still red on the
            # unfixed `main` — immediately re-opens: the comment history this
            # close path exists to keep would be stranded on the issue it just
            # shut. Filing stays allowed on every event this job runs on — a
            # red run found something real regardless of which ref it
            # targeted — so only the retraction is fenced. `GITHUB_EVENT_NAME`
            # is a default runner variable, like the `GITHUB_REPOSITORY` the
            # lookup above already reads, so consulting it puts no workflow
            # expression in this script — not even in a comment, which GitHub
            # expands like any other text here — and `set -u` turns a
            # misspelling into a loud failure rather than a silently skipped
            # guard.
            if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
              echo "the probes passed, but only a scheduled run may close the tracking issue"
            elif [ -n "$number" ]; then
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "$(cat "$RUNNER_TEMP/propagation-recovered.md")"
            else
              echo "the probes passed and no tracking issue is open"
            fi
          elif [ -n "$number" ]; then
            # A comment rather than an edit in place: this issue is a running
            # log of which scheduled runs failed, and each run URL is a
            # distinct fact worth keeping.
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" \
              --body-file "$RUNNER_TEMP/propagation-failure.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
              --body-file "$RUNNER_TEMP/propagation-failure.md"
          fi
