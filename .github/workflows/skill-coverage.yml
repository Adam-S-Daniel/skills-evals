name: Publish skill eval coverage and draft public gaps

# The reader has no write permission and handles all four registry layouts.
# Its artifact contains only the redacted census and public revisions. The
# writer never checks out or executes registry content. An absent private read
# credential fails the whole census, so a short denominator is never published.
#
# The private registry is read with a short-lived installation token from a
# dedicated read-only GitHub App (the owner's 2026-10-20 decision, replacing a
# fine-grained personal access token that was never set and failed this
# workflow daily, issue #292). Repository variable REGISTRY_READ_APP_CLIENT_ID
# and repository secret REGISTRY_READ_APP_PEM hold the App's client id and
# private key; the App has Contents: read only and is installed on
# adam-agentskills-private alone. The token is minted immediately before the
# one checkout that uses it, as the other apps in this repo are (see
# routine-improve-gate.yml).
on:
  schedule:
    - cron: "19 8 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read and upload the census without GitHub writes.
        type: boolean
        default: true

permissions: {}

# Serialize the read and write halves so overlapping schedule and dispatch
# runs cannot publish competing snapshots or duplicate proposals.
concurrency:
  group: skill-coverage-main
  cancel-in-progress: false

jobs:
  census:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require the private registry read credential
        env:
          APP_CLIENT_ID: ${{ vars.REGISTRY_READ_APP_CLIENT_ID }}
          APP_PEM: ${{ secrets.REGISTRY_READ_APP_PEM }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PEM" ]; then
            echo "::error::Complete coverage census unavailable: private registry read credential is absent (repository variable REGISTRY_READ_APP_CLIENT_ID and repository secret REGISTRY_READ_APP_PEM must both be set)"
            exit 1
          fi

      - name: Check out skills-evals
        uses: actions/checkout@v7.0.1
        with:
          path: skills-evals
          persist-credentials: false

      - name: Check out adam-agentskills
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: registry-agentskills
          persist-credentials: false

      - name: Check out cms-platform
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/cms-platform
          path: registry-cms
          persist-credentials: false

      - name: Check out adamdaniel.ai
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adamdaniel.ai
          path: registry-site
          persist-credentials: false

      - name: Mint the GitHub App token for adam-agentskills-private
        id: registry-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.REGISTRY_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_READ_APP_PEM }}
          owner: Adam-S-Daniel
          repositories: adam-agentskills-private
          permission-contents: read

      - name: Check out the private registry
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills-private
          path: registry-private
          token: ${{ steps.registry-token.outputs.token }}
          persist-credentials: false

      - name: Check out fleet guidance for the context revision
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/_agent-guidance
          path: guidance
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install the offline census dependency
        run: python3 -m pip install pyyaml==6.0.3

      - name: Build the redacted complete census
        working-directory: skills-evals
        run: |
          python3 scripts/scaffold_skill_gaps.py census \
            --registry "adam-agentskills=$GITHUB_WORKSPACE/registry-agentskills" \
            --registry "cms-platform=$GITHUB_WORKSPACE/registry-cms" \
            --registry "adamdaniel.ai=$GITHUB_WORKSPACE/registry-site" \
            --registry "adam-agentskills-private=$GITHUB_WORKSPACE/registry-private" \
            --guidance-dir "$GITHUB_WORKSPACE/guidance" \
            --out "$RUNNER_TEMP/skill-coverage"

      - name: Summarize the redacted census
        run: cat "$RUNNER_TEMP/skill-coverage/coverage.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload only redacted census files
        uses: actions/upload-artifact@v7.0.2
        with:
          name: skill-coverage
          path: ${{ runner.temp }}/skill-coverage/
          if-no-files-found: error

  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    needs: census
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out trusted skills-evals code
        uses: actions/checkout@v7.0.1
        with:
          path: skills-evals
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install the offline fixture parser dependency
        run: python3 -m pip install pyyaml==6.0.3

      - name: Download the redacted census
        uses: actions/download-artifact@v8.0.1
        with:
          name: skill-coverage
          path: ${{ runner.temp }}/skill-coverage/

      - name: Publish coverage and reconcile up to three public draft proposals
        working-directory: skills-evals
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          python3 scripts/scaffold_skill_gaps.py automate \
            --artifact "$RUNNER_TEMP/skill-coverage" \
            --run-id "$RUN_ID" --main-sha "$MAIN_SHA" --write

  # Skill retirement (#70, part 2): compute every skill's verdict from the
  # pooled results and act on a `retire` one. Only the schedule runs it, and
  # scripts/retire_skill.py refuses any other event as well. It reads the
  # results branch and the public registries (no private checkout, so a
  # private-registry skill has no tested digest and never retires) and
  # writes only skills-evals issues, with this repository's own token.
  #
  # AUTO MODE IS NOT WIRED. `--allow-mode proposal` makes the script exit 2
  # if evals/gate-policy.yml is switched to `retirement_mode: auto`, rather
  # than doing nothing quietly. Auto mode pushes a branch to adam-agentskills
  # and opens an auto-merging pull request there (ADR 0014), which needs a
  # write credential for that repository that does not exist yet: a GitHub
  # App with contents and pull-requests write on adam-agentskills alone,
  # minted with actions/create-github-app-token immediately before a
  # checkout that keeps its credentials, and passed to the script as
  # GH_TOKEN. Adding it, and the matching repo-settings and adam-agentskills
  # ADRs, is the owner's call.
  retirement:
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out skills-evals
        uses: actions/checkout@v7.0.1
        with:
          path: skills-evals
          persist-credentials: false

      - name: Check out the results branch
        uses: actions/checkout@v7.0.1
        with:
          ref: persistent/eval-results
          path: eval-results
          persist-credentials: false

      - name: Check out adam-agentskills
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: registry-agentskills
          persist-credentials: false

      - name: Check out cms-platform
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/cms-platform
          path: registry-cms
          persist-credentials: false

      - name: Check out adamdaniel.ai
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adamdaniel.ai
          path: registry-site
          persist-credentials: false

      - name: Check out _agent-guidance
        # The guidance sections' source (#124): read for their extents and
        # digests, never run. Not a skill registry, so it gets --guidance.
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/_agent-guidance
          path: agent-guidance
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install the offline verdict dependency
        run: python3 -m pip install pyyaml==6.0.3 markdown-it-py==4.2.0

      - name: Compute the retirement verdicts
        working-directory: skills-evals
        run: |
          as_of=$(git -C "$GITHUB_WORKSPACE/eval-results" log -1 --format=%cI)
          python3 scripts/compute_gates.py \
            --results-tree "$GITHUB_WORKSPACE/eval-results" \
            --roster evals/roster.yml --policy evals/gate-policy.yml \
            --as-of "$as_of" \
            --registry "adam-agentskills=$GITHUB_WORKSPACE/registry-agentskills" \
            --registry "cms-platform=$GITHUB_WORKSPACE/registry-cms" \
            --registry "adamdaniel.ai=$GITHUB_WORKSPACE/registry-site" \
            --guidance "$GITHUB_WORKSPACE/agent-guidance" \
            --out "$RUNNER_TEMP/gates/latest.json"

      - name: Upload the verdicts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gates
          path: ${{ runner.temp }}/gates/
          if-no-files-found: error

      - name: File or update the retirement issue
        working-directory: skills-evals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/retire_skill.py \
            --gates "$RUNNER_TEMP/gates/latest.json" \
            --registry "adam-agentskills=$GITHUB_WORKSPACE/registry-agentskills" \
            --registry "cms-platform=$GITHUB_WORKSPACE/registry-cms" \
            --registry "adamdaniel.ai=$GITHUB_WORKSPACE/registry-site" \
            --allow-mode proposal

      - name: File or update the guidance retirement issue
        # One section at a time, in proposal mode: an issue in this
        # repository, never a pull request (gate-policy.yml's guidance block;
        # auto mode is a separate, owner-approved change).
        working-directory: skills-evals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/retire_skill.py --target guidance \
            --gates "$RUNNER_TEMP/gates/latest.json" \
            --guidance "$GITHUB_WORKSPACE/agent-guidance" \
            --allow-mode proposal
