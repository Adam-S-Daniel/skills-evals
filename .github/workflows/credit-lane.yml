name: Monthly API-credit lane

# Adam, 2026-11-15: spend the monthly Claude Platform credit grant on eval.yml
# dispatches automatically, instead of a thread dispatching by hand. Every
# three hours this asks scripts/credit_lane.py whether to dispatch, and if so
# dispatches eval.yml once with the planned fixtures, model and trials. The
# rules (the window after the grant day, the eval pause, one run at a time,
# stop for the window on any failed dispatch, the soft cap) live in that
# script and evals/credit-policy.yml, the only config.
#
# * Nothing here holds an Anthropic credential or runs a fixture: eval.yml
#   does, under its own guards, which revalidate every fixture and refuse the
#   in-place ones. This job only reads and dispatches.
# * `permissions: {}` at the top; the one job gets `contents: read` for the
#   checkouts and `actions: write` to list eval.yml's runs and dispatch it.
#   All checkouts use persist-credentials: false.
# * Values reach `gh workflow run` through env, never `${{ }}` inside run:.
# * No push or pull_request trigger, so no path filter, and not a required
#   check, so a workflow-level concurrency group is safe: a run queues behind
#   the one before it (cancel-in-progress false) instead of both seeing no
#   eval.yml run in flight and dispatching twice. Default branch only.
# * The step summary carries the decision and dollar figures only.

on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan and report, but dispatch nothing
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: credit-lane
  cancel-in-progress: false

jobs:
  plan-and-dispatch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          path: skills-evals
          persist-credentials: false

      - name: Check out the results branch
        uses: actions/checkout@v7.0.1
        with:
          ref: persistent/eval-results
          path: results
          persist-credentials: false

      # Only the window file is read from it; nothing of it runs.
      - name: Check out the guidance window (_agent-guidance)
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/_agent-guidance
          path: guidance-window
          sparse-checkout: scripts/base-md-merge-window.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install the script's dependencies
        run: python3 -m pip install pyyaml==6.0.3

      - name: List eval.yml runs this month
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          since="$(date -u +%Y-%m-01)"
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/eval.yml/runs?per_page=100&created=%3E%3D${since}" \
            > "$RUNNER_TEMP/pages.json"
          python3 -c 'import json, sys; json.dump([r for page in json.load(open(sys.argv[1])) for r in page["workflow_runs"]], sys.stdout)' \
            "$RUNNER_TEMP/pages.json" > "$RUNNER_TEMP/runs.json"

      - name: Plan
        id: plan
        working-directory: skills-evals
        run: |
          set -euo pipefail
          python3 scripts/credit_lane.py plan \
            --policy evals/credit-policy.yml \
            --results-tree "$GITHUB_WORKSPACE/results" \
            --runs-json "$RUNNER_TEMP/runs.json" \
            --guidance-tree "$GITHUB_WORKSPACE/guidance-window" > "$RUNNER_TEMP/plan.json"
          python3 - "$RUNNER_TEMP/plan.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"dispatch={'true' if plan['dispatch'] else 'false'}")
          print(f"model={plan['model'] or ''}")
          print(f"fixtures={' '.join(plan['fixtures'])}")
          PY
          python3 - "$RUNNER_TEMP/plan.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          plan = json.load(open(sys.argv[1], encoding="utf-8"))
          print("### Monthly API-credit lane")
          print()
          print(f"- Dispatch: {'yes' if plan['dispatch'] else 'no'}")
          print(f"- Reason: {plan['reason']}")
          print(f"- Spent this window: ${plan['spent_usd']:.2f}")
          if plan["dispatch"]:
              print(f"- Model: `{plan['model']}`, {len(plan['fixtures'])} fixture(s), about ${plan['est_usd']:.2f}")
              for fixture in plan["fixtures"]:
                  print(f"  - `{fixture}`")
          PY

      - name: Read the trials from the policy
        id: policy
        if: steps.plan.outputs.dispatch == 'true'
        working-directory: skills-evals
        run: |
          set -euo pipefail
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import credit_lane; from pathlib import Path; print("trials=%d" % credit_lane.load_policy(Path("evals/credit-policy.yml"))["trials"])' >> "$GITHUB_OUTPUT"

      - name: Dispatch eval.yml
        if: steps.plan.outputs.dispatch == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURES: ${{ steps.plan.outputs.fixtures }}
          MODEL: ${{ steps.plan.outputs.model }}
          TRIALS: ${{ steps.policy.outputs.trials }}
        run: |
          set -euo pipefail
          gh workflow run eval.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
            -f fixture="$FIXTURES" -f model="$MODEL" -f trials="$TRIALS"
          echo "- Dispatched eval.yml." >> "$GITHUB_STEP_SUMMARY"
