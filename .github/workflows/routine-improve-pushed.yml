name: Routine improve pushed

# The trigger half of the improvement loop's gate (ADR 0005 amendment 1;
# ADR 0010). In improve mode the eval routine runs
# scripts/propose_skill_edit.py and, on an accepted candidate only, pushes
# `claude/eval-improve-<run id>`; this workflow does nothing but exist for
# that push, so that `routine-improve-gate.yml` can run on its
# `workflow_run` event.
#
# Why two workflows: a `push` workflow runs the copy of itself on the PUSHED
# commit, and the pushed branch is untrusted (a model run wrote it), so any
# job here could have been rewritten by the branch it is judging. A
# `workflow_run` workflow always runs the default branch's copy, so the gate
# and its validator never come from the branch. This job therefore holds no
# permissions, checks nothing out and runs nothing from the branch (the same
# split as routine-eval-results-pushed.yml).
#
# Salient path: `eval-improve/**`, the one directory an improve branch adds
# to (scripts/improve_gate.py SOURCE_ROOT). `claude/eval-improve-*` also
# matches routine-eval-results-pushed.yml's `claude/eval-*`; the two path
# filters (`eval-improve/**` here, `eval-results/**` there) are what keep
# each push to its own gate. This is not a pull_request workflow, so it
# publishes no required check.

on:
  push:
    branches:
      - claude/eval-improve-*
    paths:
      - eval-improve/**

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hand off to the improve gate
        run: echo "Improvement candidate pushed; routine-improve-gate.yml validates it from the default branch."
