name: Publish explorer data

# #72: publish `explorer/latest.json` on `persistent/eval-results`, the public
# data behind the Evals Explorer page (scripts/explorer_data.py says what
# it carries and what it never does).
#
# * Triggers: after a routine's results are ingested, daily (the census and the
#   regression list move without an ingest), and by hand. There is no
#   pull_request or push trigger, so no path filter applies. `workflow_run`
#   always runs the default branch's copy, never one a branch carries.
# * Two jobs so the write token never meets the code that reads the tree:
#   `build` (read-only) checks out main, the results branch and the public
#   sources, runs the script and uploads one file; `publish` (the only job
#   with `contents: write`) checks out nothing from main, puts that file on the
#   results branch and pushes.
# * Writes go only to `persistent/eval-results` (the sanctioned bot-write
#   target), never to main. Nothing from the event is interpolated into a
#   `run:` block.
# * The file is committed only when it changed apart from `generated_at` and
#   `source.results_commit`, which move with every commit to the branch
#   (including this workflow's own), so the workflow never commits to itself.
# * The regression alerts' issue links come from open issues carrying the
#   `skills-evals:regression:` markers (`issues: read`).
# * No private registry is checked out: the census on the results branch is the
#   only source of which skills are public.
# * #544/#545 (2026-11-02): the `broken` and `context-drift` alerts read each
#   in-place fixture's consumer `skills.lock` at its pin and along the
#   consumer's first-parent history, so every `--context-repo` checkout is
#   full history (`fetch-depth: 0`; adamdaniel.ai also `filter: blob:none`,
#   its media blobs are large and only lock blobs are read). A shallow
#   checkout makes both alerts "unknown", never silently clean. Measured
#   locally on 2026-11-02 (18 in-scope fixtures, full clones): the build took
#   10 to 15 s, the alerts about 2 s of it, so the job's timeout stays.
# * #555 (2026-11-02): `build` also holds `actions: read` to list the last 14
#   days of routine-eval-fire.yml runs for the document-level
#   `fires_without_results` summary. The token is in that one step's env, the
#   step is `continue-on-error` and swallows its own failure (a missing file
#   makes the summary unknown, never 0), and it prints nothing but a fixed
#   line with an exit code: the run titles name fixtures, private ones too,
#   and only explorer_data.py's scope filter may decide what is public. The
#   window start and the fetch time come from the runner's clock, never from
#   `${{ }}` context. `publish` keeps `contents: write` alone.
# * #562 (2026-11-02): the three registry checkouts' full history also feeds
#   each skill's `copies` and the report-only `loaded-copy` alert: main's
#   digest at every first-parent commit in the last 2 weeks, read with
#   `git archive` (adamdaniel.ai's few skill blobs are fetched lazily from the
#   public origin). A shallow one makes the alert unknown (null), never clean.
# * The fixture queue (Adam, 2026-11-03: requesting harder fixtures, building
#   them from real fleet work and putting them to use is tracked, acted on
#   when broken, and on the dashboard). `build` lists the `agent-ready`
#   issues and every pull request (`pull-requests: read`; the issue listing
#   uses the `issues: read` it already holds) in one `continue-on-error`
#   step that holds the token and prints only a fixed line, then
#   scripts/fixture_queue.py `report`, with no token, follows each request to
#   its pull requests and to the fixtures whose `origin:` names it, with
#   their runs and cost from the results branch, and that report becomes the
#   document's `fixture_queue`. Bodies are read, never published. A failed
#   listing or report makes the field unknown (null), never empty. The
#   report's own `generated_at` is the runner's clock, so publish ignores it
#   beside the document's.
# * `queue-alerts` is the only job with `issues: write`. It downloads the
#   report `build` made and runs `fixture_queue.py alerts`, which files,
#   reopens or closes one `half-built-or-broken` issue per finding (a stale
#   request, a stuck pull request, a fixture that never ran), in the fleet
#   health audit's format. It checks out main only for the script and reads
#   nothing else; every finding is validated again before it reaches an
#   issue. It is here, not in routine-eval-weekly.yml's work-issues job
#   (which also holds `issues: write`), because the report is built here:
#   the issues act on exactly the report the dashboard shows, and the weekly
#   job would have to rebuild it from three more checkouts. It runs only
#   when a report was built, so a failed listing closes nothing.
# * The lessons (Adam, 2026-11-03): `build` mints the read-only registry App
#   token for adam-agentskills-private alone (contents: read) and checks out
#   only `lessons/` (proposals and records) from `persistent/lessons`, with no credentials
#   kept, and lists adam-agentskills' pull requests with the job token (a
#   public repository) for each new-skill lesson's draft. Every one of those
#   steps is `continue-on-error` and prints only a fixed line, so a missing
#   App or branch makes `lessons` unknown (null), never a red build. The
#   proposals come from private local sessions: explorer_data.py publishes
#   only a public proposal's kind, subject, count, dates and draft, and its
#   records' machine surfaces and signal counts, never a session excerpt,
#   session, record id, repository or check sketch, and counts the rest.
#   One more `continue-on-error` step lists, with the job token, the memory
#   curation routine's `Memory promotion` issues across both fleet owners
#   (kept only in a repository that reads exactly `private: false`) and the
#   skill-proposal issues of adam-agentskills, for `lessons.issues`: number,
#   state, date, the count and target parsed from a title, a skill name and
#   a built URL, never a body or other title text.

on:
  workflow_run:
    workflows: [Ingest routine eval results]
    types: [completed]
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions: {}

# Each run rebuilds from the newest results, so a skipped pending run loses
# nothing. This is not a required check.
concurrency:
  group: explorer-data
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name != 'workflow_run'
          || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      queue: ${{ steps.queue.outputs.queue }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: skills-evals
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the results branch
        uses: actions/checkout@v7.0.1
        with:
          ref: persistent/eval-results
          path: eval-results
          persist-credentials: false

      - name: Check out adam-agentskills
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: registry-agentskills
          fetch-depth: 0
          persist-credentials: false

      - name: Check out cms-platform
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/cms-platform
          path: registry-cms
          fetch-depth: 0
          persist-credentials: false

      - name: Check out adamdaniel.ai
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adamdaniel.ai
          path: registry-site
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Check out _agent-guidance
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/_agent-guidance
          path: agent-guidance
          fetch-depth: 0
          persist-credentials: false

      - name: Check out repo-settings
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/repo-settings
          path: context-repo-settings
          fetch-depth: 0
          persist-credentials: false

      - name: Check out wsl-automation
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/wsl-automation
          path: context-wsl-automation
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install the offline verdict dependency
        run: python3 -m pip install pyyaml==6.0.3 markdown-it-py==4.2.0

      - name: List the open regression issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search '"skills-evals:regression:" in:body' \
            --json number,url,body --limit 200 \
            > "$RUNNER_TEMP/regression-issues.json"

      - name: List the recent eval fires
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/fire-runs.json"
          raw="$RUNNER_TEMP/fire-runs.raw"
          # Taken before the call: a fire the listing judges old enough
          # (2 hours before this) was old enough when the listing began.
          fetched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          since=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)
          rc=0
          { gh api --method GET --paginate --slurp \
              -f event=workflow_dispatch -f "created=>=$since" -f per_page=100 \
              "repos/$GITHUB_REPOSITORY/actions/workflows/routine-eval-fire.yml/runs" \
              > "$raw" 2>/dev/null \
            && python3 -I -c 'import json, sys
          pages = json.load(open(sys.argv[2], encoding="utf-8"))
          json.dump({"fetched_at": sys.argv[1], "pages": pages}, open(sys.argv[3], "w", encoding="utf-8"))' \
              "$fetched_at" "$raw" "$out.tmp" 2>/dev/null \
            && mv "$out.tmp" "$out"; } || rc=$?
          rm -f "$raw"
          if [ "$rc" -ne 0 ]; then
            rm -f "$out" "$out.tmp"
            echo "fire runs unavailable (exit $rc)"
          fi
          exit 0

      - name: List the fixture requests and their pull requests
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          { gh api --method GET --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues?state=all&labels=agent-ready&per_page=100" \
              > "$RUNNER_TEMP/queue-issues.json" 2>/dev/null \
            && gh api --method GET --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/pulls?state=all&per_page=100" \
              > "$RUNNER_TEMP/queue-pulls.json" 2>/dev/null; } || rc=$?
          if [ "$rc" -ne 0 ]; then
            rm -f "$RUNNER_TEMP/queue-issues.json" "$RUNNER_TEMP/queue-pulls.json"
            echo "fixture queue listings unavailable (exit $rc)"
          fi
          exit 0

      - name: Build the fixture queue report
        id: queue
        working-directory: skills-evals
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/fixture-queue/fixture-queue.json"
          if [ ! -f "$RUNNER_TEMP/queue-issues.json" ] || [ ! -f "$RUNNER_TEMP/queue-pulls.json" ]; then
            echo "queue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rc=0
          python3 scripts/fixture_queue.py report \
            --issues "$RUNNER_TEMP/queue-issues.json" --pulls "$RUNNER_TEMP/queue-pulls.json" \
            --repo . --results-tree "$GITHUB_WORKSPACE/eval-results" \
            --now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --out "$out" || rc=$?
          if [ "$rc" -ne 0 ]; then
            rm -f "$out"
            echo "fixture queue report unavailable (exit $rc)"
            echo "queue=false" >> "$GITHUB_OUTPUT"
          else
            echo "queue=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      # The lessons (Adam, 2026-11-03): every step that reaches the private
      # lessons is continue-on-error, so a missing App, branch or checkout
      # leaves `lessons` unknown (null) and never breaks the page build.
      - name: Mint the read-only token for the lessons
        id: lessons-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REGISTRY_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_READ_APP_PEM }}
          owner: Adam-S-Daniel
          repositories: adam-agentskills-private
          permission-contents: read

      # ls-remote exits 2 when persistent/lessons is absent; any other
      # nonzero code (no token, no network) also reads as absent here.
      - name: Look for the lessons branch
        id: lessons-branch
        continue-on-error: true
        env:
          LESSONS_TOKEN: ${{ steps.lessons-token.outputs.token }}
        run: |
          set -uo pipefail
          if [ -z "$LESSONS_TOKEN" ]; then
            echo "lessons unavailable (no token)"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          auth="$(printf 'x-access-token:%s' "$LESSONS_TOKEN" | base64 -w0)"
          rc=0
          git -c "http.extraHeader=Authorization: basic $auth" ls-remote --exit-code --heads \
            https://github.com/Adam-S-Daniel/adam-agentskills-private.git persistent/lessons \
            > /dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "lessons unavailable (exit $rc)"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"

      # Only lessons/ (proposals/ and records/), read as data by
      # explorer_data.py, which publishes only each public proposal's kind,
      # subject, count, dates, and its records' sources and signals.
      # Credentials not kept.
      - name: Check out the lesson proposals (adam-agentskills-private)
        if: steps.lessons-branch.outputs.present == 'true'
        continue-on-error: true
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills-private
          ref: persistent/lessons
          path: private-lessons
          persist-credentials: false
          sparse-checkout: lessons
          token: ${{ steps.lessons-token.outputs.token }}

      # adam-agentskills is public: the job token lists its pull requests for
      # each new-skill lesson's `draft-skill/<subject>` draft. Titles and
      # bodies are dropped here; only head, number, state and merged remain.
      - name: List the skill draft pull requests
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/draft-prs.json"
          rc=0
          gh api --method GET \
            "repos/Adam-S-Daniel/adam-agentskills/pulls?state=all&per_page=100" \
            --jq '[.[] | {head: .head.ref, number: .number, state: .state, merged: (.merged_at != null)}]' \
            > "$out.tmp" 2>/dev/null && mv "$out.tmp" "$out" || rc=$?
          if [ "$rc" -ne 0 ]; then
            rm -f "$out" "$out.tmp"
            echo "draft pull requests unavailable (exit $rc)"
          fi
          exit 0

      # Lessons from two more sources (Adam, 2026-11-03), with the job token
      # (`issues: read`): the memory curation routine's `Memory promotion`
      # issues across both fleet owners, each kept only when its repository
      # reads exactly `private: false`, and the skill-proposal issues of the
      # public adam-agentskills. The file is data for explorer_data.py, which
      # publishes only the number, state, date, the count and target parsed
      # from a title, and a skill name; nothing from it is printed here.
      - name: List the memory promotion and skill proposal issues
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/lesson-issues.json"
          hits="$RUNNER_TEMP/memory-hits.jsonl"
          rows="$RUNNER_TEMP/memory-rows.jsonl"
          rc=0
          : > "$hits"; : > "$rows"
          for owner in Adam-S-Daniel jodidaniel; do
            gh api -X GET search/issues -f "q=user:$owner is:issue \"Memory promotion\" in:title" \
              -f per_page=100 \
              --jq '.items[] | {repo: (.repository_url | sub("^https://api.github.com/repos/"; "")), number: .number, state: .state, created_at: .created_at, title: .title}' \
              >> "$hits" 2>/dev/null || rc=$?
          done
          if [ "$rc" -eq 0 ]; then
            for repo in $(jq -r '.repo' "$hits" | sort -u); do
              case "$repo" in */*) ;; *) continue ;; esac
              private=$(gh api "repos/$repo" --jq '.private' 2>/dev/null) || private=unknown
              [ "$private" = false ] || continue
              jq -c --arg repo "$repo" 'select(.repo == $repo) + {private: false}' "$hits" >> "$rows"
            done
            gh api "repos/Adam-S-Daniel/adam-agentskills/issues?labels=skill-proposal&state=all&per_page=100" \
              > "$RUNNER_TEMP/proposal-issues.json" 2>/dev/null || rc=$?
          fi
          if [ "$rc" -eq 0 ]; then
            jq -n --slurpfile memory "$rows" --slurpfile proposals "$RUNNER_TEMP/proposal-issues.json" \
              '{memory: $memory, proposals: $proposals[0]}' > "$out.tmp" 2>/dev/null \
              && mv "$out.tmp" "$out" || rc=$?
          fi
          rm -f "$hits" "$rows" "$RUNNER_TEMP/proposal-issues.json" "$out.tmp"
          if [ "$rc" -ne 0 ]; then
            rm -f "$out"
            echo "lesson issues unavailable (exit $rc)"
          fi
          exit 0

      - name: Build the explorer data
        working-directory: skills-evals
        run: |
          set -euo pipefail
          as_of=$(git -C "$GITHUB_WORKSPACE/eval-results" log -1 --format=%cI)
          mkdir -p "$RUNNER_TEMP/explorer"
          lessons=()
          if [ -d "$GITHUB_WORKSPACE/private-lessons/lessons/proposals" ]; then
            lessons+=(--lessons "$GITHUB_WORKSPACE/private-lessons/lessons/proposals")
          fi
          if [ -d "$GITHUB_WORKSPACE/private-lessons/lessons/records" ]; then
            lessons+=(--lesson-records "$GITHUB_WORKSPACE/private-lessons/lessons/records")
          fi
          if [ -f "$RUNNER_TEMP/lesson-issues.json" ]; then
            lessons+=(--lesson-issues "$RUNNER_TEMP/lesson-issues.json")
          fi
          if [ -f "$RUNNER_TEMP/draft-prs.json" ]; then
            lessons+=(--draft-prs "$RUNNER_TEMP/draft-prs.json")
          fi
          python3 scripts/explorer_data.py \
            --results-tree "$GITHUB_WORKSPACE/eval-results" \
            --roster evals/roster.yml --policy evals/gate-policy.yml \
            --as-of "$as_of" \
            --repository-commit "$(git rev-parse HEAD)" \
            --results-commit "$(git -C "$GITHUB_WORKSPACE/eval-results" rev-parse HEAD)" \
            --registry "adam-agentskills=$GITHUB_WORKSPACE/registry-agentskills" \
            --registry "cms-platform=$GITHUB_WORKSPACE/registry-cms" \
            --registry "adamdaniel.ai=$GITHUB_WORKSPACE/registry-site" \
            --guidance "$GITHUB_WORKSPACE/agent-guidance" \
            --guidance-manifest "$GITHUB_WORKSPACE/agent-guidance/agents-md/eval-coverage.yml" \
            --regression-issues "$RUNNER_TEMP/regression-issues.json" \
            --context-repo "Adam-S-Daniel/skills-evals=$GITHUB_WORKSPACE/skills-evals" \
            --context-repo "Adam-S-Daniel/adam-agentskills=$GITHUB_WORKSPACE/registry-agentskills" \
            --context-repo "Adam-S-Daniel/cms-platform=$GITHUB_WORKSPACE/registry-cms" \
            --context-repo "Adam-S-Daniel/adamdaniel.ai=$GITHUB_WORKSPACE/registry-site" \
            --context-repo "Adam-S-Daniel/_agent-guidance=$GITHUB_WORKSPACE/agent-guidance" \
            --context-repo "Adam-S-Daniel/repo-settings=$GITHUB_WORKSPACE/context-repo-settings" \
            --context-repo "Adam-S-Daniel/wsl-automation=$GITHUB_WORKSPACE/context-wsl-automation" \
            --fire-runs "$RUNNER_TEMP/fire-runs.json" \
            --fixture-queue "$RUNNER_TEMP/fixture-queue/fixture-queue.json" \
            "${lessons[@]}" \
            --out "$RUNNER_TEMP/explorer/latest.json"

      - name: Upload the explorer data
        uses: actions/upload-artifact@v7.0.2
        with:
          name: explorer-data
          path: ${{ runner.temp }}/explorer/latest.json
          if-no-files-found: error

      - name: Upload the fixture queue report
        if: steps.queue.outputs.queue == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fixture-queue
          path: ${{ runner.temp }}/fixture-queue/fixture-queue.json
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the results branch
        uses: actions/checkout@v7.0.1
        with:
          ref: persistent/eval-results
          path: eval-results
          persist-credentials: false

      - name: Download the explorer data
        uses: actions/download-artifact@v8.0.2
        with:
          name: explorer-data
          path: ${{ runner.temp }}/explorer/

      - name: Commit to persistent/eval-results and push
        working-directory: eval-results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new="$RUNNER_TEMP/explorer/latest.json"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          refspec="+refs/heads/persistent/eval-results:refs/remotes/origin/persistent/eval-results"
          # The two fields that change with every commit to the branch, and the
          # fixture queue report's clock, which changes with every build.
          strip='del(.generated_at, .source.results_commit, .fixture_queue.generated_at)'
          for attempt in 1 2 3 4 5 6; do
            # Other publishers push this branch every minute or two, so wait
            # (about 2, 4, 8, 16 and 32 s plus jitter) before each retry.
            if [ "$attempt" -gt 1 ]; then
              sleep $(( (1 << attempt) + RANDOM % 5 ))
            fi
            git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin "$refspec"
            git reset -q --hard refs/remotes/origin/persistent/eval-results
            if [ -f explorer/latest.json ] \
                && [ "$(jq -S "$strip" explorer/latest.json)" = "$(jq -S "$strip" "$new")" ]; then
              echo "explorer/latest.json is current; nothing to commit"
              exit 0
            fi
            mkdir -p explorer
            cp "$new" explorer/latest.json
            git add -- explorer/latest.json
            git \
              -c user.name="skills-evals explorer bot" \
              -c user.email="skills-evals@users.noreply.github.com" \
              commit -q -m "explorer: refresh explorer/latest.json [skip ci]"
            commit="$(git rev-parse HEAD)"
            if git -c "http.https://github.com/.extraheader=$auth" \
                 push origin HEAD:refs/heads/persistent/eval-results; then
              git -c "http.https://github.com/.extraheader=$auth" fetch --no-tags origin "$refspec"
              if git merge-base --is-ancestor "$commit" refs/remotes/origin/persistent/eval-results; then
                echo "published explorer/latest.json as ${commit}"
                exit 0
              fi
              echo "::error::the push reported success but ${commit} is not on persistent/eval-results"
              exit 1
            fi
            echo "push attempt ${attempt} was rejected; rebuilding on the new tip"
          done
          echo "::error::could not push to persistent/eval-results after 6 attempts"
          exit 1

  queue-alerts:
    needs: build
    if: needs.build.outputs.queue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install the pins fixture_queue.py's imports need
        run: python3 -m pip install pyyaml==6.0.3 markdown-it-py==4.2.0

      - name: Download the fixture queue report
        uses: actions/download-artifact@v8.0.2
        with:
          name: fixture-queue
          path: ${{ runner.temp }}/fixture-queue/

      - name: File, keep or close the fixture queue issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 scripts/fixture_queue.py alerts \
            --report "$RUNNER_TEMP/fixture-queue/fixture-queue.json" --run-url "$RUN_URL"
