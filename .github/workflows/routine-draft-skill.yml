name: Draft a skill from a lesson

# The consumer side of the session miner: once a day, pick ONE `new-skill`
# lesson proposal and dispatch routine-eval-fire.yml in draft mode for it.
# The routine triages it first (hooks first, Adam 2026-10-26: "I want the
# first choice to be git hooks whenever possible"), then drafts either a
# hook proposal or a skill with four fixtures, and always pushes
# `claude/draft-skill-<run id>`; routine-draft-skill-gate.yml validates that
# branch. See docs/how-it-works.md, "Draft mode".
#
# * `select` holds `contents: read` and `actions: read` (the allowance
#   guard counts the fire workflow's runs). It reads four things as data
#   and runs nothing from them: the redacted proposals under
#   adam-agentskills-private's lessons/ (a sparse checkout with the
#   read-only registry App token, minted as propagation.yml mints it), the
#   open `skill-proposal` issues in the public adam-agentskills (with the
#   job token; only the owner's own issues with a "Skill name: `<subject>`"
#   line count, and scripts/draft_new_skill.py `issue-proposals` turns each
#   into a proposal of the same schema under issue-proposals/), the
#   public adam-agentskills checkout and the private one's plugins/ (a
#   subject that is already a skill there is never drafted), and the
#   `claude/draft-skill-*` branches of this repository (a subject drafted
#   before, whatever the decision, hook-first included, is never drafted
#   again). `drafted-subjects` reads those branches through git plumbing;
#   `select` ranks both sources together, the highest evidence_count, then
#   the newest, then by name, and prints only the proposal's path and a
#   count. With no persistent/lessons branch, the issues alone can still
#   produce a pick.
# * The decline path (`issues: read`): the agent-checks lane closes a
#   `Hook proposal: <subject>` issue as not planned when the lesson cannot
#   be checked at commit time. Those subjects go to `select
#   --hook-declined`, which may pick them again although they were drafted
#   (hook-first) before, and prints `hook_declined=1`; the dispatch then
#   sets the fire's `hook_declined` input, and the routine skips its
#   triage and drafts a skill.
# * The allowance pre-check is the weekly caller's (#68,
#   scripts/allowance_guard.py `fits`): with no room for one fire the
#   dispatch job is skipped with a notice, and the fire runs the guard again
#   before it spends anything. An unreadable spend fails the job (closed).
# * `dispatch` holds `actions: write` and sends only the validated path;
#   the fire workflow validates it again and builds the payload itself.
# * Schedule plus manual dispatch; no push or pull_request trigger, so no
#   path filter and no required check. No `concurrency` group: one dispatch
#   a day, and the fire's own guard bounds a manual burst.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  select:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      issues: read
    outputs:
      proposal: ${{ steps.select.outputs.proposal }}
      count: ${{ steps.select.outputs.count }}
      hook_declined: ${{ steps.select.outputs.hook_declined }}
      fits: ${{ steps.allowance.outputs.fits }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: skills-evals
          persist-credentials: false

      # Tips only: drafted-subjects reads one file per branch with
      # `git cat-file`, never a checkout. No match is not an error.
      - name: Fetch the drafted branches
        working-directory: skills-evals
        run: |
          set -euo pipefail
          # A glob refspec that matches no branch fails the fetch, so look
          # first: ls-remote exits 2 when nothing matches, and any other
          # nonzero code is a real failure.
          rc=0
          git ls-remote --exit-code --heads origin 'claude/draft-skill-*' > /dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "no claude/draft-skill-* branches yet"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          git fetch --no-tags --depth=1 origin \
            '+refs/heads/claude/draft-skill-*:refs/remotes/origin/claude/draft-skill-*'

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install pyyaml==6.0.3

      - name: Mint the read-only token for the lessons
        id: lessons-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.REGISTRY_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_READ_APP_PEM }}
          owner: Adam-S-Daniel
          repositories: adam-agentskills-private
          permission-contents: read

      # persistent/lessons exists only once the BOXY miner has pushed a
      # lesson; until then only the skill-proposal issues can be drafted,
      # which is not an error. ls-remote exits 2 when the branch is absent;
      # any other nonzero code fails the step.
      - name: Look for the lessons branch
        id: lessons-branch
        env:
          LESSONS_TOKEN: ${{ steps.lessons-token.outputs.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$LESSONS_TOKEN" | base64 -w0)"
          rc=0
          git -c "http.extraHeader=Authorization: basic $auth" ls-remote --exit-code --heads \
            https://github.com/Adam-S-Daniel/adam-agentskills-private.git persistent/lessons \
            > /dev/null || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "no persistent/lessons branch yet: only issues can be drafted"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$rc" -eq 0 ] || exit "$rc"
          echo "present=true" >> "$GITHUB_OUTPUT"

      # lessons/ for the proposals, from persistent/lessons: the BOXY miner
      # writes there because main is PR-only (skills-evals#423, ADR 0015).
      # Credentials not kept.
      - name: Check out the lessons (adam-agentskills-private)
        if: steps.lessons-branch.outputs.present == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills-private
          ref: persistent/lessons
          path: adam-agentskills-private-lessons
          persist-credentials: false
          sparse-checkout: lessons
          token: ${{ steps.lessons-token.outputs.token }}

      # plugins/ from the default branch, so a private skill's name is never
      # drafted again. Credentials not kept.
      - name: Check out the private skills (adam-agentskills-private)
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills-private
          path: adam-agentskills-private
          persist-credentials: false
          sparse-checkout: plugins
          token: ${{ steps.lessons-token.outputs.token }}

      - name: Check out adam-agentskills
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: adam-agentskills
          persist-credentials: false

      # Subjects whose hook proposal the agent-checks lane declined: CLOSED
      # `hook-proposal` issues here with state_reason not_planned, the
      # subject taken from the fixed title and kept only when it matches
      # the subject pattern. An API error fails the job (closed).
      - name: List the declined hook proposals
        working-directory: skills-evals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issues="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues?labels=hook-proposal&state=closed&per_page=100" \
            --jq '.[] | select((has("pull_request") | not)
                               and .state_reason == "not_planned") | .title')" || issues="ERROR"
          if [ "$issues" = ERROR ]; then
            echo "::error::could not list the closed hook-proposal issues"
            exit 1
          fi
          declined="${RUNNER_TEMP:?}/hook-declined.txt"
          : > "$declined"
          while IFS= read -r title; do
            subject="${title#Hook proposal: }"
            if [ "$subject" != "$title" ] \
               && [[ "$subject" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
              printf '%s\n' "$subject" >> "$declined"
            fi
          done <<<"$issues"
          echo "declined hook proposals: $(wc -l < "$declined")"

      # Skill proposals filed as issues in the public adam-agentskills: one
      # page of the open `skill-proposal` issues, saved as data and never
      # printed. `issue-proposals` keeps only the owner's own issues with a
      # name line and writes each as a proposal file; it prints counts and
      # issue numbers only. An API error fails the job (closed).
      - name: Convert the skill-proposal issues
        working-directory: skills-evals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issues="${RUNNER_TEMP:?}/skill-proposal-issues.json"
          fetched=ok
          gh api "repos/Adam-S-Daniel/adam-agentskills/issues?labels=skill-proposal&state=open&per_page=100" \
            > "$issues" || fetched=ERROR
          if [ "$fetched" = ERROR ]; then
            echo "::error::could not list the skill-proposal issues"
            exit 1
          fi
          python3 scripts/draft_new_skill.py issue-proposals --issues "$issues" \
            --out "$RUNNER_TEMP/issue-lessons"

      - name: Select one new-skill proposal
        id: select
        working-directory: skills-evals
        run: |
          set -euo pipefail
          # No lessons branch yet: an empty lessons/ adds nothing, and the
          # issue proposals still compete.
          mkdir -p ../adam-agentskills-private-lessons/lessons
          drafted="${RUNNER_TEMP:?}/drafted-subjects.txt"
          python3 scripts/draft_new_skill.py drafted-subjects --repo . > "$drafted"
          python3 scripts/draft_new_skill.py select \
            --lessons ../adam-agentskills-private-lessons/lessons \
            --issue-proposals "$RUNNER_TEMP/issue-lessons" \
            --registry adam-agentskills=../adam-agentskills \
            --registry adam-agentskills-private=../adam-agentskills-private \
            --evals evals --drafted "$drafted" \
            --hook-declined "$RUNNER_TEMP/hook-declined.txt" > "$RUNNER_TEMP/select.out"
          cat "$RUNNER_TEMP/select.out" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/select.out"

      - name: Check out persistent/eval-results (the ingested runs)
        if: steps.select.outputs.count == '1'
        uses: actions/checkout@v7.0.1
        with:
          ref: persistent/eval-results
          path: eval-results-branch
          persist-credentials: false
          sparse-checkout: routine-results

      # One fire must fit under the weekly cap (#68), as the weekly caller
      # plans; `fits` prints numbers only and exits 1 when the spend cannot
      # be read.
      - name: Check the weekly allowance
        id: allowance
        if: steps.select.outputs.count == '1'
        working-directory: skills-evals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$(python3 scripts/allowance_guard.py fits --results-tree ../eval-results-branch)"
          printf '%s\n' "$out"
          fires="$(sed -n 's/^fires=\([0-9][0-9]*\)$/\1/p' <<<"$out")"
          if ! [[ "$fires" =~ ^[0-9]+$ ]]; then
            echo "::error::the allowance guard printed no fire count"
            exit 1
          fi
          if [ "$fires" -ge 1 ]; then
            echo "fits=yes" >> "$GITHUB_OUTPUT"
          else
            echo "fits=no" >> "$GITHUB_OUTPUT"
            echo "::notice::no draft fire fits under the weekly allowance cap today"
          fi

  dispatch:
    needs: select
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && needs.select.outputs.count == '1' && needs.select.outputs.fits == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the draft
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PROPOSAL: ${{ needs.select.outputs.proposal }}
          HOOK_DECLINED: ${{ needs.select.outputs.hook_declined }}
        run: |
          set -euo pipefail
          # The fire workflow's own pattern, checked again before the value
          # reaches a command line.
          if ! [[ "$PROPOSAL" =~ ^(proposals|issue-proposals)/[0-9]{4}-[0-9]{2}-[0-9]{2}/[a-z0-9][a-z0-9-]{0,63}__new-skill\.json$ ]]; then
            echo "::error::the selected proposal is not proposals/ or issue-proposals/<date>/<subject>__new-skill.json"
            exit 1
          fi
          case "$HOOK_DECLINED" in
            1) declined=true ;;
            0) declined=false ;;
            *)
              echo "::error::the selector printed no hook_declined flag"
              exit 1 ;;
          esac
          if ! gh workflow run routine-eval-fire.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            --raw-field mode=draft --raw-field "proposal=$PROPOSAL" \
            --raw-field "hook_declined=$declined" > /dev/null 2>&1; then
            echo "::error::Routine draft dispatch failed"
            exit 1
          fi
          echo "dispatched draft mode for ${PROPOSAL} (hook declined: ${declined})"
