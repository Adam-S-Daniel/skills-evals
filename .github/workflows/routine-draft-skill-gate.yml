name: Gate routine skill draft

# Draft mode's review gate (docs/how-it-works.md, "Draft mode"). In draft
# mode the eval routine triages one `new-skill` lesson (hooks first, Adam
# 2026-10-26: "I want the first choice to be git hooks whenever possible"),
# and always pushes `claude/draft-skill-<run id>` holding
# `draft-skill/<run id>/summary.json` and, by decision:
#
#   hook-first  report.md, nothing else: the lesson can be enforced by an
#               agent-checks hook or a PreToolUse guard, so no skill is
#               drafted. This gate opens one ISSUE here, `Hook proposal:
#               <subject>`, labeled hook-proposal and agent-authored, for
#               the agent-checks lane to pick up.
#   accepted    report.md, skill.patch and 4-8 fixtures under
#               evals/<subject>/: the drafted skill beat no skill on its own
#               fixtures. This gate opens a DRAFT pull request in
#               adam-agentskills with the skill, then a DRAFT pull request
#               here with only evals/<subject>/ and its README layout line;
#               both bodies say to merge the skill first. In auto merge
#               mode (below) both are ready instead, with auto-merge on.
#   rejected    nothing else: the record stays on its branch, and the
#               subject counts as drafted, so it is not picked again.
#
# The routine never opens a pull request or an issue.
#
# * The branch is UNTRUSTED (a model run wrote it). This workflow runs on
#   `workflow_run`, so GitHub always runs the DEFAULT BRANCH's copy of it,
#   never one the branch carries (see routine-draft-skill-pushed.yml). Every
#   checkout is the default branch (and adam-agentskills' default branch,
#   which the validator reads to refuse a subject that is already a skill);
#   the branch is only fetched into a private ref and read through git
#   plumbing by scripts/draft_new_skill.py `validate`. Nothing from it is
#   checked out, imported or executed; its patch reaches `git apply` in a
#   registry checkout as data, after validation, and its fixtures reach the
#   fixtures pull request as files at the judged sha, after validation.
# * Every job that acts re-validates the branch at the sha `validate`
#   judged, stages its own copy instead of trusting an artifact, and checks
#   the values it re-derived are the ones `validate` handed over.
# * Jobs and what each holds (workflow permissions are `{}`; no workflow- or
#   job-level `env:`):
#     validate     contents: read, no secret.
#     credential   nothing; learns only WHETHER the GitHub App's two secrets
#                  exist (a boolean), as routine-improve-gate.yml does.
#     skill-pr     contents: read; mints the EVAL_IMPROVE_APP installation
#                  token (adam-agentskills only, contents and pull-requests
#                  write) after re-validation, and one step uses it: `apply`
#                  adds the skill and the registry's bookkeeping, and when
#                  the bundle is in the registry's skills.lock a second
#                  commit re-pins it (generate_skills_lock.py --repin). Without
#                  the secrets it is SKIPPED with a job-summary note, and so
#                  is fixtures-pr: fixtures for a skill no pull request
#                  proposes would only fail.
#     fixtures-pr  contents: write and pull-requests: write on this
#                  repository's job token: it commits evals/<subject>/ and
#                  its README layout line (fixtures-apply) to a fresh branch `draft-skill-fixtures/<subject>` from
#                  the default branch and opens a draft pull request. It
#                  runs only after skill-pr opened the skill's pull request,
#                  so the order is skill first, fixtures second; the
#                  fixtures pull request says to merge after the skill's.
#                  A pull request opened with the job token starts no other
#                  workflow, so `test` (ci.yml) runs once a person pushes.
#     hook-issue   contents: read and issues: write on the job token.
# * One proposal per subject: an existing `draft-skill/<subject>` branch in
#   adam-agentskills, `draft-skill-fixtures/<subject>` branch here or
#   `Hook proposal: <subject>` issue (open or closed) means one is already
#   waiting for a person, so nothing is opened. Nothing here approves,
#   force-pushes or deletes anything.
# * The merge mode is the improvement gate's one switch,
#   evals/improve-policy.yml `improve_merge_mode`, read by
#   `improve_gate.py merge-mode` (draft when the skill's plugin runs code).
#   In `auto` (Adam, 2026-10-26; adam-agentskills ADR 0021) the skill's pull
#   request is ready, labeled and auto-merges (merge commit) after its
#   required checks, unless another loop pull request (`eval-improve/*`,
#   `draft-skill/*`, `retire-skill/*`) is open there, which makes both
#   drafts. The fixtures pull request is ready with auto-merge only when the
#   skill's is, so it never leads; opened with the job token, its required
#   checks start only when someone pushes or runs them.
# * Branch names, shas and file content are never interpolated into a
#   `run:` block: the event is read from $GITHUB_EVENT_PATH by the
#   validator, which emits only values that matched a strict pattern, and
#   every later step reads them through `env`.
# * No `concurrency` group: GitHub keeps only the newest pending run in a
#   group, so a burst of pushes would cancel gates silently.
# * `workflow_dispatch` re-gates a branch by name (for a missed or failed
#   run); only the default branch's copy may run.

on:
  workflow_run:
    workflows: [Routine draft skill pushed]
    types: [completed]
    branches:
      - claude/draft-skill-*
  workflow_dispatch:
    inputs:
      branch:
        description: The draft branch, claude/draft-skill-<run id>.
        required: true
        type: string

permissions: {}

jobs:
  validate:
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.resolve.outputs.branch }}
      sha: ${{ steps.fetch.outputs.sha }}
      decision: ${{ steps.gate.outputs.decision }}
      subject: ${{ steps.gate.outputs.subject }}
      plugin: ${{ steps.gate.outputs.plugin }}
      run_id: ${{ steps.gate.outputs.run_id }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: skills-evals
          fetch-depth: 0
          persist-credentials: false

      - name: Check out adam-agentskills
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: adam-agentskills
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install the validator's one dependency
        run: python3 -m pip install pyyaml==6.0.3

      - name: Resolve the branch to gate
        id: resolve
        working-directory: skills-evals
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 scripts/draft_new_skill.py resolve \
            --event-name "$EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            > "$RUNNER_TEMP/resolve.out"
          cat "$RUNNER_TEMP/resolve.out" >> "$GITHUB_OUTPUT"

      # A push names its sha; a dispatch names only the branch, so the tip
      # fetched here is the one judged, and every later job holds to it.
      - name: Fetch the draft branch into a private ref
        id: fetch
        working-directory: skills-evals
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
          PUSHED_SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/draft-skill/source"
          tip="$(git rev-parse --verify 'refs/draft-skill/source^{commit}')"
          if ! [[ "$tip" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::could not resolve the draft branch's tip"
            exit 1
          fi
          if [ -n "$PUSHED_SHA" ] && [ "$PUSHED_SHA" != "$tip" ]; then
            echo "::error::the branch moved after the push; its newer push runs its own gate"
            exit 1
          fi
          echo "sha=${tip}" >> "$GITHUB_OUTPUT"

      - name: Validate the draft
        id: gate
        working-directory: skills-evals
        env:
          BRANCH: ${{ steps.resolve.outputs.branch }}
          SHA: ${{ steps.fetch.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 scripts/draft_new_skill.py validate \
            --repo . --base "refs/remotes/origin/${DEFAULT_BRANCH}" \
            --source refs/draft-skill/source --branch "$BRANCH" \
            --expect-sha "$SHA" --registry adam-agentskills=../adam-agentskills \
            --out "$RUNNER_TEMP/staged" > "$RUNNER_TEMP/gate.out"
          cat "$RUNNER_TEMP/gate.out" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/gate.out"

  credential:
    needs: validate
    if: needs.validate.outputs.decision == 'accepted'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Are the GitHub App's secrets configured?
        id: check
        env:
          PR_CREDENTIAL_SET: ${{ secrets.EVAL_IMPROVE_APP_CLIENT_ID != '' && secrets.EVAL_IMPROVE_APP_PEM != '' }}
        run: |
          set -euo pipefail
          if [ "$PR_CREDENTIAL_SET" = "true" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "::notice::the skill draft passed the gate; no pull requests are opened because the GitHub App secrets EVAL_IMPROVE_APP_CLIENT_ID and EVAL_IMPROVE_APP_PEM are not both set"
          {
            echo "### Skill draft validated; pull requests skipped"
            echo
            echo "The draft passed the gate. The skill and fixtures pull requests are skipped because repository secrets \`EVAL_IMPROVE_APP_CLIENT_ID\` and \`EVAL_IMPROVE_APP_PEM\` are not both set (see routine-improve-gate.yml's header for the App this needs)."
          } >> "$GITHUB_STEP_SUMMARY"

  skill-pr:
    needs: [validate, credential]
    if: needs.validate.outputs.decision == 'accepted' && needs.credential.outputs.present == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      opened: ${{ steps.open.outputs.opened }}
      auto: ${{ steps.open.outputs.auto }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: skills-evals
          fetch-depth: 0
          persist-credentials: false

      - name: Check out adam-agentskills
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: adam-agentskills
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install the validator's one dependency
        run: python3 -m pip install pyyaml==6.0.3

      # The same validator, on the sha `validate` judged: this job stages its
      # own copy of the files instead of trusting an artifact, and fails if
      # the branch moved (its newer push runs its own gate).
      - name: Re-validate the draft at the judged sha
        id: revalidate
        working-directory: skills-evals
        env:
          BRANCH: ${{ needs.validate.outputs.branch }}
          SHA: ${{ needs.validate.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/draft-skill/source"
          python3 scripts/draft_new_skill.py validate \
            --repo . --base "refs/remotes/origin/${DEFAULT_BRANCH}" \
            --source refs/draft-skill/source --branch "$BRANCH" \
            --expect-sha "$SHA" --registry adam-agentskills=../adam-agentskills \
            --out "$RUNNER_TEMP/staged" > "$RUNNER_TEMP/revalidate.out"
          cat "$RUNNER_TEMP/revalidate.out"

      # The loop's one merge switch (evals/improve-policy.yml), lowered to
      # draft when the skill's plugin runs code, exactly as the improvement
      # gate decides it. No credential is held yet.
      - name: Decide the merge mode
        id: mode
        working-directory: skills-evals
        env:
          PLUGIN: ${{ needs.validate.outputs.plugin }}
        run: |
          set -euo pipefail
          python3 scripts/improve_gate.py merge-mode \
            --tree ../adam-agentskills --plugin "$PLUGIN" > "$RUNNER_TEMP/mode.out"
          cat "$RUNNER_TEMP/mode.out"
          cat "$RUNNER_TEMP/mode.out" >> "$GITHUB_OUTPUT"

      # Minted only now, after re-validation: an installation token for
      # adam-agentskills alone, with contents and pull-requests write only.
      - name: Mint the GitHub App token for adam-agentskills
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.EVAL_IMPROVE_APP_CLIENT_ID }}
          private-key: ${{ secrets.EVAL_IMPROVE_APP_PEM }}
          owner: Adam-S-Daniel
          repositories: adam-agentskills
          permission-contents: write
          permission-pull-requests: write

      - name: Open the skill's pull request in adam-agentskills
        id: open
        working-directory: skills-evals
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TARGET_REPO: Adam-S-Daniel/adam-agentskills
          BRANCH: ${{ needs.validate.outputs.branch }}
          SHA: ${{ needs.validate.outputs.sha }}
          RUN_ID: ${{ needs.validate.outputs.run_id }}
          SUBJECT: ${{ needs.validate.outputs.subject }}
          PLUGIN: ${{ needs.validate.outputs.plugin }}
          MODE: ${{ steps.mode.outputs.mode }}
          MODE_REASON: ${{ steps.mode.outputs.mode_reason }}
        run: |
          set -euo pipefail
          echo "opened=false" >> "$GITHUB_OUTPUT"
          echo "auto=false" >> "$GITHUB_OUTPUT"
          if ! [[ "$MODE" =~ ^(auto|draft)$ ]]; then
            echo "::error::the merge-mode step decided no mode"
            exit 1
          fi
          if [ -n "$MODE_REASON" ]; then
            echo "::notice::opening drafts, not auto-merging pull requests: ${MODE_REASON}"
          fi
          # The values re-derived from the judged sha must be the ones
          # `validate` handed over.
          for pair in "decision=accepted" "run_id=${RUN_ID}" "sha=${SHA}" \
                      "subject=${SUBJECT}" "plugin=${PLUGIN}"; do
            if ! grep -qxF -- "$pair" "$RUNNER_TEMP/revalidate.out"; then
              echo "::error::re-validation disagrees with the validate job"
              exit 1
            fi
          done
          base="$(gh api "repos/${TARGET_REPO}" --jq '.default_branch')" || base=""
          if ! [[ "$base" =~ ^[A-Za-z0-9._/-]{1,100}$ ]]; then
            echo "::error::could not read ${TARGET_REPO}'s default branch"
            exit 1
          fi
          target="draft-skill/${SUBJECT}"
          reg="$RUNNER_TEMP/registry"
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${b64}"
          auth="AUTHORIZATION: basic ${b64}"
          git init -q "$reg"
          git -C "$reg" remote add origin "https://github.com/${TARGET_REPO}.git"
          # One draft per subject: an existing branch means one is already
          # waiting for a person, so leave it alone.
          existing="$(git -C "$reg" -c "http.https://github.com/.extraheader=$auth" \
            ls-remote --heads origin "refs/heads/${target}")"
          if [ -n "$existing" ]; then
            echo "::notice::${target} already exists in ${TARGET_REPO}; a draft of ${SUBJECT} is already waiting, so this one is not opened"
            exit 0
          fi
          # Another open loop pull request writes the same bundle version,
          # docs/skill-impact.md and skills.lock, so this one would conflict
          # once that one merged: it is opened as a draft for a person.
          if [ "$MODE" = auto ]; then
            heads="$(gh api --paginate "repos/${TARGET_REPO}/pulls?state=open&per_page=100" \
              --jq '.[].head.ref')" || { echo "::error::could not list ${TARGET_REPO}'s open pull requests"; exit 1; }
            while IFS= read -r head; do
              case "$head" in
                eval-improve/*|retire-skill/*|draft-skill/*)
                  echo "::notice::a loop pull request is already open in ${TARGET_REPO}; opening drafts instead"
                  MODE=draft ;;
              esac
            done <<<"$heads"
          fi
          # A new skill adds files, so it is based on the registry's current
          # default branch, where the registry's own additions (apply) fit.
          git -C "$reg" -c "http.https://github.com/.extraheader=$auth" \
            fetch -q --no-tags origin "+refs/heads/${base}:refs/remotes/origin/${base}"
          git -C "$reg" checkout -q --detach "refs/remotes/origin/${base}"
          # apply: the patch as data, then the registry's own additions
          # (manifest versions, README table, docs/skill-impact.md entry).
          python3 scripts/draft_new_skill.py apply \
            --staged "$RUNNER_TEMP/staged" --tree "$reg" > "$RUNNER_TEMP/apply.out"
          cat "$RUNNER_TEMP/apply.out"
          git -C "$reg" add -A
          git -C "$reg" \
            -c user.name="skills-evals draft-gate bot" \
            -c user.email="skills-evals@users.noreply.github.com" \
            commit -q -m "Add the drafted ${SUBJECT} skill from draft run ${RUN_ID}"
          # The bundle is in the registry's own skills.lock: re-pin it on the
          # commit just made, as its --check-current requires, and commit that.
          if grep -qxF -- "relock=true" "$RUNNER_TEMP/apply.out"; then
            (cd "$reg" && python3 scripts/generate_skills_lock.py --repin)
            git -C "$reg" add -A
            git -C "$reg" \
              -c user.name="skills-evals draft-gate bot" \
              -c user.email="skills-evals@users.noreply.github.com" \
              commit -q -m "Re-pin skills.lock for the drafted ${SUBJECT} skill"
          elif ! grep -qxF -- "relock=false" "$RUNNER_TEMP/apply.out"; then
            echo "::error::apply printed no relock decision"
            exit 1
          fi
          commit="$(git -C "$reg" rev-parse HEAD)"
          git -C "$reg" -c "http.https://github.com/.extraheader=$auth" \
            push origin "HEAD:refs/heads/${target}"
          git -C "$reg" -c "http.https://github.com/.extraheader=$auth" \
            fetch -q --no-tags origin "+refs/heads/${target}:refs/remotes/origin/${target}"
          if ! git -C "$reg" merge-base --is-ancestor "$commit" "refs/remotes/origin/${target}"; then
            echo "::error::the push reported success but ${commit} is not on ${target}"
            exit 1
          fi
          body="$RUNNER_TEMP/body.md"
          python3 scripts/draft_new_skill.py pr-body --staged "$RUNNER_TEMP/staged" \
            --run-id "$RUN_ID" --sha "$SHA" --branch "$BRANCH" \
            --repo adam-agentskills --mode "$MODE" > "$body"
          draft=()
          if [ "$MODE" = draft ]; then
            draft=(--draft)
          fi
          url="$(gh pr create --repo "$TARGET_REPO" "${draft[@]}" --base "$base" \
            --head "$target" \
            --title "New skill: ${SUBJECT} (draft run ${RUN_ID})" \
            --body-file "$body")"
          echo "opened=true" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = auto ]; then
            # Labeled before auto-merge: a pull request that could not be
            # marked as the loop's stays open for a person.
            gh pr edit "$url" --add-label agent-authored > /dev/null \
              || { echo "::error::could not label ${url}; it stays open without auto-merge"; exit 1; }
            gh pr merge "$url" --repo "$TARGET_REPO" --auto --merge
            method="$(gh pr view "$url" --repo "$TARGET_REPO" --json autoMergeRequest \
              --jq '.autoMergeRequest.mergeMethod // ""')" || method=""
            if [ "$method" != "MERGE" ]; then
              echo "::error::auto-merge is not enabled on ${url}"
              exit 1
            fi
            echo "auto=true" >> "$GITHUB_OUTPUT"
          # The label is a courtesy on a draft: a missing label must not
          # strand an opened pull request, so a failure here is a warning.
          elif ! gh pr edit "$url" --add-label agent-authored > /dev/null 2>&1; then
            echo "::warning::could not add the agent-authored label to the skill's pull request"
          fi
          {
            echo "### Skill draft pull request opened"
            echo
            echo "- Run id: \`${RUN_ID}\`"
            echo "- Source commit: \`${SHA}\`"
            echo "- ${TARGET_REPO} branch: \`${target}\` at \`${commit}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  fixtures-pr:
    needs: [validate, skill-pr]
    if: needs.skill-pr.outputs.opened == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: skills-evals
          fetch-depth: 0
          persist-credentials: false

      - name: Check out adam-agentskills
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: adam-agentskills
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install the validator's one dependency
        run: python3 -m pip install pyyaml==6.0.3

      - name: Re-validate the draft at the judged sha
        id: revalidate
        working-directory: skills-evals
        env:
          BRANCH: ${{ needs.validate.outputs.branch }}
          SHA: ${{ needs.validate.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/draft-skill/source"
          python3 scripts/draft_new_skill.py validate \
            --repo . --base "refs/remotes/origin/${DEFAULT_BRANCH}" \
            --source refs/draft-skill/source --branch "$BRANCH" \
            --expect-sha "$SHA" --registry adam-agentskills=../adam-agentskills \
            --out "$RUNNER_TEMP/staged" > "$RUNNER_TEMP/revalidate.out"
          cat "$RUNNER_TEMP/revalidate.out"

      # Only the validated fixtures, placed at evals/<subject>/ by
      # fixtures-apply from this job's staged copy, plus the README layout
      # line the suite requires of every eval directory, on a fresh branch
      # from the default branch: the record under draft-skill/ stays on the
      # routine's branch. The job token pushes; a push with it starts no
      # workflow.
      - name: Open the fixtures' pull request
        working-directory: skills-evals
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
          BRANCH: ${{ needs.validate.outputs.branch }}
          SHA: ${{ needs.validate.outputs.sha }}
          RUN_ID: ${{ needs.validate.outputs.run_id }}
          SUBJECT: ${{ needs.validate.outputs.subject }}
          PLUGIN: ${{ needs.validate.outputs.plugin }}
          AUTO: ${{ needs.skill-pr.outputs.auto }}
        run: |
          set -euo pipefail
          for pair in "decision=accepted" "run_id=${RUN_ID}" "sha=${SHA}" \
                      "subject=${SUBJECT}" "plugin=${PLUGIN}"; do
            if ! grep -qxF -- "$pair" "$RUNNER_TEMP/revalidate.out"; then
              echo "::error::re-validation disagrees with the validate job"
              exit 1
            fi
          done
          target="draft-skill-fixtures/${SUBJECT}"
          b64="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::${b64}"
          auth="AUTHORIZATION: basic ${b64}"
          existing="$(git -c "http.https://github.com/.extraheader=$auth" \
            ls-remote --heads origin "refs/heads/${target}")"
          if [ -n "$existing" ]; then
            echo "::notice::${target} already exists; fixtures for ${SUBJECT} are already waiting, so these are not opened"
            exit 0
          fi
          git checkout -q --detach "refs/remotes/origin/${BASE}"
          python3 scripts/draft_new_skill.py fixtures-apply \
            --staged "$RUNNER_TEMP/staged" --tree .
          git add -A
          # The commit adds files under evals/<subject>/, edits README.md's
          # layout, and changes nothing else.
          outside="$(git diff --cached --name-only -- . \
            ":(exclude)evals/${SUBJECT}/" ":(exclude)README.md")"
          changed="$(git diff --cached --name-only --diff-filter=a -- "evals/${SUBJECT}/")"
          added="$(git diff --cached --name-only --diff-filter=A -- "evals/${SUBJECT}/")"
          readme="$(git diff --cached --name-only --diff-filter=M -- README.md)"
          if [ -n "$outside" ] || [ -n "$changed" ] || [ -z "$added" ] \
             || [ "$readme" != README.md ]; then
            echo "::error::the fixtures commit would not be evals/${SUBJECT}/ additions plus the README layout line"
            exit 1
          fi
          git -c user.name="skills-evals draft-gate bot" \
            -c user.email="skills-evals@users.noreply.github.com" \
            commit -q -m "Add the drafted ${SUBJECT} fixtures from draft run ${RUN_ID}"
          commit="$(git rev-parse HEAD)"
          git -c "http.https://github.com/.extraheader=$auth" \
            push origin "HEAD:refs/heads/${target}"
          git -c "http.https://github.com/.extraheader=$auth" \
            fetch -q --no-tags origin "+refs/heads/${target}:refs/remotes/origin/${target}"
          if ! git merge-base --is-ancestor "$commit" "refs/remotes/origin/${target}"; then
            echo "::error::the push reported success but ${commit} is not on ${target}"
            exit 1
          fi
          body="$RUNNER_TEMP/body.md"
          # Auto only when the skill's own pull request auto-merges: the
          # fixtures follow the skill, never lead it.
          mode=draft
          if [ "$AUTO" = true ]; then
            mode=auto
          fi
          python3 scripts/draft_new_skill.py pr-body --staged "$RUNNER_TEMP/staged" \
            --run-id "$RUN_ID" --sha "$SHA" --branch "$BRANCH" \
            --repo skills-evals --mode "$mode" > "$body"
          draft=()
          if [ "$mode" = draft ]; then
            draft=(--draft)
          fi
          url="$(gh pr create --repo "$REPO" "${draft[@]}" --base "$BASE" \
            --head "$target" \
            --title "Fixtures for the drafted ${SUBJECT} skill (draft run ${RUN_ID})" \
            --body-file "$body")"
          if ! gh pr edit "$url" --add-label agent-authored > /dev/null 2>&1; then
            echo "::warning::could not add the agent-authored label to the fixtures pull request"
          fi
          # The job token starts no workflow, so this pull request's
          # required checks wait for someone to push or run them; by then
          # the skill's pull request, already auto-merging, has had its
          # checks. Auto-merge only removes the click.
          if [ "$mode" = auto ]; then
            gh pr merge "$url" --repo "$REPO" --auto --merge
            method="$(gh pr view "$url" --repo "$REPO" --json autoMergeRequest \
              --jq '.autoMergeRequest.mergeMethod // ""')" || method=""
            if [ "$method" != "MERGE" ]; then
              echo "::error::auto-merge is not enabled on ${url}"
              exit 1
            fi
          fi
          {
            echo "### Fixtures pull request opened (${mode})"
            echo
            echo "- Run id: \`${RUN_ID}\`"
            echo "- Branch: \`${target}\` at \`${commit}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  hook-issue:
    needs: validate
    if: needs.validate.outputs.decision == 'hook-first'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: skills-evals
          fetch-depth: 0
          persist-credentials: false

      - name: Check out adam-agentskills
        uses: actions/checkout@v7.0.1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: adam-agentskills
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Install the validator's one dependency
        run: python3 -m pip install pyyaml==6.0.3

      - name: Re-validate the draft at the judged sha
        id: revalidate
        working-directory: skills-evals
        env:
          BRANCH: ${{ needs.validate.outputs.branch }}
          SHA: ${{ needs.validate.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${BRANCH}:refs/draft-skill/source"
          python3 scripts/draft_new_skill.py validate \
            --repo . --base "refs/remotes/origin/${DEFAULT_BRANCH}" \
            --source refs/draft-skill/source --branch "$BRANCH" \
            --expect-sha "$SHA" --registry adam-agentskills=../adam-agentskills \
            --out "$RUNNER_TEMP/staged" > "$RUNNER_TEMP/revalidate.out"
          cat "$RUNNER_TEMP/revalidate.out"

      # The agent-checks lane picks these up (_agent-guidance ADR 0021);
      # nothing here writes to _agent-guidance.
      - name: Open the hook-proposal issue
        working-directory: skills-evals
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.validate.outputs.branch }}
          SHA: ${{ needs.validate.outputs.sha }}
          RUN_ID: ${{ needs.validate.outputs.run_id }}
          SUBJECT: ${{ needs.validate.outputs.subject }}
        run: |
          set -euo pipefail
          for pair in "decision=hook-first" "run_id=${RUN_ID}" "sha=${SHA}" \
                      "subject=${SUBJECT}"; do
            if ! grep -qxF -- "$pair" "$RUNNER_TEMP/revalidate.out"; then
              echo "::error::re-validation disagrees with the validate job"
              exit 1
            fi
          done
          title="Hook proposal: ${SUBJECT}"
          # One issue per subject, open or closed: a closed one is a
          # person's answer, so it is not asked again.
          issues="$(gh api "repos/${REPO}/issues?labels=hook-proposal&state=all&per_page=100")" || issues=""
          count="$(jq --arg t "$title" \
            '[.[] | select(.title == $t and (has("pull_request") | not))] | length' \
            <<<"$issues" 2>/dev/null)" || count=""
          case "$count" in
            0) ;;
            [1-9]*)
              echo "::notice::a hook-proposal issue for ${SUBJECT} already exists; none is opened"
              exit 0 ;;
            *)
              echo "::error::could not list the existing hook-proposal issues"
              exit 1 ;;
          esac
          # The two labels exist before the issue names them: a missing
          # label would refuse the whole issue.
          for label in hook-proposal agent-authored; do
            if ! gh api "repos/${REPO}/labels/${label}" > /dev/null 2>&1; then
              if [ "$label" = hook-proposal ]; then
                desc="A lesson to enforce as an agent-checks hook or PreToolUse guard"
              else
                desc="Opened by an agent on behalf of the owner"
              fi
              gh label create "$label" --repo "$REPO" --description "$desc" > /dev/null
            fi
          done
          body="$RUNNER_TEMP/body.md"
          python3 scripts/draft_new_skill.py issue-body --staged "$RUNNER_TEMP/staged" \
            --run-id "$RUN_ID" --sha "$SHA" --branch "$BRANCH" > "$body"
          gh issue create --repo "$REPO" --title "$title" \
            --label hook-proposal --label agent-authored --body-file "$body"
          {
            echo "### Hook-proposal issue opened"
            echo
            echo "- Run id: \`${RUN_ID}\`"
            echo "- Source commit: \`${SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
