name: Weekly routine evals

# Plan only reviewed, committed fixtures. Each leg dispatches the existing
# fire workflow, which validates its inputs and holds the routine bearer.
# This caller uses eval mode only; the improvement loop has a separate gate.
on:
  schedule:
    - cron: "0 7 * * 2"

permissions: {}

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml==6.0.3
      - name: Plan reviewed fixtures within the hourly fire limit
        id: plan
        env:
          GITHUB_EVENT_NAME: schedule
        run: python3 scripts/plan_scheduled_evals.py --max-fixtures 30

  dispatch:
    needs: plan
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Revalidate the committed fixture
        env:
          FIXTURE: ${{ matrix.fixture }}
          MATRIX_KEY: ${{ matrix.eval_key }}
          MATRIX_SLOT: ${{ matrix.slot }}
        run: python3 scripts/plan_scheduled_evals.py --validate "$FIXTURE" "$MATRIX_KEY" "$MATRIX_SLOT" > /dev/null
      - name: Dispatch the validated eval
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          if ! gh workflow run routine-eval-fire.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            --raw-field mode=eval --raw-field "fixture=$FIXTURE" \
            --raw-field arms=both --raw-field trials=1 > /dev/null 2>&1; then
            echo "::error::Routine eval dispatch failed"
            exit 1
          fi
