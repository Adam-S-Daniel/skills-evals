name: Routine eval results pushed

# The trigger half of the routine results ingest (ADR 0010, decision 2). The
# eval routine pushes `claude/eval-<run id>`; this workflow does nothing but
# exist for that push, so that `routine-eval-ingest.yml` can run on its
# `workflow_run` event.
#
# Why two workflows: a `push` workflow runs the copy of itself on the PUSHED
# commit, and the pushed branch is untrusted (an AI run wrote it), so any
# job here could have been rewritten by the branch it is judging. A
# `workflow_run` workflow always runs the default branch's copy, so the
# ingest job, its validator and its `contents: write` token never come from
# the branch. This job therefore holds no permissions, checks nothing out
# and runs nothing from the branch.
#
# Salient paths: the two directories the routine has pushed results under
# (scripts/ingest_routine_results.py SOURCE_ROOTS). A push that touches
# neither has nothing to ingest. This is not a pull_request workflow, so it
# publishes no required check.

on:
  push:
    branches:
      - claude/eval-*
    paths:
      - results/**
      - eval-results/**

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hand off to the ingest workflow
        run: echo "Routine results pushed; routine-eval-ingest.yml validates and ingests them from the default branch."
