name: Refresh the model roster

# Adam, 2026-10-25: the roster follows what is in use now, so it has to be
# recomputed on a schedule rather than only when someone dispatches eval.yml
# by hand (it had not moved since 2026-10-06). This dispatches eval.yml with
# its `roster_only` input, which refreshes the roster and files its proposal
# and then stops, spending nothing beyond the Models API read; under
# `roster_mode: auto` that proposal merges automatically once `test` passes
# (docs/decisions/0003-roster-merges-automatically.md). Monday 07:00 UTC is
# the day before routine-eval-weekly.yml's Tuesday sweep, so the sweep reads
# a fresh roster.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  dispatch:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch the roster-only refresh
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run eval.yml \
            --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH" \
            -f roster_only=true
