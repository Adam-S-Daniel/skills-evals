name: CI

# The salient list is DERIVED, not guessed: this workflow runs exactly one
# thing — `python3 test/run_tests.py` — so it is the set of files that suite
# actually reads, taken from tracing a real run. harness/ (run_eval,
# run_canary, the scorers it imports), scripts/ (make_badge.py, both imported
# and shelled out to), test/ (the suite, its fake-claude stub, fixtures/),
# evals/ (the fixture YAML and seed trees the eval and canary dirs load), and
# eval.yml — which BadgeWorkflowOrderingTests parses to assert the badge is
# built after the eval-results checkout. Plus this file itself, so a change to
# the filter is always exercised by the filter. README.md and DESIGN.md are
# included too: TestIssue80::test_readme_lists_the_writing_adrs_eval_directory
# reads the former and test_design_doc_no_longer_lists_writing_adrs_as_a_class_a_candidate
# reads the latter, so a change that drops the README's writing-adrs/ line or
# DESIGN's graduation sentence needs this workflow to run — and
# CiDispatchTests::test_every_root_markdown_file_this_suite_reads_is_salient
# closes this as a class, not a one-off: it AST-walks this suite's own source
# for every root Markdown file it reads and fails if one is ever missing from
# here. AGENTS/CLAUDE and badges/ stay deliberately absent: the
# suite never opens them, so a docs-only pull request touching only those has
# nothing to prove here and should not pay for a runner. One
# path this filter structurally cannot name: the suite also reads agentskills'
# own scripts/skills_registries.yml from the side-by-side checkout below, for
# TestIssue63::test_registries_agree_with_agentskills_own_file — a file in a
# different repo, outside anything a `paths:` filter here can match.
#
# `push:` is pinned to main because without a branch filter every push to a
# pull-request branch ran `test` TWICE — once for the push, once for the
# pull_request. Observed on 82596ff: same commit, same job, finishing 03:38:30
# and 03:39:14. Both events carry the same list; keep the two in step.
#
# A plain workflow-level filter is the right tool here, not always-run +
# early-skip. That shape exists to keep a REQUIRED check present on every pull
# request, and repo-settings' fleet.yml sets `required_status_checks: []` for
# this fleet — nothing here gates a merge, so a filtered-out run cannot
# deadlock one.
on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/eval.yml
      - evals/**
      - harness/**
      - scripts/**
      - test/**
      - README.md
      - DESIGN.md
  push:
    branches: [main]
    paths:
      - .github/workflows/ci.yml
      - .github/workflows/eval.yml
      - evals/**
      - harness/**
      - scripts/**
      - test/**
      - README.md
      - DESIGN.md
  # Bare — no inputs, and deliberately no `paths:`, which GitHub ignores on a
  # dispatch anyway. That is the point rather than an omission: the filters
  # above are what make a docs-only pull request cheap, and they are therefore
  # also what leaves running this suite against such a commit with no button at
  # all. Added for the same reason as propagation.yml's: a fix merged and
  # confirming it was impossible — `422 Workflow does not have
  # 'workflow_dispatch' trigger` — so verification waited on the next
  # qualifying push. Nothing to guard against here, unlike propagation.yml:
  # this workflow declares no `concurrency` group at any level, so a manual run
  # cancels nothing, and fleet.yml leaves the repo on the default
  # `required_status_checks: []` regardless.
  workflow_dispatch:

# Least privilege: the suite is hermetic — no network, no pushes — so a read
# token is all it needs. propagation.yml declares the same at workflow level.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out skills-evals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: skills-evals
          persist-credentials: false

      # Side-by-side, same convention as eval.yml and propagation.yml: this
      # is what makes the harness's sibling-directory default (`../agentskills`
      # next to a skills-evals checkout) resolve to something real here, which
      # is what lets TestIssue63::test_registries_agree_with_agentskills_own_file
      # actually run in CI instead of skipping every time.
      - name: Check out agentskills registry (side-by-side)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adam-S-Daniel/agentskills
          path: agentskills
          persist-credentials: false

      - name: Install dependencies
        run: pip install pyyaml
      - name: Run tests
        working-directory: skills-evals
        run: python3 test/run_tests.py
