# Real (non-hermetic) skill eval: runs the workflow-path-audit A/B eval against
# the live Claude Code CLI + Anthropic API, regenerates the quality badge, and
# pushes the badge + run summaries to the `eval-results` branch. The hermetic
# suite stays in ci.yml — this workflow is the ONLY place real credentials
# appear. The objective checks are hermetic everywhere, here included.
#
# SECURITY POSTURE — read this before changing anything:
#
# * Triggers are `schedule` + `workflow_dispatch` ONLY. NEVER add pull_request
#   or pull_request_target: this workflow holds an API key, and the harness
#   runs the agent under test with `--permission-mode bypassPermissions` (see
#   harness/run_eval.py) inside a throwaway temp workspace. Key +
#   bypassPermissions must never meet untrusted fixture content. The fixtures
#   here are trusted because only maintainers can push to this repo; the only
#   prompts ever run are this repo's committed fixtures. Never accept external
#   fixture contributions into this path without dropping the key first.
#   The trust boundary equally includes the three registries checked out
#   below (adam-agentskills, cms-platform, adamdaniel.ai): the with_skill arm
#   installs skill content from whichever registry the fixture names, from
#   that registry's default branch, and executes it under bypassPermissions
#   with the key in env — write access to any of the three checked-out
#   registries is equivalent to key access here. All four repos (this one
#   included) are maintainer-only; keep it that way or drop the key.
#   cms-platform and adamdaniel.ai also land commits on their default
#   branches through automated lanes — Decap CMS editorial publish loops,
#   auto-merge nudges, dependabot auto-merge — not only direct maintainer
#   pushes. A commit landed by one of those lanes is inside this trust
#   boundary just the same as a maintainer's own push: treat it as trusted,
#   or drop the key.
#
# * _agent-guidance is now inside that same boundary, and this is new with
#   the guidance subject (#97). A guidance fixture's `with` arm delivers a
#   payload assembled from that repo's agents-md/base.md into the agent's
#   user memory and then runs the agent under bypassPermissions with the key
#   in env — so the guidance content is EXECUTED here, exactly as skill
#   content from a registry is. Write access to _agent-guidance's default
#   branch is therefore equivalent to key access here. It is checked out with
#   persist-credentials: false like every other checkout, and it is NOT a
#   skill registry: it gets --guidance, never --registry.
#
# * The fixture that runs is a dispatch input (`fixture`, default
#   evals/workflow-path-audit), read from $GITHUB_EVENT_PATH as DATA in the
#   validation step below and never interpolated into a run: block —
#   `${{ inputs.* }}` in a shell script is an injection surface, and this is
#   the workflow that holds the key. The value is first refused outright if it
#   carries any character outside [A-Za-z0-9/_.-] — a newline included, which
#   is what a `grep -F` match alone could not catch, since grep treats each
#   LINE of its pattern as a pattern of its own — and only then matched
#   against the set of evals/**/fixture.yaml directories present in this
#   checkout. Anything failing either check fails the step BEFORE the token
#   exchange runs. The scheduled run passes no input and gets the default.
#
# * Auth: GitHub OIDC → Anthropic Workload Identity Federation. No stored
#   secret exists. The Claude Code CLI does not resolve the
#   ANTHROPIC_FEDERATION_* env vars (it hangs credential-less — verified
#   2026-07-17), so this workflow performs the RFC 7523 jwt-bearer exchange
#   explicitly rather than delegating it to the CLI. The "Mint OIDC token
#   and exchange for Anthropic access token" step exchanges the runner's
#   ACTIONS_ID_TOKEN_REQUEST_TOKEN for a GitHub-issued OIDC token (sub
#   pinned to repo:Adam-S-Daniel/skills-evals:ref:refs/heads/main, audience
#   https://api.anthropic.com, single-use JTI), then POSTs that assertion
#   to https://api.anthropic.com/v1/oauth/token against federation rule
#   fdrl_012TsUrCbGZKH17uCUpgqMxf / org 0905256d-aaf8-45ad-892b-9d2867c67c4e
#   / service account svac_01DVDm1YuUembqV2LScAjsGz, with the exchange body
#   pinned to workspace_id wrkspc_017pHomopHiJ7nRzZJS6NhV4 (the spend-capped
#   skills-evals-ci workspace) explicitly, so a rule-binding change can never
#   silently rescope the token and binding failures surface as named errors
#   instead of opaque 401s. The resulting sk-ant-oat01 access
#   token (≤1h, workspace-scoped, spend-capped) is masked via
#   ::add-mask::, stored only in $RUNNER_TEMP/anthropic-bearer, and
#   exported step-locally as ANTHROPIC_AUTH_TOKEN in each step that calls
#   claude — never top-level env. The single exchange also satisfies the
#   issuer's single-use JTI enforcement (one exchange, all four claude
#   calls share the token). Dispatches from non-main refs get no
#   credential — the rule's sub claim matches ref:refs/heads/main only —
#   which also supersedes the old maintainer-branch trust widening
#   caveat. Cost depends on the fixture: a skill A/B is 2 agent arms +
#   2 judge calls; a guidance dispatch is one agent call AND one tool-free
#   guard probe per declared arm, which is 5 + 5 for the delivery canary. The
#   report's cost column counts the SCORED leg only — the guard probes are
#   real calls and are not in it. The fixture
#   pins a mid-tier agent and a strong judge — carried over unchanged from
#   the predecessor fixture — which puts a run at ~$0.30–0.90, i.e.
#   ~$1.50–4/month at weekly cadence. Unpinning any of them would make the
#   per-run cost track the CLI's default model instead, and would break
#   week-over-week badge comparability with it. Per-dispatch spend is
#   bounded by the harness timeouts
#   (600s per arm, 120s per judge call); the workspace spend limit, not
#   this workflow, is the hard ceiling.
#
# * The model roster step (#67) adds ONE more caller of that same bearer: a
#   `GET /v1/models` read from scripts/refresh_models.py, exported
#   step-locally exactly like the claude calls and never at top level. It
#   introduces NO new credential shape — no stored secret, no new federation
#   binding — and it is a read of the model catalogue, not of usage or
#   billing. The one thing it would use if it existed is ANTHROPIC_ADMIN_KEY,
#   for the optional org-wide usage report; that variable is deliberately NOT
#   provisioned, and its absence prints a `::notice::` naming it rather than
#   failing the run. Do not create it to silence the notice — provision it
#   only if the org-wide report is actually wanted. Because the WIF rule's sub
#   claim matches `ref:refs/heads/main` only, a dispatch from any other ref
#   gets no bearer and dies at the exchange step above, before this one. That
#   read is also the FIRST use of this bearer in the job, ahead of the
#   preflight — which is a reason for it to be non-fatal, not a reason to put
#   it later: it is a free extra signal about the credential, and the
#   preflight remains the step that decides whether the bearer works.
#
#   The Admin API usage report, if it is ever provisioned, is BILLING data.
#   It is written to $RUNNER_TEMP/admin-usage.json, deliberately NOT into
#   $RUNNER_TEMP/roster/ — that directory is the one the commit step copies
#   from, and it holds the published roster and nothing else so that a future
#   directory copy cannot publish billing data to a public branch.
#
#   The roster step's ::warning:: carries an HTTP status code or an exception
#   class name, and refresh_models.py is written to produce nothing else. The
#   token-exchange failure output below is a separate pre-existing path.
#
# * All five checkouts use `persist-credentials: false`; push auth is injected
#   only in the two steps of the `eval` job that push — the roster-proposal
#   step and the final commit step — and only in their own `env:`. Both sit
#   AFTER the eval, so while the bypassPermissions agent is running, no
#   GitHub write credential exists anywhere on that job's runner and no
#   long-lived secret exists on it. The `roster-pr` job (F2, adversarial
#   round 1 on #209) gets its own fresh `${{ github.token }}`, scoped to
#   that job's own `permissions:` block, never the `eval` job's token — the
#   two jobs run on separate runners and share no credential. What IS in
#   reach differs by subject, because the two arms are built differently:
#
#     - a SKILL arm's agent gets an ALLOWLIST too, since #81 (harness/
#       run_eval.py's `_ALLOWED_ENV` + `_ALLOWED_ENV_PREFIXES`): PATH, HOME,
#       USER, LOGNAME, SHELL, TERM, LANG, LANGUAGE, TZ, TMPDIR, TMP, TEMP,
#       the proxy names HTTP_PROXY, HTTPS_PROXY, NO_PROXY, ALL_PROXY and
#       their lower-case twins http_proxy, https_proxy, no_proxy, all_proxy,
#       the CA-bundle names SSL_CERT_FILE, SSL_CERT_DIR, NODE_EXTRA_CA_CERTS,
#       REQUESTS_CA_BUNDLE, CURL_CA_BUNDLE, and every variable whose name
#       begins ANTHROPIC_, CLAUDE_, LC_ or XDG_ — plus the harness's own
#       WORKSPACE and GH_CONFIG_DIR, the deliberately EMPTIED GH_TOKEN and
#       GITHUB_TOKEN, and last the fixture's own `env:` block. It used to be
#       `dict(os.environ)`, which also handed the agent
#       ACTIONS_ID_TOKEN_REQUEST_TOKEN and ACTIONS_ID_TOKEN_REQUEST_URL —
#       which mint a GitHub OIDC assertion for any audience while
#       `id-token: write` is granted — and ACTIONS_RUNTIME_TOKEN, which
#       writes this run's artifacts and cache. None of those three is in
#       reach for either arm now.
#     - a GUIDANCE arm's agent gets an ALLOWLIST built from nothing
#       (harness/guidance.py's `agent_env`): PATH, LANG, LC_ALL, SHELL, USER,
#       NODE_PATH, plus the HOME, TMPDIR, CLAUDE_CONFIG_DIR and WORKSPACE the
#       harness sets and every ANTHROPIC_* variable, and on top of all of
#       that the fixture's own `env:` block, which may add any name except
#       those three isolation variables (HOME, TMPDIR, CLAUDE_CONFIG_DIR are
#       refused by name, because the block is applied after they are set, so
#       a fixture allowed to name one could point an arm at the real config
#       dir). The three GitHub runner tokens above are NOT in that set
#       either.
#
#   The two allowlists are deliberately DIFFERENT and neither derives from
#   the other: the guidance one is the narrower, because a guidance arm is
#   handed HOME, TMPDIR and CLAUDE_CONFIG_DIR by the harness and must not
#   inherit the operator's. What they share is the predicate that refuses a
#   name or value the OS itself will not take (`guidance.check_env_block`),
#   which bounds what a fixture may SPELL rather than what is inherited.
#
# * The weekly badge commit doubles as cron keep-alive: GitHub disables
#   scheduled workflows after ~60 days without repo activity, and each run
#   commits fresh results, so the schedule keeps itself alive.
#
# * Results + badge live on the `eval-results` branch, not main: main's
#   branch-protection ruleset requires changes go through a pull request
#   (this repo's fleet repo-settings baseline), so a bot direct-pushing
#   straight to main would be rejected — as it was in run 29620223686. The
#   commit step fetches/builds on `eval-results` (creating it on the first
#   run) and pushes there directly; nobody hand-commits to that branch and
#   the `real-eval` concurrency lane serializes runs, so a rejected push
#   fails the job loudly rather than retrying. The README badge URL consumes
#   raw content from `eval-results` accordingly.
#
# * All actions are SHA-pinned, bare — no trailing version/date comment. The
#   comment went stale silently and then lied (Dependabot rewrites it only
#   sometimes), so the SHA is the only claim made; resolve a version with
#   `git ls-remote <url> | grep <sha>` when you need one. Same pins as
#   adam-agentskills' ci.yml, and this repo's own eval seeds practice what we
#   pin.

name: Real eval

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      fixture:
        description: >-
          Fixture directory to run, e.g. evals/workflow-path-audit or
          evals/guidance/_delivery. Validated against the committed
          evals/**/fixture.yaml set before any credential is minted.
        required: false
        default: evals/workflow-path-audit
      roster_only:
        description: >-
          Refresh the model roster and file its proposal, then stop: skip the
          WIF preflight, the eval and the badge, so nothing is spent on a
          model beyond the Models API read. A roster_only run publishes
          nothing to `eval-results`; its only outputs are the
          `roster/proposal` branch and the tracking issue.
        type: boolean
        required: false
        default: false

# TWO jobs, each least-privileged at JOB level (adversarial round 1 on #209,
# F2). Workflow-level permissions is `{}` deliberately: the `eval` job runs
# the bypass-permissions agent, and giving it `pull-requests: write` /
# `actions: write` for the whole job — as a single-job shape once did — would
# hand those scopes to that agent too, not just to the "Propose a roster
# change" step. Each job below declares its own set instead.
#
# `eval` (contents: write, id-token: write, issues: write): unchanged from
# before the split. `contents: write` is for the badge/results push and the
# `roster/proposal` branch push (both happen from this job, since both need
# only `contents`); `issues: write` is #147's roster-proposal tracking issue.
# Nothing in this job ever calls `gh pr` or `gh workflow run`.
#
# `roster-pr` (pull-requests: write, actions: write, issues: write,
# contents: write): everything that touches the pull request the `eval`
# job's propose step pushed — find/create/edit/merge/close it, and dispatch
# `ci.yml` on it so `test` lands on its head sha (`pull-requests: write`,
# `actions: write`, Adam's decision of 2026-09-28,
# docs/decisions/0003-roster-merges-automatically.md). It also carries
# `issues: write`: the tracking issue's final wording depends on what this
# job did to the PR (opened it, could not enable auto-merge, turned auto-
# merge off, …), so this job edits/creates the SAME issue the `eval` job's
# propose step found or left neutral, rather than splitting one issue's text
# across two writers with no shared view of the outcome. `contents: write`
# (S2, round 2, spec-roster-mode-r2.md) is needed by
# `enablePullRequestAutoMerge`/an immediate merge even though this job
# performs no checkout and runs no repository code — it only calls `gh`.
# This job runs on EVERY eval run, `roster_mode: proposal` included (F3): a
# stale `roster/proposal` PR's auto-merge must come off even when this
# run's proposal never reached the auto path.
permissions: {}

# Never let two runs (e.g. a manual dispatch during the weekly run) race the
# badge commit; queue instead of cancelling so results are never half-written.
concurrency:
  group: real-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    # Job-level, not workflow-level (F2) — this is exactly the eval.yml's
    # pre-#209-review scope, never widened by the roster-pr split.
    permissions:
      contents: write
      id-token: write
      issues: write
    # 45 min covers the widest committed shape, not just the 2-arm skill
    # A/B: a guidance fixture spends (agent budget + guard budget) per
    # DECLARED arm, and the delivery canary declares five at 120 + 120 s. A
    # five-arm fixture that inherited the defaults instead (600 + 300 s)
    # would need 75 min and not fit —
    # test_every_guidance_fixture_fits_inside_the_workflow_job_timeout is
    # what catches that, over every guidance fixture under evals/.
    timeout-minutes: 45
    # Consumed by the `roster-pr` job (needs: eval) — see that job's own
    # comment for what each carries and how it is validated before use.
    # Every one of these is written by the "Propose a roster change" step
    # (id: propose); a value it never reaches stays the empty string, which
    # `roster-pr` treats as "no action for this run" rather than an error.
    outputs:
      roster_mode: ${{ steps.propose.outputs.roster_mode }}
      status: ${{ steps.propose.outputs.status }}
      probe_clean: ${{ steps.propose.outputs.probe_clean }}
      issue_number: ${{ steps.propose.outputs.issue_number }}
      pushed_sha: ${{ steps.propose.outputs.pushed_sha }}
      rejected: ${{ steps.propose.outputs.rejected }}
      rejection_reason: ${{ steps.propose.outputs.rejection_reason }}
      rendered_identical: ${{ steps.propose.outputs.rendered_identical }}
      eval_note: ${{ steps.propose.outputs.eval_note }}
      probe_note: ${{ steps.propose.outputs.probe_note }}
      roster_summary: ${{ steps.propose.outputs.roster_summary }}
    steps:
      - name: Check out skills-evals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: skills-evals
          # Full history so the push-race rebase below always has the commits
          # it needs; this repo is small.
          fetch-depth: 0
          persist-credentials: false

      - name: Check out adam-agentskills registry (side-by-side)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adam-S-Daniel/adam-agentskills
          path: adam-agentskills
          persist-credentials: false

      - name: Check out cms-platform registry (side-by-side)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adam-S-Daniel/cms-platform
          path: cms-platform
          persist-credentials: false

      - name: Check out adamdaniel.ai registry (side-by-side)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adam-S-Daniel/adamdaniel.ai
          path: adamdaniel.ai
          persist-credentials: false

      - name: Check out _agent-guidance (side-by-side)
        # NOT a skill registry: this is the guidance subject's source, read by
        # harness/guidance.py through --guidance. Its content is executed
        # under bypassPermissions by a guidance fixture's `with` arm — see the
        # header's trust-boundary clause.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adam-S-Daniel/_agent-guidance
          path: _agent-guidance
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install Claude Code CLI
        # NOT PINNED, and ALWAYS THE LATEST (the owner's decisions of
        # 2026-09-27, #202, and 2026-09-28, #203): every run installs the
        # newest Claude Code release npm reports, never reusing one already
        # on the runner, and fails if another `claude` on PATH shadows it.
        # scripts/probe_model_defaults.py reads the vendor's alias defaults
        # off this very CLI, so an older one would report older defaults.
        # The pin existed because this step feeds the key-bearing eval step
        # and an install is a supply-chain vector into whatever credential
        # the job later holds. What still bounds that: this step runs BEFORE
        # the OIDC mint / token exchange below, so nothing it installs runs
        # with a credential in the environment at install time (the step
        # order is asserted by test/issues/test_issue_202_harness.py). What
        # replaces the pin's audit trail: the version actually used is
        # recorded per run — here in the step summary, and in every arm's
        # summary.json (`harness.version`) by harness/run_eval.py.
        #
        # `claude --version` is captured whole and cut to its first line in
        # the shell, not piped through `head`: under pipefail a `head` that
        # exits first can fail the step on the CLI's SIGPIPE. A failing or
        # empty version, an unusable npm answer, or a shadowing CLI fails the
        # step by name.
        run: |
          set -euo pipefail
          latest="$(npm view @anthropic-ai/claude-code version)" || { echo "::error::could not resolve the latest Claude Code version"; exit 1; }
          # A plain MAJOR.MINOR.PATCH and nothing else: a prerelease, an error
          # page, an empty answer or two lines is refused, never stripped
          # into something that looks like a version.
          [[ "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::npm reported no usable latest Claude Code version"; exit 1; }
          npm install -g "@anthropic-ai/claude-code@${latest}"
          version="$(timeout -k 10 60 claude --version)" || { echo "::error::claude --version failed"; exit 1; }
          # First line only, and only characters a version string needs: this
          # lands in a markdown code span in the step summary.
          version="${version%%$'\n'*}"
          version="${version:0:80}"
          version="${version//[^A-Za-z0-9._() -]/}"
          [[ -n "$version" ]] || { echo "::error::claude --version printed no version"; exit 1; }
          # A different claude earlier on PATH would shadow the one just
          # installed. Exact on the first token: a prefix match would pass a
          # stale 2.1.30 for a latest of 2.1.3.
          [[ "${version%% *}" == "$latest" ]] || { echo "::error::claude on PATH is not the npm latest just installed"; exit 1; }
          echo "harness: Claude Code ${version} (npm latest)"
          { echo "### Harness"; echo "Claude Code \`${version}\` (npm latest)"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        # markdown-it-py is pinned exact, per this repo's cooling-off
        # convention: harness/guidance.py locates a section's extent with a
        # real markdown parse, and a floating parser version could silently
        # change what a `section` arm delivers.
        run: pip install pyyaml markdown-it-py==4.2.0

      # Runs BEFORE the token exchange, deliberately: a dispatch naming a
      # fixture that does not exist must fail here, with no credential minted
      # and nothing spent. The value is read from the event payload as DATA
      # (jq, no `${{ }}` interpolation into this shell), checked for SHAPE,
      # and only then matched against the set of directories that actually
      # carry a committed fixture.yaml — so a traversal, an absolute path, a
      # shell metacharacter, a newline or a stale name never gets past here.
      # "Committed" here means "present in this checkout": the set comes from
      # `find`, not `git ls-files`, so an untracked fixture directory would be
      # accepted too. Equivalent in the fresh CI checkout this workflow runs
      # in, where nothing is untracked.
      - name: Select and validate the fixture to run
        working-directory: skills-evals
        run: |
          set -euo pipefail
          # Byte semantics for the character class below, so what this gate
          # accepts does not depend on the runner's locale.
          export LC_ALL=C
          fixture=""
          if [ -n "${GITHUB_EVENT_PATH:-}" ] && [ -f "$GITHUB_EVENT_PATH" ]; then
            # NUL FIRST, on the event file itself, before any command
            # substitution. `jq -r` emits a NUL faithfully and bash's `$( )`
            # then DROPS it ("warning: command substitution: ignored null
            # byte in input"), so every check below would be judging a string
            # the dispatcher did not send, and the step's own `fixture:` log
            # line would name something else again. Measured: a value whose
            # JSON spelling is the NUL escape followed by
            # evals/workflow-path-audit was accepted AS that fixture, rc 0.
            # It fails safe — no uncommitted fixture can be reached this way,
            # because whatever survives the substitution still has to match a
            # committed path — but the gate never sees the byte it would
            # refuse, and this workflow's header promises that it does.
            # `jq -e` exits non-zero for a non-string (a number, a list) too,
            # which simply falls through to the shape gate that already
            # refuses those. No value is echoed, same as every other
            # rejection here.
            if jq -e '(.inputs.fixture // "") | test("\u0000")' \
                 "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
              echo "eval.yml: dispatch input 'fixture' contains a NUL byte"
              exit 1
            fi
            fixture="$(jq -r '.inputs.fixture // empty' "$GITHUB_EVENT_PATH")"
          fi
          # The scheduled run carries no inputs at all; it gets the default.
          if [ -z "$fixture" ]; then
            fixture="evals/workflow-path-audit"
          fi
          # SHAPE FIRST, before any matching. `grep -F` treats each LINE of
          # its pattern as a separate pattern, so a MULTI-LINE dispatch value
          # used to pass this gate whenever either line named a committed
          # fixture — and the whole two-line string was then written to
          # $RUNNER_TEMP/eval-fixture, so the OIDC exchange ran, a real bearer
          # was minted and the WIF preflight spent a call before the run step
          # finally failed on "no such fixture.yaml". Nothing was injectable
          # (every use is quoted) and no uncommitted fixture could run, but
          # the ordering guarantee this header makes twice was false for that
          # value. NEITHER rejection branch echoes the value back: this log
          # is public, so both messages name the rule, not the input. (The
          # "names no committed fixture" branch below used to append
          # `: $fixture` — charset-clean, but still up to 100 KB of dispatch
          # input copied into a public log, and contradicting this very
          # sentence. The dispatched value is already on the run's own inputs
          # for anyone who can read the log at all, so naming it here buys
          # nothing.)
          case "$fixture" in
            *[!A-Za-z0-9/_.-]*)
              echo "eval.yml: dispatch input 'fixture' has characters outside [A-Za-z0-9/_.-]"
              exit 1 ;;
          esac
          committed="$(find evals -mindepth 1 -name fixture.yaml -printf '%h\n' | sort)"
          # A here-string, never `printf ... | grep -Fxq`: piping a list into
          # an early-exit reader under `pipefail` makes the writer take
          # SIGPIPE the moment grep matches, and the step then fails CLOSED on
          # a perfectly valid fixture once the list outgrows a pipe buffer.
          # Safe at today's ~250 bytes; measured to reject valid fixtures from
          # ~66 KB of committed list upward.
          if ! grep -Fxq -- "$fixture" <<<"$committed"; then
            echo "eval.yml: dispatch input 'fixture' names no committed fixture"
            echo "Committed fixtures:"
            sed 's/^/  /' <<<"$committed"
            exit 1
          fi
          printf '%s' "$fixture" > "$RUNNER_TEMP/eval-fixture"
          # The results/badge key is the fixture path without its evals/
          # prefix: `workflow-path-audit`, or `guidance/<section id>`.
          printf '%s' "${fixture#evals/}" > "$RUNNER_TEMP/eval-key"
          echo "fixture: $fixture"

      - name: Mint OIDC token and exchange for Anthropic access token
        run: |
          resp=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapi.anthropic.com")
          jq -r .value <<<"$resp" > "$RUNNER_TEMP/anthropic-oidc.jwt"
          test -s "$RUNNER_TEMP/anthropic-oidc.jwt"
          body=$(jq -n --rawfile jwt "$RUNNER_TEMP/anthropic-oidc.jwt" '{
            grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
            assertion: ($jwt | rtrimstr("\n")),
            federation_rule_id: "fdrl_012TsUrCbGZKH17uCUpgqMxf",
            organization_id: "0905256d-aaf8-45ad-892b-9d2867c67c4e",
            service_account_id: "svac_01DVDm1YuUembqV2LScAjsGz",
            workspace_id: "wrkspc_017pHomopHiJ7nRzZJS6NhV4"
          }')
          xresp="$RUNNER_TEMP/exchange-resp.json"
          code=$(curl -sS -o "$xresp" -w "%{http_code}" -X POST https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" -d "$body")
          if [ "$code" != "200" ]; then
            echo "token exchange failed: HTTP $code"
            cat "$xresp"
            exit 1
          fi
          tok=$(jq -re .access_token < "$xresp")
          rm -f "$xresp"
          echo "::add-mask::$tok"
          printf '%s' "$tok" > "$RUNNER_TEMP/anthropic-bearer"

      # Model roster (#67, redesigned in #147). Recomputes which models this
      # harness SHOULD be running against — arms, judge, preflight — from
      # what the Models API says is AVAILABLE and what the published usage
      # census says is USED, and publishes it with the run.
      #
      # IT COMPUTES A PROPOSAL, NOT THE RUNNING SET (ADR 0001). The models
      # the eval below actually runs come from the committed
      # `evals/roster.yml` and from nothing else; this step's `--previous`
      # is that same committed file, and its output goes to `eval-results`
      # as an exhibit plus, when it differs, to the bot-owned
      # `roster/proposal` branch and one tracking issue for a human to
      # merge. Nothing here sets $EVAL_ROSTER, and nothing materialises a
      # roster off `eval-results` for selection — that is what let one line
      # on an unprotected branch pick every unpinned fixture's models.
      #
      # No new credential. The Models API call reuses the same WIF-derived
      # bearer minted above; ANTHROPIC_ADMIN_KEY is optional and its absence
      # produces a ::notice::, never a failure.
      #
      # Vendor defaults (#202, ADR 0002; #203): which model each family alias
      # resolves to, asked of the Claude Code CLI the install step above just
      # put on the runner at the npm latest, by scripts/probe_model_defaults.py.
      # It runs before the bearer is exported, and it scrubs the CLI's
      # environment itself (PATH, a fresh temporary HOME, LANG=C and two fixed
      # traffic switches), so no credential exists in the probe's environment:
      # the CLI's own unauthenticated connections can bill nothing and leak
      # nothing, and alias resolution is built into the binary, not fetched.
      # It reads the init event and kills the CLI's process group. It never
      # fails the step. A family the probe FAILED for (an error recorded for
      # its alias, an answer in the wrong tier or family, or no usable
      # document) is FROZEN for this run by roster.py — its seats held, none
      # retired except models gone from the Models API, none added unless the
      # family holds no seat the Models API still lists. A default the probe
      # answered but this run's catalogue does not match FREEZES its family
      # too, through the identical rule (#203 probe round 7) — only the
      # wording says a mismatch rather than a failure, and the summary says
      # so. On a freeze the proposal step below warns
      # and keeps the tracking issue open; that step runs unless the workflow
      # is cancelled, so it fires even when the eval step failed. Nothing is
      # carried to the next run.
      #
      # NOT FATAL TO THE EVAL. The Models API read is still fatal to the
      # ROSTER — a half-read API is indistinguishable from a model retiring,
      # and publishing that quietly is the failure mode this feature exists to
      # remove — but the eval and the badge never depended on the roster, and
      # this step sits ahead of both. So a failure here prints a ::warning::
      # naming the failure class, publishes NO roster (never a partial one),
      # and lets the eval run on the fixture pins. This also matters because
      # the WIF bearer against GET /v1/models is an auth path exercised for
      # the very first time on the first dispatch after merge.
      #
      # A failed `git fetch` is NOT a first run. `|| true` conflated the two,
      # and the roster then asserted "no fresh census (none published)" about
      # a branch it simply could not read; `ls-remote` tells them apart.
      #
      # Everything lands in $RUNNER_TEMP, not the working tree: roster/ is
      # tracked on eval-results and untracked on main, so a copy in the
      # working tree would make the commit step's `git checkout -B
      # eval-results` refuse. The commit step restores it after the switch,
      # exactly as it already does for results/. $RUNNER_TEMP/roster holds the
      # published roster AND NOTHING ELSE — the working inputs live in
      # roster-inputs/ and the Admin API usage report (billing data) at
      # $RUNNER_TEMP/admin-usage.json — so that a future directory copy of
      # that path can only ever publish the roster.
      - name: Refresh the model roster
        working-directory: skills-evals
        run: |
          set -uo pipefail
          pub="$RUNNER_TEMP/roster"
          work="$RUNNER_TEMP/roster-inputs"
          rm -rf "$pub" "$work"; mkdir -p "$pub" "$work"
          reason=""
          # The reason a failed script's stderr becomes a ::warning::/step-
          # summary line. Prefers the FIRST non-empty line that is neither a
          # `roster: `-prefixed warn() line (compute_roster's own warnings,
          # chronologically first) nor an indented line (a roster.py
          # "  <id>: <reason>" per-model detail, or an indented traceback
          # frame) nor the traceback's own header — the single least useful
          # line a traceback has. That headline is what roster.py's fatal
          # "refusing to publish a roster with no arms" path prints FIRST,
          # ahead of one indented line per excluded/unranked model, so the
          # old `tail -n 1` here surfaced a random model's detail instead of
          # the headline. Falls back to the plain last non-empty line only
          # when nothing clears that bar (an uncaught exception, where the
          # exception's own message is the last line and the traceback's
          # header and frames are the only other candidates).
          extract_reason() {
            local line
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                'roster: '*) continue ;;
                ' '*|$'\t'*) continue ;;
                'Traceback (most recent call last):') continue ;;
              esac
              printf '%s\n' "$line"
              return 0
            done < "$1"
            grep -v '^$' "$1" | tail -n 1
          }
          # The `roster: `-prefixed warn() lines carry the actual diagnosis
          # (a stale/unreadable census, skipped bad rows, ...). A census
          # that is stale/unreadable/carries skipped rows can print these
          # and STILL let the run succeed overall (a graceful fallback), so
          # this runs on both the success and failure paths — it used to
          # run only on failure, reaching only the raw job log on success,
          # never the step summary — the surface most people actually read
          # first.
          emit_roster_warnings() {
            local file="$1" warnings
            [ -f "$file" ] || return 0
            warnings=$(grep '^roster: ' "$file" || true)
            [ -n "$warnings" ] || return 0
            {
              echo
              echo "<details><summary>roster warnings</summary>"
              echo
              echo '```'
              printf '%s\n' "$warnings"
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          refresh() {
            # Vendor model defaults (#202, #203): which model each family
            # alias resolves to, read off the installed CLI's init event with
            # no credential. Run BEFORE the bearer is exported so it never
            # sits in this process's environment (the probe scrubs the CLI's
            # environment regardless), and it cannot fail the step: a failed
            # probe records its error classes and roster.py freezes those
            # families for this run. A probe that exits non-zero writes no
            # document, so a stand-in naming that is written in its place —
            # read as its own class, `probe-exited` (every family frozen),
            # never as "no probe at all" nor as a probe that ran and
            # resolved nothing (`{}`, `no-defaults`).
            python3 scripts/probe_model_defaults.py --out "$work/defaults.json" || printf '{"probe_exit": "nonzero"}\n' > "$work/defaults.json" || true
            ANTHROPIC_AUTH_TOKEN="$(cat "$RUNNER_TEMP/anthropic-bearer")"
            export ANTHROPIC_AUTH_TOKEN
            # The published census comes off eval-results WITHOUT checking it
            # out; the previous roster is the committed evals/roster.yml.
            # The branch switch belongs to the commit step, and an absent
            # census remains an ordinary fallback case.
            if ! git fetch origin eval-results 2>/dev/null; then
              # `git ls-remote | grep -q` discards ls-remote's OWN exit status
              # under `pipefail`: on a correlated outage (fetch AND ls-remote
              # both unreachable) grep sees empty stdin, "no match" is exit 1,
              # and pipefail reports the pipeline's status as grep's 1 rather
              # than ls-remote's 128 — reading a network outage as a genuine
              # first run. Capture ls-remote's own output and exit status via
              # command substitution instead, and match on the captured text
              # with a here-string so nothing is piped into grep (the fleet's
              # SIGPIPE rule) and ls-remote's failure cannot be swallowed by
              # what comes after it.
              ls_out=$(git ls-remote --heads origin eval-results 2>/dev/null) || {
                reason="roster inputs unavailable: could not reach origin"
                return 1
              }
              if grep -qF -- 'refs/heads/eval-results' <<<"$ls_out"; then
                reason="roster inputs unavailable: eval-results exists but could not be fetched"
                return 1
              fi
            fi
            # THE CENSUS ONLY. The previous roster is the COMMITTED
            # evals/roster.yml now (ADR 0001) — it is not materialised
            # from this branch at all, because a document read off an
            # unprotected branch cannot be the harness's record of what
            # it has observed (#147).
            if git rev-parse -q --verify origin/eval-results >/dev/null 2>&1; then
              git show origin/eval-results:usage/latest.json > "$work/census.json" 2>/dev/null || true
            fi
            # stderr is captured, not swallowed: it is echoed back to the log
            # either way, and on failure extract_reason picks the
            # ::warning::. Both scripts are written to keep that line to a
            # status code or an exception class — never a response body.
            if ! python3 scripts/refresh_models.py \
                 --out "$work/models.json" \
                 --admin-report "$RUNNER_TEMP/admin-usage.json" 2> "$work/refresh.err"; then
              cat "$work/refresh.err" >&2
              reason="$(extract_reason "$work/refresh.err")"
              return 1
            fi
            cat "$work/refresh.err" >&2
            if ! python3 harness/roster.py \
                 --models "$work/models.json" \
                 --policy evals/roster-policy.yml \
                 --census "$work/census.json" \
                 --admin-report "$RUNNER_TEMP/admin-usage.json" \
                 --previous evals/roster.yml \
                 --defaults "$work/defaults.json" \
                 --out "$pub/latest.json" > "$work/summary.md" 2> "$work/roster.err"; then
              cat "$work/roster.err" >&2
              reason="$(extract_reason "$work/roster.err")"
              return 1
            fi
            cat "$work/roster.err" >&2
            cat "$work/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
            emit_roster_warnings "$work/roster.err"
            return 0
          }
          if ! refresh; then
            rm -f "$pub/latest.json" "$pub"/*.partial
            echo "::warning::model roster NOT refreshed: ${reason:-unknown failure}"
            {
              echo "### Model roster"
              echo
              echo "**The roster was not refreshed this run.** ${reason:-unknown failure}"
              echo
              echo "No roster is published and no proposal is made; the eval below"
              echo "will run on the committed evals/roster.yml, as it always does."
            } >> "$GITHUB_STEP_SUMMARY"
            emit_roster_warnings "$work/roster.err"
          fi

      # Cheap canary validating the exchanged bearer before the real spend,
      # on the model the roster names as `preflight` — the cheapest the Models
      # API still returns. That entry used to be computed and consumed by
      # nothing while this step hardcoded a model of its own.
      #
      # THE COMMITTED FILE, not the computed one (ADR 0001, #147). The
      # preflight used to read `$RUNNER_TEMP/roster/latest.json` — this
      # run's own proposal, computed partly from an untrusted census — so a
      # census plant could choose which model the job canaried its bearer
      # against. `evals/roster.yml` is on `main`, behind a reviewed commit.
      #
      # The literal below is the documented ROSTER FALLBACK, and it is the
      # only model id in this file. It is used when the committed roster
      # cannot be read, AND as the one retry when the roster's own
      # preflight pick fails (a day-old cheapest-tier model can be past the
      # roster's cooling-off check yet still not entitled for this bearer) —
      # `test_no_model_ids_are_hardcoded_outside_fixtures` allows exactly one
      # such literal and only because the marker on its line says what it is.
      - name: WIF auth preflight
        # Skipped by a roster_only dispatch (#202). An expression in `if:`, never
        # interpolated into a run: body.
        if: ${{ !inputs.roster_only }}
        working-directory: skills-evals
        run: |
          set +e
          fallback="claude-haiku-4-5" # ROSTER FALLBACK: used when no roster, and retried once if the roster's preflight model fails
          model="$fallback"
          if [ -f evals/roster.yml ]; then
            from_roster=$(python3 -c 'import yaml,sys; d=yaml.safe_load(open(sys.argv[1])) or {}; p=(d.get("preflight") or {}).get("id"); print(p if isinstance(p, str) else "")' evals/roster.yml 2>/dev/null)
            if [ -n "$from_roster" ]; then model="$from_roster"; fi
          fi
          ANTHROPIC_AUTH_TOKEN="$(cat "$RUNNER_TEMP/anthropic-bearer")"
          export ANTHROPIC_AUTH_TOKEN
          echo "preflight model: $model"
          out=$(timeout 120 claude -p 'Reply with exactly: ok' \
            --model "$model" --output-format json 2>&1)
          rc=$?
          echo "preflight exit: $rc"
          printf '%s\n' "$out" | tail -c 4000
          if [ "$rc" -ne 0 ] && [ "$model" != "$fallback" ]; then
            echo "::warning::preflight failed on roster model $model; retrying with the fallback"
            model="$fallback"
            echo "preflight model: $model"
            out=$(timeout 120 claude -p 'Reply with exactly: ok' \
              --model "$model" --output-format json 2>&1)
            rc=$?
            echo "preflight exit: $rc"
            printf '%s\n' "$out" | tail -c 4000
          fi
          exit $rc

      # `--arm both` means "every arm this fixture declares": the two arms of
      # a skill fixture, and for a guidance fixture the arms it names (five,
      # one per delivery mode, for the delivery canary).
      - name: Run the eval (both arms, judge)
        # `id: eval` so the proposal step can say whether the eval ran (#203
        # probe round 3): its `outcome` reaches that step through `env:`.
        id: eval
        # Skipped by a roster_only dispatch (#202). An expression in `if:`, never
        # interpolated into a run: body.
        if: ${{ !inputs.roster_only }}
        working-directory: skills-evals
        run: |
          ANTHROPIC_AUTH_TOKEN="$(cat "$RUNNER_TEMP/anthropic-bearer")"
          export ANTHROPIC_AUTH_TOKEN
          fixture="$(cat "$RUNNER_TEMP/eval-fixture")"
          python3 harness/run_eval.py "$fixture" \
            --arm both \
            --guidance ../_agent-guidance \
            --registry adam-agentskills=../adam-agentskills \
            --registry cms-platform=../cms-platform \
            --registry adamdaniel.ai=../adamdaniel.ai

      # THE PROPOSAL (#147, ADR 0001 decision 2). The roster step above
      # computed what the roster SHOULD be; this step is what a human ever
      # sees of it. When it differs from the committed `evals/roster.yml`
      # it pushes the proposed file as ONE commit on the bot-owned branch
      # `roster/proposal` and upserts ONE tracking issue carrying the
      # rendered summary and the compare link. When it does not differ it
      # closes that issue, so a stale one never sits open claiming a change
      # that has already landed or gone away.
      #
      # WHY A BRANCH AND AN ISSUE, AND NOT A PULL REQUEST. GitHub can create
      # approval-required runs for pull_request opened, synchronized, or
      # reopened by `GITHUB_TOKEN`. This design still has a human open the PR
      # from the branch so the reviewer owns that route and its admission
      # state before merging after CI. This is the fleet's sanctioned bot-write path:
      # a branch and a pull request a person merges, never a direct push to
      # a protected branch and never a ruleset bypass actor.
      #
      # `roster/proposal` IS BOT-OWNED AND IS NEVER SHARED. It is recreated
      # from this run's checked-out `main` sha every run and force-pushed
      # with `--force-with-lease`; nobody commits to it by hand and nothing
      # else reads it. That is the one sanctioned exception to the fleet's
      # "do not force-push a shared branch" rule, and it is sanctioned
      # because the branch is not shared: a proposal computed against last
      # week's `main` is not a thing to preserve, it is a thing to replace.
      # The lease is what keeps that honest — a push that would discard a
      # commit this run has not seen fails rather than silently winning.
      #
      # IT RUNS AFTER THE EVAL, deliberately. The eval must run on the
      # committed roster with no GitHub write credential anywhere on the
      # runner (the security header's fourth rule); this step holds one, so
      # it sits after the bypassPermissions agent has finished. It does its
      # git work in a WORKTREE under $RUNNER_TEMP so the main checkout is
      # untouched for the badge/commit step that follows.
      #
      # Nothing here interpolates a GitHub Actions expression into the
      # shell. The run id, the repository and the server URL arrive through
      # `env:` and are read as variables.
      - name: Propose a roster change
        # Unless the workflow is cancelled (#203 probe round 2): the proposal
        # and a failed probe's warning and tracking issue are the loud
        # channels, so a failed eval step must not silence them. An
        # expression in `if:`, never interpolated into a run: body.
        if: ${{ !cancelled() }}
        id: propose
        working-directory: skills-evals
        env:
          # Write auth lives only in this step and the commit step.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          # The eval step's outcome (success, failure, skipped or cancelled),
          # for the issue's eval sentence (#203 probe round 3). Read as a
          # variable and matched against fixed words, never interpolated.
          EVAL_OUTCOME: ${{ steps.eval.outcome }}
        run: |
          set -euo pipefail
          # GITHUB_OUTPUT always exists on a real runner; this default only
          # protects a test harness that runs the script without it
          # (`set -u` would otherwise turn every `emit`/`emit_ml` call
          # below into an "unbound variable" failure) — output goes nowhere
          # rather than the step dying on a harness gap unrelated to what
          # it is testing.
          : "${GITHUB_OUTPUT:=/dev/null}"
          # `emit`/`emit_ml` write this step's job outputs, consumed by the
          # `roster-pr` job (F2, adversarial round 1 on #209). `emit_ml`'s
          # delimiter is RANDOM per call, never fixed: `roster_summary` below
          # is harness/roster.py's own rendered text, shaped partly by the
          # untrusted census (ADR 0003's own Consequences section), and a
          # fixed `key<<EOF` delimiter could be spoofed by that text to
          # smuggle extra `key=value` lines into $GITHUB_OUTPUT. Every OTHER
          # value this step emits is either one of a small set of fixed
          # literals this step itself chose (never the raw computed value)
          # or digit/hex-validated before emit — see each call site below.
          emit() { printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"; }
          emit_ml() {
            # `content="$(cat)"` strips any trailing newline stdin has (or
            # doesn't have) and the `printf '%s\n'` below always puts exactly
            # one back — the delimiter line must never land glued onto the
            # content's last line, whether or not the caller's own value
            # ended with one.
            local key="$1" delim content
            delim="ghaout_$$_${RANDOM}${RANDOM}${RANDOM}"
            content="$(cat)"
            {
              printf '%s<<%s\n' "$key" "$delim"
              printf '%s\n' "$content"
              printf '%s\n' "$delim"
            } >> "$GITHUB_OUTPUT"
          }
          marker='<!-- skills-evals:roster-proposal -->'
          computed="$RUNNER_TEMP/roster/latest.json"
          if [ ! -f "$computed" ]; then
            echo "::notice::no roster was computed this run, so there is nothing to propose"
            exit 0
          fi
          status=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(((d.get("proposal") or {}).get("status")) or "")' "$computed")
          echo "proposal status: ${status:-unknown}"
          # `status` is not emitted yet — only once the tracker lookup below
          # has actually resolved one issue (or confirmed there is none): if
          # that lookup fails or is ambiguous, the roster-pr job must see an
          # unknown/empty status (its disable-only path), exactly like today,
          # never a "differs" it would then act on with no tracking issue to
          # write to.

          # >>> roster-mode
          # `roster_mode` in `evals/roster-policy.yml` (Adam's decision of
          # 2026-09-28, docs/decisions/0003-roster-merges-automatically.md)
          # selects `auto` (merge the roster proposal automatically via PR +
          # auto-merge) or `proposal` (today's flow: a human opens and merges
          # the PR). Read from THIS working directory, which is the trusted
          # `main` checkout (never the `roster/proposal` branch, and never
          # the untrusted census). A missing key is a genuine "not set yet"
          # and falls back to `proposal` silently; a present-but-unreadable
          # file behaves the same (the `except` below). Any other value is a
          # fixed warning, since it is a typo or drift rather than a
          # deliberate absence. roster.py itself never reads this key.
          #
          # `find_roster_pr` — used to live here too, but every `gh pr` call
          # moved to the `roster-pr` job (F2, adversarial round 1 on #209):
          # this job no longer looks the pull request up at all.
          roster_mode=$(python3 -c '
          import sys
          import yaml
          try:
              with open("evals/roster-policy.yml", encoding="utf-8") as handle:
                  doc = yaml.safe_load(handle)
          except Exception:
              doc = None
          value = doc.get("roster_mode") if isinstance(doc, dict) else None
          print(value if isinstance(value, str) else "")
          ' 2>/dev/null) || roster_mode=""
          case "$roster_mode" in
            auto|proposal) : ;;
            "") roster_mode="proposal" ;;
            *)
              echo "::warning::roster_mode is not auto or proposal; using proposal"
              roster_mode="proposal"
              ;;
          esac
          echo "roster_mode: $roster_mode"
          emit roster_mode "$roster_mode"
          # <<< roster-mode

          # >>> roster-only note
          # What the issue says about the eval depends on whether one ran
          # (#203 round 1) and how it ended (#203 probe round 3). roster_only
          # is read from the event payload with jq at run time, never
          # interpolated into this block: a dispatch sends the boolean input
          # as a boolean or as the string "true", and a scheduled run has no
          # inputs at all. The eval step's outcome arrives as EVAL_OUTCOME.
          # THIS STEP RUNS BEFORE the badge step that publishes to
          # `eval-results`, so whether that publish succeeds is not known
          # here: a successful eval's sentence says the next step publishes,
          # and a failed or skipped eval's says nothing was published (the
          # badge step runs only when every step before it succeeded).
          roster_only=false
          if [ -f "${GITHUB_EVENT_PATH:-}" ] && jq -e '(.inputs.roster_only // false) | . == true or . == "true"' "$GITHUB_EVENT_PATH" > /dev/null 2>&1; then
            roster_only=true
          fi
          if [ "$roster_only" = true ]; then
            eval_note="This was a \`roster_only\` dispatch: no eval ran, and nothing from this run is published to \`eval-results\`. Its only outputs are the \`roster/proposal\` branch and this issue; where the summary below says the eval ran on the committed roster, no eval ran at all."
          elif [ "${EVAL_OUTCOME:-}" = success ]; then
            eval_note="The paid eval ran on the committed \`evals/roster.yml\`; its results are published to \`eval-results\` by the next step, which runs after this issue is written — if that step failed or was skipped, this run's results were not published."
          elif [ "${EVAL_OUTCOME:-}" = failure ]; then
            eval_note="The paid eval ran on the committed \`evals/roster.yml\`, but the eval step failed; nothing from this run was published to \`eval-results\`."
          else
            eval_note="No eval result: the eval step did not run; nothing from this run was published to \`eval-results\`."
          fi
          # <<< roster-only note

          # >>> defaults-failed note
          # A vendor-default probe that failed FROZE its families for this run
          # (#203 probe round 1): their seats were held, so the proposal can
          # read "same" for a reason a reviewer must see. The count is read
          # from the computed roster by python at run time, never
          # interpolated, and validated as digits; the warning's text is
          # otherwise fixed.
          defaults_failed=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); f=d.get("defaults_failed") if isinstance(d,dict) else None; print(len(f) if isinstance(f,dict) else 0)' "$computed" 2>/dev/null) || defaults_failed=0
          case "$defaults_failed" in ''|*[!0-9]*) defaults_failed=0 ;; esac
          # Also read `defaults_mismatched` (#203 probe round 8, R8-1): a
          # catalogue mismatch freezes its family exactly like a probe
          # failure (see harness/roster.py's compute_roster), so it must be
          # just as loud here — its own fixed warning, its own probe-note
          # sentence, and it keeps the tracking issue open on "same" too.
          defaults_mismatched=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1],encoding="utf-8")); f=d.get("defaults_mismatched") if isinstance(d,dict) else None; print(len(f) if isinstance(f,dict) else 0)' "$computed" 2>/dev/null) || defaults_mismatched=0
          case "$defaults_mismatched" in ''|*[!0-9]*) defaults_mismatched=0 ;; esac
          probe_note=""
          failed_note=""
          if [ "$defaults_failed" -gt 0 ]; then
            failed_word="families"; [ "$defaults_failed" -eq 1 ] && failed_word="family"
            echo "::warning::vendor-default probe failed for $defaults_failed $failed_word; their seats were held"
            failed_note="**The vendor-default probe failed for $defaults_failed $failed_word this run.** Their seats were held and none retired except models gone from the Models API; a family of theirs gained a seat only if it held none the Models API still lists. The summary below names each family and its error class. Nothing is carried over: the next run's probe decides afresh."
          fi
          mismatch_note=""
          if [ "$defaults_mismatched" -gt 0 ]; then
            mismatched_word="families"; [ "$defaults_mismatched" -eq 1 ] && mismatched_word="family"
            echo "::warning::vendor default not matched by this run's catalogue for $defaults_mismatched $mismatched_word; their seats were held"
            mismatch_note="**A vendor default did not match this run's catalogue for $defaults_mismatched $mismatched_word this run.** Their seats were held and none retired except models gone from the Models API; a family of theirs gained a seat only if it held none the Models API still lists. The summary below names each family and its mismatch class. Nothing is carried over: the next run's probe decides afresh."
          fi
          if [ -n "$failed_note" ] && [ -n "$mismatch_note" ]; then
            probe_note=$(printf '%s\n\n%s' "$failed_note" "$mismatch_note")
          elif [ -n "$failed_note" ]; then
            probe_note="$failed_note"
          elif [ -n "$mismatch_note" ]; then
            probe_note="$mismatch_note"
          fi
          if [ "$defaults_failed" -eq 0 ] && [ "$defaults_mismatched" -eq 0 ]; then
            emit probe_clean true
          else
            emit probe_clean false
          fi
          printf '%s' "$eval_note" | emit_ml eval_note
          printf '%s' "$probe_note" | emit_ml probe_note
          emit_ml roster_summary < "$RUNNER_TEMP/roster-inputs/summary.md"
          # <<< defaults-failed note

          # The open tracking issue is owned by this workflow's bot account,
          # not by whoever copied a public marker into an issue body. Query
          # every page with GitHub's creator filter, then verify the creator
          # again locally before a number can reach an edit or close command.
          # `--slurp` preserves page boundaries, so malformed or incomplete
          # listings fail closed rather than looking like no tracker.
          issues="$RUNNER_TEMP/roster-issues.json"
          tracker_creator='github-actions[bot]'
          if ! gh api --paginate --slurp "repos/$REPO/issues?state=open&per_page=100&creator=github-actions%5Bbot%5D" > "$issues"; then
            echo "::warning::could not list issues; the roster proposal was not filed"
            exit 0
          fi
          if ! issue=$(python3 - "$issues" "$marker" "$tracker_creator" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              pages = json.load(handle)
          if not isinstance(pages, list) or not pages or not all(isinstance(page, list) for page in pages):
              raise SystemExit("tracker listing was not a complete paginated response")
          rows = [row for page in pages for row in page]
          for row in rows:
              if (not isinstance(row, dict)
                      or not isinstance(row.get("number"), int)
                      or isinstance(row.get("number"), bool)
                      or row["number"] <= 0):
                  raise SystemExit("tracker listing contained a malformed issue")
              user = row.get("user")
              if (not isinstance(user, dict)
                      or not isinstance(user.get("login"), str)
                      or not user["login"].strip()
                      or not isinstance(user.get("type"), str)
                      or not user["type"].strip()):
                  raise SystemExit("tracker listing contained a malformed issue")
              if "body" not in row or not isinstance(row["body"], (str, type(None))):
                  raise SystemExit("tracker listing contained a malformed issue")
          hits = [row for row in rows
                  if "pull_request" not in row
                  and row.get("user", {}).get("login") == sys.argv[3]
                  and row.get("user", {}).get("type") == "Bot"
                  and sys.argv[2] in (row.get("body") or "")]
          if len(hits) > 1:
              raise SystemExit("multiple bot-owned roster tracking issues are open")
          print(hits[0]["number"] if hits else "")
          PY
          ); then
            echo "::warning::could not identify one bot-owned roster tracking issue; the roster proposal was not filed"
            exit 0
          fi
          case "$issue" in
            ''|*[!0-9]*) : ;;
            *) emit issue_number "$issue" ;;
          esac
          # Forwarded as one of these two fixed literals ONLY, never the raw
          # value read above: `status` is partly shaped by the untrusted
          # census, and the roster-pr job's shell reads this output straight
          # into a variable it compares and interpolates.
          case "$status" in
            same) emit status same ;;
            differs) emit status differs ;;
            *) : ;;
          esac

          # A failed probe, or a catalogue mismatch, keeps the tracking
          # issue OPEN even on "same" (#203 probe round 8, R8-1 folded the
          # mismatch case in): the roster did not move because the probe
          # could not say whether it should, or could not corroborate the
          # catalogue, and closing the issue would hide either one. The
          # title and first line are chosen BY CLASS so a mismatch-only run
          # never says "probe failed", and a run with both says both.
          #
          # F3 (adversarial round 1 on #209): this "same" branch — frozen or
          # not — never touches the roster pull request any more; the
          # `roster-pr` job does that unconditionally from the `status`
          # output above, whether or not the probe was clean, so an open
          # automatic PR is closed here too even when the probe froze.
          if [ "$status" = "same" ] && { [ "$defaults_failed" -gt 0 ] || [ "$defaults_mismatched" -gt 0 ]; }; then
            if [ "$defaults_failed" -gt 0 ] && [ "$defaults_mismatched" -gt 0 ]; then
              issue_title="Model roster: the vendor-default probe failed and a default did not match the catalogue"
              first_line="This run proposes no change to the committed \`evals/roster.yml\`, but the vendor-default probe failed and a vendor default did not match this run's catalogue, so this issue stays open until a run probes cleanly with a matching catalogue."
            elif [ "$defaults_failed" -gt 0 ]; then
              issue_title="Model roster: the vendor-default probe failed"
              first_line="This run proposes no change to the committed \`evals/roster.yml\`, but the vendor-default probe failed, so this issue stays open until a run probes cleanly."
            else
              issue_title="Model roster: a vendor default did not match this run's catalogue"
              first_line="This run proposes no change to the committed \`evals/roster.yml\`, but a vendor default did not match this run's catalogue, so this issue stays open until a run's catalogue matches."
            fi
            body="$RUNNER_TEMP/proposal-body.md"
            {
              printf '%s\n\n' "$marker"
              echo "$first_line"
              echo
              echo "$probe_note"
              echo
              echo "$eval_note"
              echo
              cat "$RUNNER_TEMP/roster-inputs/summary.md"
            } > "$body"
            # A failed gh write warns and never fails the job (#203 probe
            # rounds 2 and 3): the roster and the eval are already done.
            if [ -n "$issue" ]; then
              if gh issue edit "$issue" --repo "$REPO" \
                --title "$issue_title" --body-file "$body"; then
                echo "updated the roster tracking issue #$issue"
              else
                echo "::warning::could not update the roster tracking issue"
              fi
            else
              gh issue create --repo "$REPO" \
                --title "$issue_title" --body-file "$body" \
                || echo "::warning::could not create the roster tracking issue"
            fi
            exit 0
          fi
          if [ "$status" = "same" ]; then
            if [ -n "$issue" ]; then
              if gh issue close "$issue" --repo "$REPO" \
                --comment "This run proposes no change to the model roster (routine observation-date refreshes are not proposed). Closing until something changes."; then
                echo "closed the stale proposal issue #$issue"
              else
                echo "::warning::could not close the roster tracking issue"
              fi
            else
              echo "nothing to propose and no open proposal issue"
            fi
            exit 0
          fi
          if [ "$status" != "differs" ]; then
            echo "::warning::the computed roster has an unknown proposal status; it was not filed"
            exit 0
          fi

          # The eval-results commit the census came from, recorded in the
          # rendered file's provenance so a merged proposal says which
          # untrusted document shaped it.
          census_commit=$(git rev-parse origin/eval-results 2>/dev/null) || census_commit="none"
          # A computed roster may legitimately have no non-arm judge when
          # every available model is seated. Preserve that observation in the
          # published eval result, but do not publish a branch a reviewer
          # cannot merge under the committed-roster contract.
          rejection=""
          if ! python3 scripts/render_roster_yaml.py \
            --roster "$computed" \
            --out "$RUNNER_TEMP/proposed-roster.yml" \
            --run-id "$RUN_ID" \
            --eval-results-commit "$census_commit" \
            > "$RUNNER_TEMP/proposal-render.err" 2>&1; then
            rejection="Rendering was rejected because the computed proposal could not be rendered safely."
          elif ! python3 - "$RUNNER_TEMP/proposed-roster.yml" > "$RUNNER_TEMP/proposal-admission.err" 2>&1 <<'PY'
          import sys

          import yaml

          sys.path.insert(0, "harness")
          import roster

          with open(sys.argv[1], encoding="utf-8") as handle:
              problems = roster.committed_roster_problems(yaml.safe_load(handle))
          if problems:
              print("\n".join(f"- {problem}" for problem in problems))
              raise SystemExit(1)
          PY
          then
            rejection="Admission was rejected because the rendered proposal does not meet the committed-roster contract."
          fi
          if [ -n "$rejection" ]; then
            # F2 (adversarial round 1 on #209): this run's proposal never
            # reached publication, so there is no branch for the `roster-pr`
            # job to act on either — but an EARLIER run's PR may still be
            # open, and that job disables its auto-merge unconditionally
            # whenever this run did not (re-)enable one, from the `rejected`
            # output alone. Nothing about any existing PR is decided here.
            # `$rejection` is one of exactly two fixed sentences (never a
            # rendered/admission tool's own untrusted stderr — those are
            # captured to $RUNNER_TEMP files and never echoed), so it is
            # safe as an ordinary single-line output.
            emit rejected true
            emit rejection_reason "$rejection"
            echo "::notice::this run's roster proposal was rejected before publication: $rejection"
            exit 0
          fi

          base=$(git rev-parse HEAD)
          worktree="$RUNNER_TEMP/proposal-worktree"
          rm -rf "$worktree"
          git worktree add --detach "$worktree" "$base"
          cp "$RUNNER_TEMP/proposed-roster.yml" "$worktree/evals/roster.yml"
          git -C "$worktree" checkout -B roster/proposal
          git -C "$worktree" add evals/roster.yml
          if git -C "$worktree" diff --cached --quiet; then
            echo "::notice::the proposal renders byte-identically to the committed roster; nothing pushed"
            emit rendered_identical true
            git worktree remove --force "$worktree"
            exit 0
          fi
          # `-c user.*` rather than `git config`: a worktree shares the
          # parent checkout's config, so `git config` here would rewrite
          # the identity of the checkout the next step commits from.
          git -C "$worktree" \
            -c user.name="skills-evals real-eval bot" \
            -c user.email="skills-evals@users.noreply.github.com" \
            commit -q -m "roster: proposed model roster (run $RUN_ID)"
          pushed_sha=$(git -C "$worktree" rev-parse HEAD)
          # F5 (adversarial round 1 on #209): validated as a bare 40-hex sha
          # — `git rev-parse HEAD` in the worktree just committed to, never
          # `$base` (the checkout's HEAD before that commit, mutant M1) and
          # never a sha read from any OTHER checkout (mutant M8) — before
          # it becomes a job output the `roster-pr` job will pass straight
          # to `--match-head-commit`. S1 (round 2, spec-roster-mode-r2.md):
          # the `emit` itself waits until AFTER the push below actually
          # succeeds — "a proposal was published" must never be claimed for
          # a commit that only exists on this runner's local worktree. A
          # failed push therefore emits no `pushed_sha` at all (the step
          # dies at the push line, under `set -euo pipefail`, before
          # reaching the `emit` that used to sit here) and the `roster-pr`
          # job takes the same disable-only path as a rejected proposal.
          pushed_sha_valid=false
          if [[ "$pushed_sha" =~ ^[0-9a-f]{40}$ ]]; then pushed_sha_valid=true; fi
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          # Fetch first so the implicit lease compares against the current
          # remote-tracking ref when the proposal branch already exists. A
          # missing ref is not a plain-force permission; Git's explicit
          # expected-value lease form can require that a destination is absent.
          git -c "http.$SERVER_URL/.extraheader=$auth" fetch origin \
            '+refs/heads/roster/proposal:refs/remotes/origin/roster/proposal' || true
          # NOT wrapped, unlike the `gh issue` writes (#203 probe round 3): a
          # proposal branch that failed to push does not exist for review, so
          # the step fails here rather than filing an issue that links to it.
          # A failure here means NO outputs below `pushed_sha` were written
          # (the step dies here, mid-script) — the `roster-pr` job still
          # runs (F3: it is gated on the workflow not being cancelled, and a
          # failed step is not a cancelled job) and, seeing no `pushed_sha`,
          # takes the same disable-only path as a rejected proposal.
          git -C "$worktree" -c "http.$SERVER_URL/.extraheader=$auth" \
            push --force-with-lease origin roster/proposal
          if [ "$pushed_sha_valid" = true ]; then
            emit pushed_sha "$pushed_sha"
          fi
          git worktree remove --force "$worktree"

      # Badge generation, commit and push are ONE step because the badge's
      # window can only see the accumulated history, and that history exists
      # nowhere until the `eval-results` checkout below has happened. This
      # workflow used to build the badge in a step of its own, ahead of the
      # commit step — which ran make_badge.py against the fresh workspace,
      # where results/ holds only the run that just finished. The `--window N`
      # average could therefore never draw on more than one run: the
      # aggregation was structurally inert and every published badge quietly
      # reported a single run (the `n=` marker only appears above one run, so
      # its absence was the only symptom). The ordering here is load-bearing —
      # fetch and check out `eval-results`, restore the fresh run into
      # results/, and only THEN build the badge, so the window spans the real
      # run history. Note also that the `eval-results` branch carries no
      # scripts/ directory, so the branch switch takes make_badge.py out of the
      # working tree; it is stashed in $RUNNER_TEMP beforehand and invoked from
      # there. It is stdlib-only, so nothing else has to travel with it.
      - name: Build the badge over the run window, commit, and push
        # Skipped by a roster_only dispatch (#202). An expression in `if:`, never
        # interpolated into a run: body.
        if: ${{ !inputs.roster_only }}
        working-directory: skills-evals
        env:
          # Push auth lives only in this step.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "skills-evals real-eval bot"
          git config user.email "skills-evals@users.noreply.github.com"
          # Stash the badge script before the branch switch drops scripts/.
          cp scripts/make_badge.py "$RUNNER_TEMP/"
          # Snapshot generated outputs (results/ is new/untracked here, and is
          # tracked on eval-results — without this the branch switch would
          # clobber or refuse the fresh run's output)
          snap="$RUNNER_TEMP/eval-outputs"
          rm -rf "$snap"; mkdir -p "$snap"
          [ -d results ] && cp -r results "$snap/results"
          # Build on the accumulated results branch (create on first run)
          git checkout -- .
          git fetch origin eval-results || true
          if git rev-parse -q --verify origin/eval-results >/dev/null; then
            git checkout -B eval-results origin/eval-results
          else
            git checkout -B eval-results
          fi
          [ -d "$snap/results" ] && { mkdir -p results; cp -r "$snap/results/." results/; }
          # The roster the refresh step computed, restored after the switch for
          # the same reason results/ is: it is tracked here and nowhere on main.
          # The refresh step is non-fatal, so there may be none — in which case
          # nothing is committed for it and the summary says why.
          if [ -f "$RUNNER_TEMP/roster/latest.json" ]; then
            mkdir -p roster
            cp "$RUNNER_TEMP/roster/latest.json" roster/latest.json
          else
            echo "No roster was published this run — see the roster step's warning." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          # The published badge is the reference A/B's, always: it is what the
          # README renders, and rebuilding it from the accumulated window is a
          # no-op on a run of some other fixture. A dispatched fixture's own
          # results are still committed below; make_badge.py takes a
          # `guidance/<id>` name too, for when a guidance A/B earns a badge.
          python3 "$RUNNER_TEMP/make_badge.py" workflow-path-audit
          git add badges results
          # -f is load-bearing: .gitignore lists roster/ and usage/ so a stray
          # local copy cannot ride into a main-branch PR. They ARE tracked here
          # on eval-results, and a plain `git add` would silently skip them.
          if [ -d roster ]; then git add -f roster; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "eval: $(cat "$RUNNER_TEMP/eval-key") run + badge + roster [skip ci]"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" push origin eval-results

      # LAST step in the job so `if: failure()` sees a failure from ANY
      # earlier step — not just the eval run, but also the badge-build and
      # commit/push step (e.g. a rejected push). Surfaces
      # the per-arm error detail (summaries + reports, incl. gitignored raw
      # transcripts) as an artifact instead of losing it with the runner.
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eval-results-debug
          path: skills-evals/results/
          if-no-files-found: ignore
          include-hidden-files: true

  # F2 (adversarial round 1 on #209): everything that touches the
  # `roster/proposal` pull request — find/create/edit/close/merge it, and
  # dispatch `ci.yml` on it — lives in this job, never in `eval`, so
  # `pull-requests: write` and `actions: write` are never in reach of the
  # `eval` job's bypass-permissions agent. Runs on EVERY eval run
  # (`needs: eval`, `if: !cancelled()`), `roster_mode: proposal` included
  # and a failed "Propose a roster change" step included (F3): a stale
  # `roster/proposal` PR's auto-merge must come off — or the PR must be
  # closed, if the committed roster no longer differs — whether or not this
  # run's propose step reached the auto path, or reached anything at all.
  # See the workflow-level `permissions:` comment above for the job's own
  # scope and why it also carries `issues: write`.
  roster-pr:
    needs: eval
    # B1.4 (round 2, spec-roster-mode-r2.md): only on `main` — a dispatch on
    # any other ref never has a `$GITHUB_SHA` worth trusting as "the
    # committed policy", so this job (and the auto-merge surface it alone
    # holds) never runs for one.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      actions: write
      issues: write
      # S2 (round 2): `enablePullRequestAutoMerge` and an immediate merge
      # both need write access to contents, even though this job performs
      # no checkout and runs no repository code — it only calls `gh`.
      contents: write
    steps:
      - name: Manage the roster pull request
        # Nothing here interpolates a GitHub Actions expression into the
        # shell; every `needs.eval.outputs.*` value arrives through `env:`
        # and is re-validated below before this job's own shell reads it —
        # the `eval` job already validated each before emitting it, but the
        # boundary between two jobs is exactly where "validate again" earns
        # its keep (adversarial round 1 on #209's own hard constraint).
        #
        # ROUND 2 (spec-roster-mode-r2.md, B1, blocker): EVERYTHING the
        # `eval` job produces — its outputs, the commit it pushed, its
        # workspace — is untrusted; that job runs a bypass-permissions
        # agent before this one. This step is the only place trust is
        # established, from GitHub's own API and `$GITHUB_SHA` (the
        # triggering commit on `main`, never the `eval` job's checkout).
        # `ROSTER_MODE` below is therefore read but never trusted for the
        # auto decision — `roster_mode` (the decision variable) comes from
        # a fresh, independent read of `evals/roster-policy.yml` AT
        # `$GITHUB_SHA` via the contents API (B1.1); the pushed branch's
        # actual head is re-read from the API and required to equal
        # `$PUSHED_SHA` (B1.2); and `$GITHUB_SHA...$PUSHED_SHA` must compare
        # as exactly one commit ahead, none behind, touching only
        # `evals/roster.yml` (B1.3) before this job will enable auto-merge.
        # B1.4's main-ref gate lives on the job itself, above.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          GITHUB_SHA: ${{ github.sha }}
          ROSTER_MODE: ${{ needs.eval.outputs.roster_mode }}
          STATUS: ${{ needs.eval.outputs.status }}
          PROBE_CLEAN: ${{ needs.eval.outputs.probe_clean }}
          ISSUE_NUMBER: ${{ needs.eval.outputs.issue_number }}
          PUSHED_SHA: ${{ needs.eval.outputs.pushed_sha }}
          REJECTED: ${{ needs.eval.outputs.rejected }}
          REJECTION_REASON: ${{ needs.eval.outputs.rejection_reason }}
          RENDERED_IDENTICAL: ${{ needs.eval.outputs.rendered_identical }}
          EVAL_NOTE: ${{ needs.eval.outputs.eval_note }}
          PROBE_NOTE: ${{ needs.eval.outputs.probe_note }}
          ROSTER_SUMMARY: ${{ needs.eval.outputs.roster_summary }}
        run: |
          set -uo pipefail
          export REPO
          github_sha=""
          if [[ "${GITHUB_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then github_sha="$GITHUB_SHA"; fi
          status=""
          case "${STATUS:-}" in same|differs) status="$STATUS" ;; esac
          probe_clean=false
          case "${PROBE_CLEAN:-}" in true) probe_clean=true ;; esac
          issue=""
          case "${ISSUE_NUMBER:-}" in ''|*[!0-9]*) : ;; *) issue="$ISSUE_NUMBER" ;; esac
          pushed_sha=""
          if [[ "${PUSHED_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then pushed_sha="$PUSHED_SHA"; fi
          rejected=false
          case "${REJECTED:-}" in true) rejected=true ;; esac
          # One of exactly two fixed sentences the eval job's propose step
          # can send (never arbitrary tool stderr); anything else falls
          # back to empty rather than being trusted verbatim.
          rejection_reason=""
          case "${REJECTION_REASON:-}" in
            "Rendering was rejected because the computed proposal could not be rendered safely."| \
            "Admission was rejected because the rendered proposal does not meet the committed-roster contract.")
              rejection_reason="$REJECTION_REASON" ;;
          esac
          rendered_identical=false
          case "${RENDERED_IDENTICAL:-}" in true) rendered_identical=true ;; esac
          marker='<!-- skills-evals:roster-proposal -->'

          # >>> text-allowlist (N2, round 2): `eval_note`/`probe_note` are
          # allow-listed against exactly the fixed sentences the `eval`
          # job's propose step can emit — never trusted verbatim, since
          # other text this job renders is shaped by the untrusted census
          # (ADR 0003's Consequences section). A value that does not match
          # falls back to empty rather than being printed.
          eval_note_raw="${EVAL_NOTE:-}"
          eval_note=""
          case "$eval_note_raw" in
            "This was a \`roster_only\` dispatch: no eval ran, and nothing from this run is published to \`eval-results\`. Its only outputs are the \`roster/proposal\` branch and this issue; where the summary below says the eval ran on the committed roster, no eval ran at all."| \
            "The paid eval ran on the committed \`evals/roster.yml\`; its results are published to \`eval-results\` by the next step, which runs after this issue is written — if that step failed or was skipped, this run's results were not published."| \
            "The paid eval ran on the committed \`evals/roster.yml\`, but the eval step failed; nothing from this run was published to \`eval-results\`."| \
            "No eval result: the eval step did not run; nothing from this run was published to \`eval-results\`.")
              eval_note="$eval_note_raw" ;;
          esac
          probe_note="${PROBE_NOTE:-}"
          probe_note_ok=true
          if [ -n "$probe_note" ]; then
          probe_note_ok=$(printf '%s' "$probe_note" | python3 -c '
          import re
          import sys
          FAILED = (r"\*\*The vendor-default probe failed for (\d+) (family|families) this run\.\*\* "
                     r"Their seats were held and none retired except models gone from the Models API; "
                     r"a family of theirs gained a seat only if it held none the Models API still lists\. "
                     r"The summary below names each family and its error class\. Nothing is carried over: "
                     r"the next run'"'"'s probe decides afresh\.")
          MISMATCH = (r"\*\*A vendor default did not match this run'"'"'s catalogue for (\d+) (family|families) "
                       r"this run\.\*\* Their seats were held and none retired except models gone from the "
                       r"Models API; a family of theirs gained a seat only if it held none the Models API "
                       r"still lists\. The summary below names each family and its mismatch class\. Nothing "
                       r"is carried over: the next run'"'"'s probe decides afresh\.")
          def agrees(m):
              n, word = m.group(1), m.group(2)
              return (word == "family") == (n == "1")
          text = sys.stdin.read()
          parts = text.split("\n\n")
          ok = False
          if len(parts) == 1:
              for pattern in (FAILED, MISMATCH):
                  m = re.fullmatch(pattern, parts[0])
                  if m and agrees(m):
                      ok = True
          elif len(parts) == 2:
              mf = re.fullmatch(FAILED, parts[0])
              mm = re.fullmatch(MISMATCH, parts[1])
              ok = bool(mf and mm and agrees(mf) and agrees(mm))
          print("true" if ok else "false")
          ' 2>/dev/null) || probe_note_ok=false
          fi
          case "$probe_note_ok" in true) : ;; *) probe_note="" ;; esac
          # <<< text-allowlist

          roster_summary="${ROSTER_SUMMARY:-}"
          # N2: the census-shaped summary's "Nothing changes until a human
          # merges it" sentence is only true under `roster_mode: proposal`
          # — swapped for an accurate one wherever this job builds the
          # AUTO pull request's own body (the tracking issue keeps the
          # unmodified summary; its own surrounding text already says
          # whether a human or the automation is expected to act).
          auto_summary=$(printf '%s' "$roster_summary" | sed \
            "s/Nothing changes until a human merges it; the eval ran on the committed roster, as it always does\\./This proposal merges automatically once \`test\` passes on it (\`roster_mode: auto\`); the eval always runs on the committed roster, never on this proposal./")

          # >>> policy-read (B1.1, round 2): the auto/proposal decision
          # comes ONLY from the committed policy at `$GITHUB_SHA`, read
          # fresh here — never from `$ROSTER_MODE` (the `eval` job's own
          # output, logged below but never trusted for the decision itself,
          # since a compromised `eval` job could forge it).
          eval_roster_mode=""
          case "${ROSTER_MODE:-}" in auto) eval_roster_mode="auto" ;; esac
          policy_content=""
          if [ -n "$github_sha" ]; then
            policy_b64=$(gh api "repos/$REPO/contents/evals/roster-policy.yml?ref=$github_sha" \
                          --jq .content 2>/dev/null) || policy_b64=""
            if [ -n "$policy_b64" ]; then
              policy_content=$(printf '%s' "$policy_b64" | base64 -d 2>/dev/null) || policy_content=""
            fi
          fi
          policy_mode=$(printf '%s' "$policy_content" | python3 -c '
          import sys
          import yaml
          try:
              doc = yaml.safe_load(sys.stdin.read())
          except Exception:
              doc = None
          value = doc.get("roster_mode") if isinstance(doc, dict) else None
          print(value if isinstance(value, str) else "")
          ' 2>/dev/null) || policy_mode=""
          case "$policy_mode" in
            auto|proposal) roster_mode="$policy_mode" ;;
            "") roster_mode="proposal" ;;
            *)
              echo "::warning::roster_mode is not auto or proposal; using proposal"
              roster_mode="proposal"
              ;;
          esac
          echo "roster_mode (policy at \$GITHUB_SHA): $roster_mode"
          if [ -n "$eval_roster_mode" ]; then
            echo "roster_mode (eval job's own output, informational only): $eval_roster_mode"
          fi
          # <<< policy-read

          # F1 (blocker): never match a fork's same-named branch. S4
          # (round 2): the lookup itself is now server-side —
          # `?head=<owner>:roster/proposal` filters by branch name at
          # GitHub, and the `--jq` filter re-asserts the SAME repo by full
          # name from `env.REPO` (never a client-side boolean GitHub
          # computed) before anything is taken off the list; a non-digit
          # (or empty) answer is treated exactly like "no open PR", never
          # interpolated further.
          find_roster_pr() {
            local raw
            if ! raw=$(gh api "repos/$REPO/pulls?state=open&base=main&head=${REPO%%/*}:roster/proposal" \
                        --jq '[.[] | select(.head.repo.full_name == env.REPO)] | .[0].number // empty' \
                        2>/dev/null); then
              return 1
            fi
            case "$raw" in
              ''|*[!0-9]*) printf '' ;;
              *) printf '%s' "$raw" ;;
            esac
          }

          # >>> publish-verify (B1.2 + B1.3, round 2): re-derive, from the
          # API alone, that `$PUSHED_SHA` really is `roster/proposal`'s
          # current head and really is exactly one commit ahead of the
          # trusted `$GITHUB_SHA`, changing only `evals/roster.yml`.
          verify_publish() {
            local actual_head compare_json ok
            actual_head=$(gh api "repos/$REPO/git/ref/heads/roster/proposal" \
                          --jq .object.sha 2>/dev/null) || actual_head=""
            if ! [[ "$actual_head" =~ ^[0-9a-f]{40}$ ]]; then actual_head=""; fi
            if [ -z "$actual_head" ] || [ "$actual_head" != "$pushed_sha" ]; then
              printf 'head'
              return 1
            fi
            compare_json=$(gh api "repos/$REPO/compare/$github_sha...$pushed_sha" 2>/dev/null) \
              || compare_json=""
            ok=$(printf '%s' "$compare_json" | python3 -c '
          import json
          import sys
          try:
              d = json.load(sys.stdin)
          except Exception:
              d = None
          good = False
          if isinstance(d, dict):
              files = d.get("files") or []
              names = [f.get("filename") for f in files if isinstance(f, dict)]
              statuses = [f.get("status") for f in files if isinstance(f, dict)]
              good = (d.get("status") == "ahead" and d.get("ahead_by") == 1
                      and d.get("behind_by") == 0 and names == ["evals/roster.yml"]
                      and statuses == ["modified"])
          print("true" if good else "false")
          ' 2>/dev/null) || ok="false"
            if [ "$ok" != true ]; then
              printf 'compare'
              return 1
            fi
            return 0
          }
          # <<< publish-verify

          # F4: track whether a disable actually succeeded — the tracking
          # issue must never claim auto-merge is off when this call failed.
          disable_auto() {
            local n="$1"
            if gh pr merge "$n" --repo "$REPO" --disable-auto; then
              return 0
            fi
            echo "::warning::could not disable auto-merge for the roster pull request"
            return 1
          }

          write_issue() {
            local title="$1" body_file="$2"
            if [ -n "$issue" ]; then
              if gh issue edit "$issue" --repo "$REPO" \
                --title "$title" --body-file "$body_file"; then
                echo "updated the proposal issue #$issue"
              else
                echo "::warning::could not update the roster tracking issue"
              fi
            else
              gh issue create --repo "$REPO" \
                --title "$title" --body-file "$body_file" \
                || echo "::warning::could not create the roster tracking issue"
            fi
          }

          if [ "$status" = same ]; then
            # S3 (round 2): a stale automatic PR is closed on "same"
            # regardless of `roster_mode` — the committed roster no longer
            # differs either way, so a PR this automation opened earlier
            # (under either mode, since `roster_mode: proposal` can follow
            # an earlier `auto` run) no longer has anything to merge. No
            # issue write here either way: the `eval` job's propose step
            # already finished the tracking issue's text for every "same"
            # case (it never depends on the PR).
            if same_pr=$(find_roster_pr); then
              if [ -n "$same_pr" ]; then
                if gh pr close "$same_pr" --repo "$REPO" \
                  --comment "This run proposes no change to the model roster; this pull request no longer differs from \`main\`. Closing."; then
                  echo "closed the stale roster pull request #$same_pr"
                else
                  echo "::warning::could not close the roster pull request"
                fi
              fi
            else
              echo "::warning::could not find the roster pull request"
            fi
            exit 0
          fi

          if [ "$status" != differs ] || [ "$rendered_identical" = true ]; then
            # F3: unknown/empty status (no roster computed, issue listing
            # failed, an ambiguous tracker, an unrecognised proposal
            # status, or the propose step failed before writing any
            # output at all) and a "differs" that rendered byte-identically
            # to the committed file (nothing to merge) get NO issue write
            # either way — today's behavior for all of these — but an open
            # PR from an EARLIER run must not be left carrying a stale
            # auto-merge. S5 (round 2): when a stale auto-merge really was
            # turned off, the tracking issue (if one is open) is corrected
            # with one fixed line, so it never keeps saying "merging
            # automatically" for a run that published nothing verifiable.
            if pr_number=$(find_roster_pr); then
              if [ -n "$pr_number" ]; then
                if disable_auto "$pr_number" && [ -n "$issue" ]; then
                  body="$RUNNER_TEMP/proposal-body.md"
                  {
                    printf '%s\n\n' "$marker"
                    echo "Automatic merge of PR #$pr_number was turned off: this run did not publish a proposal it could verify."
                  } > "$body"
                  if gh issue edit "$issue" --repo "$REPO" \
                    --title "Model roster: automatic merge turned off" --body-file "$body"; then
                    echo "updated the proposal issue #$issue"
                  else
                    echo "::warning::could not update the roster tracking issue"
                  fi
                fi
              fi
            else
              echo "::warning::could not find the roster pull request"
            fi
            exit 0
          fi

          # status == differs, admitted, not byte-identical: the only case
          # that can enable auto-merge, and the only case whose tracking-
          # issue text this job constructs.
          attempt=false
          verify_fail=""
          if [ "$rejected" != true ] && [ "$roster_mode" = auto ] \
             && [ "$probe_clean" = true ] && [ -n "$pushed_sha" ] && [ -n "$github_sha" ]; then
            if verify_fail=$(verify_publish); then
              attempt=true
            fi
          fi
          verify_reason_text=""
          case "$verify_fail" in
            head) verify_reason_text="the pushed branch's head does not match this run's proposal" ;;
            compare) verify_reason_text="the pushed commit did not verify as a single \`evals/roster.yml\` change ahead of this run's checkout" ;;
          esac

          pr_number=""
          pr_failed=""
          disable_ok=""

          if [ "$attempt" = true ]; then
            pr_body="$RUNNER_TEMP/pr-body.md"
            {
              echo "The weekly run computes a model roster that differs from the committed \`evals/roster.yml\`."
              echo
              [ -z "$probe_note" ] || printf '%s\n\n' "$probe_note"
              echo "$eval_note"
              echo
              echo "[Compare \`main...roster/proposal\`]($SERVER_URL/$REPO/compare/main...roster/proposal)"
              echo
              printf '%s\n' "$auto_summary"
              echo
              echo "Merged automatically once \`test\` passes (\`roster_mode: auto\` in \`evals/roster-policy.yml\`; set it to \`proposal\` to require approval)."
            } > "$pr_body"

            if pr_number=$(find_roster_pr); then
              if [ -n "$pr_number" ]; then
                if ! gh pr edit "$pr_number" --repo "$REPO" \
                  --title "roster: automatic update (run $RUN_ID)" --body-file "$pr_body"; then
                  pr_failed=1
                  echo "::warning::could not update the roster pull request"
                fi
              else
                pr_url=$(gh pr create --repo "$REPO" --base main --head roster/proposal \
                  --title "roster: automatic update (run $RUN_ID)" --body-file "$pr_body") \
                  || pr_url=""
                pr_number=$(printf '%s' "$pr_url" | grep -oE '[0-9]+$' || true)
                case "$pr_number" in
                  ''|*[!0-9]*)
                    pr_number=""
                    pr_failed=1
                    echo "::warning::could not create the roster pull request"
                    ;;
                esac
              fi
            else
              pr_number=""
              pr_failed=1
              echo "::warning::could not find the roster pull request"
            fi

            if [ -z "$pr_failed" ]; then
              if ! gh workflow run ci.yml --repo "$REPO" --ref roster/proposal; then
                pr_failed=1
                echo "::warning::could not start checks for the roster pull request"
              fi
            fi
            if [ -z "$pr_failed" ]; then
              # N1: idempotent — a PR this job is EDITING (not creating
              # fresh) may already carry auto-merge from an earlier run;
              # disabling it first means the enable call below is never a
              # no-op on a PR already in that state. Genuinely silent, not
              # just unwrapped: a BRAND NEW pr create has no auto-merge to
              # disable, and `--disable-auto` on one can itself answer with
              # an error (GraphQL "Auto merge is not enabled") — that is an
              # expected, harmless outcome here, never the "something a
              # human should see" failure `disable_auto` warns about
              # elsewhere in this job.
              gh pr merge "$pr_number" --repo "$REPO" --disable-auto >/dev/null 2>&1 || true
              if ! gh pr merge "$pr_number" --repo "$REPO" --auto --merge \
                   --match-head-commit "$pushed_sha"; then
                pr_failed=1
                echo "::warning::could not enable auto-merge for the roster pull request"
              fi
            fi
            if [ -n "$pr_failed" ] && [ -n "$pr_number" ]; then
              # The attempt above did not finish with auto-merge enabled on
              # this run's head but DID learn a PR number: that PR must not
              # be left carrying a stale auto-merge from an earlier run (or
              # from an earlier half of this same attempt).
              if disable_auto "$pr_number"; then disable_ok=1; fi
            fi
          else
            if pr_number=$(find_roster_pr); then
              if [ -n "$pr_number" ]; then
                if disable_auto "$pr_number"; then disable_ok=1; fi
              fi
            else
              pr_number=""
              pr_failed=1
              echo "::warning::could not find the roster pull request"
            fi
          fi

          body="$RUNNER_TEMP/proposal-body.md"
          if [ "$attempt" = true ] && [ -z "$pr_failed" ] && [ -n "$pr_number" ]; then
            {
              printf '%s\n\n' "$marker"
              echo "The weekly run computed a roster difference and opened pull request #$pr_number from \`roster/proposal\`, which merges automatically once its \`test\` check passes (\`roster_mode: auto\` in \`evals/roster-policy.yml\`; set it to \`proposal\` to require approval)."
              echo
              [ -z "$probe_note" ] || printf '%s\n\n' "$probe_note"
              echo "$eval_note"
              echo
              echo "[Pull request #$pr_number]($SERVER_URL/$REPO/pull/$pr_number)"
              echo
              printf '%s\n' "$roster_summary"
            } > "$body"
            write_issue "Model roster: a change is merging automatically" "$body"
            exit 0
          fi

          if [ "$rejected" = true ]; then
            # F4: the "turned off" sentence is conditioned on $disable_ok,
            # never printed because the call was merely attempted.
            {
              printf '%s\n\n' "$marker"
              echo "The weekly run computed a roster difference, but it was rejected before proposal publication."
              echo
              echo "**Needs review before publication.** No proposal branch or compare link was updated."
              if [ "$roster_mode" = auto ]; then
                echo "\`roster_mode: auto\` is set, but no pull request was opened: a rejected proposal never reaches the automatic-merge step."
              fi
              if [ -n "$pr_number" ]; then
                if [ "$disable_ok" = 1 ]; then
                  echo "Pull request #$pr_number from an earlier run is still open; its automatic merge has been turned off because this run's proposal was rejected before publication."
                else
                  echo "Pull request #$pr_number from an earlier run is still open; its automatic merge could NOT be turned off — disable it by hand on PR #$pr_number."
                fi
              fi
              echo
              [ -z "$probe_note" ] || printf '%s\n\n' "$probe_note"
              echo "$eval_note"
              echo
              echo "$rejection_reason"
              echo
              printf '%s\n' "$roster_summary"
            } > "$body"
            write_issue "Model roster: proposal needs review" "$body"
            exit 0
          fi

          # `roster_mode: proposal`, or `auto` with a probe that was not
          # clean, or a publication that could not be verified (B1), or an
          # attempt that started but failed partway.
          why=""
          if [ "$roster_mode" = auto ]; then
            if [ "$probe_clean" != true ]; then
              why="this run's vendor-default probe was not clean"
            elif [ -n "$verify_reason_text" ]; then
              why="this run's proposal needs review: $verify_reason_text"
            else
              why="this run's automatic-merge attempt did not complete"
            fi
          fi
          if [ -n "$pr_number" ]; then
            # F4: WHY auto-merge is not on stays in the sentence either
            # way — only whether the disable call itself succeeded changes.
            off_reason="${why:-\`roster_mode\` is \`proposal\`}"
            if [ "$disable_ok" = 1 ]; then
              turned_off="its automatic merge has been turned off because ${off_reason}."
            else
              turned_off="its automatic merge could NOT be turned off because ${off_reason} — disable it by hand on PR #$pr_number."
            fi
            if [ -n "$why" ]; then
              pr_line="Pull request #$pr_number is open from \`roster/proposal\`; a human must merge it after CI. ${turned_off^}"
            else
              pr_line="Pull request #$pr_number is open from \`roster/proposal\`; merge it after CI if the reasons below hold up. ${turned_off^}"
            fi
          else
            if [ -n "$why" ]; then
              pr_line="\`roster_mode: auto\` is set, but $why, so the automatic merge was skipped this run — a human must open or merge the pull request from \`roster/proposal\`."
            else
              pr_line="Open a pull request from \`roster/proposal\` and merge it after CI if the reasons below hold up."
            fi
          fi
          {
            printf '%s\n\n' "$marker"
            echo "The weekly run computes a model roster that differs from the committed \`evals/roster.yml\`."
            echo
            echo "**Nothing has changed yet.** The harness runs on the committed file (ADR 0001); this is a proposal."
            echo "$pr_line"
            echo
            [ -z "$probe_note" ] || printf '%s\n\n' "$probe_note"
            echo "$eval_note"
            echo
            echo "[Compare \`main...roster/proposal\`]($SERVER_URL/$REPO/compare/main...roster/proposal)"
            echo
            printf '%s\n' "$roster_summary"
          } > "$body"
          write_issue "Model roster: a change is proposed" "$body"
