# Real (non-hermetic) skill eval: runs the workflow-path-audit A/B eval against
# the live Claude Code CLI + Anthropic API, regenerates the quality badge, and
# pushes the badge + run summaries to the `eval-results` branch. The hermetic
# suite stays in ci.yml — this workflow is the ONLY place real credentials
# appear. The objective checks are hermetic everywhere, here included.
#
# SECURITY POSTURE — read this before changing anything:
#
# * Triggers are `schedule` + `workflow_dispatch` ONLY. NEVER add pull_request
#   or pull_request_target: this workflow holds an API key, and the harness
#   runs the agent under test with `--permission-mode bypassPermissions` (see
#   harness/run_eval.py) inside a throwaway temp workspace. Key +
#   bypassPermissions must never meet untrusted fixture content. The fixtures
#   here are trusted because only maintainers can push to this repo; the only
#   prompts ever run are this repo's committed fixtures. Never accept external
#   fixture contributions into this path without dropping the key first.
#   The trust boundary equally includes the three registries checked out
#   below (agentskills, cms-platform, adamdaniel.ai): the with_skill arm
#   installs skill content from whichever registry the fixture names, from
#   that registry's default branch, and executes it under bypassPermissions
#   with the key in env — write access to any of the three checked-out
#   registries is equivalent to key access here. All four repos (this one
#   included) are maintainer-only; keep it that way or drop the key.
#   cms-platform and adamdaniel.ai also land commits on their default
#   branches through automated lanes — Decap CMS editorial publish loops,
#   auto-merge nudges, dependabot auto-merge — not only direct maintainer
#   pushes. A commit landed by one of those lanes is inside this trust
#   boundary just the same as a maintainer's own push: treat it as trusted,
#   or drop the key.
#
# * Auth: GitHub OIDC → Anthropic Workload Identity Federation. No stored
#   secret exists. The Claude Code CLI does not resolve the
#   ANTHROPIC_FEDERATION_* env vars (it hangs credential-less — verified
#   2026-07-17), so this workflow performs the RFC 7523 jwt-bearer exchange
#   explicitly rather than delegating it to the CLI. The "Mint OIDC token
#   and exchange for Anthropic access token" step exchanges the runner's
#   ACTIONS_ID_TOKEN_REQUEST_TOKEN for a GitHub-issued OIDC token (sub
#   pinned to repo:Adam-S-Daniel/skills-evals:ref:refs/heads/main, audience
#   https://api.anthropic.com, single-use JTI), then POSTs that assertion
#   to https://api.anthropic.com/v1/oauth/token against federation rule
#   fdrl_012TsUrCbGZKH17uCUpgqMxf / org 0905256d-aaf8-45ad-892b-9d2867c67c4e
#   / service account svac_01DVDm1YuUembqV2LScAjsGz, with the exchange body
#   pinned to workspace_id wrkspc_017pHomopHiJ7nRzZJS6NhV4 (the spend-capped
#   skills-evals-ci workspace) explicitly, so a rule-binding change can never
#   silently rescope the token and binding failures surface as named errors
#   instead of opaque 401s. The resulting sk-ant-oat01 access
#   token (≤1h, workspace-scoped, spend-capped) is masked via
#   ::add-mask::, stored only in $RUNNER_TEMP/anthropic-bearer, and
#   exported step-locally as ANTHROPIC_AUTH_TOKEN in each step that calls
#   claude — never top-level env. The single exchange also satisfies the
#   issuer's single-use JTI enforcement (one exchange, all four claude
#   calls share the token). Dispatches from non-main refs get no
#   credential — the rule's sub claim matches ref:refs/heads/main only —
#   which also supersedes the old maintainer-branch trust widening
#   caveat. Cost: a full run is 2 agent arms + 2 judge calls. The fixture
#   pins a mid-tier agent and a strong judge — carried over unchanged from
#   the predecessor fixture — which puts a run at ~$0.30–0.90, i.e.
#   ~$1.50–4/month at weekly cadence. Unpinning any of them would make the
#   per-run cost track the CLI's default model instead, and would break
#   week-over-week badge comparability with it. Per-dispatch spend is
#   bounded by the harness timeouts
#   (600s per arm, 120s per judge call); the workspace spend limit, not
#   this workflow, is the hard ceiling.
#
# * The model roster step (#67) adds ONE more caller of that same bearer: a
#   `GET /v1/models` read from scripts/refresh_models.py, exported
#   step-locally exactly like the claude calls and never at top level. It
#   introduces NO new credential shape — no stored secret, no new federation
#   binding — and it is a read of the model catalogue, not of usage or
#   billing. The one thing it would use if it existed is ANTHROPIC_ADMIN_KEY,
#   for the optional org-wide usage report; that variable is deliberately NOT
#   provisioned, and its absence prints a `::notice::` naming it rather than
#   failing the run. Do not create it to silence the notice — provision it
#   only if the org-wide report is actually wanted. Because the WIF rule's sub
#   claim matches `ref:refs/heads/main` only, a dispatch from any other ref
#   gets no bearer and dies at the exchange step above, before this one. That
#   read is also the FIRST use of this bearer in the job, ahead of the
#   preflight — which is a reason for it to be non-fatal, not a reason to put
#   it later: it is a free extra signal about the credential, and the
#   preflight remains the step that decides whether the bearer works.
#
#   The Admin API usage report, if it is ever provisioned, is BILLING data.
#   It is written to $RUNNER_TEMP/admin-usage.json, deliberately NOT into
#   $RUNNER_TEMP/roster/ — that directory is the one the commit step copies
#   from, and it holds the published roster and nothing else so that a future
#   directory copy cannot publish billing data to a public branch.
#
#   Nothing in this workflow ever prints a response body. The roster step's
#   ::warning:: carries an HTTP status code or an exception class name, and
#   refresh_models.py is written to produce nothing else.
#
# * All four checkouts use `persist-credentials: false`; push auth is injected
#   only in the two steps that push — the roster-proposal step and the final
#   commit step — and only in their own `env:`. Both sit AFTER the eval, so
#   while the bypassPermissions agent is
#   running, no GitHub write credential exists anywhere on the runner — the
#   only credential in reach is the short-lived WIF-derived access token
#   (and the single-use OIDC token file) scoped to the spend-capped
#   workspace — no long-lived secret exists on the runner.
#
# * The weekly badge commit doubles as cron keep-alive: GitHub disables
#   scheduled workflows after ~60 days without repo activity, and each run
#   commits fresh results, so the schedule keeps itself alive.
#
# * Results + badge live on the `eval-results` branch, not main: main's
#   branch-protection ruleset requires changes go through a pull request
#   (this repo's fleet repo-settings baseline), so a bot direct-pushing
#   straight to main would be rejected — as it was in run 29620223686. The
#   commit step fetches/builds on `eval-results` (creating it on the first
#   run) and pushes there directly; nobody hand-commits to that branch and
#   the `real-eval` concurrency lane serializes runs, so a rejected push
#   fails the job loudly rather than retrying. The README badge URL consumes
#   raw content from `eval-results` accordingly.
#
# * All actions are SHA-pinned, bare — no trailing version/date comment. The
#   comment went stale silently and then lied (Dependabot rewrites it only
#   sometimes), so the SHA is the only claim made; resolve a version with
#   `git ls-remote <url> | grep <sha>` when you need one. Same pins as
#   agentskills' ci.yml, and this repo's own eval seeds practice what we pin.

name: Real eval

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:

# Single job, so this block is the whole workflow's privilege set.
# `contents: write` is required for the badge/results push; splitting eval and
# commit into separate jobs would not shed it (the commit job still needs write
# + the results artifact), it would only add an artifact hand-off surface.
# `issues: write` is #147's one addition, for the roster-proposal tracking
# issue. GITHUB_TOKEN here gets no other scopes.
permissions:
  contents: write
  id-token: write
  # #147: the roster proposal step upserts ONE tracking issue (marker
  # `<!-- skills-evals:roster-proposal -->`) and closes it again when the
  # computed roster matches the committed one. That is the ONLY new
  # permission this workflow has taken; the `roster/proposal` branch push
  # needs none, because the job already pushes `eval-results`.
  issues: write

# Never let two runs (e.g. a manual dispatch during the weekly run) race the
# badge commit; queue instead of cancelling so results are never half-written.
concurrency:
  group: real-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 2 arms x 10 min agent budget + judges + setup
    steps:
      - name: Check out skills-evals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: skills-evals
          # Full history so the push-race rebase below always has the commits
          # it needs; this repo is small.
          fetch-depth: 0
          persist-credentials: false

      - name: Check out agentskills registry (side-by-side)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adam-S-Daniel/agentskills
          path: agentskills
          persist-credentials: false

      - name: Check out cms-platform registry (side-by-side)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adam-S-Daniel/cms-platform
          path: cms-platform
          persist-credentials: false

      - name: Check out adamdaniel.ai registry (side-by-side)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adam-S-Daniel/adamdaniel.ai
          path: adamdaniel.ai
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Install Claude Code CLI
        # Pinned per the repo cooling-off convention: this step feeds the
        # key-bearing eval step, so an unpinned install is a supply-chain
        # vector straight into the API key. 2.1.211 is the version this
        # harness was validated against locally; bump deliberately via PR.
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.211
          claude --version

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install harness dependencies
        run: pip install pyyaml

      - name: Mint OIDC token and exchange for Anthropic access token
        run: |
          resp=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Fapi.anthropic.com")
          jq -r .value <<<"$resp" > "$RUNNER_TEMP/anthropic-oidc.jwt"
          test -s "$RUNNER_TEMP/anthropic-oidc.jwt"
          body=$(jq -n --rawfile jwt "$RUNNER_TEMP/anthropic-oidc.jwt" '{
            grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
            assertion: ($jwt | rtrimstr("\n")),
            federation_rule_id: "fdrl_012TsUrCbGZKH17uCUpgqMxf",
            organization_id: "0905256d-aaf8-45ad-892b-9d2867c67c4e",
            service_account_id: "svac_01DVDm1YuUembqV2LScAjsGz",
            workspace_id: "wrkspc_017pHomopHiJ7nRzZJS6NhV4"
          }')
          xresp="$RUNNER_TEMP/exchange-resp.json"
          code=$(curl -sS -o "$xresp" -w "%{http_code}" -X POST https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" -d "$body")
          if [ "$code" != "200" ]; then
            echo "token exchange failed: HTTP $code"
            cat "$xresp"
            exit 1
          fi
          tok=$(jq -re .access_token < "$xresp")
          rm -f "$xresp"
          echo "::add-mask::$tok"
          printf '%s' "$tok" > "$RUNNER_TEMP/anthropic-bearer"

      # Model roster (#67, redesigned in #147). Recomputes which models this
      # harness SHOULD be running against — arms, judge, preflight — from
      # what the Models API says is AVAILABLE and what the published usage
      # census says is USED, and publishes it with the run.
      #
      # IT COMPUTES A PROPOSAL, NOT THE RUNNING SET (ADR 0001). The models
      # the eval below actually runs come from the committed
      # `evals/roster.yml` and from nothing else; this step's `--previous`
      # is that same committed file, and its output goes to `eval-results`
      # as an exhibit plus, when it differs, to the bot-owned
      # `roster/proposal` branch and one tracking issue for a human to
      # merge. Nothing here sets $EVAL_ROSTER, and nothing materialises a
      # roster off `eval-results` for selection — that is what let one line
      # on an unprotected branch pick every unpinned fixture's models.
      #
      # No new credential. The Models API call reuses the same WIF-derived
      # bearer minted above; ANTHROPIC_ADMIN_KEY is optional and its absence
      # produces a ::notice::, never a failure.
      #
      # NOT FATAL TO THE EVAL. The Models API read is still fatal to the
      # ROSTER — a half-read API is indistinguishable from a model retiring,
      # and publishing that quietly is the failure mode this feature exists to
      # remove — but the eval and the badge never depended on the roster, and
      # this step sits ahead of both. So a failure here prints a ::warning::
      # naming the failure class, publishes NO roster (never a partial one),
      # and lets the eval run on the fixture pins. This also matters because
      # the WIF bearer against GET /v1/models is an auth path exercised for
      # the very first time on the first dispatch after merge.
      #
      # A failed `git fetch` is NOT a first run. `|| true` conflated the two,
      # and the roster then asserted "no fresh census (none published)" about
      # a branch it simply could not read; `ls-remote` tells them apart.
      #
      # Everything lands in $RUNNER_TEMP, not the working tree: roster/ is
      # tracked on eval-results and untracked on main, so a copy in the
      # working tree would make the commit step's `git checkout -B
      # eval-results` refuse. The commit step restores it after the switch,
      # exactly as it already does for results/. $RUNNER_TEMP/roster holds the
      # published roster AND NOTHING ELSE — the working inputs live in
      # roster-inputs/ and the Admin API usage report (billing data) at
      # $RUNNER_TEMP/admin-usage.json — so that a future directory copy of
      # that path can only ever publish the roster.
      - name: Refresh the model roster
        working-directory: skills-evals
        run: |
          set -uo pipefail
          pub="$RUNNER_TEMP/roster"
          work="$RUNNER_TEMP/roster-inputs"
          rm -rf "$pub" "$work"; mkdir -p "$pub" "$work"
          reason=""
          # The reason a failed script's stderr becomes a ::warning::/step-
          # summary line. Prefers the FIRST non-empty line that is neither a
          # `roster: `-prefixed warn() line (compute_roster's own warnings,
          # chronologically first) nor an indented line (a roster.py
          # "  <id>: <reason>" per-model detail, or an indented traceback
          # frame) nor the traceback's own header — the single least useful
          # line a traceback has. That headline is what roster.py's fatal
          # "refusing to publish a roster with no arms" path prints FIRST,
          # ahead of one indented line per excluded/unranked model, so the
          # old `tail -n 1` here surfaced a random model's detail instead of
          # the headline. Falls back to the plain last non-empty line only
          # when nothing clears that bar (an uncaught exception, where the
          # exception's own message is the last line and the traceback's
          # header and frames are the only other candidates).
          extract_reason() {
            local line
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              case "$line" in
                'roster: '*) continue ;;
                ' '*|$'\t'*) continue ;;
                'Traceback (most recent call last):') continue ;;
              esac
              printf '%s\n' "$line"
              return 0
            done < "$1"
            grep -v '^$' "$1" | tail -n 1
          }
          # The `roster: `-prefixed warn() lines carry the actual diagnosis
          # (a stale/unreadable census, skipped bad rows, ...). A census
          # that is stale/unreadable/carries skipped rows can print these
          # and STILL let the run succeed overall (a graceful fallback), so
          # this runs on both the success and failure paths — it used to
          # run only on failure, reaching only the raw job log on success,
          # never the step summary — the surface most people actually read
          # first.
          emit_roster_warnings() {
            local file="$1" warnings
            [ -f "$file" ] || return 0
            warnings=$(grep '^roster: ' "$file" || true)
            [ -n "$warnings" ] || return 0
            {
              echo
              echo "<details><summary>roster warnings</summary>"
              echo
              echo '```'
              printf '%s\n' "$warnings"
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          }
          refresh() {
            ANTHROPIC_AUTH_TOKEN="$(cat "$RUNNER_TEMP/anthropic-bearer")"
            export ANTHROPIC_AUTH_TOKEN
            # Previous roster and published census come off eval-results
            # WITHOUT checking it out — the branch switch belongs to the
            # commit step, and both inputs are optional, so a genuine first
            # run (no branch, no files) just leaves empty files behind and
            # roster.py treats those as absent.
            if ! git fetch origin eval-results 2>/dev/null; then
              # `git ls-remote | grep -q` discards ls-remote's OWN exit status
              # under `pipefail`: on a correlated outage (fetch AND ls-remote
              # both unreachable) grep sees empty stdin, "no match" is exit 1,
              # and pipefail reports the pipeline's status as grep's 1 rather
              # than ls-remote's 128 — reading a network outage as a genuine
              # first run. Capture ls-remote's own output and exit status via
              # command substitution instead, and match on the captured text
              # with a here-string so nothing is piped into grep (the fleet's
              # SIGPIPE rule) and ls-remote's failure cannot be swallowed by
              # what comes after it.
              ls_out=$(git ls-remote --heads origin eval-results 2>/dev/null) || {
                reason="roster inputs unavailable: could not reach origin"
                return 1
              }
              if grep -qF -- 'refs/heads/eval-results' <<<"$ls_out"; then
                reason="roster inputs unavailable: eval-results exists but could not be fetched"
                return 1
              fi
            fi
            # THE CENSUS ONLY. The previous roster is the COMMITTED
            # evals/roster.yml now (ADR 0001) — it is not materialised
            # from this branch at all, because a document read off an
            # unprotected branch cannot be the harness's record of what
            # it has observed (#147).
            if git rev-parse -q --verify origin/eval-results >/dev/null 2>&1; then
              git show origin/eval-results:usage/latest.json > "$work/census.json" 2>/dev/null || true
            fi
            # stderr is captured, not swallowed: it is echoed back to the log
            # either way, and on failure extract_reason picks the
            # ::warning::. Both scripts are written to keep that line to a
            # status code or an exception class — never a response body.
            if ! python3 scripts/refresh_models.py \
                 --out "$work/models.json" \
                 --admin-report "$RUNNER_TEMP/admin-usage.json" 2> "$work/refresh.err"; then
              cat "$work/refresh.err" >&2
              reason="$(extract_reason "$work/refresh.err")"
              return 1
            fi
            cat "$work/refresh.err" >&2
            if ! python3 harness/roster.py \
                 --models "$work/models.json" \
                 --policy evals/roster-policy.yml \
                 --census "$work/census.json" \
                 --admin-report "$RUNNER_TEMP/admin-usage.json" \
                 --previous evals/roster.yml \
                 --out "$pub/latest.json" > "$work/summary.md" 2> "$work/roster.err"; then
              cat "$work/roster.err" >&2
              reason="$(extract_reason "$work/roster.err")"
              return 1
            fi
            cat "$work/roster.err" >&2
            cat "$work/summary.md" | tee -a "$GITHUB_STEP_SUMMARY"
            emit_roster_warnings "$work/roster.err"
            return 0
          }
          if ! refresh; then
            rm -f "$pub/latest.json" "$pub"/*.partial
            echo "::warning::model roster NOT refreshed: ${reason:-unknown failure}"
            {
              echo "### Model roster"
              echo
              echo "**The roster was not refreshed this run.** ${reason:-unknown failure}"
              echo
              echo "No roster is published and no proposal is made; the eval below"
              echo "ran on the committed evals/roster.yml, as it always does."
            } >> "$GITHUB_STEP_SUMMARY"
            emit_roster_warnings "$work/roster.err"
          fi

      # Cheap canary validating the exchanged bearer before the real spend,
      # on the model the roster names as `preflight` — the cheapest the Models
      # API still returns. That entry used to be computed and consumed by
      # nothing while this step hardcoded a model of its own.
      #
      # THE COMMITTED FILE, not the computed one (ADR 0001, #147). The
      # preflight used to read `$RUNNER_TEMP/roster/latest.json` — this
      # run's own proposal, computed partly from an untrusted census — so a
      # census plant could choose which model the job canaried its bearer
      # against. `evals/roster.yml` is on `main`, behind a reviewed commit.
      #
      # The literal below is the documented ROSTER FALLBACK, and it is the
      # only model id in this file. It is used when the committed roster
      # cannot be read, AND as the one retry when the roster's own
      # preflight pick fails (a day-old cheapest-tier model can be past the
      # roster's cooling-off check yet still not entitled for this bearer) —
      # `test_no_model_ids_are_hardcoded_outside_fixtures` allows exactly one
      # such literal and only because the marker on its line says what it is.
      - name: WIF auth preflight
        working-directory: skills-evals
        run: |
          set +e
          fallback="claude-haiku-4-5" # ROSTER FALLBACK: used when no roster, and retried once if the roster's preflight model fails
          model="$fallback"
          if [ -f evals/roster.yml ]; then
            from_roster=$(python3 -c 'import yaml,sys; d=yaml.safe_load(open(sys.argv[1])) or {}; p=(d.get("preflight") or {}).get("id"); print(p if isinstance(p, str) else "")' evals/roster.yml 2>/dev/null)
            if [ -n "$from_roster" ]; then model="$from_roster"; fi
          fi
          ANTHROPIC_AUTH_TOKEN="$(cat "$RUNNER_TEMP/anthropic-bearer")"
          export ANTHROPIC_AUTH_TOKEN
          echo "preflight model: $model"
          out=$(timeout 120 claude -p 'Reply with exactly: ok' \
            --model "$model" --output-format json 2>&1)
          rc=$?
          echo "preflight exit: $rc"
          printf '%s\n' "$out" | tail -c 4000
          if [ "$rc" -ne 0 ] && [ "$model" != "$fallback" ]; then
            echo "::warning::preflight failed on roster model $model; retrying with the fallback"
            model="$fallback"
            echo "preflight model: $model"
            out=$(timeout 120 claude -p 'Reply with exactly: ok' \
              --model "$model" --output-format json 2>&1)
            rc=$?
            echo "preflight exit: $rc"
            printf '%s\n' "$out" | tail -c 4000
          fi
          exit $rc

      - name: Run the eval (both arms, judge)
        working-directory: skills-evals
        run: |
          ANTHROPIC_AUTH_TOKEN="$(cat "$RUNNER_TEMP/anthropic-bearer")"
          export ANTHROPIC_AUTH_TOKEN
          python3 harness/run_eval.py evals/workflow-path-audit \
            --arm both \
            --registry agentskills=../agentskills \
            --registry cms-platform=../cms-platform \
            --registry adamdaniel.ai=../adamdaniel.ai

      # THE PROPOSAL (#147, ADR 0001 decision 2). The roster step above
      # computed what the roster SHOULD be; this step is what a human ever
      # sees of it. When it differs from the committed `evals/roster.yml`
      # it pushes the proposed file as ONE commit on the bot-owned branch
      # `roster/proposal` and upserts ONE tracking issue carrying the
      # rendered summary and the compare link. When it does not differ it
      # closes that issue, so a stale one never sits open claiming a change
      # that has already landed or gone away.
      #
      # WHY A BRANCH AND AN ISSUE, AND NOT A PULL REQUEST. A pull request
      # opened by `GITHUB_TOKEN` does not trigger `pull_request` workflows,
      # so a PR this job opened would sit with no CI on it — and this repo's
      # `main` is ruleset-protected and PR-only, which is the whole reason
      # the roster is trusted. A human opens the PR from the branch and
      # merges it after CI. This is the fleet's sanctioned bot-write path:
      # a branch and a pull request a person merges, never a direct push to
      # a protected branch and never a ruleset bypass actor.
      #
      # `roster/proposal` IS BOT-OWNED AND IS NEVER SHARED. It is recreated
      # from this run's checked-out `main` sha every run and force-pushed
      # with `--force-with-lease`; nobody commits to it by hand and nothing
      # else reads it. That is the one sanctioned exception to the fleet's
      # "do not force-push a shared branch" rule, and it is sanctioned
      # because the branch is not shared: a proposal computed against last
      # week's `main` is not a thing to preserve, it is a thing to replace.
      # The lease is what keeps that honest — a push that would discard a
      # commit this run has not seen fails rather than silently winning.
      #
      # IT RUNS AFTER THE EVAL, deliberately. The eval must run on the
      # committed roster with no GitHub write credential anywhere on the
      # runner (the security header's fourth rule); this step holds one, so
      # it sits after the bypassPermissions agent has finished. It does its
      # git work in a WORKTREE under $RUNNER_TEMP so the main checkout is
      # untouched for the badge/commit step that follows.
      #
      # Nothing here interpolates a GitHub Actions expression into the
      # shell. The run id, the repository and the server URL arrive through
      # `env:` and are read as variables.
      - name: Propose a roster change
        working-directory: skills-evals
        env:
          # Write auth lives only in this step and the commit step.
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          marker='<!-- skills-evals:roster-proposal -->'
          computed="$RUNNER_TEMP/roster/latest.json"
          if [ ! -f "$computed" ]; then
            echo "::notice::no roster was computed this run, so there is nothing to propose"
            exit 0
          fi
          status=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(((d.get("proposal") or {}).get("status")) or "")' "$computed")
          echo "proposal status: ${status:-unknown}"

          # The open tracking issue, found by the marker in its body. The
          # listing is written to a file and parsed, rather than piped into
          # a filter: `gh api` prints its raw error body to STDOUT on a
          # non-2xx, so a `|| true` around a pipeline would capture that
          # error JSON and read it as data.
          issues="$RUNNER_TEMP/roster-issues.json"
          if ! gh api "repos/$REPO/issues?state=open&per_page=100" > "$issues"; then
            echo "::warning::could not list issues; the roster proposal was not filed"
            exit 0
          fi
          # One line, no heredoc: this is a YAML block scalar, so a
          # continuation line at column 0 would end the block, and a
          # heredoc body indented to the block would be indented Python.
          issue=$(python3 -c "import json,sys; rows=json.load(open(sys.argv[1])); hits=[str(r['number']) for r in rows if not r.get('pull_request') and sys.argv[2] in (r.get('body') or '')]; print(hits[0] if hits else '')" "$issues" "$marker")

          if [ "$status" != "differs" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$REPO" \
                --comment "This run computes the same roster the committed \`evals/roster.yml\` already names. Closing until something changes."
              echo "closed the stale proposal issue #$issue"
            else
              echo "nothing to propose and no open proposal issue"
            fi
            exit 0
          fi

          # The eval-results commit the census came from, recorded in the
          # rendered file's provenance so a merged proposal says which
          # untrusted document shaped it.
          census_commit=$(git rev-parse origin/eval-results 2>/dev/null) || census_commit="none"
          python3 scripts/render_roster_yaml.py \
            --roster "$computed" \
            --out "$RUNNER_TEMP/proposed-roster.yml" \
            --run-id "$RUN_ID" \
            --eval-results-commit "$census_commit"

          base=$(git rev-parse HEAD)
          worktree="$RUNNER_TEMP/proposal-worktree"
          rm -rf "$worktree"
          git worktree add --detach "$worktree" "$base"
          cp "$RUNNER_TEMP/proposed-roster.yml" "$worktree/evals/roster.yml"
          git -C "$worktree" checkout -B roster/proposal
          git -C "$worktree" add evals/roster.yml
          if git -C "$worktree" diff --cached --quiet; then
            echo "::notice::the proposal renders byte-identically to the committed roster; nothing pushed"
            git worktree remove --force "$worktree"
            exit 0
          fi
          # `-c user.*` rather than `git config`: a worktree shares the
          # parent checkout's config, so `git config` here would rewrite
          # the identity of the checkout the next step commits from.
          git -C "$worktree" \
            -c user.name="skills-evals real-eval bot" \
            -c user.email="skills-evals@users.noreply.github.com" \
            commit -q -m "roster: proposed model roster (run $RUN_ID)"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          # Fetch first so the lease has something to compare against: with
          # no remote-tracking ref, --force-with-lease has no expectation to
          # enforce and degrades to a plain force.
          git -c "http.$SERVER_URL/.extraheader=$auth" fetch origin \
            '+refs/heads/roster/proposal:refs/remotes/origin/roster/proposal' || true
          git -C "$worktree" -c "http.$SERVER_URL/.extraheader=$auth" \
            push --force-with-lease origin roster/proposal
          git worktree remove --force "$worktree"

          body="$RUNNER_TEMP/proposal-body.md"
          {
            printf '%s\n\n' "$marker"
            echo "The weekly run computes a model roster that differs from the committed \`evals/roster.yml\`."
            echo
            echo "**Nothing has changed yet.** The harness runs on the committed file (ADR 0001); this is a proposal."
            echo "Open a pull request from \`roster/proposal\` and merge it after CI if the reasons below hold up."
            echo
            echo "[Compare \`main...roster/proposal\`]($SERVER_URL/$REPO/compare/main...roster/proposal)"
            echo
            cat "$RUNNER_TEMP/roster-inputs/summary.md"
          } > "$body"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$REPO" \
              --title "Model roster: a change is proposed" --body-file "$body"
            echo "updated the proposal issue #$issue"
          else
            gh issue create --repo "$REPO" \
              --title "Model roster: a change is proposed" --body-file "$body"
          fi

      # Badge generation, commit and push are ONE step because the badge's
      # window can only see the accumulated history, and that history exists
      # nowhere until the `eval-results` checkout below has happened. This
      # workflow used to build the badge in a step of its own, ahead of the
      # commit step — which ran make_badge.py against the fresh workspace,
      # where results/ holds only the run that just finished. The `--window N`
      # average could therefore never draw on more than one run: the
      # aggregation was structurally inert and every published badge quietly
      # reported a single run (the `n=` marker only appears above one run, so
      # its absence was the only symptom). The ordering here is load-bearing —
      # fetch and check out `eval-results`, restore the fresh run into
      # results/, and only THEN build the badge, so the window spans the real
      # run history. Note also that the `eval-results` branch carries no
      # scripts/ directory, so the branch switch takes make_badge.py out of the
      # working tree; it is stashed in $RUNNER_TEMP beforehand and invoked from
      # there. It is stdlib-only, so nothing else has to travel with it.
      - name: Build the badge over the run window, commit, and push
        working-directory: skills-evals
        env:
          # Push auth lives only in this step.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "skills-evals real-eval bot"
          git config user.email "skills-evals@users.noreply.github.com"
          # Stash the badge script before the branch switch drops scripts/.
          cp scripts/make_badge.py "$RUNNER_TEMP/"
          # Snapshot generated outputs (results/ is new/untracked here, and is
          # tracked on eval-results — without this the branch switch would
          # clobber or refuse the fresh run's output)
          snap="$RUNNER_TEMP/eval-outputs"
          rm -rf "$snap"; mkdir -p "$snap"
          [ -d results ] && cp -r results "$snap/results"
          # Build on the accumulated results branch (create on first run)
          git checkout -- .
          git fetch origin eval-results || true
          if git rev-parse -q --verify origin/eval-results >/dev/null; then
            git checkout -B eval-results origin/eval-results
          else
            git checkout -B eval-results
          fi
          [ -d "$snap/results" ] && { mkdir -p results; cp -r "$snap/results/." results/; }
          # The roster the refresh step computed, restored after the switch for
          # the same reason results/ is: it is tracked here and nowhere on main.
          # The refresh step is non-fatal, so there may be none — in which case
          # nothing is committed for it and the summary says why.
          if [ -f "$RUNNER_TEMP/roster/latest.json" ]; then
            mkdir -p roster
            cp "$RUNNER_TEMP/roster/latest.json" roster/latest.json
          else
            echo "No roster was published this run — see the roster step's warning." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
          python3 "$RUNNER_TEMP/make_badge.py" workflow-path-audit
          git add badges results
          # -f is load-bearing: .gitignore lists roster/ and usage/ so a stray
          # local copy cannot ride into a main-branch PR. They ARE tracked here
          # on eval-results, and a plain `git add` would silently skip them.
          if [ -d roster ]; then git add -f roster; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "eval: workflow-path-audit run + badge + roster [skip ci]"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=$auth" push origin eval-results

      # LAST step in the job so `if: failure()` sees a failure from ANY
      # earlier step — not just the eval run, but also the badge-build and
      # commit/push step (e.g. a rejected push). Surfaces
      # the per-arm error detail (summaries + reports, incl. gitignored raw
      # transcripts) as an artifact instead of losing it with the runner.
      - name: Upload results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: eval-results-debug
          path: skills-evals/results/
          if-no-files-found: ignore
          include-hidden-files: true
