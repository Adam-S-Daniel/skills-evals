  .ex .tablewrap.tall { max-height: none; overflow-y: visible; }

  .ex table.stack, .ex table.stack tbody, .ex table.stack tfoot, .ex table.stack tr, .ex table.stack td { display: block; width: 100%; }

  .ex table.stack tr { border-bottom: 3px solid var(--ink); padding: 6px 0; }
  .ex table.stack td, .ex table.stack td:first-child { border-bottom: 0; padding: 3px 0; text-align: left; white-space: normal; }

/* Motion, only for readers who have not asked for less. A new view comes in
   from the left, part by part (app.js marks the content `enter` on a new
   route, never on a keystroke or a data refresh); the section rules draw
   across; the scoreboard counts in; meters fill. Nothing that can hold a
   term button moves on hover: a transform there would re-anchor its popup. */
@media (prefers-reduced-motion: no-preference) {
  .ex a.group, .ex .tile, .ex .chip.term, .ex .seg button, .ex .subnav a, .ex .defbox-close, .ex input.search, .ex tbody tr > td { transition: background-color 130ms, color 130ms, border-color 130ms, box-shadow 130ms var(--ex-ease); }
  .ex .content.enter > * > * { animation: ex-rise 420ms var(--ex-ease) backwards; }
  .ex .content.enter > * > :nth-child(2) { animation-delay: 50ms; }
  .ex .content.enter > * > :nth-child(3) { animation-delay: 100ms; }
  .ex .content.enter > * > :nth-child(4) { animation-delay: 150ms; }
  .ex .content.enter > * > :nth-child(5) { animation-delay: 200ms; }
  .ex .content.enter > * > :nth-child(n+6) { animation-delay: 250ms; }
  .ex .content.enter h1 { animation: ex-wipe 560ms var(--ex-ease) backwards; }
  .ex .content.enter .tiles > * { animation: ex-drop 420ms var(--ex-ease) backwards; }
  .ex .content.enter .tiles > :nth-child(2) { animation-delay: 90ms; }
  .ex .content.enter .tiles > :nth-child(3) { animation-delay: 150ms; }
  .ex .content.enter .tiles > :nth-child(4) { animation-delay: 210ms; }
  .ex .content.enter .tiles > :nth-child(n+5) { animation-delay: 270ms; }
  .ex .content.enter .weekbars .wb { animation: ex-bar-rise 520ms var(--ex-ease) 260ms backwards; }
  .ex .content.enter .statebar .sbar { animation: ex-bar-fill 620ms var(--ex-ease) 260ms backwards; }
  .ex .content.enter .meter .fill { animation: ex-fill 900ms 200ms var(--ex-ease) backwards; }
  .ex .defbox { animation: ex-pop 140ms var(--ex-ease) backwards; }
}
@keyframes ex-rise { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: none; } }
@keyframes ex-drop { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
@keyframes ex-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 -1% 0 0); } }
@keyframes ex-fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes ex-pop { from { opacity: 0; transform: translate(-4px, -4px); } to { opacity: 1; transform: none; } }

  --axis: var(--cds-chart-axis, #737B8C);
  --grid: var(--cds-chart-grid, #D3D9E1);
  --base: var(--color-border-line, #B4BCC8);

    --base: var(--color-border-line, #343A4D); --ring: var(--color-border-line, #434A60); --s1: var(--cds-chart-1, #7090FF);
    --s2: var(--cds-chart-2, #FF5FB6); --s3: var(--cds-chart-3, #2ED3CC); --good: var(--color-ok, #72DC62); --good-ink: var(--color-ok, #8BE87C);

t it records the lesson in a section so it doesn't happen twice. This page shows whether each section earns its place.","To test a section, Claude gets an ordinary task with that section's trap hidden inside it and runs it with all the guidance and with all of it but that section. When a section is close to removal, it also runs with only that section and with no guidance at all. Fixed checks score each attempt.",`Two things matter here that don't for skills. Claude reads every section in every session, so each one has a cost — shown as roughly how many words it adds. And a section can look useful on its own but add nothing once the rest of the guidance is present; compare the "All the guidance" and "All but this section" bars to see that.`],glossaryHeading:"Words used on this page",glossary:[["Fixture","One small, fixed practice task used for testing. The same task is used every time so results can be compared."],["Arm",'One way of running the task, such as "with the skill" or "without it". Each test compares two or more arms.'],["Trial","A single attempt at the task. A run is made of several trials."],["Run","One test of one subject on one fixture and one model. It attempts the task several times in each arm and saves the results together. A comparison run is one in which both arms were scored together."],["Fire","One scheduled start of a run. Its results should come back to the results branch within 2 hours; a sweep is a group of fires with no results that started within an hour of each other, usually one outage."],["Subject","Whatever is being tested: a skill or a guidance section."],["Judge","A separate AI model that reads each attempt and gives it a score from 0 to 10. It never takes part in the task itself."],["Objective check",'A yes-or-no test that a computer can score without opinion, such as "did it create this file". The counts on this page are these checks.'],["Roster","The list of AI models the tests run on, and the judge that scores them, with the rea
