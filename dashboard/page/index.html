uates and revises it. Writing one is easy — knowing it actually helps is not.','So every skill gets an eval. Claude gets the same small task many times, sometimes with the skill and sometimes without it. Fixed checks score each attempt automatically, and a second AI model (the judge) also scores it from 0 to 10.','Read each number as "N of M checks passed." A higher share with the skill than without it means the skill helped. "Trials" counts every attempt behind the numbers, and "comparison runs" counts how many eval runs had both sides scored together — the more of either, the more the result can be trusted.'],introGuidance:['The guidance is a page of instructions Claude reads at the start of every working session on '+n.whose+" projects. It is split into sections, one topic each. Claude writes most of it too: when something goes wrong, the session that hit it records the lesson in a section so it doesn't happen twice. This page shows whether each section earns its place.","To evaluate a section, Claude gets an ordinary task with that section's trap hidden inside it and tries it with all the guidance and with all of it but that section. When a section is close to removal, it also runs with only that section and with no guidance at all. Fixed checks score each attempt.",`Two things matter here that don't for skills. Claude reads every section in every session, so each one has a cost — shown as roughly how many words it adds. And a section can look useful on its own but add nothing once the rest of the guidance is present; compare the "All the guidance" and "All but this section" bars to see that.`],glossaryHeading:'Words used on this page',glossary:[['Eval','One fixed task (the fixture) plus the checks that score it.'],['Fixture','The fixed task inside an eval: one small practice task, the same every time.'],['Arm','One way of running the task, such as "with the skill" or "without it". Each eval run compares two or more arms.'],['Trial','A single attempt at the task
