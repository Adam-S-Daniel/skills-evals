 actually helps is not.','So every skill gets tested. Claude gets the same small task many times, sometimes with the skill and sometimes without it. Fixed checks score each attempt automatically, and a second AI model (the judge) also scores it from 0 to 10.','Read each number as "checks passed out of checks in total." A higher share with the skill than without it means the skill helped. "Trials" counts every attempt behind the numbers, and "comparison runs" counts how many eval runs had both sides scored together — the more of either, the more the result can be trusted.'],introGuidance:['The guidance is a page of instructions Claude reads at the start of every working session on '+n.whose+" projects. It is split into sections, one topic each. Claude writes most of it too: when something goes wrong, the session that hit it records the lesson in a section so it doesn't happen twice. This page shows whether each section earns its place.","To test a section, Claude gets an ordinary task with that section's trap hidden inside it and runs it with all the guidance and with all of it but that section. When a section is close to removal, it also runs with only that section and with no guidance at all. Fixed checks score each attempt.",`Two things matter here that don't for skills. Claude reads every section in every session, so each one has a cost — shown as roughly how many words it adds. And a section can look useful on its own but add nothing once the rest of the guidance is present; compare the "All the guidance" and "All but this section" bars to see that.`],glossaryHeading:'Words used on this page',glossary:[['Fixture','One small, fixed practice task used for testing. The same task is used every time so results can be compared.'],['Arm','One way of running the task, such as "with the skill" or "without it". Each test compares two or more arms.'],['Trial','A single attempt at the task. An eval run is made of several trials.'],['Eval run','One test of one subject on one fixture and one model. It attempts the task several times in each arm and saves the results together. A comparison run is an eval run in which both arms were scored together.'],['Fire','One scheduled start of an eval run. Its results should come back to the results branch within 2 hours; a sweep is a group of fires with no results that started within an hour of each other, usually one outage.'],['Subject','Whatever is being tested: a skill or a guidance section.'],['Judge','A separate AI model that reads each attempt and gives it a score from 0 to 10. It never takes part in the task itself.'],['Objective check','A yes-or-no test that a computer can score without opinion, such as "did it create this file". The counts on this page are these checks.'],['Roster','The list of AI models the tests run on, and the judge that scores them, with the reason each one was chosen.'],['Improvement loop',"The automated system that runs these tests on a schedule, proposes edits, keeps the changes that measurably help, and removes what doesn't. "+n.Who+' set'+n.s+' its thresholds and budget; day to day, it runs without '+n.obj+'.'],['Trending toward removal','Recent eval runs score below the eval runs before them, or the subject stopped beating the arm without it. This is expected: the loop detects it, and if the trend holds it removes the subject automatically.']],glossaryGuidance:[['Section','One topic within the guidance, under its own heading.'],['Ablation','Running with all the guidance except one section, to see whether that section still makes a difference when the rest is there.'],['Cost per session','How much reading a section adds to every working session, given here in rough words. Shorter is cheaper, so a section should earn its length.']],chipGlossaryIntro:'The colored status label means:',chips:{helps:'Helps',alone:'Helps only on its own',none:'No measurable difference',worse:'Trending toward removal',early:'Early sign: helps',canttell:'Test cannot tell',insufficient:'N
