<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evals Explorer</title>
<style>
:root {
  color-scheme: light;
  /* adamdaniel.ai's tool palette, matched to the Claude Memory Map page:
     warm paper, soft ink, muted earth accents. */
  --page: #FDFBF7;
  --surface: #FFFFFF;
  --ink: #3D3A34;
  --ink-2: #5A564E;
  --muted: #6B675E;
  --axis: #8A8478;
  --grid: #EDE8DD;
  --base: #E4DFD4;
  --ring: #E4DFD4;
  --s1: #4A6B8F;
  --s2: #B06A4F;
  --s3: #54805C;
  --good: #54805C;
  --good-ink: #3F6646;
  --warning: #9A6F33;
  --critical: #B06A4F;
  --link: #4A6B8F;
  --chip-bg: #F3EFE6;
  --hover: #F7F4EC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #1E1C19;
    --surface: #272420;
    --ink: #EDE8DD;
    --ink-2: #CFC8BA;
    --muted: #A9A294;
    --axis: #8A8478;
    --grid: #36322C;
    --base: #45403A;
    --ring: #3A362F;
    --s1: #7F9FC2;
    --s2: #D08B70;
    --s3: #7FAA86;
    --good: #7FAA86;
    --good-ink: #9CC4A2;
    --warning: #C99B5C;
    --critical: #D08B70;
    --link: #9DB8D6;
    --chip-bg: #322E28;
    --hover: #2E2A25;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #1E1C19;
  --surface: #272420;
  --ink: #EDE8DD;
  --ink-2: #CFC8BA;
  --muted: #A9A294;
  --axis: #8A8478;
  --grid: #36322C;
  --base: #45403A;
  --ring: #3A362F;
  --s1: #7F9FC2;
  --s2: #D08B70;
  --s3: #7FAA86;
  --good: #7FAA86;
  --good-ink: #9CC4A2;
  --warning: #C99B5C;
  --critical: #D08B70;
  --link: #9DB8D6;
  --chip-bg: #322E28;
  --hover: #2E2A25;
}
/* The page color fills the whole window, outside the column and below short pages. */
html { -webkit-text-size-adjust: 100%; background: var(--page); min-height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); min-height: 100vh; }
/* Shared by both builds, scoped under .ex so the dashboard host's own styles
   and these never meet. Each template sets the palette variables. */
.ex, .ex * { box-sizing: border-box; }
.ex { color: var(--ink); font: var(--ex-font, 15px/1.5 Helvetica, Arial, sans-serif); max-width: 1120px; margin: 0 auto; padding: 0 16px 48px; overflow-wrap: anywhere; }
.ex h1 { font-family: var(--ex-serif, Georgia, "Times New Roman", serif); font-weight: normal; font-size: 1.75rem; line-height: 1.25; margin: 16px 0 4px; }
.ex h2 { font-size: 0.8rem; font-weight: normal; letter-spacing: 1.6px; text-transform: uppercase; margin: 32px 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--base); }
.ex h3 { font-family: var(--ex-serif, Georgia, "Times New Roman", serif); font-weight: normal; font-size: 1.15rem; margin: 14px 0 4px; overflow-wrap: anywhere; }
.ex p { margin: 0 0 12px; }
.ex a { color: var(--link); }
.ex .asof, .ex .note, .ex .src { color: var(--ink-2); font-size: 0.9rem; }
.ex .src { font-size: 0.8rem; color: var(--muted); margin: -4px 0 8px; }
.ex .muted { color: var(--muted); }
.ex .warn { color: var(--warning); font-weight: 600; }
.ex .lead { max-width: 70ch; }
.ex .n { cursor: help; text-decoration: underline dotted var(--axis); text-underline-offset: 3px; }

/* The top bar: one row of groups and a search box; at phone width one menu button. */
.ex .topbar { position: sticky; top: 0; z-index: 5; background: var(--page); border-bottom: 1px solid var(--base); margin: 0 -16px; padding: 0 16px; }
.ex .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; min-height: 52px; }
.ex .brand { font-family: var(--ex-serif, Georgia, "Times New Roman", serif); font-size: 1.1rem; color: var(--ink); text-decoration: none; padding: 8px 0; }
.ex .menu { display: none; font: inherit; font-size: 0.9rem; margin-left: auto; padding: 6px 12px; min-height: 36px; border: 1px solid var(--base); border-radius: 9px; background: var(--surface); color: var(--ink); cursor: pointer; }
.ex .drawer { display: flex; flex: 1 1 auto; flex-wrap: wrap; align-items: center; gap: 4px 12px; min-width: 0; }
.ex nav.groups { display: flex; flex-wrap: wrap; gap: 2px; flex: 1 1 auto; }
.ex a.group { color: var(--ink-2); text-decoration: none; padding: 14px 10px 12px; border-bottom: 2px solid transparent; font-size: 0.92rem; }
.ex a.group:hover { color: var(--ink); }
.ex a.group[aria-current="page"] { color: var(--ink); border-bottom-color: var(--s1); font-weight: 600; }
.ex input.search { font: inherit; font-size: 0.9rem; padding: 6px 10px; min-height: 36px; width: 16rem; max-width: 100%; border: 1px solid var(--base); border-radius: 9px; background: var(--surface); color: var(--ink); }
@media (max-width: 760px) {
  .ex .menu { display: inline-block; }
  .ex .drawer { display: none; flex-basis: 100%; flex-direction: column; align-items: stretch; padding: 0 0 12px; }
  .ex .topbar.open .drawer { display: flex; }
  .ex nav.groups { flex-direction: column; }
  .ex a.group { padding: 10px 4px; border-bottom: 0; border-left: 3px solid transparent; padding-left: 10px; }
  .ex a.group[aria-current="page"] { border-left-color: var(--s1); }
  .ex input.search { width: 100%; }
}
.ex .subnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.ex .subnav a { text-decoration: none; color: var(--ink-2); padding: 4px 12px; border: 1px solid var(--base); border-radius: 999px; font-size: 0.88rem; }
.ex .subnav a[aria-current="page"] { background: var(--s1); color: var(--page); border-color: var(--s1); font-weight: 600; }
.ex .group-title { margin-top: 18px; }
.ex .back { display: inline-block; margin: 12px 0 0; font-size: 0.9rem; }

.ex .toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 12px 0 4px; }
.ex .seg { display: inline-flex; border: 1px solid var(--base); border-radius: 9px; overflow: hidden; max-width: 100%; flex-wrap: wrap; }
.ex .seg button { font: inherit; font-size: 0.9rem; padding: 6px 12px; border: 0; background: var(--surface); color: var(--ink); cursor: pointer; min-height: 36px; }
.ex .seg button + button { border-left: 1px solid var(--base); }
.ex .seg button:hover { background: var(--hover); }
.ex .seg button[aria-pressed="true"] { background: var(--s1); color: var(--page); font-weight: 600; }
.ex .seg button:focus-visible, .ex a:focus-visible, .ex th:focus-visible, .ex .tile:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.ex .panel, .ex .block.banner { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; margin: 12px 0; }
.ex .block.banner h2 { margin-top: 0; }
.ex .big { font-size: 1.1rem; font-weight: 600; }
.ex dl.gloss { display: grid; grid-template-columns: minmax(8em, max-content) 1fr; gap: 6px 16px; margin: 8px 0 0; }
.ex dl.gloss dt { font-weight: 600; }
.ex dl.gloss dd { margin: 0; color: var(--ink-2); }
@media (max-width: 560px) { .ex dl.gloss { grid-template-columns: 1fr; } .ex dl.gloss dd { margin-bottom: 8px; } }
.ex summary { cursor: pointer; font-weight: 600; min-height: 32px; }

/* Tiles */
.ex .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 12px; margin: 12px 0; }
.ex .tile { display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px; color: var(--ink); text-decoration: none; min-width: 0; }
.ex a.tile:hover { border-color: var(--axis); }
.ex .tile-label { font-size: 0.8rem; color: var(--ink-2); }
.ex .tile-num { font-family: var(--ex-serif, Georgia, "Times New Roman", serif); font-size: 1.7rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
.ex .tile-num[data-tip] { cursor: help; }
.ex .tile-num.small { font-size: 1.2rem; }
.ex .tile-note { font-size: 0.8rem; color: var(--muted); }
.ex .tile:first-child { border-color: var(--s1); }
.ex .headline-num { font-size: 1.1rem; font-weight: 600; }

/* Cards */
.ex .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 12px; }
.ex .card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px; min-width: 0; }
.ex .card .head { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; margin-bottom: 4px; }
.ex .card .gl { color: var(--ink-2); font-size: 0.92rem; margin: 2px 0 8px; }
.ex .card .sent { font-size: 0.95rem; margin-top: 10px; }
.ex .card .meta { color: var(--muted); font-size: 0.82rem; margin: 6px 0 0; }
.ex .card h3 a, .ex a.nav-link { text-decoration: none; }
.ex .card h3 a:hover, .ex a.nav-link:hover { text-decoration: underline; }
.ex .model { font-size: 0.85rem; font-weight: 600; margin: 8px 0 0; color: var(--ink-2); }
.ex .chip { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; font-size: 0.78rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip-bg); color: var(--ink); border: 1px solid var(--ring); cursor: help; }
.ex .chip .ic { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--axis); }
.ex .chip.helps .ic { background: var(--good); }
.ex .chip.worse .ic { background: var(--critical); }
.ex .chip.alone .ic { background: var(--warning); }
.ex .chip.none .ic { background: var(--axis); }
.ex .chip.insufficient .ic { background: transparent; border: 2px solid var(--axis); }
.ex .chip.canttell .ic { background: transparent; border: 2px dashed var(--axis); }
.ex .chip.early .ic { background: transparent; border: 2px solid var(--good); }
.ex .badge { display: inline-block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.4px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--s1); color: var(--s1); vertical-align: middle; white-space: nowrap; }
.ex .st { display: inline-block; font-size: 0.78rem; padding: 1px 8px; border-radius: 999px; background: var(--chip-bg); border: 1px solid var(--ring); white-space: nowrap; }
.ex .st.good { border-color: var(--good); color: var(--good-ink); }
.ex .st.bad { border-color: var(--critical); color: var(--critical); }
.ex .st.warn { border-color: var(--warning); color: var(--warning); }
.ex .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--ink-2); margin: 6px 0 0; }
.ex .legend span { display: inline-flex; align-items: center; gap: 6px; }
.ex .sw { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
.ex svg { display: block; width: 100%; height: auto; overflow: visible; }
.ex svg text { font-family: Helvetica, Arial, sans-serif; }
.ex .chart { max-width: 396px; }
.ex .chart.weeks { max-width: 640px; }
.ex .spark { max-width: 320px; margin-top: 10px; }
.ex .mark:hover, .ex .mark:focus { opacity: 0.8; outline: none; }
.ex .trend-cap { font-size: 0.8rem; color: var(--muted); margin: 8px 0 0; }
.ex .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px; }
.ex ul.plain { margin: 6px 0 0; padding-left: 1.2em; }
.ex ul.plain li { margin: 2px 0; overflow-wrap: anywhere; }
.ex ol.stages { margin: 6px 0 12px; padding-left: 1.4em; }
.ex ol.stages li { margin: 4px 0; }
.ex .reason { color: var(--ink-2); font-size: 0.9rem; }
.ex .failure { border-left: 4px solid var(--critical); }
.ex .summary-line { font-size: 1rem; }
.ex .subject-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 8px 0; }
.ex .subject-head .title { font-family: var(--ex-serif, Georgia, "Times New Roman", serif); text-transform: none; letter-spacing: 0; font-size: 1.6rem; border: 0; margin: 0; padding: 0; }
.ex .meter { position: relative; height: 10px; border-radius: 5px; background: var(--grid); margin: 4px 0 10px; max-width: 480px; }
.ex .meter .fill { height: 100%; border-radius: 5px; background: var(--s1); }
.ex .meter .fill.over { background: var(--critical); }
.ex .meter-mark { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--ink); }

/* Tables */
.ex .tablewrap { overflow-x: auto; max-width: 100%; }
.ex .tablewrap.tall { max-height: 520px; overflow-y: auto; }
.ex table { border-collapse: collapse; font-size: 0.82rem; width: 100%; }
.ex th, .ex td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; overflow-wrap: break-word; }
.ex th { position: sticky; top: 0; background: var(--surface); cursor: pointer; font-weight: 600; white-space: nowrap; }
.ex th[aria-sort="ascending"]::after { content: " \25B4"; }
.ex th[aria-sort="descending"]::after { content: " \25BE"; }
.ex td.num, .ex th.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.ex .block { min-width: 0; }
.ex table.console { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.78rem; }
.ex .problems-only tr[data-ok] { display: none; }
.ex label.check, .ex label.filter { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; margin: 0 12px 8px 0; }
.ex .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 8px 0; }
.ex select { font: inherit; font-size: 0.88rem; padding: 4px 6px; border: 1px solid var(--base); border-radius: 6px; background: var(--surface); color: var(--ink); max-width: 100%; }
.ex .linkish { font: inherit; font-size: 0.88rem; border: 0; background: none; color: var(--link); text-decoration: underline; cursor: pointer; padding: 4px; }
.ex-tip { font-family: var(--ex-font-family, Helvetica, Arial, sans-serif); position: fixed; z-index: 10; pointer-events: none; max-width: 260px; background: var(--surface); color: var(--ink); border: 1px solid var(--base); border-radius: 8px; padding: 6px 8px; font-size: 0.82rem; box-shadow: 0 2px 8px rgba(61,58,52,0.15); }
.ex-tip[hidden] { display: none; }
.ex .headline .answer { font-size: 1.1rem; font-weight: 600; }
@media (forced-colors: active) { .ex .chip .ic { forced-color-adjust: none; } }
.ex .conf { margin: 12px 0 0; }
.ex .conf-h { font-size: 0.85rem; font-weight: 600; color: var(--ink-2); margin: 0 0 6px; }
.ex .chart.range { max-width: 420px; margin-top: 4px; }
.ex .badge.hv.earning { border-color: var(--good); color: var(--good-ink); }
.ex .badge.hv.overridden-often { border-color: var(--critical); color: var(--critical); }
.ex .badge.hv.never-fires, .ex .badge.hv.none { border-color: var(--axis); color: var(--ink-2); }
</style>
</head>
<body>
<main id="app" class="ex">
  <h1>Evals Explorer</h1>
  <p id="loading">Loading the latest results.</p>
</main>
<div class="ex-tip" id="tip" role="tooltip" hidden></div>
<noscript>
  <div style="max-width:640px;margin:16px auto;padding:16px">
    This page needs JavaScript to read the latest test results and draw its charts.
    Please turn JavaScript on, or read the raw results file at
    https://raw.githubusercontent.com/Adam-S-Daniel/skills-evals/persistent/eval-results/explorer/latest.json
  </div>
</noscript>
<script>
'use strict';
(() => {
  // src/core/rules.js
  var SCHEMA_VERSION = 1;
  var WINDOW_WEEKS = 26;
  var MIN_PAIRED_RUNS = 5;
  var HELPS_MIN_GAIN = 0.05;
  var WORSE_TOLERANCE = -0.05;
  var EPS = 1e-9;
  var WEEK_MS = 7 * 24 * 3600 * 1e3;
  var TIME_ZONE = "America/New_York";
  var pts = (x) => Math.round(Math.abs(x) * 100);
  var KEEP_AT = 0.8;
  var REMOVE_AT = 0.9;
  var ordinal = (n) => {
    const t = n % 100, u = n % 10;
    return n + (t >= 11 && t <= 13 ? "th" : u === 1 ? "st" : u === 2 ? "nd" : u === 3 ? "rd" : "th");
  };
  var countWord = (n) => ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten"][n] || String(n);

  // src/config.js
  var DATA_REPO = "Adam-S-Daniel/skills-evals";

  // src/core/glosses.js
  function buildGlosses(you) {
    const whose = you ? "your" : "the owner's", Whose = you ? "Your" : "The owner's";
    return {
      "working-in-these-repos": "For any project: leave paused work alone, fix only what was asked, test every change, and use American spelling.",
      "anything-you-name-gets-its-link": "Whenever Claude mentions something you might want to open, it gives the link right there, so you never have to go looking.",
      "finding-your-unknowns": "Say what is unclear before starting, flag surprises while working, and write lasting lessons down where the next person will find them.",
      "turn-lessons-into-checks": "When a mistake or a hard-won procedure could happen again, Claude records it as an automatic check, a skill or a guidance note before finishing.",
      "workstation-layout": "Where project folders live on " + whose + " computers, so Claude looks in the right place.",
      "security": "Treat anything from outside as untrusted, never mix it straight into commands, and never save passwords or keys in a project.",
      "data-exposure-in-ci": "Logs from automated checks on public projects are visible to anyone, so personal details must never be printed there.",
      "read-before-you-start": "A short list of reference pages to read before touching certain settings.",
      "automation-vs-branch-protection": "The main copy of each project only accepts reviewed changes, so automated helpers must propose changes rather than write to it directly.",
      "two-github-connectors": "Claude can reach GitHub through two different connections with different powers, and must know which one it is using.",
      "agent-contribution-markers": "Anything Claude posts on GitHub under " + whose + " name ends with a note saying an AI wrote it.",
      "pr-tldr": "Every pull request description starts with a short plain-English summary of what changes and why.",
      "github-404-means-not-authorized": 'When GitHub says "not found", it may only mean "you are not allowed to see this", so do not report something as gone on that alone.',
      "fleet-spans-two-owners": Whose + " projects sit under two different accounts, so a search of only one gives an answer that looks complete but is wrong.",
      "watch-finished-is-not-ci-passed": "A command that waits for the automatic checks finishing does not mean the checks passed; read the actual results.",
      "git-push-does-not-mean-commit-exists": "Uploading changes can report success even when the new change was never saved, so confirm the change is really there.",
      "dependency-updates": "Wait about a week before adopting a new version of an outside package, and record exact versions.",
      "name-becomes-scanner-data": 'Names that contain words like "secret" or "token" can set off the leak scanner, so choose names that describe the purpose instead.',
      "pinning-github-actions": "Each outside building block the automation uses is locked to one exact, reviewed version, so it cannot change underneath us.",
      "test-that-can-signal-kills-every-session": "A test once stopped every program on a computer by mistake; code that stops programs must double-check what it is about to stop.",
      "subagent-delegation": "How Claude hands work to helper assistants, chooses cheaper models when that is safe, and checks their work before trusting it.",
      "skills-ecosystem": "Where " + whose + " skills come from, how they are installed, and how a project chooses which ones to load.",
      "two-setup-gaps": "Two one-time setup steps Claude may help with, mentioned once at most and never repeated as nagging.",
      "git-practices": "How to save and combine changes: short, clear notes explaining why, one change at a time, and never rewriting shared history.",
      "section-docker": "For building software containers: fixed versions, no administrator access, and no passwords inside.",
      "section-dotnet": "For C# code: switch on the strictest warnings and keep to the version the project already uses.",
      "section-go": "For Go code: let slow work be cancelled, run the standard checkers, and keep building blocks small.",
      "section-javascript": "For JavaScript code: never hide errors, and stay consistent with the project's existing style.",
      "section-python": "For Python code: describe what each function takes and returns, handle files carefully, and lock package versions.",
      "section-rust": "For Rust code: explain every risky shortcut and keep crash-on-error shortcuts out of shared code.",
      "section-typescript": "For TypeScript code: no catch-all types, and respect the project's strict settings."
    };
  }
  var GLOSSES = {};
  function useGlossVoice(v) {
    for (const k of Object.keys(GLOSSES)) delete GLOSSES[k];
    Object.assign(GLOSSES, buildGlosses(v === "you"));
  }
  useGlossVoice("owner");
  var GLOSS_MISSING = "A plain-language description of this section has not been written yet.";
  var HOOK_GLOSSES = {
    "dated-phrasing": "Warns, and never refuses, when Markdown that agents load as instructions holds dated history or phrasing relative to a migration.",
    "persistent-delete": "Refuses a push that deletes a persistent/* branch, which outlives its pull requests and holds data such as results and usage records.",
    "pr-tldr": "In CI, fails a pull request whose description does not open with a TLDR heading and text under it.",
    "push-to-default": "Refuses a push straight to a default branch, which takes changes only through pull requests.",
    "rules-dir": "Refuses path-scoped rules files (.claude/rules/), which only one tool reads; the rule belongs in AGENTS.md, a skill or a check.",
    "secret-file": "Refuses a file that looks like a secret or credential file, because git history in a public repo is public.",
    "skill-shell": "Refuses a skill line that would run a shell command the moment the skill loads, before anyone reads it.",
    "staged-index": "Refuses a push while staged changes sit in no commit, so a commit a hook refused cannot slip out with the one before it.",
    "repo-local": "Runs a repo's own checks (.agent-checks/local.sh) and refuses when they do."
  };

  // src/core/strings.js
  var ISSUES_URL = "https://github.com/" + DATA_REPO + "/issues";
  function buildStrings(you) {
    const W = you ? { who: "you", Who: "You", whose: "your", Whose: "Your", s: "", obj: "you", own: "your own", dont: "don't" } : { who: "the owner", Who: "The owner", whose: "the owner's", Whose: "The owner's", s: "s", obj: "the owner", own: "their own", dont: "doesn't" };
    return {
      title: you ? "Self-improvement project" : "Evals Explorer",
      voice: you ? "you" : "owner",
      loading: "Loading the latest results…",
      dataAsOf: (when) => "Data as of " + when + ".",
      newestRun: (when) => "Newest test run: " + when + ".",
      noRunsYet: "No test runs have been recorded yet.",
      modeLabel: "Show results for",
      modeSkills: "Skills",
      modeGuidance: "Guidance",
      hidden: "[hidden]",
