# Class C: the judge decides the quality of the unknowns pass. The objective
# checks certify only three path citations and that Python source files stayed put.
# References are outside seed/ so the agent cannot read the yardsticks.
skill: finding-unknowns
registry: https://github.com/Adam-S-Daniel/adam-agentskills

judge:
  mode: pairwise
  references:
    - name: strong
      path: references/strong.md
    - name: shallow
      path: references/shallow.md

prompt: Before you start on TASK.md, work out what you don't know and resolve what you can.

objective_checks:
  # These lexical checks establish path citations, not proof that a file was
  # read or interpreted correctly. The rubric carries that semantic judgment.
  # A path may be absolute or nested under another directory (the lookbehind
  # excludes only name characters and a dot, so `/tmp/ws/export/table.py` and
  # `a/export/table.py` count), but `my_export/table.py` and `export/table.pyc`
  # do not.
  - id: cites-export-module
    description: The reply names the existing export module
    type: transcript_matches
    must_match:
      - '(?<![A-Za-z0-9_.-])(?:\./)?export/table\.py(?![A-Za-z0-9_/-]|\.[A-Za-z0-9_-])'
  - id: cites-acceptance-test
    description: The reply names the acceptance test
    type: transcript_matches
    must_match:
      - '(?<![A-Za-z0-9_.-])(?:\./)?test/test_export\.py(?![A-Za-z0-9_/-]|\.[A-Za-z0-9_-])'
  - id: cites-design-decision
    description: The reply names the architecture decision
    type: transcript_matches
    must_match:
      - '(?<![A-Za-z0-9_.-])(?:\./)?docs/adr/0001-bounded-exports\.md(?![A-Za-z0-9_/-]|\.[A-Za-z0-9_-])'
  - id: source-unchanged
    description: The unknowns pass leaves existing Python source unchanged and creates no Python source files
    type: files_unchanged
    # Only *.py is guarded (one directory level below each root as well). A
    # blanket "src/*" would count the __pycache__ directories that running the
    # seed's failing test creates, failing a correct, restrained run.
    paths: ["src/*.py", "src/*/*.py", "export/*.py", "export/*/*.py"]

judge_rubric: >
  Rank all three drafts best to worst for the pre-implementation unknowns pass
  requested by the prompt. Score each draft 0-10 on the required dimensions
  "specificity", "register match", and "absence of corporate filler", with a
  one-sentence rationale per dimension. Prioritize factual accuracy, useful
  operator questions, and restraint over length or polished wording. The draft
  should use export/table.py as an existing streaming CSV pattern to
  examine, recognize that test/test_export.py already encodes a failing empty
  export header requirement, and apply docs/adr/0001-bounded-exports.md to
  rule out a whole-dataset in-memory build or synchronous dump. A path mention
  alone earns no factual credit. It should separate those repo-resolvable
  points from questions only the operator can answer: which export format the
  customer needs and whether the old endpoint must remain compatible. Strong
  questions state concrete options and why the answer changes implementation;
  a useful blind-spot question probes another decision that could change the
  design, such as dataset size or cancellation behavior. The draft may offer
  conditional approaches, but must not assume the unanswered choices. Do not
  require post-build notes or an explainer because no build was requested.
  Do not reward an implementation claim, unsupported claims that the
  test is green, or a list of generic questions without findings.

  Anchor specificity at 0-3 for absent or materially wrong repo findings,
  4-6 for a partial accurate reading with vague or missing operator questions,
  7-8 for all three accurate findings and both answerable operator questions
  with a remaining blind spot, and 9-10 for that evidence plus clear
  decision-linked alternatives and a precise next step. An invented meaning
  for the test or ADR caps specificity at 3 even if every path is cited.
  Anchor register match at 0-3 for a presumptive build plan or a reply that
  speaks as if the operator already decided, 4-6 for an understandable but
  loosely separated inventory, 7-8 for concise resolved-versus-open grouping,
  and 9-10 for a calm, direct explanation that tells the operator exactly
  what answers unblock which choice. Anchor absence of corporate filler at
  0-3 for repeated vague management language or empty skill jargon, 4-6 for
  substantial filler around some useful content, 7-8 for mostly concrete
  language, and 9-10 for economical, plain language throughout. A shorter
  accurate reply can outrank a longer one. Actual source edits are scored by
  the separate objective check; the blind judge cannot see workspace state.
