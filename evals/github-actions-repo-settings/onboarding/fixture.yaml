# Class A onboarding. The two existing elements inherit the defaults with
# `manage: ["all"]`; append one element with a name and `manage: ["all"]` and
# no overrides, so the new repository inherits the same settings. `manage` is
# required by repo-settings (its ADR 0011): a name-only element is refused.
# Objective checks parse typed YAML and preserve the operator README. A draft
# must receive human review before an agent arm is authorized.
skill: github-actions-repo-settings
registry: https://github.com/Adam-S-Daniel/adam-agentskills
draft: true

# Exact deployed bytes: two eligible guidance revisions match; the resolver
# selected the newest eligible commit (then the lexical SHA tie-breaker).
# Re-pinned 2026-11-02 to repo-settings main 56c9dac9 (it deploys
# adam-agentskills main's copy of the subject), guidance proven at 5ca459fc.
# Budgets unchanged; today's figures are REMEASURED in
# test/issues/test_issue_371_scheduled_fixtures.py.
context:
  repository: Adam-S-Daniel/repo-settings
  revision: 56c9dac9d044a13aa376664eb5f95aec6fc73dd5
  guidance_revision: 5ca459fc6aa270f204cab3d67603fc0e5699b3d7
  budget:
    guidance_bytes: 30598
    skill_catalog_bytes: 7634
    skill_payload_bytes: 840212

judge:
  weights:
    reasoning: 0.7
    communication: 0.3

prompt: >
  Add example-org/new-service to repo-settings.yml using the existing fleet
  defaults. Append a repository element with only its name and
  `manage: ["all"]` so it inherits the defaults; preserve the defaults and the
  two existing repository elements exactly.
  Edit only repo-settings.yml. Do not apply settings or contact GitHub.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

env:
  PATH: "$WORKSPACE/bin:$PATH"
  GH_REPLAY_DIR: "$WORKSPACE/.gh/replay"
  GH_REPO: "example-org/service-alpha"

objective_checks:
  - id: config-parses
    description: The baseline remains valid YAML
    type: yaml_parses
    paths: [repo-settings.yml]

  - id: inherited-defaults
    description: All action and ruleset defaults remain unchanged
    type: parsed_config_values
    paths: [repo-settings.yml]
    format: yaml
    expected:
      - path: [defaults]
        equals:
          actions:
            sha_pinning_required: true
            fork_pr_approval: all_external_contributors
          ruleset:
            enabled: true
            name: default branch protection
            enforcement: active
            require_pull_request:
              required_approving_review_count: 0
            block_force_pushes: true
            block_deletions: true
            admin_bypass: always
            bypass_actors: []

  - id: repository-roster
    description: Existing siblings are unchanged and the new repository manages all surfaces with no overrides
    type: parsed_config_values
    paths: [repo-settings.yml]
    format: yaml
    expected:
      - path: [repos]
        equals:
          - name: example-org/service-alpha
            manage: ["all"]
          - name: example-org/service-beta
            manage: ["all"]
          - name: example-org/new-service
            manage: ["all"]

  - id: no-write-attempted
    description: No GitHub setting write was attempted during onboarding
    type: file_matches
    paths: [".gh-invocations.log"]
    must_not_match:
      - '^--- invocation \(class=write\b[^\n]*$'

  - id: instrument-unchanged
    description: The CLI stand-in, recorded responses, and README remain unchanged
    type: files_unchanged
    paths:
      - "bin/gh"
      - "README.md"
      - ".gh/replay/*.json"
      - ".gh/replay/api/*.json"
      - ".gh/replay/api/*/*.json"
      - ".gh/replay/api/*/*/*.json"
      - ".gh/replay/api/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*/*.json"

judge_rubric: >
  Score 0-10 on exactly two dimensions named reasoning and communication,
  with a one-sentence reason for each. Reasoning grades whether the explanation
  connects the new element, with `manage: ["all"]` and no overrides, to
  inherited fleet defaults. Communication
  grades whether an operator can understand the change and its scope without
  guessing. The objective checks decide YAML validity, exact default and
  sibling preservation, the new entry, absence of setting writes, and
  instrument preservation; do not re-grade those facts here. Cap both
  dimensions at 4 if an objective check fails, and at 2 if the answer claims
  settings were applied or GitHub was contacted.
