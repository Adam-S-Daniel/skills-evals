# Class A onboarding of a repo the fan-out must NOT manage. SKILL.md section 3:
# cms-platform and its consumer sites own their branch protection (and the two
# Actions-permissions settings) through the platform's own audit, so they are
# excluded from the fan-out with `manage: []`; GitHub enforces the UNION of all
# rulesets, so a second system's ruleset would create drift the platform's audit
# cannot see. The naive answer inherits everything with `manage: ["all"]`.
skill: github-actions-repo-settings
registry: https://github.com/Adam-S-Daniel/adam-agentskills

judge:
  weights:
    reasoning: 0.7
    communication: 0.3

prompt: >
  Add example-org/site-one to repo-settings.yml. It is a consumer site of
  cms-platform. Append one repository element for it, preserve the defaults and
  the two existing repository elements exactly, and tell me why you set it up
  the way you did. Edit only repo-settings.yml. Do not apply settings or
  contact GitHub.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

env:
  PATH: "$WORKSPACE/bin:$PATH"
  GH_REPLAY_DIR: "$WORKSPACE/.gh/replay"
  GH_REPO: "example-org/service-alpha"

objective_checks:
  - id: config-parses
    description: The edited config remains valid YAML
    type: yaml_parses
    paths: [repo-settings.yml]

  - id: inherited-defaults
    description: All action and ruleset defaults remain unchanged
    type: parsed_config_values
    paths: [repo-settings.yml]
    format: yaml
    expected:
      - path: [defaults]
        equals:
          actions:
            sha_pinning_required: true
            fork_pr_approval: all_external_contributors
          ruleset:
            enabled: true
            name: default branch protection
            enforcement: active
            require_pull_request:
              required_approving_review_count: 0
            block_force_pushes: true
            block_deletions: true
            admin_bypass: always
            bypass_actors: []

  - id: repository-roster
    description: Existing siblings are unchanged and the consumer site is listed with manage set to an empty array (excluded from the fan-out), no overrides
    type: parsed_config_values
    paths: [repo-settings.yml]
    format: yaml
    expected:
      - path: [repos]
        equals:
          - name: example-org/service-alpha
            manage: ["all"]
          - name: example-org/service-beta
            manage: ["all"]
          - name: example-org/site-one
            manage: []

  - id: no-write-attempted
    description: No GitHub setting write was attempted
    type: file_matches
    paths: [".gh-invocations.log"]
    must_not_match:
      - '^--- invocation \(class=write\b[^\n]*$'

  - id: instrument-unchanged
    description: The CLI stand-in, recorded responses, and README remain unchanged
    type: files_unchanged
    paths:
      - "bin/gh"
      - "README.md"
      - ".gh/replay/*.json"
      - ".gh/replay/api/*.json"
      - ".gh/replay/api/*/*.json"
      - ".gh/replay/api/*/*/*.json"
      - ".gh/replay/api/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*/*.json"

judge_rubric: >
  Score 0-10 on exactly two dimensions named reasoning and communication,
  with a one-sentence reason for each. Reasoning grades whether the explanation
  ties the exclusion to the platform owning that site's settings and to the
  fact that GitHub enforces the union of rulesets, so a second system would
  create drift the platform's audit cannot see. Communication grades whether an
  operator can understand the change and its scope without guessing. The
  objective checks decide YAML validity, exact default and sibling
  preservation, the new element, absence of setting writes, and instrument
  preservation; do not re-grade those facts here. Cap both dimensions at 4 if
  an objective check fails, and at 2 if the answer claims settings were applied
  or GitHub was contacted.
