# Class A onboarding with a partial scope. SKILL.md section 2: a scratch or
# experimental repo gets Actions hardening only, no ruleset. `manage` lists the
# surfaces to manage (the skill gives `["labels"]` as an example), and the
# engine refuses surfaces out of alphabetical order, `manage: false`, and an
# omitted `manage`. The naive answers are `["all"]` (which adds the ruleset),
# `["labels", "actions"]` (refused), or an overrides block that only disables
# the ruleset.
skill: github-actions-repo-settings
registry: https://github.com/Adam-S-Daniel/adam-agentskills

judge:
  weights:
    reasoning: 0.7
    communication: 0.3

prompt: >
  Add example-org/scratch-notes to repo-settings.yml. It is a scratch repo for
  experiments: it should get the Actions settings hardening and the labels
  surface, and nothing else, in particular no default branch ruleset. Append one
  repository element for it, preserve the defaults and the two existing
  repository elements exactly, and explain your choice of scope. Edit only
  repo-settings.yml. Do not apply settings or contact GitHub.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

env:
  PATH: "$WORKSPACE/bin:$PATH"
  GH_REPLAY_DIR: "$WORKSPACE/.gh/replay"
  GH_REPO: "example-org/service-alpha"

objective_checks:
  - id: config-parses
    description: The edited config remains valid YAML
    type: yaml_parses
    paths: [repo-settings.yml]

  - id: inherited-defaults
    description: All action and ruleset defaults remain unchanged
    type: parsed_config_values
    paths: [repo-settings.yml]
    format: yaml
    expected:
      - path: [defaults]
        equals:
          actions:
            sha_pinning_required: true
            fork_pr_approval: all_external_contributors
          ruleset:
            enabled: true
            name: default branch protection
            enforcement: active
            require_pull_request:
              required_approving_review_count: 0
            block_force_pushes: true
            block_deletions: true
            admin_bypass: always
            bypass_actors: []

  - id: repository-roster
    description: Existing siblings are unchanged and the scratch repo manages exactly actions and labels, in canonical alphabetical order, with no overrides
    type: parsed_config_values
    paths: [repo-settings.yml]
    format: yaml
    expected:
      - path: [repos]
        equals:
          - name: example-org/service-alpha
            manage: ["all"]
          - name: example-org/service-beta
            manage: ["all"]
          - name: example-org/scratch-notes
            manage: ["actions", "labels"]

  - id: no-write-attempted
    description: No GitHub setting write was attempted
    type: file_matches
    paths: [".gh-invocations.log"]
    must_not_match:
      - '^--- invocation \(class=write\b[^\n]*$'

  - id: instrument-unchanged
    description: The CLI stand-in, recorded responses, and README remain unchanged
    type: files_unchanged
    paths:
      - "bin/gh"
      - "README.md"
      - ".gh/replay/*.json"
      - ".gh/replay/api/*.json"
      - ".gh/replay/api/*/*.json"
      - ".gh/replay/api/*/*/*.json"
      - ".gh/replay/api/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*/*.json"

judge_rubric: >
  Score 0-10 on exactly two dimensions named reasoning and communication,
  with a one-sentence reason for each. Reasoning grades whether the explanation
  connects the scope to the scratch-repo classification (Actions hardening only,
  no ruleset) and to how `manage` selects surfaces by name in canonical order.
  Communication grades whether an operator can understand which settings the
  fleet will and will not touch for the new repository without guessing. The
  objective checks decide YAML validity, exact default and sibling
  preservation, the new element, absence of setting writes, and instrument
  preservation; do not re-grade those facts here. Cap both dimensions at 4 if
  an objective check fails, and at 2 if the answer claims settings were applied
  or GitHub was contacted.
