# The use-based verdict of each git hook check in the public explorer document
# (scripts/explorer_public.py `verdict`, the document's `hooks`).
#
#   earning           blocked at least once in the window, and overridden in at
#                     most max_override_rate of its blocks
#   never-blocked     ran in the window (or its runs are not counted) and
#                     blocked nothing
#   never-ran         no recorded runs in the window and no block
#   overridden-often  overridden in more than max_override_rate of its blocks
#
# Current values in plain English: docs/rules.md (generated from this file).
# No rule removes a hook check: these verdicts are reported, never acted on.
#
# A check that blocked but whose overrides no source counts (the local hook
# log records none; only the CI file does) is `earning` with
# `overrides_measured: false`; `overridden-often` needs a measured rate.

# ISO weeks, ending with the document's as-of week.
window_weeks: 8
# Overridden over blocked, as a fraction.
max_override_rate: 0.20
# Distinct named non-public repositories needed before the folded
# `private repos` bucket is published as rows (it always counts in verdicts).
min_private_repos: 3
