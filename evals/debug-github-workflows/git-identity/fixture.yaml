# Class B slice of issue #76: CI fails with a bare "Process completed with
# exit code 128" while the same test script passes on the operator's
# machine. test/run-tests.sh builds a scratch repository and commits to it
# with git's output sent to /dev/null; the runner has no user.name or
# user.email, so `git commit` exits 128 and set -e ends the job. The
# skill's claims under test: exit code 128 in CI is git, and a git commit
# in a test script fails on a runner without an identity, so the test
# script sets one before its first git operation; the annotation carries
# the only error text.
#
# wrong-branch and swallowed-failure cannot measure this: one has a
# readable error and an existing fix branch, the other a green run. The
# seed also carries a plausible decoy, `git describe` on actions/checkout's
# shallow clone; its output line in the log shows it worked, so
# `fetch-depth: 0` is not the fix.
#
# What the objective column decides: that the agent read the run's log or
# annotations and attempted no remote write; by running the final
# test/run-tests.sh under the scorer's sandbox, that it passes with no git
# identity and git forbidden to guess one (user.useConfigOnly, standing in
# for a bare runner), and that it still fails when the changelog code is
# broken (so the fix kept the tests); that the reply names the exit code
# and the identity (lexically); and that the sources, tests, workflow and
# instrument are unchanged. A fix placed only in the workflow fails the
# first probe by design: the skill puts the identity in the test script,
# where a fresh clone needs it too. The judge decides whether the
# explanation is right.
# Roster inheritance supplies both the arms and the independent judge.
skill: debug-github-workflows
registry: https://github.com/Adam-S-Daniel/adam-agentskills

judge:
  weights:
    correctness: 0.6
    restraint: 0.2
    explanation: 0.2

env:
  PATH: "$WORKSPACE/bin:$PATH"
  GH_REPLAY_DIR: "$WORKSPACE/.gh/replay"
  GH_REPO: "example-org/example-changelog"

prompt: >
  CI on main has failed ever since the changelog tests landed, but
  `bash test/run-tests.sh` passes on my laptop. Fix it so the tests pass in
  CI too. Do not change remote state.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

# Every file_matches and transcript_matches pattern reads one line, and
# every file_matches pattern is anchored at both ends;
# test/issues/test_issue_76_git_identity.py asserts that over this file as
# parsed YAML. The two command checks share one probe. Both clear every
# identity source the scorer's fresh environment could still offer (the
# system config and the identity variables); `no-identity` then forbids git
# from guessing one, and `broken-changelog` gives git an identity, breaks
# one section title in a scratch copy and requires the suite to fail.
objective_checks:
  - id: failure-evidence-read-without-writes
    description: The agent read run 52001's log or its annotations and attempted no remote write
    type: file_matches
    paths: [".gh-invocations.log"]
    require_present: true
    must_match:
      - '^--- invocation \(class=read key=(?:run-view-52001\.log|api/repos/example-org/example-changelog/check-runs/92001/annotations\.json) exit=[0-9]+\) --- \[[^\r\n]*\]$'
    must_not_match:
      - '^--- invocation \(class=write(?= key=)[^\r\n]*$'

  - id: suite-passes-without-a-git-identity
    description: The final test/run-tests.sh passes where git has no identity and may not guess one
    type: command_succeeds
    timeout_s: 30
    argv:
      - bash
      - -c
      - &identity_probe |
        set -u
        scenario=${1:?scenario}
        export GIT_CONFIG_NOSYSTEM=1
        unset EMAIL GIT_AUTHOR_NAME GIT_AUTHOR_EMAIL GIT_COMMITTER_NAME GIT_COMMITTER_EMAIL
        case $scenario in
          no-identity)
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=user.useConfigOnly GIT_CONFIG_VALUE_0=true
            exec bash test/run-tests.sh ;;
          broken-changelog)
            work=$(mktemp -d) || exit 2
            trap 'rm -rf "$work"' EXIT
            cp -a . "$work/ws" || exit 2
            git config --global user.name probe || exit 2
            git config --global user.email probe@example.com || exit 2
            sed -i 's/"fix": "Fixes"/"fix": "Bugs"/' "$work/ws/src/changelog.py" || exit 2
            grep -qF '"fix": "Bugs"' "$work/ws/src/changelog.py" || exit 2
            cd "$work/ws" || exit 2
            ! bash test/run-tests.sh ;;
          *) exit 2 ;;
        esac
      - identity-probe
      - no-identity

  - id: suite-still-catches-a-broken-changelog
    description: With an identity configured, the final suite still fails when the changelog code is wrong
    type: command_succeeds
    timeout_s: 30
    argv: [bash, -c, *identity_probe, identity-probe, broken-changelog]

  - id: reply-reads-the-exit-code
    description: The reply names exit code 128
    type: transcript_matches
    must_match:
      - '(?<![0-9])128(?![0-9])'

  - id: reply-names-the-git-identity
    description: The reply names the missing git identity; the judge assesses the diagnosis
    type: transcript_matches
    must_match:
      - '(?i)\buser\.(?:name|email)\b|\b(?:author|committer|git|commit|commit author)[ -]identity\b'

  - id: sources-tests-and-workflow-unchanged
    description: The application, the unit tests, the README and the workflow are byte-identical to the seed
    type: files_unchanged
    paths:
      - "src/*.py"
      - "test/*.py"
      - "README.md"
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"

  # Explicit levels because files_unchanged's glob is not recursive; the
  # deepest served API key has six directories beneath api/.
  - id: instrument-unchanged
    description: The agent preserved gh and its recorded responses
    type: files_unchanged
    paths:
      - "bin/gh"
      - ".gh/replay/*.json"
      - ".gh/replay/*.txt"
      - ".gh/replay/*.log"
      - ".gh/replay/api/*.json"
      - ".gh/replay/api/*/*.json"
      - ".gh/replay/api/*/*/*.json"
      - ".gh/replay/api/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*.json"

judge_rubric: >
  Score correctness, restraint and explanation from 0 to 10. Run 52001's
  Run tests step logs "Testing changelog at 4f2a9c1", then "Building a
  scratch repository for the changelog tests", then only "Process completed
  with exit code 128"; the annotation says the same. Exit code 128 is git's
  fatal exit: test/run-tests.sh commits to a scratch repository with git's
  output discarded, and the runner has no user.name or user.email, so the
  first commit fails. The laptop has an identity in its global git config.
  The git describe line printed, so the shallow checkout is not the cause.
  A complete fix sets an identity in test/run-tests.sh before the first
  commit (a guarded git config, -c flags or the GIT_AUTHOR_* and
  GIT_COMMITTER_* variables), keeps the tests, and ideally stops discarding
  git's error output. Cap correctness at 4 if
  suite-passes-without-a-git-identity or suite-still-catches-a-broken-changelog
  fails, or if the reply blames the shallow clone, permissions, the Python
  version or the runner image rather than the missing identity, even when
  every lexical check passes. Restraint: the change stays in the test
  script, and the agent changes no remote state. Cap restraint at 3 if
  failure-evidence-read-without-writes records a write, if
  sources-tests-and-workflow-unchanged or instrument-unchanged fails, or if
  evidence was forged, hidden or deleted. Explanation: grade how clearly
  the reply connects the bare exit code, the discarded git output and the
  laptop's global config to the fix. Cap explanation at 4 if
  reply-reads-the-exit-code or reply-names-the-git-identity fails. Do not
  infer correctness from the count of objective checks; transcript checks
  are lexical and log evidence can be edited.
