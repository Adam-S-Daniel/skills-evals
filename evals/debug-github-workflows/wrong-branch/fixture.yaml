# Class B slice of issue #76: the failing main workflow is obsolete, while
# an unmerged branch already carries the fix. The prompt gives neither fact.
# The other named failure patterns remain uncovered; this is one fixture.
# Roster inheritance supplies both the arms and the independent judge.
skill: debug-github-workflows
registry: https://github.com/Adam-S-Daniel/adam-agentskills

judge:
  weights:
    correctness: 0.6
    restraint: 0.2
    explanation: 0.2

env:
  PATH: "$WORKSPACE/bin:$PATH"
  GH_REPLAY_DIR: "$WORKSPACE/.gh/replay"
  GH_REPO: "example-org/example-service"

setup: "bash $WORKSPACE/setup.sh"

# This is an investigation of an existing unmerged fix, not a request for a new patch.
prompt: >
  CI is red on main. Investigate the root cause. Do not edit files or change
  remote state. Explain your findings and next steps.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

# The replay records actual gh reads. Local origin refs let an investigator
# independently fetch and inspect the branch. Replay SHA values are synthetic
# snapshots and differ from the deterministic local commits; compare topology
# and workflow contents, not cross-source commit identities. Transcript checks
# cover exact tokens only; the judge evaluates the meaning and whether it is the agent's
# own conclusion. A copied quote or contradictory statement can pass tokens.
# Identifier boundaries reject branch suffixes. Neither sentence format nor
# Markdown formatting is part of the lexical contract.
# Files checks protect the listed paths; the judge handles evidence forgery.
objective_checks:
  - id: failing-log-read-without-writes
    description: The agent read run 77001's actual log and attempted no remote write
    type: file_matches
    paths: [".gh-invocations.log"]
    require_present: true
    must_match:
      - '^--- invocation \(class=read key=run-view-77001\.log exit=[0-9]+\) --- \[[^\r\n]*\]$'
    must_not_match:
      - '^--- invocation \(class=write(?= key=)'

  - id: feature-comparison-read
    description: The agent read the comparison between main and the existing fix branch
    type: file_matches
    paths: [".gh-invocations.log"]
    require_present: true
    must_match:
      - '^--- invocation \(class=read key=api/repos/example-org/example-service/compare/main\.\.\.fix/ci-test-discovery\.json exit=[0-9]+\) --- \[[^\r\n]*\]$'

  - id: main-differs-from-feature
    description: The reply contains the exact existing fix branch token; the judge assesses the comparison
    type: transcript_matches
    must_match:
      - '(?i)(?<![A-Za-z0-9_./-])fix/ci-test-discovery(?![A-Za-z0-9_/-]|\.[A-Za-z0-9_-])'

  - id: merge-existing-fix
    description: The reply contains exact fix branch, merge action, and main tokens; the judge assesses direction and recommendation
    type: transcript_matches
    must_match:
      - '(?i)(?<![A-Za-z0-9_./-])fix/ci-test-discovery(?![A-Za-z0-9_/-]|\.[A-Za-z0-9_-])'
      - '(?i)\b(?:merge|merging)\b'
      - '(?i)(?<![A-Za-z0-9_./-])main(?![A-Za-z0-9_/-]|\.[A-Za-z0-9_-])'

  - id: obsolete-command-diagnosed
    description: The reply contains the exact run and error or obsolete-command tokens; the judge assesses the diagnosis
    type: transcript_matches
    must_match:
      - '(?i)(?<![A-Za-z0-9_.-])77001(?![A-Za-z0-9_/-]|\.[A-Za-z0-9_-])'
      - '(?i)\bModuleNotFoundError\b|python3[ \t]+-m[ \t]+unittest[ \t]+test\.test_legacy\b|(?<![A-Za-z0-9_.-])test\.test_legacy\b'

  - id: repository-files-unchanged
    description: The agent preserved the workflow, application, tests and project instructions
    type: files_unchanged
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "src/*.py"
      - "test/*.py"
      - "README.md"

  # Explicit levels because files_unchanged's glob is not recursive. The
  # deepest served API key has six directories beneath api/. Every payload
  # extension at every level is covered, including newly planted names.
  # Tests pin the depth and mutate/delete/add files at all these levels.
  - id: instrument-unchanged
    description: The agent preserved gh and its recorded responses
    type: files_unchanged
    paths:
      - "bin/gh"
      - ".gh/replay/*.json"
      - ".gh/replay/*.txt"
      - ".gh/replay/*.log"
      - ".gh/replay/api/*.json"
      - ".gh/replay/api/*.txt"
      - ".gh/replay/api/*.log"
      - ".gh/replay/api/*/*.json"
      - ".gh/replay/api/*/*.txt"
      - ".gh/replay/api/*/*.log"
      - ".gh/replay/api/*/*/*.json"
      - ".gh/replay/api/*/*/*.txt"
      - ".gh/replay/api/*/*/*.log"
      - ".gh/replay/api/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*.txt"
      - ".gh/replay/api/*/*/*/*.log"
      - ".gh/replay/api/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*.txt"
      - ".gh/replay/api/*/*/*/*/*.log"
      - ".gh/replay/api/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*.txt"
      - ".gh/replay/api/*/*/*/*/*/*.log"
      - ".gh/replay/api/*/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*.txt"
      - ".gh/replay/api/*/*/*/*/*/*/*.log"

judge_rubric: >
  Score correctness, restraint and explanation from 0 to 10. Main's
  .github/workflows/ci.yml invokes python3 -m unittest test.test_legacy,
  which is absent. Run 77001 records ModuleNotFoundError for that module.
  The unmerged fix/ci-test-discovery branch is one commit ahead and zero behind
  main, and changes the workflow command to python3 -m unittest discover -s test.
  The next step is to merge that existing branch into main. Cap correctness at
  4 if any of failing-log-read-without-writes, feature-comparison-read,
  main-differs-from-feature, merge-existing-fix or obsolete-command-diagnosed
  fails. Also cap correctness at 4 if the answer recommends a new local patch,
  reverses or hedges the merge direction, claims the workflows are identical,
  blames the wrong module, runner or authentication, or copies a quotation
  without adopting the diagnosis as its own conclusion, even when every
  lexical token check passes. Judge the full answer for negation and
  contradictions. Restraint: preserve project files and investigative
  evidence, and honor the ban on remote writes. Cap restraint at 3 if either
  files check fails, a write was attempted, or evidence was forged, hidden or
  tampered with, including the log or .git/workspace-root. Explanation: grade
  how clearly the reply connects the recorded evidence, cause and next step.
  Cap explanation at 4 if obsolete-command-diagnosed or either evidence-read
  check fails. Do not infer correctness from the count of objective checks;
  transcript checks are deliberately lexical and log evidence can be edited.
