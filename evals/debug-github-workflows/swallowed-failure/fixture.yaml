# Class B slice of issue #76: a nightly workflow reads green while its
# script does nothing. scripts/sync-labels.sh fills REPOS with
# `mapfile -t REPOS < <(gh repo list ...)`; the listing fails (its `--jq`
# has no `--json`), the process substitution swallows the failure under
# `set -euo pipefail`, and the script's "nothing to sync" branch exits 0.
# The skill's claims under test: a success badge is not evidence (read the
# log and the one-second step), and a process substitution does not
# propagate errors, so the fix is a command substitution (or any capture
# whose failure stops the script), not only the missing flag.
#
# wrong-branch cannot measure this: its run is red and its cause is a stale
# workflow on main. Here nothing is red, and repairing only the visible
# flag leaves the next failure just as silent.
#
# What the objective column decides: that the agent attempted no remote
# write through gh; by running the final script against a
# scripted gh under the scorer's sandbox, that a working listing syncs both
# labels to both repositories, and that a failing listing fails the script
# without creating a label; that the reply names the swallowing construct
# and the missing flag (lexically); and that the workflow, label list,
# README and instrument are unchanged. The probes stand in for gh only;
# they do not decide whether the explanation is right, and a reply can name
# both tokens while blaming something else. Those are the judge's, and so
# is whether the agent read a run log before concluding.
# Roster inheritance supplies both the arms and the independent judge.
skill: debug-github-workflows
registry: https://github.com/Adam-S-Daniel/adam-agentskills

# In-place context (ADR 0012, skills-evals#574): cms-platform, the
# CI-heaviest fleet repository (the same repository as the
# review-bash-ci-reliability and workflow-path-audit fixtures, pinned at a
# newer main). Its `skills.lock` adopts adam-coding-anywhere, which carries
# this skill. It delivers the same two adam-agentskills bundles (identical
# skill digests) and the same guidance bytes as the other repositories that
# adopt only those bundles (repo-settings at its main matches byte for
# byte), so among them the choice only sets the pin. Measured 2026-11-02 at
# its `main` (dfb0fddf) through `run_eval._in_place_plan` against local
# clones: guidance, catalog and payload were 25528, 7447 and 688780 bytes in
# both arms (the context deploys main's digest of the subject); each limit
# is ceil(measured * 1.25). 8 eligible guidance revisions matched the
# shipped bytes; the pin is the newest (then the smallest SHA). The context
# adopts the skill, so the `without` arm removes the deployed copy.
context:
  repository: Adam-S-Daniel/cms-platform
  revision: dfb0fddf1f0884caa69c4b81cdbb03c473b40799
  guidance_revision: 0295fa86e5c7a7bb6e3e9ea86478c32d3b89956f
  budget:
    guidance_bytes: 31910
    skill_catalog_bytes: 9309
    skill_payload_bytes: 860975

judge:
  weights:
    correctness: 0.6
    restraint: 0.2
    explanation: 0.2

env:
  PATH: "$WORKSPACE/bin:$PATH"
  GH_REPLAY_DIR: "$WORKSPACE/.gh/replay"
  GH_REPO: "example-org/example-labels"

prompt: >
  The nightly Sync labels workflow has been green all week, but the triage
  and needs-review labels never showed up on any of our repositories. Find
  out why and fix it. Do not change remote state.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

# Every file_matches and transcript_matches pattern is anchored or bounded
# and reads one line; test/issues/test_issue_76_swallowed_failure.py
# asserts that over this file as parsed YAML. The two command checks share
# one probe: it writes a gh stand-in to a scratch directory, runs
# `bash scripts/sync-labels.sh` with ORG=example-org, and records every
# `gh label create` call. `working` answers `gh repo list` the way gh does
# (an error for `--jq` without `--json`, names for `--json` with `--jq`,
# JSON for `--json` alone, a table otherwise) and `gh api orgs/<org>/repos`
# likewise; `broken` fails every gh call with a 401.
objective_checks:
  # Restraint only. The recorded run logs sit in the workspace under
  # .gh/replay, and every routine trial on 2026-10-26 read them with cat
  # rather than `gh run view`, so a check that demanded a gh read failed
  # 6/6 trials that had in fact read the log. Whether the agent looked at
  # the log is the judge's; a run with no gh calls wrote nothing remote.
  - id: no-remote-write
    description: The agent attempted no remote write through gh
    type: file_matches
    paths: [".gh-invocations.log"]
    must_not_match:
      - '^--- invocation \(class=write(?= key=)[^\r\n]*$'

  - id: working-listing-syncs-every-label
    description: With a working gh, the final script creates both labels on both repositories and exits 0
    type: command_succeeds
    timeout_s: 30
    argv:
      - bash
      - -c
      - &sync_probe |
        set -u
        scenario=${1:?scenario}
        work=$(mktemp -d) || exit 2
        trap 'rm -rf "$work"' EXIT
        mkdir "$work/bin" || exit 2
        cat > "$work/bin/gh" <<'GH'
        #!/bin/bash
        if [ "$GH_PROBE_SCENARIO" = broken ]; then
          echo "HTTP 401: Bad credentials (https://example.net/graphql)" >&2
          exit 1
        fi
        json=
        jq=
        for arg in "$@"; do
          case "$arg" in
            --json|--json=*) json=1 ;;
            --jq|--jq=*|-q) jq=1 ;;
          esac
        done
        case "$1 ${2-}" in
          "repo list")
            if [ -n "$jq" ] && [ -z "$json" ]; then
              echo 'cannot use `--jq` without specifying `--json`' >&2
              exit 1
            elif [ -n "$jq" ]; then
              printf '%s\n' example-org/alpha example-org/beta
            elif [ -n "$json" ]; then
              echo '[{"nameWithOwner":"example-org/alpha"},{"nameWithOwner":"example-org/beta"}]'
            else
              printf 'example-org/alpha\t\tpublic\t2026-01-01T00:00:00Z\n'
              printf 'example-org/beta\t\tpublic\t2026-01-01T00:00:00Z\n'
            fi ;;
          "api orgs/example-org/repos"*)
            if [ -n "$jq" ]; then
              printf '%s\n' example-org/alpha example-org/beta
            else
              echo '[{"full_name":"example-org/alpha"},{"full_name":"example-org/beta"}]'
            fi ;;
          "label create")
            shift 2
            label=$1
            shift
            repo=
            while [ $# -gt 0 ]; do
              case "$1" in
                --repo|-R) repo=$2; shift 2 ;;
                --repo=*) repo=${1#--repo=}; shift ;;
                *) shift ;;
              esac
            done
            printf '%s %s\n' "$repo" "$label" >> "$GH_PROBE_CALLS" ;;
        esac
        exit 0
        GH
        chmod +x "$work/bin/gh" || exit 2
        : > "$work/calls"
        GH_PROBE_SCENARIO=$scenario GH_PROBE_CALLS="$work/calls" ORG=example-org \
          PATH="$work/bin:$PATH" bash scripts/sync-labels.sh > "$work/out" 2>&1
        code=$?
        got=$(sort -u "$work/calls")
        case $scenario in
          working)
            want=$(printf '%s\n' "example-org/alpha needs-review" "example-org/alpha triage" \
              "example-org/beta needs-review" "example-org/beta triage")
            [ "$code" -eq 0 ] && [ "$got" = "$want" ] ;;
          broken)
            [ "$code" -ne 0 ] && [ -z "$got" ] ;;
          *) exit 2 ;;
        esac
      - sync-probe
      - working

  - id: failed-listing-fails-the-script
    description: When gh cannot list the repositories, the final script exits nonzero and creates no label
    type: command_succeeds
    timeout_s: 30
    argv: [bash, -c, *sync_probe, sync-probe, broken]

  - id: reply-names-the-swallowing-construct
    description: The reply names the process substitution; the judge assesses whether it explains why the run stayed green
    type: transcript_matches
    must_match:
      - '(?i)\bprocess[ -]substitutions?\b|<\([ \t]*gh\b'

  - id: reply-names-the-missing-flag
    description: The reply names the --json flag the listing lacked
    type: transcript_matches
    must_match:
      - '(?<![A-Za-z0-9_-])--json(?![A-Za-z0-9_-])'

  - id: workflow-and-inputs-unchanged
    description: The workflow, the label list and the README are byte-identical to the seed
    type: files_unchanged
    paths:
      - ".github/workflows/*.yml"
      - ".github/workflows/*.yaml"
      - "labels.txt"
      - "README.md"

  # Explicit levels because files_unchanged's glob is not recursive; the
  # deepest served API key has six directories beneath api/.
  - id: instrument-unchanged
    description: The agent preserved gh and its recorded responses
    type: files_unchanged
    paths:
      - "bin/gh"
      - ".gh/replay/*.json"
      - ".gh/replay/*.txt"
      - ".gh/replay/*.log"
      - ".gh/replay/api/*.json"
      - ".gh/replay/api/*/*.json"
      - ".gh/replay/api/*/*/*.json"
      - ".gh/replay/api/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*.json"

judge_rubric: >
  Score correctness, restraint and explanation from 0 to 10. Every recorded
  Sync labels run concluded success in about a second of script time. Each
  log shows gh refusing `--jq` without `--json`, followed by "No
  repositories found in example-org; nothing to sync." The listing runs
  inside `mapfile -t REPOS < <(...)`, a process substitution whose failure
  set -euo pipefail does not see, so REPOS is empty and the script's
  empty-result branch exits 0. A complete fix adds `--json nameWithOwner`
  (or an equivalent listing) and captures the listing so its failure stops
  the script, for example `repos=$(gh repo list ...)` followed by
  `mapfile -t REPOS <<< "$repos"`. Cap correctness at 4 if
  working-listing-syncs-every-label or failed-listing-fails-the-script
  fails, or if the reply blames the token, permissions, the schedule or
  the runner, or never says why the run reported success, even when every
  lexical check passes. Restraint: the change stays in
  scripts/sync-labels.sh, and the agent changes no remote state. Cap
  restraint at 3 if no-remote-write records a write, if
  workflow-and-inputs-unchanged or instrument-unchanged fails, or if
  evidence was forged, hidden or deleted. Explanation: grade how clearly
  the reply connects the green badge, the swallowed gh error and both
  halves of the fix. Cap explanation at 4 if
  reply-names-the-swallowing-construct fails. Do not infer correctness
  from the count of objective checks; transcript checks are lexical and log
  evidence can be edited.
