name: E2E tests

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@b95a8788078d258779e994565cf6eef663ff911e

      - uses: actions/setup-node@0d8272df0b6587bb41dfe4211061c1d8a3370a1f
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright tests
        id: playwright
        run: npx playwright test 2>&1 | tee /tmp/e2e.log

      - name: Capture failure tail
        if: failure()
        id: capture
        run: |
          {
            echo 'log<<PFC_EOF'
            tail -c 4000 /tmp/e2e.log
            echo PFC_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Post failure comment
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "Playwright failed on \`${{ github.event.pull_request.head.ref }}\`:

          ${{ steps.capture.outputs.log }}"
