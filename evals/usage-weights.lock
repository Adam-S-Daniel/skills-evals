# The pinned release of the usage-weights package vendored under
# vendor/usage_weights/, and the one weight table every allowance estimate in
# this repo uses. harness/allowance_points.py reads this file and nothing else
# names a table: no reader has a default and none follows "latest". A missing
# or unreadable lock, a missing `table`, or a vendored file whose sha256 differs
# from the one below stops the reader with a message that names the problem
# (test/issues/test_usage_weights_lock.py recomputes every checksum).
#
# To move to a new release: copy its usage_weights/ package over
# vendor/usage_weights/, set `repo`, `tag` and `table`, and rewrite `files`.
# A new table is a spending decision (it changes what every run is charged).

# The source repository and release. Pending until the repository is created:
# the vendored files are the 2026-11-20 draft (64 tests passing there).
