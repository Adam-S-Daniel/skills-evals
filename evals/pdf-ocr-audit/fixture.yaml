    require_present: true
    must_match:
      - '(?i)^[ \t]*(?:>[ \t]*)*(?:[-*][ \t]+)?[`*]*Summary[`*]*[ \t]*:[`*]*[ \t]*8[ \t]+(?:files|PDFs)[ \t]+total\b[ \t]*[—–-][ \t]*4[ \t]+No\b(?:[ \t]+OCR[ \t]+needed\b)?[ \t]*,[ \t]*2[ \t]+Yes\b(?:[ \t]+\(need\b[ \t]+OCR\))?[ \t]*,[ \t]*1[ \t]+Partial\b[ \t]*,[ \t]*1[ \t]+Inaccessible\b\.?[`*]*[ \t]*$'
