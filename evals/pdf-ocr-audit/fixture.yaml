  - id: report-separator
    description: The report has a three-column Markdown table separator.
    type: file_matches
    paths:
      - audit.md
    require_present: true
    must_match:
      - '^[ \t]*(?:>[ \t]*)*\|?[ \t]*:?-{3,}:?[ \t]*\|[ \t]*:?-{3,}:?[ \t]*\|[ \t]*:?-{3,}:?[ \t]*\|?[ \t]*$'
