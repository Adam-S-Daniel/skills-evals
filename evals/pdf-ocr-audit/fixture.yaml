      - '(?i)^[ \t]*(?:>[ \t]*)*\|?[ \t]*[`*]*/(?:[^|`\r\n]*?/)?(?-i:archive/damaged\.pdf)[`*]*[ \t]*\|[ \t]*[`*]*Inaccessible[`*]*[ \t]*\|[^|\r\n]*(?:(?<!no )(?<!not )(?<!n''t )\b(?:needs?|requires?)\b[ \t]+(?:to[ \t]+)?OCR\b|(?<!no )(?<!not )\bOCR\b[ \t]+(?:is\b[ \t]+)?(?:needed|necessary|required)\b|\b(?:must|should)\b[ \t]+(?:run\b[ \t]+|perform\b[ \t]+)?OCR\b|\b(?:no\b[ \t]+need\b[ \t]+(?:to[ \t]+|for[ \t]+)?(?:(?:run|perform|recommend|need)\b[ \t]+)?OCR|no\b[ \t]+OCR[ \t]+(?:needed|necessary|required)|never\b[ \t]+(?:(?:run|perform|recommend|need)\b[ \t]+)?OCR|(?:do\b[ \t]+not|don[''’]t\b|would\b[ \t]+not)[ \t]+(?:(?:run|perform|recommend|need)\b[ \t]+)?OCR|not[ \t]+(?:needed|necessary|required)\b[ \t]+to[ \t]+(?:(?:run|perform|recommend|need)\b[ \t]+)?OCR|OCR[ \t]+(?:is\b[ \t]+)?not[ \t]+(?:needed|necessary|required)|(?:does\b[ \t]+not|doesn[''’]t\b)[ \t]+(?:need|require)\b[ \t]+OCR)\b|(?<!not )\bfully\b[ \t]+searchable\b)[^|\r\n]*'
