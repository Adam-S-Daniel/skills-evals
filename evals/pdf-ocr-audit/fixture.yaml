# Eval fixture: pdf-ocr-audit (Class A, issue #83)
# https://github.com/Adam-S-Daniel/skills-evals/issues/83
# Eight committed, tiny synthetic PDFs; shared stdlib PDF primitives come from
# ../rename-pdfs/make_pdfs.py. The local generator and expected.json deliberately
# live OUTSIDE seed/: run_eval.py copies the whole seed into both arms.
# The seed holds only archive/ and its PDFs, so neither arm sees an answer key.
#
# Conventional filename clues disagree with the text layers: signed-lease-scan.pdf
# and scanned-invoice.pdf have text, while quarterly-report.pdf and
# statement-2024-q1.pdf are image-only. Filename guesses still have a 7/12
# blanket-No baseline because four of eight PDFs have text. Any nonempty text is a
# text layer, including garbage OCR. The damaged meeting-notes.pdf is truncated
# and exercises the skill's Inaccessible verdict. POLICY.PDF exercises
# case-insensitive enumeration.
#
# The prompt adds a saved report so the existing file_matches scorer can decide
# every verdict without a new scorer. Header, separator, eight verdict rows,
# summary, and source immutability are objective. Qualitative process and verdict
# suffix consistency are judged, not scored. Solution-mutation tests prove each
# check can fail by its exact id.
#
# Report patterns anchor to table rows and the leading verdict token. They accept
# whitespace, optional outer pipes, quote prefixes, backticks/bold, and arbitrary
# verdict-cell suffixes unless they contain another verdict word, a hedge word,
# a question mark, "leave as is", or "skip". This lexical rule applies to all
# verdicts, including Inaccessible. The judge assesses whether suffix prose
# agrees with the verdict; objective checks do not infer contradictions.
# must_not_match guards reject hedged duplicates after a valid row.
# Paths must be absolute with the exact archive/name suffix. Rationale prose stays
# qualitative for the judge; the damaged PDF row needs only its verdict.
# The summary follows the skill example's count-before-label order (8 files
# total: 4 No, 2 Yes, 1 Partial, 1 Inaccessible), with a colon or dash before
# counts and a comma or conjunction before the last count. Additional summary
# prose is allowed when the required counts line is present. Inaccessible rows
# need no reason in the table; the judge assesses the read-failure explanation.
#
# No model or judge.model override: the committed roster supplies both.
# requires is informational, matching rename-pdfs; the harness currently does
# not install it. Objective checks and tests do not import or install pypdf.
# The skill itself needs this exact version for a real run; no runtime setup.


skill: pdf-ocr-audit
registry: https://github.com/Adam-S-Daniel/adam-agentskills
requires:
  python:
    - package: pypdf
      version: 6.16.2
      published: '2026-08-23'
prompt: Audit archive/ and tell me which PDFs need OCR. Save the results in audit.md.
arms:
  with_skill:
    install: copy
  without_skill:
    install: none
