# Eval fixture: pdf-ocr-audit (Class A, issue #83)
# https://github.com/Adam-S-Daniel/skills-evals/issues/83
# Eight committed, tiny synthetic PDFs; shared stdlib PDF primitives come from
# ../rename-pdfs/make_pdfs.py. The local generator and expected.json deliberately
# live OUTSIDE seed/: run_eval.py copies the whole seed into both arms.
# The seed holds only archive/ and its PDFs, so neither arm sees an answer key.
#
# Current registry skill: any nonempty extracted text is a text layer, including
# garbage OCR. noisy-text.pdf therefore receives No, not an invented quality
# threshold. annual-scan.pdf and invoice-ocr.pdf defeat filename-only guesses;
# UPPER.PDF exercises case-insensitive enumeration; damaged.pdf is deliberately
# truncated. The helper reports Error, translated to the skill's Inaccessible.
#
# The prompt adds a saved report so the existing file_matches scorer can decide
# every verdict without a new scorer. Header, separator, eight verdict rows,
# summary, and source immutability are objective. Only qualitative process is
# judged. Solution-mutation tests prove each check can fail by its exact id.
#
# Report patterns anchor to table rows and exact verdict cells. They accept
# whitespace, optional outer pipes, quote prefixes, backticks/bold, and case
# variation in prose (filename case stays exact). Paths must be absolute with the exact archive/name suffix.
# Contradiction guards cover explicit OCR recommendations/negations in each
# verdict's rationale and any duplicate row with a different verdict. These
# lexical guards do not attempt general natural-language entailment or accept
# HTML tables, multiline cells, escaped pipes, or Windows backslash paths.
# The summary follows the skill example: one Summary line with count-before-
# label wording and order (8 files total, 4 No, 2 Yes, 1 Partial, 1 Inaccessible),
# with a dash before verdict counts and commas between them. Extra claims or
# contradictory Summary lines fail; bold labels, quotes, and bullets are accepted.
# Partial does not require an OCR recommendation: the skill leaves the value
# of OCR on a cover page conditional. Negated descriptive phrases such as
# "not fully searchable" and "not an image-only scan" are accepted.
#
# No model or judge.model override: the committed roster supplies both.
# requires is informational, matching rename-pdfs; the harness currently does
# not install it. Objective checks and tests do not import or install pypdf.
# The skill itself needs this exact version for a real run; no runtime setup.


skill: pdf-ocr-audit
registry: https://github.com/Adam-S-Daniel/adam-agentskills
requires:
  python:
    - package: pypdf
      version: 6.16.2
      published: '2026-08-23'
prompt: Audit archive/ and tell me which PDFs need OCR. Save the results in audit.md.
arms:
  with_skill:
    install: copy
  without_skill:
    install: none
