    require_present: true
    must_match:
      - '(?i)^[ \t]*(?:>[ \t]*)*\|?[ \t]*[`*]*/(?:[^|`\r\n]*?/)?(?-i:archive/UPPER\.PDF)[`*]*[ \t]*\|[ \t]*[`*]*No[`*]*[ \t]*\|[ \t]*[^|\r\n]*[^|\r\n \t][^|\r\n]*\|?[ \t]*$'
    must_not_match:
