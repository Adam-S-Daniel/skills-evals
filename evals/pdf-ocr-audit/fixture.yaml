      - '(?i)^[ \t]*(?:>[ \t]*)*\|?[ \t]*[`*]*/(?:[^|`\r\n]*?/)?(?-i:archive/digital\.pdf)[`*]*[ \t]*\|[ \t]*[`*]*No[`*]*[ \t]*\|[^|\r\n]*(?:(?<!no )(?<!not )(?<!n''t )\b(?:needs?|requires?)\b[ \t]+(?:to[ \t]+)?OCR\b|(?<!no )(?<!not )\bOCR\b[ \t]+(?:is\b[ \t]+)?(?:needed|necessary|required)\b|\b(?:must|should)\b[ \t]+(?:run\b[ \t]+|perform\b[ \t]+)?OCR\b|(?<!not )\bno\b[ \t]+pages[ \t]+have\b[ \t]+(?:embedded[ \t]+)?text\b)[^|\r\n]*'
