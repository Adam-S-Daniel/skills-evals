      - '(?i)^[ \t]*(?:>[ \t]*)*\|?[ \t]*[`*]*/(?:[^|`\r\n]*?/)?(?-i:archive/invoice\-ocr\.pdf)[`*]*[ \t]*\|[ \t]*[`*]*Yes[`*]*[ \t]*\|[^|\r\n]*(?:\b(?:no\b[ \t]+need\b[ \t]+(?:to[ \t]+|for[ \t]+)?(?:(?:run|perform|recommend|need)\b[ \t]+)?OCR|no\b[ \t]+OCR[ \t]+(?:needed|necessary|required)|never\b[ \t]+(?:(?:run|perform|recommend|need)\b[ \t]+)?OCR|(?:do\b[ \t]+not|don[''’]t\b|would\b[ \t]+not)[ \t]+(?:(?:run|perform|recommend|need)\b[ \t]+)?OCR|not[ \t]+(?:needed|necessary|required)\b[ \t]+to[ \t]+(?:(?:run|perform|recommend|need)\b[ \t]+)?OCR|OCR[ \t]+(?:is\b[ \t]+)?not[ \t]+(?:needed|necessary|required)|(?:does\b[ \t]+not|doesn[''’]t\b)[ \t]+(?:need|require)\b[ \t]+OCR)\b|(?<!not )\bfully\b[ \t]+searchable\b|(?<!not )\ball\b[ \t]+pages[ \t]+have\b[ \t]+(?:embedded[ \t]+)?text\b)[^|\r\n]*'
