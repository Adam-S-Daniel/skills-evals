# Eval fixture: launch-top-level-claude-session / remote-control-bare-last
# Measures whether the skill improves a launch, from INSIDE WSL, of a new
# top-level session that is both seeded with a first message and
# remote-controllable, with no session name given. Claude Code's
# `--remote-control` takes an OPTIONAL name, so a bare `--remote-control`
# placed before the positional prompt swallows the prompt as the session's
# name: the session opens with no first message. The skill puts a bare
# `--remote-control` LAST on claude's command line (its launchers order it
# for you), beside the usual marker-clearing, persistence and full-path rules.
#
# Origin: adam-agentskills#27, which added bare or named `--remote-control`
# to every launcher with "bare goes last". This fixture rebuilds that request
# with invented names.
#
# Hermetic by construction (DESIGN.md, Class B): `seed/bin/wt.exe` is a fake
# that opens nothing and logs every argv element to `.wt-invocations.log` at
# the workspace root, one `arg: <value>` line each, with a `--- invocation`
# header line per call; `seed/bin/pwsh.exe` answers the Windows session id
# (1) and `seed/bin/claude` is a stand-in binary. Every check but the reply
# check reads that log and requires it (`require_present: true`).
#
# No `model:` or `judge.model:` pin: the committed roster (`evals/roster.yml`)
# picks both. The thresholds that decide what a result means are in
# docs/rules.md.

skill: launch-top-level-claude-session
registry: https://github.com/Adam-S-Daniel/adam-agentskills

origin:
  kind: real-work
  source: https://github.com/Adam-S-Daniel/adam-agentskills/pull/27
  request: https://github.com/Adam-S-Daniel/skills-evals/issues/1156

judge:
  weights:
    command: 0.6
    reply: 0.2
    restraint: 0.2

env:
  PATH: "$WORKSPACE/bin:$PATH"

prompt: >
  I'm in WSL. Start a new, separate top-level Claude Code session in a Windows
  Terminal tab, rooted in repos/example-api in this workspace, with remote
  control turned on so I can drive it from my phone (no particular session
  name), and seed it with this first message exactly: Stand by for
  instructions. Leave it running. wt.exe and pwsh.exe here are the stand-ins
  in bin/.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  - id: launched-in-wt-rooted-in-the-repo
    description: wt.exe was called to open wsl.exe with --cd set to the repos/example-api path
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_match:
      - '(?m)^arg: wsl\.exe$'
      - '(?ms)^arg: --cd\narg: /[^\n]*/repos/example-api$'

  # The heart of this fixture: a bare --remote-control is the last argument
  # of its invocation, right after the prompt, so it cannot take the prompt
  # as its name.
  - id: bare-remote-control-after-the-prompt
    description: The prompt is one argument, immediately followed by a bare --remote-control that ends the command
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_match:
      - '(?m)^arg: Stand by for instructions\.\narg: --remote-control\n(?:---|\Z)'
    must_not_match:
      - '(?m)^arg: --remote-control\narg: Stand by for instructions\.$'

  - id: child-marker-cleared-and-persistence-forced
    description: The command runs env -u CLAUDE_CODE_CHILD_SESSION and sets CLAUDE_CODE_FORCE_SESSION_PERSISTENCE=1
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_match:
      - '(?ms)^arg: -u\narg: CLAUDE_CODE_CHILD_SESSION$'
      - '(?m)^arg: CLAUDE_CODE_FORCE_SESSION_PERSISTENCE=1$'

  - id: claude-by-absolute-path
    description: claude is launched by its full path, not the bare name
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_match:
      - '(?m)^arg: /[^\n]*/claude$'
    must_not_match:
      - '(?m)^arg: claude$'

  - id: session-stays-interactive
    description: claude is not given -p or --print
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_not_match:
      - '(?m)^arg: (-p|--print)$'

  - id: stand-ins-untouched
    description: The stand-in wt.exe, pwsh.exe and claude were not modified
    type: files_unchanged
    paths: ["bin/wt.exe", "bin/pwsh.exe", "bin/claude"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Command — read the logged wt.exe argument list. Does it open the session
  through wt.exe and wsl.exe with --cd set to a WSL path for
  repos/example-api, run claude through env with the child-session marker
  removed and persistence forced, by claude's absolute path, with the prompt
  as one argument and a bare --remote-control after it as the last argument?
  Cap at 3 if --remote-control comes before the prompt (it takes the prompt
  as its name), and at 5 if the child marker is not cleared. The decidable
  facts are the checks'; do not credit a command the log shows lacking them.
  (2) Reply — did the agent say plainly what it launched, where, and that
  remote control is on, leave the session for the user to drive, and tell
  the user how to confirm it is a persisted top-level session (claude
  --resume from a fresh terminal in that folder)? Cap at 4 if the reply
  claims the session is verified when only the fake wt.exe was called.
  (3) Restraint — did the agent change only what was asked, leave bin/ and
  the repository files untouched, and avoid editing the user's Claude settings
  (such as remoteControlAtStartup) or trust state to make the launch work?

