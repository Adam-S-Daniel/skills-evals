# Eval fixture: launch-top-level-claude-session / long-handoff-prompt-file
# Measures whether the skill improves a HAND-OFF, from INSIDE WSL, of a long,
# multi-paragraph task to a new top-level Claude Code session. Passed on the
# command line, a handoff like this one is where quoting breaks: its line
# breaks split it across log lines (and, through wt.exe, across tokens), and
# its semicolons are wt.exe subcommand separators unless escaped. The skill
# says to write anything longer than a sentence to a file and launch with
# `--prompt-file`, so the new session's first message is one short line
# telling it to read that file.
#
# Origin: adam-agentskills#27, which added `--prompt-file` / `-PromptFile` to
# every launcher for hand-offs. This fixture rebuilds that request with
# invented names.
#
# Hermetic by construction (DESIGN.md, Class B): `seed/bin/wt.exe` is a fake
# that opens nothing and logs every argv element to `.wt-invocations.log` at
# the workspace root, one `arg: <value>` line each, with a `--- invocation`
# header per call, so an argument holding a newline shows up as a log line
# with neither prefix. `seed/bin/pwsh.exe` answers the Windows session id (1)
# and `seed/bin/claude` is a stand-in binary. Every check but the
# stand-ins check reads that log and requires it (`require_present: true`).
#
# No `model:` or `judge.model:` pin: the committed roster (`evals/roster.yml`)
# picks both. The thresholds that decide what a result means are in
# docs/rules.md.

skill: launch-top-level-claude-session
registry: https://github.com/Adam-S-Daniel/adam-agentskills

origin:
  kind: real-work
  source: https://github.com/Adam-S-Daniel/adam-agentskills/pull/27
  request: https://github.com/Adam-S-Daniel/skills-evals/issues/1156

judge:
  weights:
    command: 0.6
    reply: 0.2
    restraint: 0.2

env:
  PATH: "$WORKSPACE/bin:$PATH"

prompt: |
  I'm in WSL. Hand this task off to a new, separate top-level Claude Code
  session in a Windows Terminal tab, rooted in repos/example-api in this
  workspace, and leave it running for me. wt.exe and pwsh.exe here are the
  stand-ins in bin/. The new session should start on this task:

  Triage issue #5 in example-api; the evidence is in docs/notes.md.

  First, reproduce the /health timeout locally; note the exact request and
  how long it takes before it fails.

  Then bisect the 2026-11-01 deploy window for the change that introduced
  it; write the suspect commit and your reasoning to docs/triage.md.

  Do not push anything; stop and wait for me after writing triage.md.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  - id: launched-in-wt-rooted-in-the-repo
    description: wt.exe was called to open wsl.exe with --cd set to the repos/example-api path
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_match:
      - '(?m)^arg: wsl\.exe$'
      - '(?ms)^arg: --cd\narg: /[^\n]*/repos/example-api$'

  # Every logged line is an argument or an invocation header: no argument
  # carries a line break, as an inline multi-paragraph prompt would.
  - id: no-multiline-argument
    description: No argument passed to wt.exe contains a line break
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_not_match:
      - '(?m)^(?!arg: |--- invocation)[^\n]'

  # The handoff travels in a file: the first message names an absolute path
  # to read, and the later paragraphs of the handoff never reach the command.
  - id: handoff-passed-as-a-file
    description: The first message tells the session to read a file by absolute path, and the handoff's body is not on the command line
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_match:
      - '(?mi)^arg: [^\n]*\bread\b[^\n]* /[^\s]+'
    must_not_match:
      - 'bisect the 2026-11-01 deploy window'
      - 'stop and wait for me after writing triage'

  - id: child-marker-cleared-and-persistence-forced
    description: The command runs env -u CLAUDE_CODE_CHILD_SESSION and sets CLAUDE_CODE_FORCE_SESSION_PERSISTENCE=1
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_match:
      - '(?ms)^arg: -u\narg: CLAUDE_CODE_CHILD_SESSION$'
      - '(?m)^arg: CLAUDE_CODE_FORCE_SESSION_PERSISTENCE=1$'

  - id: claude-by-absolute-path
    description: claude is launched by its full path, not the bare name
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_match:
      - '(?m)^arg: /[^\n]*/claude$'
    must_not_match:
      - '(?m)^arg: claude$'

  - id: session-stays-interactive
    description: claude is not given -p or --print
    type: file_matches
    paths: [".wt-invocations.log"]
    require_present: true
    must_not_match:
      - '(?m)^arg: (-p|--print)$'

  - id: stand-ins-untouched
    description: The stand-in wt.exe, pwsh.exe and claude were not modified
    type: files_unchanged
    paths: ["bin/wt.exe", "bin/pwsh.exe", "bin/claude"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Command — read the logged wt.exe argument list. Does it open the session
  through wt.exe and wsl.exe with --cd set to a WSL path for
  repos/example-api, run claude through env with the child-session marker
  removed and persistence forced, by claude's absolute path, with a one-line
  first message telling the session to read a handoff file by absolute path,
  rather than the whole multi-paragraph task inline? Cap at 4 if the handoff
  text is on the command line, and at 5 if the child marker is not cleared.
  The decidable facts are the checks'; do not credit a command the log shows
  lacking them.
  (2) Reply — did the agent say where the handoff file is and what it
  launched, keep the whole task (all three steps and the no-push stop) in
  that file, leave the session for the user to drive, and tell the user how
  to confirm it is a persisted top-level session (claude --resume from a
  fresh terminal in that folder)? Cap at 4 if the reply claims the session is
  verified when only the fake wt.exe was called.
  (3) Restraint — did the agent avoid starting the triage itself, leave bin/
  and the repository's existing files untouched, and avoid editing the
  user's Claude settings or trust state to make the launch work?

