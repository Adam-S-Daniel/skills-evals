# The weekly allowance budget for every automated eval (#68).
#
# Adam's standing decision (25% since 2026-11-02, his steady-state goal; 30%
# from 2026-10-10,
# https://github.com/Adam-S-Daniel/skills-evals/issues/68#issuecomment-6097945979):
# all automated evals together stay within 25% of the Claude subscription's
# weekly allowance. Every value below is a fraction of that allowance, as the
# CLI's meter reports it (`unifiedWindows.seven_day.utilization`, 0 to 1), so
# 0.01 is one point, and points = percent of the weekly allowance.
#
# Three layers read this file (docs/how-it-works.md, "The weekly allowance
# guard"):
#   * harness/run_eval.py stops starting new trials and judge calls once a
#     run has spent `per_run_cap` or the account is at
#     `stop_when_account_above` (the in-run stop);
#   * scripts/allowance_guard.py refuses a routine fire whose reservation
#     would take the eval spend since the account's last weekly reset past
#     `weekly_cap` (the pre-fire check in routine-eval-fire.yml);
#   * scripts/plan_scheduled_evals.py plans only as many weekly fires as fit
#     under `weekly_cap` (routine-eval-weekly.yml).
#
# The loop's own automatic scheduled jobs share this cap (Adam, 2026-11-15:
# every automated part of the continuous improvement system fits inside the
# 25%). scripts/allowance_guard.py therefore reserves their measured weekly
# meter use out of `weekly_cap` before any fire: the dashboard refresh writes
# it to spend/weekly.json's `loop_jobs` (scripts/automatic_spend.py), and the
# guard refuses, saying so, when that figure is missing or older than 3 days.
# Nothing is typed in here for it.
#
# harness/budget.py validates it strictly: exactly these four keys, each a
# number above 0 and at most 1, and `per_run_cap` no larger than
# `weekly_cap`, plus `claude_plan` below. A change here is a spending
# decision: it is Adam's.

# 25 points: all automated evals together, in each allowance week of the
# account (Monday 17:00 UTC to the next; Adam, 2026-10-26), so a sanctioned
# push in one week is not charged to the next. 100 for the finish week that
# ended 2026-11-09 17:00 UTC (Adam, 2026-11-02).
weekly_cap: 0.25

# 1 point: one run stops starting new work once its own calls have cost this
# much by the allowance estimate (below); before 2026-11-03, once the meter had
# moved this much since the run's first reading. Adam, 2026-11-01, permanently: of the
# 258 metered runs to then, none moved the meter 3 points, 5 moved it 2 and
# 74 moved it 1 (95th and 97.5th percentiles 1 point, 99th 2), so the
# 3-point value (set with the guard in #388, before any run was measured)
# reserved several times what a run spends. The meter reads whole points
# only, so a run stopped at its first 1-point tick, which Adam's own use can
# also cause; charging the run its own spend ended that.
per_run_cap: 0.01

# Added to a run's charge only when the run is charged by its meter delta or
# its reservation; a run priced from its own calls' token counts is charged
# that measured cost alone (Adam, 2026-11-25: "Count runs at their measured
# cost"). Pending fires keep it. The routine session that ran the eval has a
# cost no summary records: about $0.67 per fire (12 fires measured), which is
# about 0.0003 at the rate below. Since 2026-11-25 a run priced from its own
# calls is charged that session's measured cost instead, once per run: the
# spend file's `eval_routine.points_per_fire` (the median eval runner fire in
# the fire ledger's last 14 days; dashboard/build.py). This value is the named
# fallback when that block is missing or stale, and the guard's message says
# so (scripts/allowance_guard.py, "Eval routine session"). It also covers each run's last call (agent
# or judge), which the meter delta never includes: 0.180 points at p95 over
# 258 metered runs (Adam, 2026-11-01: "Use p95 now and in the future";
# 0.311 at most). Was 0.5 points, then 0.2, then 0.18; 0.05 since
# 2026-11-06 (docs/how-it-works.md, "The weekly allowance guard").
per_run_overrun: 0.0005

# How runs are charged (2026-11-20): from their token counts by type, priced
# with the weight table that evals/usage-weights.lock pins
# (harness/allowance_points.py), not from dollars at a flat rate. The flat
# rate it replaces, 0.0015 of the week per dollar ($6.67 a point, Adam,
# 2026-11-11), charged eval runs about 1.9 to 2.6 times their real use: two
# controlled quiet nights (2026-11-19 and 2026-11-20) measured the meter
# directly. scripts/allowance_guard.py charges each run its estimated points
# plus `per_run_overrun`, and harness/run_eval.py holds `per_run_cap` against
# the same estimate.
#
# Dollars per point for the calls recorded WITHOUT token counts (summaries
# from before tokens were kept, a result with no `modelUsage`, a model the
# table does not price). Night 1 (2026-11-19) measured the eval mix at $17.15
# a point on Opus 5.5 and $12.35 on Sonnet 5.5; this is the lower, so a call
# with no tokens is never charged less than it may have used. Not a fraction
# of the week like the keys above: dollars per point.
legacy_usd_per_point: 12.35

# 80 points: once the account's own weekly meter reads this high, a run stops
# starting new work, whatever it has spent, so evals never take the last of
# the allowance from Adam's own work. Since 2026-11-01 it is also the fire
# limit: scripts/allowance_guard.py starts no fire past it (Adam, "Unify the
# limit"). The finish week that ended 2026-11-09 17:00 UTC ran at 85 to 96
# (Adam, 2026-11-02 to 2026-11-09).
stop_when_account_above: 0.80

# The subscription this account is on, which decides whether the 5-hour stop
# applies (harness/budget.py, FIVE_HOUR_WINDOW, cites Anthropic's help center
# for each plan). Ultra, formerly Max 20x: a verified Ultra account has no
# 5-hour limit (https://support.claude.com/en/articles/17728952), and this
# account's meter has shown none since 2026-10-30 (the CLI's snapshots in
# ingested runs and the owner's usage-endpoint collector carry only the weekly
# windows), so neither `stop_when_session_above` nor `working_hours` is set.
# On a plan with a 5-hour window both apply, for example:
#
#   stop_when_session_above: 0.90
#   working_hours:
#     timezone: America/New_York
#     days: [mon, tue, wed, thu, fri]
#     start: "09:00"
#     end: "18:00"
#     session_stop: 0.50
#
# `session_stop` replaces `stop_when_session_above` from 5 hours before
# `start` (a window opened then is still open when work begins) until `end`.
claude_plan: ultra
