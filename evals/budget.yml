# The weekly allowance budget for every automated eval (#68).
#
# Adam's standing decision (2026-10-10,
# https://github.com/Adam-S-Daniel/skills-evals/issues/68#issuecomment-6097945979):
# all automated evals together stay within 30% of the Claude subscription's
# weekly allowance. Every value below is a fraction of that allowance, as the
# CLI's meter reports it (`unifiedWindows.seven_day.utilization`, 0 to 1), so
# 0.01 is one point, and points = percent of the weekly allowance.
#
# Three layers read this file (docs/how-it-works.md, "The weekly allowance
# guard"):
#   * harness/run_eval.py stops starting new trials and judge calls once a
#     run has spent `per_run_cap` or the account is at
#     `stop_when_account_above` (the in-run stop);
#   * scripts/allowance_guard.py refuses a routine fire whose reservation
#     would take the eval spend since the account's last weekly reset past
#     `weekly_cap` (the pre-fire check in routine-eval-fire.yml);
#   * scripts/plan_scheduled_evals.py plans only as many weekly fires as fit
#     under `weekly_cap` (routine-eval-weekly.yml).
#
# harness/budget.py validates it strictly: exactly these four keys, each a
# number above 0 and at most 1, and `per_run_cap` no larger than
# `weekly_cap`. A change here is a spending decision: it is Adam's.

# 30 points: all automated evals together, in each allowance week of the
# account (Monday 17:00 UTC to the next; Adam, 2026-10-26), so a sanctioned
# push in one week is not charged to the next.
# Temporarily raised for the week ending 2026-11-02 17:00 UTC (Adam,
# 2026-10-27: 50, after two improve fires' estimated charge had left 2.5
# points, which blocked every fire; 2026-10-28: "a smidge" more, 55; then
# 60, so the first guidance-improve fire could go; 2026-10-31: 1.00, "run
# evals up to the 80% stop", so only `stop_when_account_above` binds); back
# to 0.30 after that reset.
weekly_cap: 1.00

# 1 point: one run stops starting new work once the meter has moved this
# much since the run's first reading. Adam, 2026-11-01, permanently: of the
# 258 metered runs to then, none moved the meter 3 points, 5 moved it 2 and
# 74 moved it 1 (95th and 97.5th percentiles 1 point, 99th 2), so the
# 3-point value (set with the guard in #388, before any run was measured)
# reserved several times what a run spends. The meter reads whole points
# only, so a run stops at its first 1-point tick, which Adam's own use can
# also cause.
per_run_cap: 0.01

# Added to every run's measured spend: the meter is read as each call
# begins, so the run's last call (agent or judge) is never inside the
# measured delta. Set to the 95th percentile of each run's largest single
# call (Adam, 2026-11-01: "Use p95 now and in the future"); recalculate with
# `python3 scripts/run_costs.py --results-tree <persistent/eval-results>`,
# which prints the value to use. Over 258 metered runs, at 0.220 points per
# dollar of agent, judge and guard calls, that call was 0.180 points at p95
# (0.311 at most). Was 0.5 points, then 0.2.
per_run_overrun: 0.0018

# 80 points: once the account's own weekly meter reads this high, a run stops
# starting new work, whatever it has spent, so evals never take the last of
# the allowance from Adam's own work. Since 2026-11-01 it is also the fire
# limit: scripts/allowance_guard.py starts no fire past it (Adam, "Unify the
# limit"). Raised to 95 for the week ending 2026-11-02 17:00 UTC (Adam,
# 2026-11-01: "Raise to 95%"); back to 0.80 after that reset.
stop_when_account_above: 0.95
