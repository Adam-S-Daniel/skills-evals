# The weekly allowance budget for every automated eval (#68).
#
# Adam's standing decision (2026-10-10,
# https://github.com/Adam-S-Daniel/skills-evals/issues/68#issuecomment-6097945979):
# all automated evals together stay within 30% of the Claude subscription's
# weekly allowance. Every value below is a fraction of that allowance, as the
# CLI's meter reports it (`unifiedWindows.seven_day.utilization`, 0 to 1), so
# 0.01 is one point, and points = percent of the weekly allowance.
#
# Three layers read this file (docs/how-it-works.md, "The weekly allowance
# guard"):
#   * harness/run_eval.py stops starting new trials and judge calls once a
#     run has spent `per_run_cap` or the account is at
#     `stop_when_account_above` (the in-run stop);
#   * scripts/allowance_guard.py refuses a routine fire whose reservation
#     would take the eval spend since the account's last weekly reset past
#     `weekly_cap` (the pre-fire check in routine-eval-fire.yml);
#   * scripts/plan_scheduled_evals.py plans only as many weekly fires as fit
#     under `weekly_cap` (routine-eval-weekly.yml).
#
# harness/budget.py validates it strictly: exactly these four keys, each a
# number above 0 and at most 1, and `per_run_cap` no larger than
# `weekly_cap`. A change here is a spending decision: it is Adam's.

# 100 points for the allowance week ending Mon 2026-11-09 17:00 UTC only
# (Adam, 2026-11-02, finish-week push). Restore to 0.25 after that reset
# (Adam's steady-state goal, 2026-11-02). Normally: all automated evals
# together, in each allowance week of the account (Monday 17:00 UTC to the
# next; Adam, 2026-10-26), so a sanctioned push in one week is not charged to
# the next.
weekly_cap: 1.00

# 1 point: one run stops starting new work once its own calls have cost this
# much at `points_per_usd` (below); before 2026-11-03, once the meter had
# moved this much since the run's first reading. Adam, 2026-11-01, permanently: of the
# 258 metered runs to then, none moved the meter 3 points, 5 moved it 2 and
# 74 moved it 1 (95th and 97.5th percentiles 1 point, 99th 2), so the
# 3-point value (set with the guard in #388, before any run was measured)
# reserved several times what a run spends. The meter reads whole points
# only, so a run stopped at its first 1-point tick, which Adam's own use can
# also cause; `points_per_usd` ended that.
per_run_cap: 0.01

# Added to every run's charge. The routine session that ran the eval has a
# cost no summary records: about $0.67 per fire (12 fires measured), which is
# about 0.0003 at the rate below. It also covers each run's last call (agent
# or judge), which the meter delta never includes: 0.180 points at p95 over
# 258 metered runs (Adam, 2026-11-01: "Use p95 now and in the future";
# 0.311 at most). Was 0.5 points, then 0.2, then 0.18.
per_run_overrun: 0.0005

# The allowance one dollar of API-equivalent spend uses: $20 per point, the
# low end of the rate measured on 2026-11-04 (about $24 per point, range $20
# to $35), so charges err high. scripts/allowance_guard.py charges each run
# `usage.cost_estimate.usd` times this plus `per_run_overrun`, not the
# account meter's movement: the meter is the whole account's, so it charged
# each run with every other thread's use and booked 116 points of eval spend
# against about 23 real in the week to 2026-11-04. A run with no usable
# dollar figure falls back to the meter. `per_run_cap` is charged the same way
# (harness/run_eval.py), so the in-run stop and the weekly cap now share a
# rate. Before 2026-11-04 it was 0.214 points per dollar over 288 metered
# runs (2026-11-03, `python3 scripts/run_costs.py --results-tree
# <persistent/eval-results>`), which is $4.67 per point.
points_per_usd: 0.0005

# 80 points: once the account's own weekly meter reads this high, a run stops
# starting new work, whatever it has spent, so evals never take the last of
# the allowance from Adam's own work. Since 2026-11-01 it is also the fire
# limit: scripts/allowance_guard.py starts no fire past it (Adam, "Unify the
# limit"). 95 points for the allowance week ending 2026-11-09 17:00 UTC only
# (Adam, 2026-11-02); 85 from 2026-11-07 17:51 UTC, when Adam asked to slow
# evals so his other work keeps room before the reset. Restore to 0.80 after
# that reset.
stop_when_account_above: 0.85
