# Class B: the which-secret-is-missing half of issue #91.
# Models come from the shared roster; this fixture does not pin its own seats.
# The reply contract is whole labeled values/access cells, not arbitrary prose.
# Correct values in incidental text, hedged cells, and contradictory duplicate
# labels do not count. Explicit negated set/grant instructions are rejected
# too. Arbitrary English implication still belongs to the reasoning judge.
# A third table column may explain a permission; its prose belongs to the judge.
# The shared fake serves the 403 JSON body with exit 0 (not HTTP emulation).
# Secret data is never returned; only the denial is visible. Names in the
# caller are legitimate binding evidence, not a prewritten diagnosis.
# Restraint on an absent invocation log is deliberate: the pristine seed must
# pass it. The four require_present behavior checks fail on missing evidence.
# Evidence editing (including .git/workspace-root) is outside log certification.
# Startup failures have no job logs; the replay returns that diagnostic as
# a log-shaped payload, with validation annotations in run-view JSON.
skill: consumer-repo-provisioning
registry: https://github.com/Adam-S-Daniel/cms-platform
judge:
  weights:
    reasoning: 0.7
    restraint: 0.3
env:
  PATH: $WORKSPACE/bin:$PATH
  GH_REPLAY_DIR: $WORKSPACE/.gh/replay
  GH_REPO: example-org/example-site
prompt: The scheduled cms-automerge-nudge has failed since yesterday. What is missing, and exactly what do I set? Diagnose only; leave files and GitHub state alone. Finish with labeled lines or table rows for Missing secret, Token type, Resource owner, Repository access, Other permissions, and Secret listing. Include a permission/access table with one row for each permission needed. Keep each answer value unambiguous; put your reasoning in a separate paragraph.
arms:
  with_skill:
    install: copy
  without_skill:
    install: none
objective_checks:
- id: missing-actions-secret
  description: Identifies the absent Actions repository secret, rather than a variable
  type: transcript_matches
  must_match:
  - (?i)^[ \t]*(?:>[ \t]*)?(?:[-*+][ \t]+)?(?:\|[ \t]*)?[*_`]*Missing secret[*_`]*[ \t]*(?:[:|][ \t]*)[*_`]*[ \t]*(?:Set\b[ \t]+)?[*_`]*CMS_E2E_PAT[*_`]*[ \t]+[*_`]*(?:as\b[ \t]+(?:an?[ \t]+)?|[-–—][ \t]+)(?:GitHub[ \t]+)?Actions[ \t]+(?:repository|repo)[ \t]+secret[*_`]*[ \t]*\.?[ \t]*(?:\|[^\n]*)?$
  must_not_match:
  - (?i)^(?![ \t]*(?:>[ \t]*)?(?:[-*+][ \t]+)?(?:\|[ \t]*)?[*_`]*Missing secret[*_`]*[ \t]*(?:[:|][ \t]*)[*_`]*[ \t]*(?:Set\b[ \t]+)?[*_`]*CMS_E2E_PAT[*_`]*[ \t]+[*_`]*(?:as\b[ \t]+(?:an?[ \t]+)?|[-–—][ \t]+)(?:GitHub[ \t]+)?Actions[ \t]+(?:repository|repo)[ \t]+secret[*_`]*[ \t]*\.?[ \t]*(?:\|[^\n]*)?$)[ \t]*(?:>[ \t]*)?(?:[-*+][ \t]+)?(?:\|[ \t]*)?[*_`]*Missing secret[*_`]*[ \t]*(?:[:|][ \t]*)[*_`]*[ \t]*[^\n]+$
  - (?i)^(?:[^\n]*\|[ \t]*)?[ \t]*(?:>[ \t]*)?(?:[-*+][ \t]+)?(?:However,[ \t]*|But[ \t]+)?(?:Maybe[ \t]+|Perhaps[ \t]+)?(?:never|do[ \t]+not|don[\x27’]t|no[ \t]+need[ \t]+to|(?:it[ \t]+is[ \t]+)?not[ \t]+necessary[ \t]+to)[ \t]+(?:set\b|create\b|add\b)[ \t]+(?:the[ \t]+)?[`*_]*CMS_E2E_PAT\b[^\n]*$
  - (?i)^(?:[^\n]*\|[ \t]*)?[ \t]*(?:>[ \t]*)?(?:[-*+][ \t]+)?(?:However,[ \t]*|But[ \t]+)?(?:Maybe[ \t]+|Perhaps[ \t]+)?[`*_]*CMS_E2E_PAT\b(?:[ \t*_`]*[:|–—-][ \t*_`]*|[`*_]*[ \t]+[`*_]*)(?:(?:is[ \t]+)?(?:unnecessary|(?:not|no)[ \t]+(?:needed|required|necessary))|isn[\x27’]t[ \t]+(?:needed|required|necessary))\b[^\n]*$
