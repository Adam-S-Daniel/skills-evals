  - (?i)^[^\n]*\bno[ \t]+[`*_]*CMS_E2E_PAT\b[`*_]*[ \t]+[`*_]*(?:needed|required|necessary)\b[^\n]*$
  - (?i)^[^\n]*\b(?:you[ \t]+)?should(?:[ \t]+not|n[\x27’]t)[ \t]+(?:set\b|create\b|add\b)[ \t]+(?:the[ \t]+)?[`*_]*CMS_E2E_PAT\b[^\n]*$
  - (?i)^[^\n]*\bCMS_E2E_PAT[`*_]*[ \t]+(?:is[ \t]+not|isn[\x27’]t)[ \t]+(?:the[ \t]+)?missing(?:[ \t]+secret)?\b[^\n]*$
