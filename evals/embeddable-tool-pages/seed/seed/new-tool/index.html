<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Length Converter</title>
<style>body { font-family: sans-serif; max-width: 32rem; margin: 2rem auto; padding: 1rem; } label { display: block; margin: 1rem 0; } input, select { font: inherit; padding: .4rem; } output { display: block; margin-top: 1rem; }</style>
</head>
<body>
<h1>Length Converter</h1>
<label>Distance <input id="distance" type="number" value="1" step="any"></label>
<label>From <select id="from"><option value="1">Meters</option><option value="0.3048">Feet</option></select></label>
<label>To <select id="to"><option value="0.3048">Feet</option><option value="1">Meters</option></select></label>
<output id="result" aria-live="polite"></output>
<script>
const distance = document.getElementById('distance');
const from = document.getElementById('from');
const to = document.getElementById('to');
const result = document.getElementById('result');
function convert() {
  const value = Number(distance.value) * Number(from.value) / Number(to.value);
  result.textContent = distance.value === '' ? 'Enter a distance.' : value.toFixed(4) + ' ' + to.selectedOptions[0].textContent.toLowerCase();
}
for (const field of [distance, from, to]) field.addEventListener('input', convert);
convert();
</script>
</body>
</html>
