# The keep, remove and re-check rules for skills and guidance sections: the
# source of truth. harness/gates.py reads it (`load_gate_policy`, which
# refuses a missing, unknown or out-of-range key); scripts/plan_week.py and
# scripts/retire_skill.py read it too. The rules in plain English, with the
# current values: docs/rules.md, generated from this file by
# scripts/build_rules.py. Edit the values here, then run
# `python3 scripts/build_rules.py`. The statistics behind each test:
# harness/gates.py's docstring. Decisions and their history:
# docs/decisions/0014-removal-pull-requests-merge-without-review.md.
#
# Keys of each block (`skills:` and `guidance:`, kept apart so they can
# diverge):
#   objective_margin       a cell shows no benefit when its gain D = with -
#                          without is confidently below this (0 to 1).
#   judge_margin           the judge's margin on its 0-to-10 scale; the judge
#                          is reported but does not vote.
#   benefit_confidence     the keep test's level, split over the subject's
#                          cells (Bonferroni).
#   retire_confidence      the level of the remove, harm, no-harm and ceiling
#                          tests, per cell.
#   min_cli_versions       Claude Code versions a removal's pairs must span.
#   max_runs_per_cell      the pair cap: a cell is not fired past it.
#   max_runs_high_cell     pairs after which a high cell may stop as
#                          `ceiling-unconfirmed` (at most max_runs_per_cell).
#   high_stop_min_without  the least without-arm mean such a stop needs.
#   floor_fraction         a cell whose arms both pass at most this share is a
#                          broken fixture (`cannot-discriminate`) ...
#   floor_min_runs         ... once it has this many pairs.
#   recheck_weeks          a decided subject is re-checked this many weeks
#                          after its newest run (scripts/plan_week.py) ...
#   recheck_weeks_high     ... or this many for a `stakes: high` one
#                          (evals/stakes.yml).
#   max_removal_pauses     removals the loop may withdraw for one subject
#                          before it files the owner's proposal issue instead
#                          (scripts/retire_skill.py; the same in both blocks).
#   retirement_mode        `auto` (a retire verdict opens a removal that
#                          merges with no human review) or `proposal` (an
#                          issue; a person removes). Missing or invalid is
#                          `proposal`.
# Guidance block only (ADR 0014, "Pooled-rest addendum (2026-11-07)"):
#   rest_policy            `pooled-with-current-guard` pools pairs made beside
#                          every rest of the guidance, guarded by the current
#                          rest; `current` reads the current rest only.
#   rest_guard_min_pairs   pairs beside the current rest a removal-direction
#                          decision needs.
skills:
  objective_margin: 0.15
  judge_margin: 1.5
  benefit_confidence: 0.80
  retire_confidence: 0.90
  min_cli_versions: 2
  max_runs_per_cell: 20
  max_runs_high_cell: 20
  floor_fraction: 0.10
  floor_min_runs: 3
  high_stop_min_without: 0.90
  recheck_weeks: 8
  recheck_weeks_high: 4
  max_removal_pauses: 3
  retirement_mode: auto
guidance:
  objective_margin: 0.15
  judge_margin: 1.5
  benefit_confidence: 0.80
  retire_confidence: 0.90
  min_cli_versions: 2
  max_runs_per_cell: 20
  max_runs_high_cell: 20
  floor_fraction: 0.10
  floor_min_runs: 3
  high_stop_min_without: 0.90
  recheck_weeks: 8
  recheck_weeks_high: 4
  max_removal_pauses: 3
  retirement_mode: auto
  rest_policy: pooled-with-current-guard
  rest_guard_min_pairs: 6
