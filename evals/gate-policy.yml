# Thresholds for the retirement verdict, read by harness/gates.py (#70).
#
# Adam set the thresholds on 2026-10-10 (#70) and chose POOLED evidence on
# 2026-10-25, replacing #70's four weekly sweeps: a cell (skill, fixture,
# requested arm model) pools every validated run whose fixture, arm context
# and (for the with arm) skill content match the current ones, the run is
# the unit, and bounds over run means decide it. harness/gates.py's
# docstring says how each number is used.
#
# Confidences (Adam, 2026-10-31: decide on confidence alone, 85% to keep and
# 95% to remove): each is the two-sided level of an anytime-valid confidence
# sequence over run means (harness/gates.py, `confidence_sequence`), so a
# cell is checked after every run with no minimum run count and no fixed
# looks. Keep when the `benefit_confidence` sequence's lower end is above 0
# (or a check's, Holm-corrected at `check_confidence`); no benefit when the
# `retire_confidence` sequence's upper end is under the margin, and only
# once the runs span `min_cli_versions` Claude Code versions (removals
# only). `prior_strength` is how many runs' worth of weight the run-to-run
# spread measured across every evaluation gets against a cell's own spread.
#
# Every validated run counts, from `results/` and `routine-results/` alike
# (scripts/compute_gates.py): the gate guards against honest mistakes (a
# changed fixture or skill, a different guidance or skill set between the
# arms, errored trials, a copy of a run ingested twice), not against forged
# results, since anyone who can write the results can also remove a skill.
#
# `retirement_mode` is `auto` (a `retire` verdict opens a removal PR in
# adam-agentskills that auto-merges with no human review) or `proposal` (an
# issue is filed and a human removes). A missing or invalid value is
# `proposal`. It is `auto` by Adam's 2026-10-26 decision (removal pull
# requests auto-merge with no human; ADR 0014 and adam-agentskills ADR 0021);
# set it to `proposal` to turn removal pull requests off. Even in `auto`,
# scripts/retire_skill.py files the issue instead when the skill's plugin
# runs code or the scheduled workflow has no adam-agentskills write token,
# opens nothing while another loop pull request is open there, and acts only
# from the scheduled workflow, never a dispatched or pull-request run.
skills:
  objective_margin: 0.05
  judge_margin: 0.5
  benefit_confidence: 0.85
  retire_confidence: 0.95
  check_confidence: 0.85
  min_cli_versions: 2
  prior_strength: 4
  ceiling_fraction: 0.90
  judge_ceiling: 9.0
  floor_fraction: 0.10
  retirement_mode: auto
# Guidance sections (skills-evals#124): the same verdict over each section's
# ablation pair (full vs full-minus-section), with the section-vs-none pair
# read only for the `shorten-or-merge` outcome (harness/gates.py,
# `guidance_verdict`). Same starting values as skills, kept apart so they can
# diverge. Adam made section removal automatic on 2026-10-10 (#124) and
# removal pull requests auto-merging on 2026-10-25. The write path is the
# eval-improve GitHub App's token for _agent-guidance alone; with no token
# (the secrets are unset, the mint failed, or the App is not installed on
# _agent-guidance), scripts/retire_skill.py --target guidance files the
# issue instead. Set it to `proposal` to turn removal pull requests off.
guidance:
  objective_margin: 0.05
  judge_margin: 0.5
  benefit_confidence: 0.85
  retire_confidence: 0.95
  check_confidence: 0.85
  min_cli_versions: 2
  prior_strength: 4
  ceiling_fraction: 0.90
  judge_ceiling: 9.0
  floor_fraction: 0.10
  retirement_mode: auto
