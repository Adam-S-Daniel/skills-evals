# The public repositories .github/workflows/rules-consistency.yml checks daily
# with scripts/check_rule_restatements.py against docs/rules.json: the one
# place their names live. Each is shallow-cloned read-only with no token, so
# only public repositories belong here. `exclude` lists globs, relative to
# the repository root, of paths that are deliberately not this fleet's rules
# (an adopter's starter template ships its own example values).
repos:
  - repo: Adam-S-Daniel/_agent-guidance
    exclude:
      - docs/reference/adopt-the-whole-system/starter/*
  - repo: Adam-S-Daniel/adam-agentskills
  - repo: Adam-S-Daniel/acsi-kit
    exclude:
      - starter/*
  - repo: Adam-S-Daniel/adamdaniel.ai
