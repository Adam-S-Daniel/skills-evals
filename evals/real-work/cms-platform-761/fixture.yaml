prompt: |-
  Tags box: a trailing space is swallowed, an applied suggestion leaves no separator, and the chips are small on a phone

  Found in an exploratory round (adamdaniel.ai owner pass, local admin). Follow-ups to the Tags box from https://github.com/Adam-S-Daniel/cms-platform/pull/746.

  **Severity:** minor.

  ## 1. A space typed at the end of a tag is swallowed

  Steps (1440×900): in Posts → Tags type `agents, field`, press Space, type `notes`.
  Seen: the box shows `agents, fieldnotes`; `Field Notes` becomes `FieldNotes`. Because the space is gone, the near-duplicate warning never compares `Field Notes` with `field-notes`. A space inserted mid-word (after ArrowLeft) stays.
  Expected: the space stays, or the hint says multi-word tags use dashes.
  Cause: Decap's list widget `handleChange` runs `e.target.value.trim()` each time a key is pressed, so a trailing space never survives. `theme/admin/tags-input.js` only handles Space right after a comma.

  ## 2. Applying a suggestion leaves no separator

  Steps: type `rel`, Tab to the "release-notes" chip, Enter, then type `agent`.
  Seen: `release-notesagent`.
  Expected: `release-notes, ` after applying, as Enter in the box already does.

  ## 3. Suggestion and warning chips are small tap targets on a phone

  About 62×20 px at 390×844; 44 px tall would match the share buttons.

  Fix the Tags box shim in `theme/admin/tags-input.js` so that all three behave as expected.

  Interface the reviewer's tests use: the shim exposes its pure helpers on `window.__tagsInput`, and the tests load `theme/admin/tags-input.js` in a bare `vm` sandbox with no DOM. `replaceTag(value, index, replacement)` swaps piece `index` of the comma-separated box value and now ends the result with `, ` (comma, space), never leaving an empty piece before it; the other pieces are joined with a bare comma and no space. So swapping the lone piece `rel` for `release` gives `release, `, swapping piece 1 of `a, re` gives `a,release, `, and swapping piece 0 of `rel, b, ` (which already ends in a separator) gives `release,b, `. A new pure helper `holdsTrailingSpace(value, caretAtEnd)` returns true only when the caret is at the end and the value ends in exactly one space that follows a letter (`field ` and `agents, field ` are true; `field`, `agents, `, `agents,`, `field  `, a lone space and the empty string are false, as is any value when `caretAtEnd` is false).
