# Dependabot for cms-platform (the machinery repo itself).
#
# Down-sync to consuming SITES is separate: Dependabot in each site bumps
# the uses:@<tag> platform pins + the cms-platform-theme gem (see
# docs/SYNC.md). THIS config keeps the platform's OWN deps current:
#   - github-actions: the third-party actions pinned by full SHA across
#     .github/workflows/*.yml (actions/checkout, setup-node, setup-ruby,
#     aws-actions/*, dependabot/fetch-metadata, …).
#   - npm: the e2e harness toolchain (Playwright + helpers) under /e2e.
# Bundler is intentionally omitted — theme/ ships a bare .gemspec with no
# Gemfile.lock to resolve, so there is nothing for the bundler ecosystem
# to pin here.
#
# Opened PRs auto-merge once the required self-ci checks pass — see
# self-dependabot-auto-merge.yml + .github/rulesets/main.json.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # MINIMUM PACKAGE AGE ("cooldown") — how long a release must exist before
    # Dependabot will even OPEN the PR. Version updates ONLY: security updates
    # bypass cooldown by GitHub's spec, so an advisory still opens (and
    # auto-merges) the moment the matrix is green. GitHub's own default is
    # 3 days, so `default-days: 7` here is a deliberate RAISE, not a floor
    # from zero. It mechanises this repo's standing cooling-off convention
    # for third-party action SHAs (AGENTS.md, "SHA-pin every workflow `uses:`"),
    # which until now depended on whoever happened to review the PR — and the
    # repaired Dependabot pipeline merges these UNATTENDED, so the bot has to
    # hold the wait instead.
    #
    # NO semver-major-days here — UNLIKE the npm block below. GitHub's
    # Dependabot options reference marks github-actions as supporting
    # `default-days` but NOT per-SemVer-tier cooldown at all, while npm
    # supports it fully; that split, not preference, is why the
    # setup-node-6->7-style major revert this repo has actually hit (#179)
    # gets no separate major-bump wait on the actions side — only the flat
    # 7 days above. Re-adding any `semver-*-days` key to THIS block is a
    # schema validation error ("...cooldown' is not supported for the
    # package ecosystem 'github-actions'") that disables the whole
    # `updates[]` entry, not a silently-ignored key.
    # dependabot/dependabot-core#14628 is the open upstream request to add
    # the support; until it lands, this stays flat. The group below does not
    # interact with cooldown: each release still waits its own 7 days before
    # it is eligible, and the group PR only collects those that have.
    cooldown:
      default-days: 7
    # GROUPING — minor+patch version updates collapse into ONE PR, majors do
    # not. Measured 2026-09-28: in 8 of the 11 weekly runs that opened any
    # github-actions PR since 2026-06-03, Dependabot opened 2-4 at once (2026-06-30: 4;
    # 2026-09-22: ruby/setup-ruby + aws-actions/configure-aws-credentials), so
    # the #118-122 batch-strand (see the npm block below) is the NORMAL case
    # here, not a rarity: once the first merges every later PR is behind main,
    # and a behind PR touching .github/workflows/* cannot be refreshed by
    # GITHUB_TOKEN (cms-platform#467 mitigates that with an App-token
    # refresh). Majors stay individual PRs so a bad one is revertible alone
    # (the setup-node 6->7 revert, #179). No `patterns` narrowing: "*" is
    # every action.
    groups:
      actions-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: "/e2e"
    schedule:
      interval: weekly
    # Same graduated wait, same reason: the e2e harness under /e2e is not
    # platform-internal — BOTH consumers check it out and execute it, so a bad
    # Playwright major reaches production CI the same way a bad action SHA
    # would. Playwright is the test RUNNER for the whole ~126-file suite, not
    # one dependency among many, so a major here is the class that most needs
    # deliberate handling rather than a red-CI scramble — 30 days is that room.
    # (An earlier version of this comment additionally claimed a Playwright
    # major requires a coupled .github/ci-runner/Dockerfile bump, citing the
    # playwright-image-drift guard. That coupling does not exist anywhere in
    # the fleet — measured 2026-08-31: no .github/ci-runner/ or root
    # package-lock.json in this repo, no .github/ci-runner/Dockerfile in
    # either consumer, and scaffold/create-site.js seeds neither. Don't
    # reintroduce it on the strength of this comment's own prior wording.)
    #
    # GROUPING — collapses a security batch into one PR (#118-122 postmortem).
    # A batch of Dependabot PRs opened together can strand indefinitely:
    # GitHub auto-disables auto-merge the moment the FIRST PR in the batch
    # merges, and every later merge in the batch also leaves the rest
    # genuinely behind main, which re-arming alone (dependabot-rearm-sweep.yml)
    # cannot fix by itself — it re-arms, it does not un-strand a PR whose base
    # has moved. One PR has nothing for that failure mode to act on.
    #
    # applies-to: security-updates ONLY, deliberately not version updates.
    # Version updates keep their per-package cooldown graduation above and
    # stay individually revertible — packages graduate out of cooldown at
    # different times, so grouping them would fight the very cooldown this
    # block sits next to. Security advisories bypass cooldown by GitHub's
    # spec (see the cooldown comment above), so they are the ones that
    # actually DO arrive as a simultaneous batch — exactly the batch that
    # strands under #118-122's mechanism.
    #
    # @playwright/test is excluded from the group on purpose, not swept in
    # with everything else: it is the test RUNNER for the entire /e2e suite
    # (~126 spec files) that BOTH consumer sites check out and execute in
    # their own production CI — the same blast-radius argument the major-bump
    # wait above is built on. Inside a group, one bad Playwright security bump
    # reds the ONE grouped PR and blocks every other security fix riding in
    # it; excluded, a bad Playwright bump costs one extra separate PR while
    # the rest of the group still lands unattended.
    #
    # This is a groups: block and NOT the repo-level "Grouped security
    # updates" UI toggle — verified 2026-08-31 against GitHub's REST docs for
    # repos and for org/enterprise code-security configurations: grouped
    # security updates has NO REST endpoint at either level (absent from the
    # security_and_analysis object, and code-security configurations are
    # org-only anyway — unreachable for a user-account fleet repo). It is the
    # one Dependabot setting that structurally CANNOT be declared as code, so
    # flipping it in the UI would reintroduce exactly the undeclared-live-
    # value class repo-settings.yml exists to prevent: no # why:, no drift
    # detection, nothing for the daily audit to see. GitHub's own settings
    # page states that a repo's dependabot.yml group rules override the
    # toggle — so this block is both the as-code path AND the one that wins.
    #
    # github-actions above groups minor+patch VERSION updates (measured
    # batches of 2-4 PRs) and leaves majors individual, for #179-style
    # isolation of one bad bump; this block's security group is separate.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
        exclude-patterns: ["@playwright/test"]
