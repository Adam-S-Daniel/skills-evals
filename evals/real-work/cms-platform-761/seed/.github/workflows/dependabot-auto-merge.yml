# Reusable: unattended-merge gate for Dependabot PRs.
#
# A consuming site calls this from a thin wrapper that owns the
# `pull_request` trigger + run-name (see
# examples/site/.github/workflows/dependabot-auto-merge.yml). Part of the
# platform down-sync: it auto-merges the platform-bump / gem Dependabot PRs
# once CI is green. Nothing site-specific is hardcoded — `gh` infers the repo
# from the runner, and the PR fields come from the caller's `pull_request`
# event.
#
# THE ONE PLATFORM-OWNED SCRIPT DEP: the manifest-path allowlist check lives
# in scripts/check-dependabot-manifest-paths.sh, in THIS repo — not the
# caller's. The job's default `actions/checkout` (no `repository:`) checks
# out the CALLER's tree (this is a `workflow_call` job; `github.repository`
# is the consumer at run time), so the allowlist script is not on disk unless
# a second checkout fetches it from the platform. Sparse-checked into
# `.cms-platform/` (a dot-dir Jekyll ignores), the same pattern
# pin-agreement.yml / editorial-label-audit.yml / scheduled-run-health.yml
# use for their own platform-owned scripts, via the same `platform_repo` /
# `platform_ref` inputs those reusables declare.
#
# `${{ github.job_workflow_sha }}` was tried first, as a way to fetch the
# exact commit of THIS reusable file without adding an input at all — but
# that context path is a known dead end (actions/runner#2417: it reads empty
# inside a reusable-workflow job). The commit SHA a reusable's OWN job steps
# can actually read is `job.workflow_sha` (a different, separate context,
# added 2026-04-23 for exactly this "check out my own defining file" case) —
# but this repo's pinned actionlint (1.7.7, 2025-05-30) predates that
# addition and fails the required lint on it. So this uses the same
# `platform_repo` / `platform_ref` input pair pin-agreement.yml already
# established, at the routine cost of one `with:` line in each of the two
# examples/site thin callers (kept at the release version, same as every
# other `platform_ref:` in that tree — see AGENTS.md #283).
name: Dependabot auto-merge (reusable)

# Flow:
#   1. Confirm the actor is dependabot[bot] (defence in depth — the
#      job-level `if:` would already skip non-Dependabot PRs).
#   2. Confirm the PR diff only touches dependency-manifest paths.
#      Dependabot already restricts itself to those by design, so a
#      diff outside this allowlist is a sign something is wrong —
#      bail out and leave the PR for human review.
#   3. Enable GitHub's native auto-merge with --squash. GitHub holds
#      the merge until every required status check on `main` passes
#      (e.g. e2e, visual-regression / approve-regression).
#
# Once the merge fires, the site's deploy-production workflow runs on the
# resulting push to main and ships the change. Preview environments per PR
# are already covered by deploy-preview's pull_request trigger and come up
# the moment Dependabot opens the PR.
#
# Security updates: Dependabot's 7-day cooldown applies to version
# updates only, not security updates. A vulnerability bump opens a PR
# immediately, lands here on the same auto-merge gate, and ships as
# soon as the test matrix is green.

on:
  workflow_call:
    inputs:
      platform_repo: { type: string, default: Adam-S-Daniel/cms-platform }
      platform_ref: { type: string, default: main }

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fetch the manifest-path allowlist script from the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          sparse-checkout: scripts/check-dependabot-manifest-paths.sh
          sparse-checkout-cone-mode: false
          path: .cms-platform

      - name: Fetch base ref
        # BASE_REF via `env:`, never `${{ }}` inside the body: a branch name
        # may legally contain `$( )`, backticks and `;` (git permits them),
        # and the runner expands an expression into the command TEXT before
        # bash parses it — so the substitution would run as code.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "$BASE_REF"

      - name: Get Dependabot metadata
        # Surfaces dependency-name / update-type / etc. as outputs.
        # Even though we don't gate on update-type (we trust the test
        # matrix to catch breakage in major bumps), the action also
        # validates that the PR genuinely came from Dependabot.
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98

      - name: Verify only manifest paths changed
        id: paths
        # Path allowlist: only dependency manifests and workflow
        # files. Dependabot doesn't touch anything else, so a diff
        # outside this list means either a misconfiguration or a
        # tampered branch — either way, refuse to auto-merge. The
        # allowlist itself lives in the platform's scripts/check-dependabot-
        # manifest-paths.sh (fetched into .cms-platform/ by the checkout step
        # above) — the single source shared with dependabot-rearm-sweep.yml's
        # scheduled re-arm sweep (see AGENTS.md "Dependabot batch-strand
        # re-arm sweep"); keep both call sites in lockstep.
        #
        # Both values via `env:` — see the "Fetch base ref" step above for
        # why an interpolated branch name is executable here.
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE="origin/${BASE_REF}"
          HEAD="$HEAD_SHA"

          if bash .cms-platform/scripts/check-dependabot-manifest-paths.sh "$BASE" "$HEAD"; then
            echo "safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "safe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable auto-merge
        if: steps.paths.outputs.safe == 'true'
        # --auto enables the same auto-merge feature exposed in the
        # GitHub UI: GitHub holds the merge until every required
        # status check on `main` reports success. The merge method
        # matches the CMS editorial workflow's choice (squash) so
        # main keeps a linear history of single-commit landings.
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disable auto-merge (path check failed)
        if: steps.paths.outputs.safe == 'false'
        # If a previous run already enabled auto-merge but the PR was
        # later updated to touch content paths, undo the enablement
        # so the merge can't fire. `|| true` because `--disable-auto`
        # errors when auto-merge wasn't enabled — we don't care.
        run: |
          gh pr merge --disable-auto "$PR_URL" || true
          echo "::error::PR touches paths outside the dependency-manifest allowlist; auto-merge disabled."
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
