# Reusable host-repo canary publish loop for platform sites.
#
# A consuming site calls this from a thin wrapper that owns the schedule /
# push / workflow_dispatch triggers + run-name (see
# examples/site/.github/workflows/cms-publish-loop-host.yml). The e2e
# harness, the cms-recursion-gate + await-prod-deploy + post-failure-comment
# composites all live in the PLATFORM repo, so each job checks the platform
# out into `.cms-platform/` and runs the suite from there. Site identity
# (CMS_PROD_URL / CMS_APEX) resolves to the CALLER's repo VARS under
# workflow_call.
#
# Runs the full Decap → cms PR → auto-merge → deploy-production loop
# end-to-end against prod, mutating a `_e2e/` canary entry (default
# canary-post). Mirrors cms-publish-loop-prod.yml's structure but
# targets the canary collection instead of `_posts/`.
#
# PLATFORM PORT NOTES (vs adamdaniel.ai@origin/main):
#   - The site's deployed identity is parameterized via repo VARS
#     (CMS_PROD_URL / CMS_APEX) so a consuming deployment supplies its
#     own URLs; CMS_REPO falls back to github.repository.
#   - The GHCR prebaked `ci-runner` image + its `build-image` job and
#     the `container:` block were DROPPED — that is adamdaniel-only
#     infra (a Jekyll/Ruby image pushed to that repo's GHCR namespace).
#     Deps install inline (Node + npm ci + playwright install), the
#     same shape e2e-tests.yml uses. The shared prod-mutating-loop
#     concurrency lane, the await-prod-deploy gate, and the
#     recursion-gate job — the load-bearing invariants — are preserved.
#   - The stuck-PR diagnostic steps were DROPPED: they shell out to
#     scripts/diagnose-stuck-pr.js (+ auto-resolve-newline-conflict.js),
#     CMS-PR-sweep tooling that is not part of the e2e harness scope.
#
# Spec gating: e2e/cms-publish-loop.spec.js self-skips when
# `RUN_HOST_REPO_PUBLISH_LOOP=1` is unset, so the spec only runs inside
# this workflow.
name: CMS Publish Loop — Host Repo (canary collection) (reusable)

on:
  workflow_call:
    inputs:
      platform_repo:
        description: "owner/name of the platform repo holding the e2e harness + composite actions."
        required: false
        type: string
        default: Adam-S-Daniel/cms-platform
      platform_ref:
        description: "Tag/sha of the platform repo to fetch the harness from (pin to the same ref as this workflow)."
        required: false
        type: string
        default: main
    secrets:
      CMS_E2E_PAT:
        required: false

permissions:
  # The spec drives admin via a fine-grained PAT (CMS_E2E_PAT) — the
  # workflow itself only needs contents:read to check out source.
  #
  # `pull-requests: write` is needed by the post-failure-comment
  # composite so the default GITHUB_TOKEN can post the failure-summary
  # comment via the issues comments API.
  #
  # `actions: read` lets the await-prod-deploy gate query this commit's
  # `Deploy to Production` run via the REST API.
  contents: read
  pull-requests: write
  actions: read

defaults:
  run:
    shell: bash

jobs:
  # Changed-files recursion gate. A push whose only changed files are
  # this loop's own canary churn skips the heavy job; schedule/dispatch
  # always run; any ambiguity fails OPEN. The `prod-mutating-loop` lane
  # lives on the heavy loop job, not the workflow, so this gate runs
  # OUTSIDE the lane: its skip decision is computed immediately even
  # while a real loop holds the lane.
  recursion-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Checkout platform (e2e harness + composite actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: .cms-platform

      # Pinned: the cms-recursion-gate composite runs node (ubuntu-latest's
      # default Node moves from 22 to 24 with Ubuntu 26.04,
      # actions/runner-images#14748).
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Recursion gate
        id: gate
        uses: ./.cms-platform/.github/actions/cms-recursion-gate
        with:
          loop: host

  host-loop:
    needs: [recursion-gate]
    runs-on: ubuntu-latest
    concurrency:
      # SHARED lane for ALL real-prod-mutating loop workflows
      # (cms-publish-loop-prod / cms-media-roundtrip / cms-publish-loop-host).
      # Declared on the HEAVY LOOP JOB, not the workflow: the cheap
      # recursion-gate job has no concurrency, so it runs OUTSIDE this lane
      # — its skip decision is computed immediately even while a real loop
      # holds the lane, and a recursion-skipped loop is `if:`-skipped before
      # it ever enters the lane (zero lane occupancy for recursion). GHA
      # keys concurrency groups by string ACROSS workflows, so one constant
      # group on these three loop jobs keeps them mutually exclusive: only
      # one real-prod loop runs at a time, whatever the trigger (push /
      # workflow_dispatch / host's daily cron all converge here). They each
      # mutate prod through Decap → cms-PR → auto-merge → deploy-production
      # and a parallel pair races deploy-production's `group: production`,
      # blowing each other's URL-reflect budgets. cancel-in-progress:false
      # queues rather than killing an in-flight loop (cancelling mid-flow
      # can leave the canary dirty); a stuck run holds the lane up to its
      # timeout-minutes, which is bounded and far cheaper than the collision.
      # This block MUST stay byte-identical across all three workflows AND
      # remain on the loop job (NOT the workflow) — enforced by
      # e2e/workflow-prod-loop-serialized.test.js.
      #
      # SCOPE — the lane is REPOSITORY-scoped, and that is a GitHub fact rather
      # than a choice here: Actions has no cross-repo concurrency at all. So a
      # bare literal group serialises these three loops WITHIN one consumer and
      # CANNOT serialise two consumers against each other — the group is
      # evaluated in the CALLER's repository even though this reusable lives in
      # cms-platform. Verified empirically, not assumed: adamdaniel.ai host-loop
      # run 31179432081 and jodidaniel.com host-loop run 31181497216 overlapped
      # 2026-08-07 13:11:48-13:13:08Z and BOTH succeeded — one of 4 such
      # cross-consumer overlaps in 4 days. Within a consumer the exclusion is
      # the whole point (all three mutate THAT site's prod content and race its
      # `production` deploy lane); across consumers there is nothing to
      # serialise — separate buckets, distributions and canaries — so do NOT
      # "fix" this by adding ${{ github.repository }} to the group, which would
      # be a no-op that only makes the byte-identity lint harder to satisfy.
      group: prod-mutating-loop
      cancel-in-progress: false
    env:
      # Site identity for the parameterized e2e helpers (base.js,
      # cms-host.js). Supplied by repo VARS so a consuming deployment
      # passes its own deployed URLs; CMS_REPO falls back to the repo.
      CMS_PROD_URL: ${{ vars.CMS_PROD_URL }}
      CMS_APEX: ${{ vars.CMS_APEX }}
      CMS_REPO: ${{ github.repository }}
    timeout-minutes: 150
    # Recursion guard delegated to the `recursion-gate` job above.
    if: ${{ needs.recursion-gate.outputs.run == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout platform (e2e harness + composite actions)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: .cms-platform

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Install harness deps
        working-directory: .cms-platform/e2e
        run: npm ci

      - name: Install Playwright browser + system deps
        uses: ./.cms-platform/.github/actions/install-playwright-browsers
        with:
          browser: chromium

      # Post-merge only: do NOT drive prod until THIS commit is live
      # (deploy-production succeeded + CDN serves the SHA or a newer
      # descendant; prod ahead of the merge is fine). Skipped on
      # workflow_dispatch/schedule (no associated merge). Fails loud if
      # the deploy failed.
      - name: Await prod deploy of this merge
        if: ${{ github.event_name == 'push' }}
        uses: ./.cms-platform/.github/actions/await-prod-deploy
        with:
          prod-url: ${{ vars.CMS_PROD_URL }}

      # Self-heal: BEFORE the spec injects a fresh `e2e-publish-loop:`
      # marker, reset any canary still carrying an orphaned marker from a
      # PRIOR interrupted run back to its canonical baseline (via the same
      # labelled-PR + auto-merge path the spec's own step-0 setup-reset
      # uses). An interrupted run leaves the marker on main, which wedges
      # the byte-lock invariant (e2e/canary-content.test.js) on a
      # path-filtered required check (adamdaniel.ai#1861). Idempotent +
      # FAIL-OPEN: a clean repo / missing PAT (forks, Dependabot) / API
      # hiccup is a no-op and never breaks the loop.
      #
      # On main it also sweeps `_tags/` for e2e tags a tags lifecycle run
      # left behind (#689) and reports the count as `leftover_e2e_tags`,
      # which the last step of this job fails on.
      - name: Self-heal orphaned canary markers
        id: self-heal
        env:
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
        run: ./.cms-platform/scripts/reset-orphaned-canary.sh

      - name: Run host-repo publish loop + delete-published specs
        working-directory: .cms-platform/e2e
        env:
          # PW_PROJECT — the project(s) this step runs. e2e/install-browsers-on-miss.js
          # narrows its missing-engine check to these projects' engines; without it the
          # blanket check reports the engines this job never installed as "missing" and
          # re-downloads them, while crying wolf about ci-runner image drift.
          # Locked by e2e/engine-scope-lint.test.js.
          PW_PROJECT: "chromium-desktop-3k"
          # SITE_ROOT — the CONSUMING site's checkout (github.workspace). The e2e
          # harness runs from .cms-platform/e2e here, so the base_collections guards'
          # default (resolve __dirname/..) would point at the PLATFORM, not the
          # consumer; set it so keepsBaseCollection() reads the consumer's _config.yml
          # and a single-page bio (base_collections:[]) correctly SKIPS the collection
          # specs instead of timing out on a Posts sidebar link that never renders.
          SITE_ROOT: ${{ github.workspace }}
          # Fine-grained PAT scoped to the host repo (contents r/w +
          # pull_requests r/w + metadata r).
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
          # Tells playwright.config.js (via TARGET=) NOT to spin up the
          # local Jekyll + decap-server webServer — the specs hit the
          # deployed prod URL directly.
          TARGET: prod
          # Opt-in marker the specs check; without it they self-skip.
          RUN_HOST_REPO_PUBLISH_LOOP: "1"
        run: |
          set -o pipefail
          # --max-failures=1 bails the whole run on the first failure.
          # --workers=1 serialises the specs: they all mutate prod via
          # Decap → cms/* PR → auto-merge → deploy-production, which has
          # `concurrency: { group: production, cancel-in-progress: false }`
          # — parallel specs queue multiple-deep on deploy and blow each
          # other's URL-wait budgets.
          export PLAYWRIGHT_JSON_OUTPUT_FILE=/tmp/host-loop.log.json
          status=0
          npx playwright test \
            cms-publish-loop.spec.js \
            cms-delete-published.spec.js \
            cms-unpublish-republish.spec.js \
            cms-tags-lifecycle.spec.js \
            --project=chromium-desktop-3k \
            --reporter=list,html,json \
            --max-failures=1 \
            --workers=1 \
            > /tmp/host-loop.log 2>&1 || status=$?
          node summarize-playwright.js "${PLAYWRIGHT_JSON_OUTPUT_FILE}"
          exit "$status"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-loop-results
          path: |
            .cms-platform/e2e/test-results/
            /tmp/host-loop.log
            /tmp/host-loop.log.json
            .cms-platform/e2e/playwright-report/
          retention-days: 14

      # Surface the Playwright failure block as a PR comment. Two call
      # sites — caller-side gating with failure()/success() is the
      # canonical pattern; the composite is mode-driven.
      - name: Post failure summary
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: ./.cms-platform/.github/actions/post-failure-comment
        with:
          mode: post
          log-file: /tmp/host-loop.log
          marker: host-loop-failure-summary
          title: host-loop

      - name: Resolve failure summary on success
        if: ${{ success() && github.event_name == 'pull_request' }}
        # FAIL-OPEN: this step only stamps an EXISTING failure comment as
        # resolved. It runs on success(), so its own failure says nothing about
        # the tests — but without this it turns a fully GREEN job red, and via
        # the aggregating gate that blocks merges. Observed 2026-08-12:
        # adamdaniel.ai e2e run 31569023550 passed its tests, failed HERE, reddened
        # `e2e / e2e`, blocked seed PR #3063, timed out cms-scheduled-publish-loop
        # after 25 min and filed health-audit issue #3064. Same fail-open rationale
        # the ephemeral-branch cleanup steps already carry. Locked by
        # e2e/resolve-summary-fail-open.test.js.
        continue-on-error: true
        uses: ./.cms-platform/.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: host-loop-failure-summary
          title: host-loop

      # #22: delete this loop's EPHEMERAL canary branches on completion AND
      # on cancel/failure. The host-repo loop specs push ephemeral
      # cms/e2e/canary-* (Decap canary-collection drafts) and
      # cms/e2e-fixture/* (seed/cleanup) branches; a cycle that
      # cancels/fails mid-flight orphans them (~35 piled up on adamdaniel).
      # Pattern-delete every branch on this loop's OWN prefixes that has NO
      # open PR (a live cycle's branch always carries its in-flight cms/*
      # PR). Idempotent + FAIL-OPEN: every delete is `|| echo`-guarded and
      # the step is continue-on-error, so a cleanup hiccup (API blip,
      # missing PAT on a fork) NEVER fails the loop. Uses CMS_E2E_PAT
      # (contents r/w) since the workflow only grants contents:read. Locked
      # by e2e/workflow-loop-branch-cleanup.test.js.
      - name: Clean up ephemeral host-loop canary branches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CMS_E2E_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::notice::no CMS_E2E_PAT — skipping ephemeral branch cleanup (fail-open)"
            exit 0
          fi
          # This loop's OWN ephemeral branch prefixes.
          PREFIXES=(
            'cms/e2e/canary-'
            'cms/e2e-fixture/'
          )
          for prefix in "${PREFIXES[@]}"; do
            echo "::notice::Cleanup — deleting orphaned ${prefix}* branches with no open PR"
            gh api --paginate "repos/${GH_REPO}/branches?per_page=100" \
              --jq ".[] | select(.name | startswith(\"${prefix}\")) | .name" \
              2>/dev/null | while read -r branch; do
              [ -z "$branch" ] && continue
              # Belt-and-braces prefix re-verify against this loop's set.
              ok=false
              for p in "${PREFIXES[@]}"; do
                case "$branch" in "${p}"*) ok=true; break;; esac
              done
              if [ "$ok" != "true" ]; then
                echo "skip ${branch} — prefix mismatch"
                continue
              fi
              open_count=$(gh pr list --state open --search "head:${branch}" --limit 1 --json number --jq 'length' 2>/dev/null || echo "1")
              if [ "$open_count" != "0" ]; then
                echo "skip ${branch} — has open PR(s) (live cycle)"
                continue
              fi
              echo "delete ${branch}"
              gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${branch}" \
                || echo "::warning::failed to delete ${branch} (already gone?) — ignoring (fail-open)"
            done
          done
          echo "::notice::Cleanup complete (fail-open)"

      # #689: an e2e tag on main is live on the public site, so a leftover
      # fails this daily run (scheduled-run-health turns that into an issue)
      # even though the self-heal above already opened its removal PR. Runs
      # last and on always() so the loop's own result is still recorded;
      # skipped when the self-heal did not report (no PAT, fail-open exit).
      - name: Fail on leftover e2e tags on main
        if: ${{ always() && steps.self-heal.outputs.leftover_e2e_tags != '' && steps.self-heal.outputs.leftover_e2e_tags != '0' }}
        env:
          LEFTOVER: ${{ steps.self-heal.outputs.leftover_e2e_tags }}
        run: |
          if [ "${LEFTOVER}" = "error" ]; then
            echo "::error::Could not check _tags/ on main for leftover e2e tags (see the self-heal step's log)."
          else
            echo "::error::${LEFTOVER} leftover e2e tag file(s) on main; see the self-heal step's log for paths and removal PRs."
          fi
          exit 1
