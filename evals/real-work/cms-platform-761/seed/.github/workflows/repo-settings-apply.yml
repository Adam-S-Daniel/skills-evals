# Repo settings APPLY-in-CI (#172, the first of #109's four deferrals).
#
# The audit (repo-settings-audit.yml) DETECTS drift and files a tracking issue;
# converging it has been a human running `--fix --yes` with their own admin auth.
# This workflow moves that apply into CI. The audit stays exactly as it is —
# this is additive, and either can be disabled alone.
#
# SIX THINGS HERE ARE LOAD-BEARING. Each is a trap, not a preference:
#
#  1. TWO JOBS, BECAUSE THE REVIEWER MUST SEE THE PLAN BEFORE APPROVING.
#     A GitHub environment gate pauses a job BEFORE its first step, so a plan
#     printed inside the gated job is invisible at approval time — the reviewer
#     would be clicking "approve" on an unknown diff. `plan` therefore runs
#     ungated and writes the full plan to the job summary; the apply lanes are
#     downstream and run only if `plan` found pending changes.
#
#  2. THE PLAN JOB'S TOKEN CANNOT WRITE — BY CONSTRUCTION, NOT BY TRUST.
#     `POST /app/installations/{id}/access_tokens` accepts a `permissions` object
#     that can only NARROW the installation's grant. `plan` mints
#     `administration:read`; the apply lanes mint `administration:write`. So the
#     ungated job is incapable of mutating settings even if something in it
#     misbehaves. (`plan` also holds `issues: write` on the *workflow* token, to
#     file the approval issue. That is a different credential on a different
#     surface — `github.token` cannot touch repo settings on any repo.)
#
#  3. A MISSING ENVIRONMENT SILENTLY DISABLES THE GATE, SO WE VERIFY IT.
#     Referencing `environment: repo-settings` when that environment does not
#     exist does NOT fail — GitHub implicitly creates it with NO protection
#     rules, and the "required reviewer" gate you think you have is absent. The
#     gated apply therefore ASKS the API whether the environment really carries
#     a `required_reviewers` rule and refuses to apply if it does not.
#
#  4. THE CONCURRENCY GROUP IS PER OWNER, ON THE APPLY JOBS, NEWEST-WINS.
#     A run parked at an UN-APPROVED gate is not finished, so it holds its
#     concurrency group for as long as nobody clicks approve. And
#     `cancel-in-progress: false` does not mean "queue them all": GitHub keeps
#     the holder plus only the LATEST pending run and cancels the rest. With the
#     group at WORKFLOW level those two facts compose into a silent outage
#     (#313: eleven days, twelve cancellations, nothing applied).
#
#     PER OWNER is the second half of that lesson, and it cost a second outage
#     to learn. The #313 fix moved the group onto `apply` but left it a CONSTANT
#     — and `apply` is a two-leg matrix, so both legs landed in one group and
#     one leg cancelled the other, non-deterministically, on every single run.
#     MEASURED across four consecutive runs: run 33123351877 and run
#     33259840589 killed the `jodidaniel` leg within a second and parked
#     `Adam-S-Daniel` at the gate until the NEXT DAY's run reaped it; runs
#     33318291358 and 33420951576 killed the `Adam-S-Daniel` leg within a second
#     and a human approved the `jodidaniel` leg, whose log reads
#     "Fix plan: EMPTY — live settings already match the manifest." So the leg
#     holding the only real drift (adamdaniel.ai's `main` ruleset, missing
#     `prerelease-guard / prerelease-guard`, #310) never ran once between
#     2026-08-27 and 2026-08-31 — while a human was asked to approve, and did,
#     every day. Interpolating `${{ matrix.owner }}` is what makes the two legs
#     independent.
#
#     `plan` deliberately carries NO group. It is read-only and cheap, and
#     un-grouping it is what makes a wedged gate VISIBLE — every run plans and
#     publishes its summary instead of dying job-less.
#
#  5. THE GATE ASKS ONLY ABOUT WRITES THAT COULD REDUCE PROTECTION.
#     A gate a person clicks every morning is not a control, it is a habit, and
#     habits do not read the diff — which is exactly how the four runs above
#     produced four approvals and zero convergences. `scripts/repo-settings-
#     write-risk.js` classifies every planned write: adding a required status
#     check, disabling a merge method, creating a ruleset or an environment can
#     only ADD constraints, so those apply unattended. Anything that could
#     remove a constraint — a required check dropped, a bypass actor added,
#     enforcement relaxed — and anything the classifier does not recognise
#     (it is an ALLOWLIST, it fails closed) goes to the human.
#
#     The routing below is not what enforces that. `apply-auto` also passes
#     `--refuse-weakening`, which re-derives the verdict from the plan it is
#     about to apply and refuses the whole plan if anything is gated-class. A
#     wrong `if:` here costs a red job, never an unattended weakening write.
#     Same shape as note 2: incapable, rather than trusted.
#
#  6. WHEN A HUMAN *IS* NEEDED, THEY ARE TOLD. An `environment:` gate is
#     invisible unless you are watching the Actions tab; #313 sat unapproved for
#     ten days partly for that reason. `plan` opens an assigned tracking issue
#     naming the run, the approval URL, the reviewers and the reason, and the
#     issue is closed again the moment the gate resolves — approved, rejected,
#     or superseded. See scripts/gate-approval-issue.js.
#
# WHY A GITHUB APP AND NOT A PAT: the manifest governs repos under TWO owners
# (Adam-S-Daniel and jodidaniel), and a fine-grained PAT cannot span owners. One
# App installed on both owners can, and its installation tokens expire in ~1h, so
# no long-lived admin credential sits in CI. Because a token is per-INSTALLATION
# (i.e. per owner), the apply runs as a matrix — one leg per owner, each holding
# only that owner's credential, so a leg's blast radius is one owner.
#
# The script's own rails still apply and are not re-implemented here:
# `default_branch` is never PATCHed (FIX_FORBIDDEN_KEYS), a live ruleset carrying
# an unknown field is SKIPPED rather than PUT lossily, live-only rulesets are
# never deleted (no --prune in v1), and `--fix --yes` re-audits afterwards and
# exits non-zero if a finding it meant to write is still there.
#
# PROVISIONING (all three are required; without them this workflow no-ops with a
# notice naming them — it never fails red for being un-onboarded):
#   - vars.REPO_SETTINGS_APP_CLIENT_ID          (repository VARIABLE on cms-platform)
#   - secrets.REPO_SETTINGS_APP_PRIVATE_KEY
#   - a `repo-settings` environment WITH at least one required reviewer
# The App needs Administration: Read and write, installed on BOTH owners.
name: Repo settings apply

run-name: >-
  ${{ github.event_name == 'schedule' && format('scheduled re-converge — {0}', github.event.schedule)
     || github.event_name == 'push' && format('manifest change — {0}', github.sha)
     || format('manual — @{0}', github.actor) }}

on:
  # Auto-converge when the manifest lands on main…
  push:
    branches: [main]
    paths: [repo-settings.yml]
  # …and re-converge daily, so a live UI flip is pulled back without waiting for
  # someone to edit the manifest. Offset from the audit's 17 9 so the audit's
  # report reflects the state this workflow left behind, not a half-applied one.
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

# NO WORKFLOW-LEVEL `concurrency` BLOCK — see header note 4. The group lives on
# the apply jobs, per owner, because those are the only things that write.

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Header note 6 — the approval issue. `github.token` with issues:write
      # cannot touch repo settings on any repo, so this does not widen the
      # ungated job's reach over the surface this workflow governs.
      issues: write
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      gate: ${{ steps.plan.outputs.gate }}
      onboarded: ${{ steps.creds.outputs.onboarded }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
      - name: Install harness deps (for the yaml parser; no browsers)
        working-directory: e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Check whether apply-in-CI is onboarded
        id: creds
        # `secrets.*` is forbidden in a step-level `if:`, so the presence check
        # is a run step writing an output the later `if:`s gate on.
        env:
          APP_CLIENT_ID: ${{ vars.REPO_SETTINGS_APP_CLIENT_ID }}
          APP_KEY: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY }}
        run: |
          if [ -n "${APP_CLIENT_ID}" ] && [ -n "${APP_KEY}" ]; then
            echo "onboarded=true" >> "$GITHUB_OUTPUT"
          else
            echo "onboarded=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Repo settings apply — not onboarded"
              echo
              echo "Skipping. To enable, provision all three:"
              echo "- \`vars.REPO_SETTINGS_APP_CLIENT_ID\` (repository variable)"
              echo "- \`secrets.REPO_SETTINGS_APP_PRIVATE_KEY\`"
              echo "- a \`repo-settings\` environment with at least one required reviewer"
              echo
              echo "The daily audit is unaffected and still reports drift."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::apply-in-CI is not onboarded (vars.REPO_SETTINGS_APP_CLIENT_ID / secrets.REPO_SETTINGS_APP_PRIVATE_KEY); skipping."
          fi

      - name: Plan the convergence (read-scoped token; cannot write)
        id: plan
        if: steps.creds.outputs.onboarded == 'true'
        env:
          APP_CLIENT_ID: ${{ vars.REPO_SETTINGS_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          pending=false
          gate=false
          : > plan-all.txt
          : > gated-all.txt
          {
            echo "### Repo settings — convergence plan"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # One leg per owner: an installation token is per owner, and --repo
          # keeps each leg scoped to the repos that token can actually see.
          for spec in "Adam-S-Daniel:cms-platform:Adam-S-Daniel/cms-platform Adam-S-Daniel/adamdaniel.ai" \
                      "jodidaniel:jodidaniel.com:jodidaniel/jodidaniel.com"; do
            owner="${spec%%:*}"; rest="${spec#*:}"; probe="${rest%%:*}"; repos="${rest#*:}"
            node scripts/mint-app-token.js --owner "$owner" --repo "$probe" \
              --permissions administration=read > mint.log 2>&1 || {
                echo "::error::could not mint a read token for ${owner}"; cat mint.log; exit 1; }
            TOKEN=$(sed -n 's/^token=//p' "$GITHUB_OUTPUT" | tail -1)
            args=(); for r in $repos; do args+=(--repo "$r"); done
            # --fix WITHOUT --yes is plan-only and exits 2 when WRITES pend.
            set +e
            # --plan-json is the structured twin of plan.txt: every write with
            # its verdict and facet-level changes, for the issue and summary
            # to render as a DIFF instead of two full bodies (#396).
            GH_TOKEN="$TOKEN" node scripts/audit-repo-settings.js --fix "${args[@]}" \
              --plan-json "plan-${owner}.json" > plan.txt 2>&1
            rc=$?
            set -e
            {
              echo "<details><summary><code>${owner}</code> — exit ${rc}</summary>"
              echo
              echo '```'
              cat plan.txt
              echo '```'
              echo
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            cat plan.txt >> plan-all.txt
            # Read the machine-readable verdict from the FILE, never through a
            # pipe into an early-exiting reader — see AGENTS.md on `grep -q`
            # taking SIGPIPE once the payload passes the pipe buffer.
            verdict=$(grep -m1 '^repo-settings-plan: ' plan.txt || true)
            gated=$(printf '%s' "$verdict" | sed -n 's/.*gated=\([0-9][0-9]*\).*/\1/p')
            if [ -z "$gated" ]; then
              echo "::error::plan for ${owner} printed no machine-readable verdict — refusing to guess whether a human is needed"
              exit 1
            fi
            if [ "$gated" != "0" ]; then
              gate=true
              grep '^   NEEDS-REVIEW ' plan.txt >> gated-all.txt || true
            fi
            if [ "$rc" = "2" ]; then pending=true
            elif [ "$rc" != "0" ]; then echo "::error::plan failed for ${owner} (exit ${rc})"; exit "$rc"; fi
          done
          # The concise rendering ABOVE the per-owner logs is what a reviewer
          # who followed the run URL actually needs; the <details> blocks are
          # the audit trail.
          if [ "${pending}" = "true" ]; then
            docs=(); for f in plan-*.json; do docs+=(--plan-json "$f"); done
            {
              echo "#### What this run will change"
              echo
              node scripts/gate-approval-issue.js render "${docs[@]}"
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "pending=${pending}" >> "$GITHUB_OUTPUT"
          echo "gate=${gate}" >> "$GITHUB_OUTPUT"
          echo "::notice::convergence pending=${pending} needs-human=${gate}"

      # Header note 6. Reconciling, not fire-and-forget: this both OPENS the
      # request when one is needed and CLOSES a stale one when it is not, so a
      # cleanup job lost to a cancelled run self-heals on the next run rather
      # than leaving an issue that lies about the present.
      - name: Announce (or retract) the approval request
        if: steps.creds.outputs.onboarded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GATE: ${{ steps.plan.outputs.gate }}
          PENDING: ${{ steps.plan.outputs.pending }}
        run: |
          set -euo pipefail
          if [ "${GATE}" = "true" ] && [ "${PENDING}" = "true" ]; then
            docs=(); for f in plan-*.json; do docs+=(--plan-json "$f"); done
            node scripts/gate-approval-issue.js open \
              --repo "${GITHUB_REPOSITORY}" \
              --run-id "${GITHUB_RUN_ID}" \
              --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --plan-file plan-all.txt \
              --gated-file gated-all.txt \
              "${docs[@]}"
          else
            node scripts/gate-approval-issue.js close \
              --repo "${GITHUB_REPOSITORY}" \
              --reason "a later plan needs no approval (nothing pending, or every planned write is non-weakening)"
          fi

  # ── the ungated lane ───────────────────────────────────────────────────────
  # Every planned write is provably non-weakening. NO `environment:`, and
  # `refuse-weakening` re-checks that claim at write time (header note 5).
  apply-auto:
    needs: plan
    if: needs.plan.outputs.onboarded == 'true' && needs.plan.outputs.pending == 'true' && needs.plan.outputs.gate == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: repo-settings-apply-${{ matrix.owner }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - owner: Adam-S-Daniel
            probe: cms-platform
            repos: Adam-S-Daniel/cms-platform Adam-S-Daniel/adamdaniel.ai
          - owner: jodidaniel
            probe: jodidaniel.com
            repos: jodidaniel/jodidaniel.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/repo-settings-converge
        with:
          owner: ${{ matrix.owner }}
          probe: ${{ matrix.probe }}
          repos: ${{ matrix.repos }}
          app-client-id: ${{ vars.REPO_SETTINGS_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY }}
          refuse-weakening: 'true'

  # ── the gated lane ─────────────────────────────────────────────────────────
  # At least one planned write could reduce protection, or is a shape the
  # classifier does not recognise. A human looks at it.
  apply-gated:
    needs: plan
    if: needs.plan.outputs.onboarded == 'true' && needs.plan.outputs.pending == 'true' && needs.plan.outputs.gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # THE GATE. Its required-reviewer rule is verified below — see header note 3;
    # naming a nonexistent environment would silently create an unprotected one.
    environment: repo-settings
    concurrency:
      group: repo-settings-apply-${{ matrix.owner }}
      cancel-in-progress: true
    strategy:
      # One leg per owner, each holding only that owner's admin token.
      # fail-fast:false so one owner's failure does not abandon the other's
      # already-approved convergence half-done.
      fail-fast: false
      matrix:
        include:
          - owner: Adam-S-Daniel
            probe: cms-platform
            repos: Adam-S-Daniel/cms-platform Adam-S-Daniel/adamdaniel.ai
          - owner: jodidaniel
            probe: jodidaniel.com
            repos: jodidaniel/jodidaniel.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify the reviewer gate actually exists
        # Header note 3: an undeclared environment is auto-created WITHOUT
        # protection rules, so reaching this step proves nothing on its own.
        # Ask the API, and refuse to apply if no required_reviewers rule is set.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rules=$(gh api "repos/${GITHUB_REPOSITORY}/environments/repo-settings" \
            --jq '[.protection_rules[].type] | join(",")' 2>/dev/null || echo "")
          echo "protection rules: ${rules:-<none>}"
          case ",${rules}," in
            *,required_reviewers,*) echo "::notice::reviewer gate present." ;;
            *)
              echo "::error::The \`repo-settings\` environment has no required_reviewers rule, so this apply would run UNATTENDED. Refusing. Add at least one required reviewer to the environment, then re-run."
              exit 1 ;;
          esac

      - uses: ./.github/actions/repo-settings-converge
        with:
          owner: ${{ matrix.owner }}
          probe: ${{ matrix.probe }}
          repos: ${{ matrix.repos }}
          app-client-id: ${{ vars.REPO_SETTINGS_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.REPO_SETTINGS_APP_PRIVATE_KEY }}

  # Close the approval request as soon as the gate stops waiting — approved,
  # rejected, or the job cancelled. `always()` so a rejection closes it too: an
  # issue that outlives the thing it is asking about is the failure mode this
  # whole lane exists to avoid. It closes only an issue still naming THIS run
  # (see gate-approval-issue.js), so a superseded run cannot retract the live
  # request.
  close-approval-issue:
    needs: [plan, apply-gated]
    if: always() && needs.plan.outputs.onboarded == 'true' && needs.plan.outputs.gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # Pinned: gate-approval-issue.js runs under node (ubuntu-latest's
      # default Node moves from 22 to 24 with Ubuntu 26.04,
      # actions/runner-images#14748).
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Close the approval issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.apply-gated.result }}
        run: |
          set -euo pipefail
          node scripts/gate-approval-issue.js close \
            --repo "${GITHUB_REPOSITORY}" \
            --run-id "${GITHUB_RUN_ID}" \
            --reason "the gated apply finished with result \`${RESULT}\`"
