prompt: "Tags input: held space uses stopImmediatePropagation, hiding the keystroke from other admin shims\n\nFollow-up from https://github.com/Adam-S-Daniel/cms-platform/pull/761 (Fixes #756), found in its independent review. This one is not blocking.\n\n`theme/admin/tags-input.js` `onInput` holds a typed trailing space with `stopImmediatePropagation()`. That also hides the event from input listeners registered later on the same target, namely `live-url-banner.js` and `autosave-on-hide.js`. \n\n**Expected:** use the narrowest stop that keeps the space, so other admin shims still see the keystroke. Add a test that a later-registered input listener still fires.\n\n**Also noted, by design:** after a paste or autocorrect that ends in a space, Decap's stored value lags until the next keystroke or blur. Save always blurs first, so no wrong data is saved.\n\n**Severity:** polish.\n\nFix the held trailing-space event so later admin listeners receive it while the editor still keeps the space.\n\nInterface the reviewer’s tests use\n\nThe reviewer runs `theme/admin/tags-input.js` in a Node vm with a capture-listener dispatcher on `document`. The field identified as `tags-field-1` has `selectionEnd` at the end of its value. Later listeners on that same document must receive the held input event while it remains hidden from the deeper React listener. The existing `window.__tagsInput` helpers `analyze`, `replaceTag` and `holdsTrailingSpace` remain callable.\n"
