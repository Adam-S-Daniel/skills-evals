# Central sync registry: repos excluded from AGENTS.md sync, and default sections.
# Consumer repos opt into extra sections via their own .agents-sync.yml.
#
# ── This list is NOT the whole exclusion story ──────────────────────────────
#
# Three more classes of repo never receive the guidance, and none of them
# appears below — they are excluded structurally, by how sync.sh and
# drift-report.sh DISCOVER repos, not by policy written here. Anyone auditing
# "which repos get the managed AGENTS.md?" from this file alone gets a wrong
# answer, which is why they are named here rather than left to be rediscovered:
#
#   • FORKS. Discovery passes `--source` to `gh repo list`, which means
#     non-forks only. Deliberate — an AGENTS.md pushed into a fork becomes a
#     diff against the upstream project and rides along in any PR sent back to
#     it. Adam-S-Daniel/OctopusDeploy-Api and Adam-S-Daniel/SonosAmpJuicePi are
#     the current forks. To sync one, it would have to stop being a fork; there
#     is no entry here that could include it.
#   • ARCHIVED repos. Discovery passes `--no-archived`. Also deliberate: an
#     archived repo rejects pushes, so syncing one is a guaranteed failure, and
#     nobody is opening agent sessions in it.
#   • THIS REPO. sync.sh skips $SYNC_SELF_REPO. It carries its own AGENTS.md as
#     a committed artifact instead, rebuilt from agents-md/ and diffed by CI —
#     see docs/decisions/0002 for why that beats syncing into itself.
#
# What remains below is the policy exclusion list: repos that discovery WOULD
# reach and that we choose not to sync.
exclude: []
default_sections: []

# ── skills-bootstrap hook delivery ─────────────────────────────────────────
#
# Delivery of the `skills-bootstrap` SessionStart hook, which installs the
# skills registry's bundles into ephemeral Claude surfaces (cloud sessions, CI
# runners). Read docs/decisions/0001-skills-bootstrap-delivery-is-opt-in.md
# before changing anything here — the shape of this block IS the decision —
# and 0004 for the widening that took the allowlist from two repos to ten.
#
# Two independent keys must BOTH hold before the sync delivers anything:
#
#   1. the repo is named in `repos:` below — the fleet operator's allowlist;
#   2. the repo already carries its own `skills.lock` — the repo owner's
#      declaration of WHICH bundles it installs.
#
# Allowlisting a repo that has no lock is a deliberate no-op with a log line,
# never a half-install: the hook without a lock is not inert, it prints a
# permanent "skills: DEGRADED — no skills.lock found" verdict into every
# ephemeral session forever.
#
# The sync NEVER writes `skills.lock` — not even to create one. The lock is
# per-repo by design (adamdaniel.ai's federates two registries; most others
# lock only the two cloud-safe plugins), so any fleet-wide writer would
# eventually flatten a consumer's declaration. See the ADR.
skills_bootstrap:
  # The hook is FETCHED from the registry at this immutable commit, never
  # vendored here — one canonical copy, in the repo whose CI shellchecks and
  # tests it. Bumping the pin (and the digest below with it) is the reviewable
  # one-line change that fans a hook fix across the fleet — which holds only
  # because sync.yml's `paths:` filter watches THIS file. It did not until
  # 2026-08-19, and a pin bump alone fired no run at all; drop that entry and
  # the claim silently becomes false again rather than failing.
  #
  # `ref` AND `sha256` ARE MACHINE-PROPOSED — do not hand-edit them.
  # `scripts/bump-hook-pin.sh` runs nightly from skills-lock-bump.yml and opens
  # a pull request here whenever the hook's BYTES change upstream, recomputing
  # the digest from the bytes at the commit it proposes. Editing either by hand
  # is not forbidden, just redundant and easy to get half-right — a ref moved
  # without its digest is a fleet with delivery disabled until someone notices.
  # It stops at proposing: merging is what fans a new hook into every repo
  # below, so no bot does that. See docs/decisions/0010.
  #
  # 2026-09-24: moved by hand from the retiring Adam-S-Daniel/agentskills to
  # its successor Adam-S-Daniel/adam-agentskills (that repo's ADR 0013). The
  # bumper re-pins within one registry and cannot change `registry`, so this
  # one move was hand-made; `sha256` was recomputed from the bytes at `ref`.
  registry: Adam-S-Daniel/adam-agentskills
  path: .claude/hooks/skills-bootstrap.sh
  ref: def7d1d13ff8ca8ff228a49f952ae6cf586fe1e2
  # sha256 of the file at `ref`. The ref is already content-addressed, so this
  # is belt-and-braces — but the artifact executes instruction text at session
  # start with no approval prompt, so "the bytes we deliver are the bytes that
  # were reviewed" is worth making mechanical rather than assumed. A mismatch
  # disables delivery for the whole run and fails it.
  sha256: da1d581552b3463a900adb4e7c78132daf829bd2fb65a297781467160ce13849
  # The allowlist. Short repo names, matched the same way `exclude` is.
  #
  # Widened from two repos to ten on 2026-08-19 (ADR 0004). The two-repo start
  # was held there by ADR 0001's "do not widen past what a human can re-pin by
  # hand"; a companion PR adds the lock re-pinner that lifts it. What decides
  # membership now is whether anyone opens an ephemeral session in the repo —
  # so the reason for an ABSENCE is what needs writing down, and it is, below.
  #
  # KEY 2 IS NOT YET HELD BY MOST OF THESE, and the difference is what an
  # operator reads this block to find out. As of 2026-08-19 only adamdaniel.ai
  # and jodidaniel.com carry a committed skills.lock; the other eight have an
  # open companion PR that adds one. Until that PR merges the entry is INERT —
  # sync.sh logs "no skills.lock in the repo yet — delivery withheld" and
  # skips, and the drift report cell reads `no-lock`. So each entry says which
  # side it is on and names its PR, rather than leaving "is the widening
  # finished?" to be answered by fetching ten default branches. Alphabetical,
  # because any other order invites a reader to look for a meaning in the
  # sequence.
  repos:
    # Corrects a wrong reason, not just an omission. The old note grouped this
    # repo with the public registry as "they AUTHOR the hook and the lock". It
    # does not: it authors PRIVATE SKILLS, it consumes an ordinary lock like
    # any other repo, and nothing here is a source of truth this sync could
    # clobber. A wrong reason left standing is worse than a missing one — it
    # survives review by looking already-decided.
    # Renamed from `agentskills-private` on 2026-09-24.
    # lock: committed — PR #8 merged 2026-08-19.
    - adam-agentskills-private
    # lock: committed — federated (adam-agentskills + cms-platform), with the hook
    # and its registration already in place. Listed so the sync keeps the hook
    # current against the pin above.
    - adamdaniel.ai
    # lock: committed — PR #19 merged 2026-08-19.
    - claude-memory-map
    # cms-platform and GHA-bench both gitignore `.claude/` — cms-platform with
    # an explanatory comment, GHA-bench as a bare `/.claude/` entry (the
    # comment above it is about workflow files) — which is why ADR 0001 refused
    # to list them. Each has ONE companion PR carrying BOTH remaining steps:
    # the narrowed ignore and the repo's first skills.lock. So the drift cell
    # for these two reads `no-lock` like the other six pending entries, not
    # `blocked`: drift-report.sh tests the lock BEFORE it probes the ignore, so
    # `blocked` is only reachable once a lock exists. The entry is INERT, not
    # wrong; what it buys is that nothing further is needed HERE once the
    # companion merges.
    # lock + ignore: pending cms-platform#275 — inert until that merges.
    - cms-platform
    # lock: committed — PR #8 merged 2026-08-19.
    - fastmail-actions
    # lock + ignore: pending GHA-bench#49 — inert until that merges.
    - GHA-bench
    # lock: committed — PR #134 merged 2026-08-16, so the lock this file used
    # to call "in flight" has been committed for three days, and the sync
    # delivered the hook on its next run (2026-08-18). The stale note said the
    # drift report reads `no-lock`; it reads `ok`.
    - jodidaniel.com
    # lock: committed — PR #17 merged 2026-08-19.
    - repo-settings
    # The `scratch-` prefix is a misnomer this list should not repeat: it is a
    # live portfolio site whose `main` deploys to sprites.dev. NOT "on every
    # push to main" — `deploy.yml` filters on `index.html` and on itself, so a
    # sync commit deploys nothing. ADR 0001 shelved it as scratch on the
    # strength of the name alone; see `cron_coverage.out_of_scope` below, where
    # it stays out for a different and still-good reason.
    # lock: committed — PR #15 merged 2026-08-19.
    - scratch-claude-002
    # lock: committed — PR #9 merged 2026-08-19.
    - wsl-automation

  # ── THE COMPLEMENT: every repo the sync REACHES and does not deliver to,
  # with the reason it does not. `repos:` above is one half of a decision and
  # this is the other, and until this key existed only the first half was
  # machine-readable — the reasons lived in a 43-line comment, which is
  # unreadable to every tool and unfalsifiable by every gate. A name in both
  # halves, an exclusion nobody justified, or a repo simply absent all looked
  # alike: like a settled decision. `scripts/check-registry.js` now asserts
  # the two keys stay a partition, and `drift-report.sh` flags whatever
  # discovery finds in neither. Read docs/decisions/0011-*.md first.
  #
  # THE DENOMINATOR IS NOT `cron_coverage`'s below, and the numbers actively
  # invite that mistake: measured 2026-08-29, both keys hold exactly NINE
  # out_of_scope entries while sharing only FIVE members. This one counts over
  # what the SYNC visits — `gh repo list --source --no-archived` across
  # SYNC_OWNERS, 19 repos. So the account's two forks and the third-owner
  # `superoutrigger` are absent here on purpose: discovery never reaches them,
  # so their exclusion is not a choice this key can express, whereas a cron
  # could exist in any of them. `scratch-claude-002` runs the other way — out
  # of scope for cron, deliberately allowlisted above for skills. Do NOT
  # "reconcile" the two lists; ADR 0003 ruled against collapsing the scope
  # keys, and this is the coupling that ruling was protecting.
  out_of_scope:
    - repo: adam-agentskills
      reason: >-
        Authors the hook and self-hosts it. Delivering it back would clobber
        the source of truth, and drift-report.sh exempts it from `unmanaged`
        for the same reason.

    # WHAT THIS ABSENCE DOES NOT MEAN, written down because a fresh reader
    # re-derives the wrong corollary from it every time: it says nothing about
    # lock BUMPING. "_agent-guidance is not in the allowlist, so the nightly
    # bumper does not re-pin its lock" is FALSE. This block governs HOOK
    # DELIVERY only. `scripts/bump-consumer-locks.sh` never reads it — it
    # discovers repos with `gh repo list` and filters on `.exclude` alone, and
    # it deliberately KEEPS the self repo exactly where sync.sh and
    # drift-report.sh drop it. This repo's own `skills.lock` is squarely in
    # the bumper's scope, and it sat stuck for the same reason every other
    # consumer's did.
    # What keeps this repo's self-hosted copy honest is test/run-tests.sh,
    # which asserts all three parts — any one alone is a dead adoption: the
    # hook's sha256 equals the pin above, `.claude/settings.json` still
    # REGISTERS it, and `skills.lock` is present and readable by it.
    - repo: _agent-guidance
      reason: >-
        Self-hosts, and could not be listed above even if it should be: both
        sync.sh and drift-report.sh drop $SELF_REPO before the per-repo loop,
        so an entry could not deliver anything or even be reported on.

    - repo: skills-evals
      reason: >-
        Runs the skill-propagation probes. Installing the bundle into its
        sessions contaminates the instrument it exists to be.

    - repo: scratch-claude-001
      reason: >-
        The live E1 skill-delivery experiment. Its own .claude/settings.json
        SessionStart hook already installs the marketplace bundle, and
        E1-HOOK-RESULT.md / E1-CLOUD-RESULT.md are its readings; a second
        installing hook confounds exactly what it measures. Same class as
        skills-evals, not the scratch class its name suggests.

    # Dormant: no human commit since 2026-03 — everything after that is the
    # AGENTS.md sync bot. Nobody opens a session there, so the bundle would
    # cost always-on context in sessions that never happen. Adoption is a
    # per-repo decision precisely so this stays a choice and not a default.
    - repo: 4A
      reason: >-
        Dormant since 2026-03; no session happens there to spend the context.
    - repo: jc
      reason: >-
        Dormant since 2024-10, though it does carry a page and a deploy
        workflow from then; no session happens there to spend the context.
    - repo: rss-inator
      reason: >-
        Dormant since 2026-03; no session happens there to spend the context.
    - repo: scratch-jules-001
      reason: >-
        Dormant since 2026-03; no session happens there to spend the context.
    - repo: squarespacetemp
      reason: >-
        Dormant since 2026-03; no session happens there to spend the context.

  # Forks and archived repos are NOT listed above: discovery never reaches
  # them (`gh repo list --source --no-archived`), so their absence from
  # delivery is not a choice this key can express. See the header of
  # `exclude:` above.


# ── cron-coverage scope ────────────────────────────────────────────────────
#
# Which repos `scripts/check-cron-coverage.js` is answering ABOUT when it
# audits a disk root. Read docs/decisions/0003-cron-coverage-is-fleet-listed.md
# before changing anything here.
#
# WHY A LIST AT ALL. The gate is deterministic and offline — pure filesystem,
# no network — so left to itself it can only audit what happens to be checked
# out, and a disk holding four repos and a disk holding all of them print the
# same "All audited repos covered". Measured 2026-08-17 (issue #37): a session
# with 14 of the account's 25 repos checked out audited 14 and reported clean.
# The list is what turns an absent repo into a FINDING instead of a silence:
# every name under `fleet:` must resolve to a real, fully-checked-out repo or
# the run ERRORs.
#
# This costs a maintenance burden the rest of this file avoids — sync.sh and
# drift-report.sh DISCOVER repos via `gh repo list` and never hold a list. The
# burden is paid back by drift-report.sh, which does discover, and now flags
# any repo it reaches that neither key below classifies. So the list can go
# stale, but not silently: adding a repo to the account and forgetting it here
# shows up in the nightly report.
cron_coverage:
  # Repos the multi-repo audit expects to find and must be able to read.
  # Derived 2026-08-18 from the 25 repos the account holds: the two owners
  # sync.yml scans (`SYNC_OWNERS: "Adam-S-Daniel jodidaniel"`), non-fork and
  # non-archived — which is exactly what discovery reaches — minus everything
  # classified out of scope below.
  fleet:
    - _agent-guidance
    - adam-agentskills
    - adam-agentskills-private
    - adamdaniel.ai
    - claude-memory-map
    - cms-platform
    - fastmail-actions
    - GHA-bench
    - jodidaniel.com
    - repo-settings
    - rss-inator
    - skills-evals
    - wsl-automation

  # Deliberately NOT audited, and not expected to be checked out. Recorded so
  # the question is settled once rather than re-argued at each audit (#37), and
  # so the completeness check above has something to measure against.
  #
  # Being here is NOT a claim that a repo has no failing cron. It is a claim
  # that nobody is promising to watch one. Moving a name up to `fleet:` is the
  # whole reversal — no other file changes.
  out_of_scope:
    # Scratch and unexamined. A cron-coverage guarantee is an operational
    # promise, and there is nothing here anyone is operating; these repos do
    # still receive the AGENTS.md sync, which is a different and cheaper thing.
    # If one ever grows a cron somebody depends on, that is the moment it stops
    # being scratch — move it, don't special-case it.
    - scratch-claude-001
    - scratch-jules-001
    - squarespacetemp
    - jc
    - 4A
    # NOT scratch — the skills_bootstrap block above records it as a live
    # portfolio site, and leaving it filed under "nothing here anyone is
    # operating" would make one key of this file contradict the other. It is
    # out of scope for a narrower reason that survives that correction: its
    # only workflow (`deploy.yml`) is push-triggered, so there is no scheduled
    # run to cover. Give it a cron anyone depends on and it moves to `fleet:`.
    - scratch-claude-002
    # FORKS. Never reachable by discovery either (`gh repo list --source`), so
    # these two can never become a finding — they are written down because
    # "why isn't this audited?" is a question worth answering from this file
    # rather than from sync.sh's flags.
    - OctopusDeploy-Api
    - SonosAmpJuicePi
    # Outside both owners in SYNC_OWNERS, so likewise unreachable by discovery.
    - superoutrigger
