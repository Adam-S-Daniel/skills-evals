# .agents-sync.yml — Drop this file in your repo root.
#
# The _agent-guidance CI reads it to decide which language / tooling
# sections to include in the managed portion of your AGENTS.md.
#
# Available sections (each maps to agents-md/sections/<name>.md):
#   python, javascript, typescript, go, dotnet, rust, docker
#
# If this file is absent, the sync falls back to default_sections defined
# in the central repos.yml registry (see that file in _agent-guidance).
# If neither exists, the repo receives only the base guidance.
#
# repos.yml also lists repos excluded from sync entirely (e.g. out-of-scope
# or archived repos) — this file has no effect for an excluded repo.

sections:
  # Uncomment the sections that apply to this repo:
  # - python
  # - javascript
  # - typescript
  # - go
  # - dotnet
  # - rust
  # - docker

# Optional: let the sync propose a PR that REWRITES this repo's CLAUDE.md to
# the standard two-line @AGENTS.md bridge when it exists but does not import
# AGENTS.md (e.g. a pointer-only file that merely links to it). Off by
# default — without this the sync never edits an existing CLAUDE.md; it only
# warns in the sync log, the sync PR body, and the drift report.
# NOTE: the rewrite REPLACES the whole file; only opt in if CLAUDE.md carries
# no hand-written guidance worth keeping.
# fix_claude_md: true

# ── skills-bootstrap: there is deliberately NO key for it here ──────────────
#
# The sync can also deliver `.claude/hooks/skills-bootstrap.sh` — a
# SessionStart hook that installs the skills registry's bundles into EPHEMERAL
# Claude surfaces (cloud sessions, CI runners; it no-ops on a developer's
# machine, where the marketplace install stays authoritative).
#
# It is off unless BOTH of these hold, and neither of them lives in this file:
#
#   1. the repo is listed in `skills_bootstrap.repos` in _agent-guidance's
#      central `repos.yml` — the fleet operator's allowlist;
#   2. the repo already contains a `skills.lock` — YOUR declaration of which
#      bundles you install, and the pins/digests they are verified against.
#
# Key 2 is this repo's own consent, which is why there is no flag for it here:
# committing a `skills.lock` IS the opt-in, and deleting it is the opt-out. The
# sync never creates, updates or overwrites that file — a lock is per-repo (some
# federate more than one registry), so a fleet-wide writer would eventually
# flatten someone's declaration.
#
# Generate a lock from the registry, not by hand:
#   python3 scripts/generate_skills_lock.py --registry Adam-S-Daniel/adam-agentskills \
#           --ref <sha> -o /path/to/your-repo/skills.lock
# (run from an adam-agentskills checkout; add one --source per extra registry —
# omitting them on a REGENERATION silently de-federates an existing lock).
#
# Note the standing cost before adopting: every bundled skill's front-matter is
# always-on context in each ephemeral session, so a 9-skill bundle is roughly
# 1.3k tokens per session, forever.
