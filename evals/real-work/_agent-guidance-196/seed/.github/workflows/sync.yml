name: Sync AGENTS.md to downstream repos

on:
  push:
    branches: [main]
    # This filter has to name every file that DECIDES WHAT A RUN DOES — every
    # file sync.sh reads at runtime, plus this workflow, which carries the
    # owner list. Anything in that set is fleet policy: editing it changes what
    # the next run does to ~20 repos, and if no run fires, the edit changes
    # nothing at all while reading as shipped.
    # `repos.yml` is the case that proved it — the bootstrap allowlist, the
    # hook's pinned ref and its sha256 all live there, so for as long as it was
    # missing here, "bump the pin to fan a hook fix across the fleet" (ADR 0001)
    # produced ZERO runs and waited for an unrelated commit to carry it.
    # `test_sync_workflow_trigger` DERIVES the script half of this list from
    # sync.sh's own `$SCRIPT_DIR/…` / `$REPO_ROOT/…` references, so adding a
    # helper to sync.sh makes the test demand its entry here; the three that no
    # derivation can see are asserted by name, with the reason each is needed.
    paths:
      - "repos.yml"
      - "agents-md/**"
      - "scripts/build-agents-md.sh"
      - "scripts/sync.sh"
      # Executed by sync.sh per repo, so each one decides a consumer's outcome:
      # how its CLAUDE.md is classified, how its settings.json is classified,
      # and what registration gets written into it.
      - "scripts/bridge-status.sh"
      - "scripts/bootstrap-status.sh"
      - "scripts/register-bootstrap-hook.sh"
      # COPIED verbatim into every synced repo, and the payload it installs is
      # agents-md/base.md (covered by `agents-md/**` above). Editing this hook
      # changes what lands in ~20 repos' .claude/hooks/, so without this entry
      # a fix to it would sit here firing no run to deliver itself.
      - ".claude/hooks/fleet-memory.sh"
      # This file. `SYNC_OWNERS` below decides WHICH ~20 repos the run touches,
      # and the dispatch inputs decide whether it writes at all — an owner
      # added or removed here is as much a policy change as an allowlist edit,
      # and without this entry it would fire no run to apply itself.
      - ".github/workflows/sync.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no PRs created)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install yq
        env:
          # Pinned exactly like a `uses:`, and for the same reason — see
          # docs/decisions/0008. Bump the two together: the digest is
          # `yq_linux_amd64`'s, taken from that release's own `checksums`
          # (the SHA-256 column, per its `checksums_hashes_order`) and
          # re-computed from the downloaded bytes.
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          # Fetch AND verify as one retryable unit. A truncated body is a 200
          # with the wrong digest, so a checksum miss is a transient to retry
          # rather than a reason to stop; only a run that fails all three is
          # reporting something real. Bounded at three because a fourth is
          # waiting out an outage, which is a red run's job to announce.
          tmp="$(mktemp -d)"
          for attempt in 1 2 3; do
            if wget -nv --tries=1 --timeout=30 -O "$tmp/yq" \
                 "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" \
               && printf '%s  %s\n' "$YQ_SHA256" "$tmp/yq" | sha256sum -c - >/dev/null; then
              # Verified bytes only, and they arrive already +x: there is no
              # window in which /usr/local/bin/yq exists unchecked.
              sudo install -m 0755 "$tmp/yq" /usr/local/bin/yq
              yq --version
              exit 0
            fi
            echo "::warning::yq $YQ_VERSION: fetch or checksum failed on attempt $attempt of 3"
            rm -f "$tmp/yq"
            if [ "$attempt" -lt 3 ]; then sleep $(( attempt * 5 )); fi
          done
          echo "::error::yq $YQ_VERSION could not be installed: three attempts failed to produce bytes matching $YQ_SHA256"
          exit 1

      # ── Per-owner installation tokens from the agents-md-sync GitHub App ──
      # One short-lived (~1h) token per owner, scoped to that owner's repos and
      # minted fresh every run — nothing to rotate. The App holds a ruleset
      # bypass on fleet-managed repos, so the sync pushes AGENTS.md directly to
      # the default branch (PR + auto-merge fallback where protection rejects
      # it). continue-on-error keeps a missing installation on one owner from
      # aborting the other owner's sync; the verify step below turns "neither
      # minted" into a hard failure.
      - name: Mint installation token for Adam-S-Daniel
        id: token_adam_s_daniel
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Adam-S-Daniel

      - name: Mint installation token for jodidaniel
        id: token_jodidaniel
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jodidaniel

      - name: Verify at least one installation token was minted
        env:
          GH_TOKEN_ADAM_S_DANIEL: ${{ steps.token_adam_s_daniel.outputs.token }}
          GH_TOKEN_JODIDANIEL: ${{ steps.token_jodidaniel.outputs.token }}
        run: |
          if [[ -z "$GH_TOKEN_ADAM_S_DANIEL" && -z "$GH_TOKEN_JODIDANIEL" ]]; then
            echo "::error::Could not mint an installation token for either owner. Check that the agents-md-sync GitHub App is installed on Adam-S-Daniel and/or jodidaniel with Contents + Pull requests: read & write, and that the APP_CLIENT_ID variable and APP_PRIVATE_KEY secret are set on this repo. See README." >&2
            exit 1
          fi
          if [[ -z "$GH_TOKEN_ADAM_S_DANIEL" ]]; then
            echo "::warning::No installation token for Adam-S-Daniel — is the App installed on that account? Its repos will be skipped this run."
          fi
          if [[ -z "$GH_TOKEN_JODIDANIEL" ]]; then
            echo "::warning::No installation token for jodidaniel — is the App installed on that org? Its repos will be skipped this run."
          fi

      - name: Run sync
        env:
          # Per-owner installation tokens minted above (GitHub App mode). Each
          # carries the App's contents:write (push directly to the default
          # branch) + pull_requests:write (PR + auto-merge fallback) +
          # metadata:read (list repos) on that owner's repos, and is consumed by
          # scripts/sync.sh's per-owner token resolution (GH_TOKEN_<OWNER>). No
          # shared GH_TOKEN fallback is needed — every owner gets its own minted
          # token.
          GH_TOKEN_ADAM_S_DANIEL: ${{ steps.token_adam_s_daniel.outputs.token }}
          GH_TOKEN_JODIDANIEL: ${{ steps.token_jodidaniel.outputs.token }}
          SYNC_OWNERS: "Adam-S-Daniel jodidaniel"
        run: |
          chmod +x scripts/sync.sh scripts/build-agents-md.sh
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            ./scripts/sync.sh --dry-run
          else
            ./scripts/sync.sh
          fi
