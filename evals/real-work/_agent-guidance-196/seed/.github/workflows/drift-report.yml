name: Nightly drift report

on:
  schedule:
    - cron: "0 6 * * *"       # 06:00 UTC daily
  workflow_dispatch:           # manual trigger

permissions:
  contents: write              # force-pushes the regenerated report to drift-report
  issues: write                # files the unclassified-repo nudge (ADR 0011)

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main

      - name: Install yq
        env:
          # Pinned exactly like a `uses:`, and for the same reason — see
          # docs/decisions/0008. Bump the two together: the digest is
          # `yq_linux_amd64`'s, taken from that release's own `checksums`
          # (the SHA-256 column, per its `checksums_hashes_order`) and
          # re-computed from the downloaded bytes.
          YQ_VERSION: v4.53.3
          YQ_SHA256: fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
        run: |
          set -euo pipefail
          # Fetch AND verify as one retryable unit. A truncated body is a 200
          # with the wrong digest, so a checksum miss is a transient to retry
          # rather than a reason to stop; only a run that fails all three is
          # reporting something real. Bounded at three because a fourth is
          # waiting out an outage, which is a red run's job to announce.
          tmp="$(mktemp -d)"
          for attempt in 1 2 3; do
            if wget -nv --tries=1 --timeout=30 -O "$tmp/yq" \
                 "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" \
               && printf '%s  %s\n' "$YQ_SHA256" "$tmp/yq" | sha256sum -c - >/dev/null; then
              # Verified bytes only, and they arrive already +x: there is no
              # window in which /usr/local/bin/yq exists unchecked.
              sudo install -m 0755 "$tmp/yq" /usr/local/bin/yq
              yq --version
              exit 0
            fi
            echo "::warning::yq $YQ_VERSION: fetch or checksum failed on attempt $attempt of 3"
            rm -f "$tmp/yq"
            if [ "$attempt" -lt 3 ]; then sleep $(( attempt * 5 )); fi
          done
          echo "::error::yq $YQ_VERSION could not be installed: three attempts failed to produce bytes matching $YQ_SHA256"
          exit 1

      # ── Per-owner read tokens from the agents-md-sync GitHub App ──
      # The same App as sync; here only its read access is exercised (list
      # repos, read CLAUDE.md/AGENTS.md, list open sync PRs). continue-on-error
      # plus the github.token base fallback below keep the report in its
      # documented degraded mode (public repos only) if an owner's install is
      # missing, rather than hard-failing the nightly job.
      - name: Mint installation token for Adam-S-Daniel
        id: token_adam_s_daniel
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: Adam-S-Daniel

      - name: Mint installation token for jodidaniel
        id: token_jodidaniel
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: jodidaniel

      - name: Generate drift report
        env:
          # Base fallback: github.token can still read this repo's owner's
          # public repos if App minting fails (the documented degraded mode).
          # GH_TOKEN_<OWNER> (minted above) takes precedence per owner.
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN_ADAM_S_DANIEL: ${{ steps.token_adam_s_daniel.outputs.token }}
          GH_TOKEN_JODIDANIEL: ${{ steps.token_jodidaniel.outputs.token }}
          SYNC_OWNERS: "Adam-S-Daniel jodidaniel"
        run: |
          chmod +x scripts/drift-report.sh scripts/build-agents-md.sh
          ./scripts/drift-report.sh

      # Under the branch ruleset that requires a PR before merging, a plain
      # "git push to main" as github-actions[bot] is rejected, so this can't
      # land on main directly. An earlier version of this job opened a
      # standing PR instead, but that's the wrong shape: a regenerated
      # dashboard is generated data, not a reviewable change, and the PR
      # just piled up as unmergeable bot noise nobody acted on. Per
      # repo-settings' ADR 0001, generated data belongs on its own
      # unprotected results branch instead. The branch holds only the
      # latest snapshot with no history worth preserving, so force-push it
      # fresh each night; consumers read the report straight off that
      # branch rather than off main. It's named drift-report-latest, not
      # drift-report, because a legacy refs/heads/drift-report/update ref
      # from that earlier standing-PR design still occupies the
      # drift-report/ namespace and blocks the bare name from ever being
      # created as a ref.
      - name: Publish to the drift-report-latest results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f drift-report.md drift-report-skills-unclassified.txt
          # The orphan sidecar is WITHHELD, not written empty, on a run where
          # an owner's listing failed (see drift-report.sh's orphan block), so
          # it is added only when it is there: `git add` on a missing path
          # fails, and this step must never be what stops the report
          # publishing. The branch is force-pushed fresh from a `main`
          # checkout each night, so a withheld file simply is not on it — there
          # is no stale copy to un-stage.
          if [ -f drift-report-skills-orphans.txt ]; then
            git add -f drift-report-skills-orphans.txt
          fi
          if git diff --cached --quiet; then
            echo "No changes to report — leaving the drift-report-latest branch as is."
            exit 0
          fi
          git commit -m "chore: nightly drift report [skip ci]"
          git push --force origin HEAD:refs/heads/drift-report-latest

      # AFTER the publish, and that ORDER IS THE POINT. This step can fail --
      # a token without issues:write, a rate limit -- and the report must
      # already be on the results branch when it does. drift-report.sh's own
      # findings are deliberately not an exit code for the same reason: the
      # publish step carries no `if: always()`, so anything that reds before it
      # suppresses the very artifact the run exists to produce.
      #
      # A `ci`-labelled ISSUE rather than a louder log line, which ADR 0003
      # pre-authorised and ADR 0011 acts on: this workflow is a 06:00 cron, and
      # a scheduled run notifies nobody. drift-report.yml itself was red for 26
      # consecutive nights before a human happened to open the Actions tab.
      #
      # NOTHING is interpolated into this script. `${{ }}` renders into the
      # command line and the command line is echoed to a public log; the repo
      # names here are already public in the report, but the habit is the
      # guard, so they arrive as files and env instead.
      - name: Nudge on repos nobody has classified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIDECAR: drift-report-skills-unclassified.txt
          ISSUE_TITLE: "Unclassified for skills-bootstrap"
        run: |
          set -euo pipefail

          # ABSENT is not EMPTY. An empty sidecar is drift-report.sh saying it
          # looked and found nothing; an absent one means it did not get that
          # far, and closing an open nudge on that would be concluding "all
          # classified" from a run that classified nothing.
          if [[ ! -f "$SIDECAR" ]]; then
            echo "::warning::$SIDECAR was not written — the report did not reach the classification pass, so nothing is concluded here"
            exit 0
          fi

          existing=$(gh issue list --state open --label ci             --search "$ISSUE_TITLE in:title" --json number,title             --jq "[.[] | select(.title == env.ISSUE_TITLE)] | .[0].number // empty")

          if [[ ! -s "$SIDECAR" ]]; then
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" --comment                 "Every discovered repo is now classified under \`skills_bootstrap.repos\` or \`skills_bootstrap.out_of_scope\`. Closed by the nightly drift report."
              echo "closed #$existing — nothing unclassified"
            else
              echo "nothing unclassified, and no open nudge to close"
            fi
            exit 0
          fi

          # Body from a FILE, never an argument: a name is untrusted input as
          # far as this script is concerned, and a here-doc keeps it out of the
          # command line and out of the log.
          {
            echo "\`drift-report.sh\` discovered repositories that are in neither half of \`skills_bootstrap\`:"
            echo
            sed 's/^/- `/; s/$/`/' "$SIDECAR"
            echo
            echo "Each one needs a decision, not a default:"
            echo
            echo "- add it to \`skills_bootstrap.repos\` to deliver the SessionStart hook there, or"
            echo "- add it to \`skills_bootstrap.out_of_scope\` with the reason not to."
            echo
            echo "\`scripts/check-registry.js\` will then accept the registry again, and this issue closes itself on the next nightly run."
            echo
            echo "Background: [ADR 0011](../blob/main/docs/decisions/0011-skills-bootstrap-scope-is-exhaustive.md)."
          } > /tmp/nudge-body.md

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body-file /tmp/nudge-body.md
            echo "updated #$existing"
          else
            gh issue create --title "$ISSUE_TITLE" --label ci --body-file /tmp/nudge-body.md
          fi

      # THE OTHER DIRECTION, and its own issue rather than a second section of
      # the one above: the two resolve differently -- that one is answered by
      # classifying a repo, this one by finding out what happened to a name --
      # and each has to be able to close while the other stands.
      #
      # ABSENT means something different here, and the difference is the whole
      # safety property. drift-report.sh WITHHOLDS this sidecar on any run
      # where an owner's listing failed, because that run's discovery union is
      # short by a whole owner and every repo that owner holds would read as
      # gone. An empty file would close the issue below on the strength of an
      # enumeration that never happened; an absent one concludes nothing.
      - name: Nudge on registry names discovery did not return
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIDECAR: drift-report-skills-orphans.txt
          ISSUE_TITLE: "Registry names discovery did not return"
        run: |
          set -euo pipefail

          if [[ ! -f "$SIDECAR" ]]; then
            echo "::warning::$SIDECAR was not written — this run did not establish a complete enumeration (an owner went unread), so nothing is concluded here"
            exit 0
          fi

          existing=$(gh issue list --state open --label ci \
            --search "$ISSUE_TITLE in:title" --json number,title \
            --jq "[.[] | select(.title == env.ISSUE_TITLE)] | .[0].number // empty")

          if [[ ! -s "$SIDECAR" ]]; then
            if [[ -n "$existing" ]]; then
              gh issue close "$existing" --comment \
                "Every name \`repos.yml\` classifies under \`skills_bootstrap\` was returned by discovery on the latest run that read every owner. Closed by the nightly drift report."
              echo "closed #$existing — every registry name was discovered"
            else
              echo "no unreturned registry names, and no open nudge to close"
            fi
            exit 0
          fi

          # Body from a FILE, never an argument, for the reason the step above
          # gives: a name is untrusted input as far as this script is concerned.
          {
            echo "\`drift-report.sh\` read every owner this run and did NOT see these names, which \`repos.yml\` classifies under \`skills_bootstrap\`:"
            echo
            sed 's/^/- `/; s/$/`/' "$SIDECAR"
            echo
            echo "**Each is a name to look at, not a verdict.** A repo this run's credential cannot see answers 404 exactly like one that is gone, so any of these may be private, renamed, transferred, or simply unreadable by the App installation that ran tonight."
            echo
            echo "For each: establish what actually happened to it, then correct or remove its entry under \`skills_bootstrap.repos\` / \`skills_bootstrap.out_of_scope\` — or leave the entry and record why the name is unreachable from here."
            echo
            echo "Why this check exists: three \`civic-*\` repos were deleted from GitHub and sat in this fleet's configuration for weeks. Nothing enumerated in this direction, so nothing said so, and a propagation verifier seeded from that configuration counted them as live consumers. \`scripts/check-registry.js\` cannot catch it — it is offline by design, and this needs the network."
            echo
            echo "Background: [ADR 0011](../blob/main/docs/decisions/0011-skills-bootstrap-scope-is-exhaustive.md)."
          } > /tmp/orphan-nudge-body.md

          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --body-file /tmp/orphan-nudge-body.md
            echo "updated #$existing"
          else
            gh issue create --title "$ISSUE_TITLE" --label ci --body-file /tmp/orphan-nudge-body.md
          fi
