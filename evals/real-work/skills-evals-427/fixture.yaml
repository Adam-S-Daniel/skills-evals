  This is the fifth skill from #422. Improve mode (`scripts/propose_skill_edit.py`) counts only nested fixtures, and workflow-path-audit had one flat fixture. Move that fixture and add three more, so the skill has four.

  ## What

  **The move.** The flat fixture (fixture key `""`) becomes a nested one, so the pooling alias can record the rename. Its new directory is named last in the interface paragraph below.

  **New fixtures.** Each one measures a SKILL.md claim the reference fixture does not:

  - `companion-skip-pair`: the required workflow's inverted-filter twin is deleted and the gating moves inside the required workflow.
  - `moved-test-dir`: renamed paths, configs reached only indirectly, and the trap of a broad `.github/**` filter.
  - `workflow-doc-in-step`: AGENTS.md's workflow table must follow the workflows' new filters, and no second doc may appear.

  All data is invented. No fixture pins a model.

  `scripts/board_feed.py`'s trend line accepts both the old flat key and the new one, so history carries over.

  Make this change.

  ## Interface the reviewer's tests use

  The hidden tests are the three `test/issues/test_issue_wpa_*.py` modules, which share `test/workflow_path_audit_case.py`, and the trend test of the board feed tests. They read the fixture directories `evals/workflow-path-audit/companion-skip-pair`, `evals/workflow-path-audit/moved-test-dir`, `evals/workflow-path-audit/workflow-doc-in-step`, plus the moved one at `evals/workflow-path-audit/required-check-routing`; every one has a `fixture.yaml` and a `seed/`. Each fixture's objective checks carry these ids, in this order.

  companion-skip-pair: required-check-gates-inside-one-workflow; then companion-skip-workflow-removed; then docs-change-still-reports-the-required-check; then source-change-skips-the-docs-site; then workflows-still-parse; then event-only-workflows-unfiltered; then ruleset-unchanged; then project-files-unchanged.

  moved-test-dir: moved-spec-runs-e2e; then server-script-runs-e2e; then own-workflow-edit-runs-itself; then sibling-workflow-edit-runs-only-itself; then unit-test-change-skips-e2e; then prose-change-runs-nothing; then lockfile-change-runs-every-installer; then workflows-still-parse; then event-only-workflows-unfiltered; then project-files-unchanged.

  workflow-doc-in-step: docs-change-builds-only-the-docs; then source-change-runs-only-the-tests; then lockfile-change-runs-only-the-tests; then agents-md-change-runs-nothing; then tests-row-names-its-paths; then docs-site-row-names-its-paths; then agents-md-keeps-the-rest; then workflows-still-parse; then event-only-workflows-unfiltered; then no-second-workflow-doc.

