---
layout: default
---
<h1>{{ page.title | escape }}</h1>
<p>{{ page.description | escape }}</p>
{% if page.embed_src %}
<iframe src="{{ page.embed_src | relative_url }}" title="{{ page.title | escape }}" loading="lazy" style="width:100%; height:80vh; border:0;"></iframe>
<p><a href="{{ page.embed_src | relative_url }}">Open full screen</a></p>
{% endif %}
{% if page.source_url %}<p><a href="{{ page.source_url }}">Source</a></p>{% endif %}
{{ content }}
