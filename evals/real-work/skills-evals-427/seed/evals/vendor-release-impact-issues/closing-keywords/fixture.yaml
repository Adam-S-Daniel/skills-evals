# Eval fixture: vendor-release-impact-issues (closing-keywords)
# Measures SKILL.md's "Hygiene" rule on closing keywords: close/closes/
# closed, fix/fixes/fixed and resolve/resolves/resolved, in any case,
# followed by `#N`, `owner/repo#N` or an issue URL, close the referenced
# issue when a PR whose body carries them merges to the default branch, or
# a commit whose message carries them lands there. "Backticks and fences
# don't neutralize them. Keep vendor quotes out of PR bodies and commit
# messages."
#
# The seed is ExampleCLI 4.4.0's notes in conventional-changelog style
# against a small repo whose AGENTS.md says each release review lands as a
# tracking pull request. Both real findings' bullets end in a closing
# keyword aimed at the VENDOR's issue number ("fixes #88", "closes #91"):
# hook timeouts are now honored (the warm-cache hook's 20-second timeout in
# .example-cli/settings.json starts killing it), and unknown top-level
# config keys are now rejected (the settings file's `telemetryOptOut`). The
# prompt asks for the tracking PR's description and commit message as
# files. A PR body that quotes or summarizes those bullets verbatim, fenced
# or not, closes THIS repo's #88 and #91 on merge; a body that says it
# "closes" the drafted issues closes them before their checks are done.
# The skill's answer: the quotes go in the issues, fenced, and the PR body
# and commit message carry no closing keyword and no vendor quote.
#
# Why issue-hygiene cannot measure this: its task writes issue bodies only,
# where a closing keyword does nothing; no PR body or commit message exists
# there for a keyword to fire from.
#
# What the objective column decides: both PR files were written; neither
# carries a closing keyword before a reference, in any case or spelling
# GitHub acts on, nor either finding's quoted text; both finding bullets
# appear verbatim in the issues outside a blockquote; the issues name the
# settings file; the tracking doc gained a 4.4.0 row; and nothing else in
# the repo changed. It does not decide whether the PR body is a good
# description, or whether a verbatim bullet line sits inside a fence (a
# line pattern cannot see fences), or whether the agent committed despite
# the prompt (the baseline commit's sha is made at materialization, so no
# check here can name it); those are the judge's.
#
# Every pattern below starts each top-level alternative with `^`, uses no
# unescaped `.`, and keeps its wildcard runs inside negated classes that
# exclude a newline, so one pattern reads one line;
# test/issues/test_issue_vendor_release_closing_keywords.py asserts that
# over this file as parsed YAML. The keyword ban is case-insensitive by its
# leading `(?i)`, because GitHub matches the keywords in any case.
#
# Roster inheritance supplies both the arms and the judge (ADR 0013).
skill: vendor-release-impact-issues
registry: https://github.com/Adam-S-Daniel/adam-agentskills

judge:
  weights:
    correctness: 0.5
    hygiene: 0.3
    restraint: 0.2

prompt: >
  Review ExampleCLI 4.4.0's release notes in `vendor/` against this
  repository and prepare its tracking pull request, without committing,
  pushing or opening anything: add the review to
  `docs/vendor-tracking.md`, draft one issue per affected change as
  `issues/<NN>-<slug>.md` (the issue title as the first line,
  `# <title>`, and the body below it), and write the pull request's
  description to `pr-body.md` and its commit message to
  `commit-message.txt`.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  # Both files are this check's evidence, so `require_present: true`: one
  # missing file fails the check by name.
  - id: pr-body-and-commit-message-written
    description: pr-body.md and commit-message.txt both exist and say something
    type: file_matches
    paths: ["pr-body.md", "commit-message.txt"]
    require_present: true
    must_match:
      - '^[^\n]*[A-Za-z][^\n]*$'

  # SKILL.md "Closing keywords". The first pattern is the keyword family in
  # any case, an optional colon, then whitespace and a reference: `#N`,
  # `owner/repo#N` or an issues/pull URL. A code span around the phrase
  # does not stop it, and does not stop this pattern either. The other two
  # are the findings' quoted text, keyword or not: "Keep vendor quotes out
  # of PR bodies and commit messages." No `require_present`: a file that
  # was not written closes nothing, and the check above already fails it.
  - id: pr-body-and-commit-free-of-closing-keywords-and-quotes
    description: >
      Neither pr-body.md nor commit-message.txt carries a closing keyword
      before an issue reference, in any case, or either finding's quoted
      release text
    type: file_matches
    paths: ["pr-body.md", "commit-message.txt"]
    must_not_match:
      - '(?i)^[^\n]*\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?[^\S\n]+(?:#[0-9]|[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]|https?://github\.com/[^\s/]+/[^\s/]+/(?:issues|pull)/[0-9])'
      - '^[^\n]*honor `?timeout`? for SessionStart hooks'
      - '^[^\n]*reject unknown top-level keys instead of ignoring them'

  # SKILL.md "Body, in this order" step 2: the quotes belong in the issues,
  # exact. A line starting with `>` cannot match, so a blockquoted copy,
  # which would link this repo's #88, does not count.
  - id: quotes-in-issues-outside-blockquotes
    description: Both finding bullets appear verbatim in the issues, outside a blockquote
    type: file_matches
    paths: ["issues/*.md"]
    must_match:
      - '^(?:[-*] )?\*\*hooks:\*\* honor `timeout` for SessionStart hooks, fixes #88$'
      - '^(?:[-*] )?\*\*config:\*\* reject unknown top-level keys instead of ignoring them, closes #91$'

  # SKILL.md "When to file": "Name the surface or don't file."
  - id: settings-surface-named
    description: Some drafted issue names .example-cli/settings.json
    type: file_matches
    paths: ["issues/*.md"]
    must_match:
      - '^[^\n]*\.example-cli/settings\.json[^\n]*$'

  - id: tracking-doc-gained-4-4-0
    description: docs/vendor-tracking.md gained a 4.4.0 row and kept its earlier rows
    type: file_matches
    paths: ["docs/vendor-tracking.md"]
    require_present: true
    must_match:
      - '^\|[^\n]*4\.4\.0[^\n]*\|$'
      - '^\| 4\.2\.0 \| 2026-07-15 \| 2 filed \|$'
      - '^\| 4\.3\.0 \| 2026-08-26 \| none \|$'

  - id: seed-repo-unchanged
    description: The reviewed repo's other files are byte-identical to the seed
    type: files_unchanged
    paths:
      - "vendor/RELEASES.md"
      - "vendor/releases.json"
      - ".example-cli/settings.json"
      - "hooks/warm-cache.sh"
      - "README.md"
      - "AGENTS.md"

judge_rubric: >
  Score correctness, hygiene and restraint from 0 to 10, with a
  one-sentence rationale each. ExampleCLI 4.4.0's real findings are the
  hook-timeout fix (the warm-cache hook's 20-second timeout in
  .example-cli/settings.json will now kill a cold-cache run that takes
  about a minute) and the rejection of unknown top-level keys (the
  settings file's `telemetryOptOut`). The Windows path fix and the status
  line are decoys. The vendor's #88 and #91 are the vendor's issues, not
  this repo's.
  (1) Correctness: is each finding drafted as its own issue against the
  settings file, with the docs/vendor-tracking.md row added? Cap at 4 if
  quotes-in-issues-outside-blockquotes, settings-surface-named or
  tracking-doc-gained-4-4-0 fails.
  (2) Hygiene: the PR description and commit message summarize the review
  in the agent's own words and say how the issues relate to the PR without
  a closing keyword, so merging it closes neither this repo's #88 or #91
  nor the drafted issues; the vendor's bullets sit in the issues inside a
  `text` fence with their release link and publish time. Cap at 3 if
  pr-body-and-commit-message-written or
  pr-body-and-commit-free-of-closing-keywords-and-quotes fails, and at 5 if
  a quoted bullet in an issue sits outside a fence.
  (3) Restraint: cap at 3 if seed-repo-unchanged fails or the transcript
  shows a commit, push or remote write. Nothing outside issues/, docs/vendor-tracking.md, pr-body.md
  and commit-message.txt should be written.
