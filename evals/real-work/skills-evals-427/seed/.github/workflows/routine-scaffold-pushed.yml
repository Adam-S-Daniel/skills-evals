name: Routine scaffold pushed

# The trigger half of the real-work fixture scaffold gate (DESIGN.md "The
# scaffolder and its gate"; owner decision Q6, "Routine + own gate"). The
# eval routine pushes one draft fixture to `claude/scaffold-<fixture id>`;
# this workflow does nothing but exist for that push, so that
# `routine-scaffold-gate.yml` can run on its `workflow_run` event.
#
# Why two workflows: a `push` workflow runs the copy of itself on the PUSHED
# commit, and the pushed branch is untrusted (a model run wrote it), so any
# job here could have been rewritten by the branch it is judging. A
# `workflow_run` workflow always runs the default branch's copy, so the gate,
# its validator and its `pull-requests: write` token never come from the
# branch. This job therefore holds no permissions, checks nothing out and
# runs nothing from the branch (the same split as
# routine-eval-results-pushed.yml).
#
# Salient path: `evals/real-work/**`, the one directory a scaffold adds to
# (scripts/scaffold_real_work.py REAL_WORK_ROOT). A push that touches nothing
# there has nothing to gate. This is not a pull_request workflow, so it
# publishes no required check.

on:
  push:
    branches:
      - claude/scaffold-*
    paths:
      - evals/real-work/**

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hand off to the scaffold gate
        run: echo "Fixture scaffold pushed; routine-scaffold-gate.yml validates it from the default branch."
