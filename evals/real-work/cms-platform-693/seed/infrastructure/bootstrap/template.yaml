AWSTemplateFormatVersion: '2010-09-09'

Description: >
  One-time bootstrap stack for a platform site's CI/CD infrastructure.

  Creates:
    1. S3 bucket for CloudFormation/SAM deployment artifacts
    2. ACM wildcard certificate *.<apex> + CloudFront distribution
       serving every preview-prN.<apex> subdomain off one bucket
    3. ACM certificate + CloudFront distribution for the apex (production),
       plus, only when AdminDomainName is set, a certificate + distribution
       serving the editor from its own host
    4. Route53 DNS records for preview wildcard and production domains
    5. GitHub OIDC identity provider in AWS IAM
    6. IAM role for GitHub Actions (assumed via OIDC — no long-lived keys)

  Prerequisites: S3 buckets for previews and production (see parameter defaults)
  must already exist with static website hosting enabled.

  Run once per AWS account:
    bash infrastructure/bootstrap/deploy.sh

Parameters:

  GitHubOrg:
    Type: String
    Default: Adam-S-Daniel
    Description: "GitHub organization or user that owns the repository"

  GitHubRepo:
    Type: String
    Description: "GitHub repository name (e.g. example.com)"

  ResourcePrefix:
    Type: String
    AllowedPattern: "^[a-z0-9-]+$"
    Description: >
      Lowercase prefix for the named AWS resources this stack creates and for
      the IAM scoping (the GitHub Actions role, plus the CloudFormation /
      Lambda / Logs ARNs that role may touch). Convention: the apex domain with
      dots as hyphens, e.g. `example-com`. Buckets are named separately below.

  ArtifactBucketName:
    Type: String
    Description: "S3 bucket name for CloudFormation/SAM deployment artifacts"

  PreviewBucketName:
    Type: String
    Description: "S3 bucket name for PR preview deployments (static website hosting)"

  PreviewDomainName:
    Type: String
    Description: >
      Wildcard DNS + cert alias for PR previews. Each PR deploys to
      preview-pr${N}.<apex> (matched by the wildcard) and a
      CloudFront Function maps the hostname to the S3 object-key prefix.

  ProductionBucketName:
    Type: String
    Description: "S3 bucket name for the production site (static website hosting)"

  ProductionDomainName:
    Type: String
    Description: "Primary custom domain for the production site"

  HostedZoneId:
    Type: String
    AllowedPattern: "^Z[A-Z0-9]+$"
    Description: "Route53 hosted zone ID for the apex domain (e.g. Z02339993KRS1LII3B24S)"

  MediaArchiveBucketName:
    Type: String
    Default: ""
    Description: >
      OPTIONAL private S3 bucket holding archived PDFs of third-party articles
      that a site's `_media` entries reference. Leave EMPTY to skip it
      entirely; a site that does not archive PDFs needs nothing here.

      It exists because a site repo is PUBLIC: a PDF committed there is
      world-readable at raw.githubusercontent.com whatever the site renders,
      and git history keeps it after a `git rm`. So the bytes live here, the
      repo names the object, and a per-item `pdf_public` checkbox decides
      whether a deploy copies one onto the public site. Public access is
      blocked on every axis and NO bucket policy grants read: the only reader
      is the GitHub Actions role, via the statement below. Convention:
      `<prefix>-media-archive`. See docs/MEDIA-ARCHIVE.md.

  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Set to 'false' if a GitHub OIDC provider already exists in this account
      (e.g., created by another stack). Only one provider per URL is allowed.

  CreateApexDnsRecords:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Whether to create the apex + www Route53 A-alias records that point the
      live domain at the production CloudFront distribution. This is the
      GO-LIVE cutover: leave 'false' to stand up all infra (buckets, both
      distributions, certs, preview DNS) WITHOUT repointing the live apex —
      so a site already served elsewhere (e.g. email-host web hosting) keeps
      serving. Flip to 'true' when ready to cut the apex over to CloudFront.
      (Defaults false so `aws cloudformation deploy` is safe pre-go-live; the
      apex/www A-records would otherwise collide with existing records or
      silently repoint a live domain.)

  AdminDomainName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[a-z0-9-]+(\\.[a-z0-9-]+)+$"
    Description: >
      OPTIONAL host that serves the Decap editor on its own origin, e.g.
      `admin.<apex>` (cms-platform#517). Leave EMPTY and nothing in this stack
      changes. When set, the stack adds a certificate, a CloudFront
      distribution and a Route53 A-alias for this host (serving only /admin/
      out of the production bucket), and a function on the production
      distribution that redirects /admin on the apex and www here. It must be
      a name inside HostedZoneId's zone with no record of its own yet. The
      site sets the same origin as `cms.admin_origin` in _config.yml.
      See docs/ADMIN-AUTH-SECURITY.md.
  HstsMaxAgeSeconds:
    Type: Number
    Default: 31536000
    MinValue: 0
    Description: >
      max-age of the Strict-Transport-Security header both distributions send
      (default one year). Lower it first if the site might ever need to serve
      plain HTTP again; 0 tells browsers to forget an earlier policy.

  HstsScope:
    Type: String
    Default: "this-host-only"
    AllowedValues: ["this-host-only", "include-subdomains", "include-subdomains-preload"]
    Description: >
      Whether Strict-Transport-Security also covers every subdomain of the
      host that sent it (includeSubDomains), and asks to be hard-coded into
      browsers (preload). Both commit hosts this stack does not serve, such
      as other services under the apex, and preload is close to permanent,
      so the default covers only the host that answered.

  AdminCspMode:
    Type: String
    Default: "report-only"
    AllowedValues: ["report-only", "enforce"]
    Description: >
      How /admin/* sends its Content-Security-Policy. 'report-only' (the
      default) sends the full policy as Content-Security-Policy-Report-Only,
      so a violation is logged to the browser console and nothing is
      blocked, while frame-ancestors stays enforced. 'enforce' sends the full
      policy as Content-Security-Policy. Flip it only after an editor
      round-trip shows no violations (docs/ADMIN-AUTH-SECURITY.md).

Conditions:
  ShouldCreateOIDCProvider: !Equals [!Ref CreateOIDCProvider, "true"]
  ShouldCreateApexDnsRecords: !Equals [!Ref CreateApexDnsRecords, "true"]
  ShouldCreateMediaArchive: !Not [!Equals [!Ref MediaArchiveBucketName, ""]]
  HasAdminDomain: !Not [!Equals [!Ref AdminDomainName, ""]]
  HstsIncludesSubdomains: !Not [!Equals [!Ref HstsScope, "this-host-only"]]
  HstsPreloads: !Equals [!Ref HstsScope, "include-subdomains-preload"]
  AdminCspEnforced: !Equals [!Ref AdminCspMode, "enforce"]

Resources:

  # ── S3 bucket for CloudFormation / SAM artifacts ──────────────────────────
  CfnArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # ── S3 bucket for PR preview deployments ────────────────────────────────────
  #
  # Imported into the stack. DeletionPolicy: Retain keeps this bucket alive
  # even if the logical resource is removed from the template — we lost the
  # earlier ProductionBucket + ProductionBucketPolicy that way and the
  # production site went down with them (see commit history).
  #
  PreviewBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref PreviewBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html

  PreviewBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    # UpdateReplacePolicy: Retain — keeps this policy alive on a stack update
    # that would otherwise replace it, matching the DeletionPolicy intent and
    # satisfying W3011. BucketPolicy replacement is rare but the consequence
    # (public-read access vanishing from the preview bucket) is serious enough
    # that Retain is the right choice.
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref PreviewBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${PreviewBucketName}/*"

  # ── S3 bucket for production site ──────────────────────────────────────────
  #
  # Imported into the stack (one-time via `create-change-set --change-set-type
  # IMPORT` — deploy.sh doesn't do imports). DeletionPolicy: Retain keeps the
  # bucket alive even if the resource is later removed from the template, so
  # production can't silently lose its website config + policy the way it did
  # when earlier versions of this stack removed them.
  #
  # Private archive of media PDFs. Deliberately unlike the three buckets
  # around it: no website configuration, no bucket policy, no CloudFront
  # origin, and Block Public Access ON for all four axes -- so it cannot be
  # made public by a stray ACL or a policy added later without also editing
  # this block. Versioning is on because the archive is the ONLY copy of a
  # rendered article capture; an overwrite with the wrong file is otherwise
  # unrecoverable. Retained on stack delete for the same reason.
  MediaArchiveBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateMediaArchive
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref MediaArchiveBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  ProductionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref ProductionBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html

  ProductionBucketPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    # UpdateReplacePolicy: Retain — mirrors the DeletionPolicy intent (W3011).
    # If this resource were replaced during an update, the policy would be
    # deleted and the production bucket would lose public-read access, taking
    # down the live site. Retain prevents that.
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref ProductionBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadForWebsite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${ProductionBucketName}/*"

  # ── ACM wildcard certificate for preview subdomains ──────────────────────
  #
  # Must be in us-east-1 for CloudFront. DNS validation via Route53. Covers
  # preview-pr1.<apex>, preview-pr2.<apex>, and any future
  # single-label subdomain — a single cert for the whole preview fleet.
  # Doesn't cover the apex <apex>, which keeps its own prod cert.
  #
  # Note: CloudFront allows *.<apex> on this distribution to coexist
  # with the production distribution's specific <apex> +
  # www.<apex> aliases. Requests for those specific hosts win over
  # the wildcard.
  #
  PreviewCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref PreviewDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref PreviewDomainName
          HostedZoneId: !Ref HostedZoneId

  # ── CloudFront Function: host → S3 object-key prefix ─────────────────────
  #
  # Runs at viewer-request on every request to the preview distribution.
  # Extracts the PR number from preview-prN.<apex> and prepends
  # /pr-N to the URI before CloudFront looks up the object in S3. The
  # browser-facing URL stays clean (no /pr-N/ prefix), and the S3 object
  # key matches what deploy-preview.yml syncs.
  #
  # Hosts that don't match the pattern fall through unchanged — useful for
  # anyone browsing directly to <apex> (which is caught by the prod
  # distribution anyway) or to preview.<apex>.
  #
  PreviewRouterFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-preview-router"
      AutoPublish: true
      FunctionConfig:
        Comment: "preview-prN / preview-cms-<slug> .<apex> → /<prefix>/<uri> for S3 origin"
        Runtime: cloudfront-js-2.0
      # Two host patterns map to two S3 object-key prefixes:
      #   preview-prN.<apex>           → /pr-N/<uri>
      #   preview-cms-<slug>.<apex>    → /cms-<slug>/<uri>
      #
      # The cms-<slug> form gives editors a stable per-entry preview URL
      # that survives across draft cycles for the same entry. The
      # preview-prN form changes when Decap closes & re-opens a PR for
      # the same canary; the cms-<slug> form does not. See
      # docs/preview-pr-ruleset-spike.md for the full reasoning.
      #
      # Slug shape: lowercase ASCII + digits + hyphens. Decap derives it
      # from `cms/<collection>/<slug>` head refs by replacing `/` with
      # `-`, so `cms/posts/foo-bar` → `posts-foo-bar`.
      #
      # Hosts that don't match either pattern fall through unchanged.
      # `!Sub` bakes the apex (${ProductionDomainName}) into the function at
      # deploy time — CloudFront Functions can't read stack params at runtime.
      # Host matching uses string ops (not a dynamic RegExp) to stay within the
      # cloudfront-js-2.0 runtime and keep the apex's dots literal. The only
      # `${...}` is the injected domain; the static `/^[0-9]+$/` etc. contain no
      # `${`, so `!Sub` leaves them untouched.
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var host = request.headers.host && request.headers.host.value;
          if (!host) return request;
          var suffix = '.${ProductionDomainName}';
          if (host.slice(-suffix.length) !== suffix) return request;
          var label = host.slice(0, host.length - suffix.length);
          if (label.indexOf('preview-pr') === 0) {
            var pr = label.slice(10);            // 'preview-pr'.length
            if (pr.length > 0 && /^[0-9]+$/.test(pr)) {
              request.uri = '/pr-' + pr + request.uri;
              return request;
            }
          } else if (label.indexOf('preview-cms-') === 0) {
            var slug = label.slice(12);          // 'preview-cms-'.length
            if (slug.length > 0 && /^[a-z0-9-]+$/.test(slug)) {
              request.uri = '/cms-' + slug + request.uri;
              return request;
            }
          }
          return request;
        }

  # ── CloudFront Function: strip /pr-N/ from response Location headers ────
  #
  # Runs at viewer-response on the same distribution as the request-side
  # PreviewRouterFunction. The router rewrites the request URI by prepending
  # /pr-N before sending it to S3, but S3 doesn't know about the rewrite —
  # so when it 302s a no-trailing-slash directory request (e.g. /admin →
  # /admin/) it includes its own internal path, surfacing /pr-N/admin/ in
  # the Location header. The browser would then navigate to
  # https://preview-prN.<apex>/pr-N/admin/, which has no /pr-N/ in
  # the visible URL space and 404s.
  #
  # This function strips the matching /pr-N/ prefix from Location on
  # responses to a preview-prN.<apex> host, restoring the clean
  # public path. Only same-PR prefixes are stripped: a /pr-99/ leak on a
  # pr-23 host is left visible so it fails loudly rather than silently
  # routing somewhere unexpected. Absolute-URL Locations and non-3xx
  # responses are no-ops.
  #
  PreviewLocationFixerFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-preview-location-fixer"
      AutoPublish: true
      FunctionConfig:
        Comment: "Strip /pr-N/ or /cms-<slug>/ from Location, and inject X-Robots-Tag: noindex on every preview response"
        Runtime: cloudfront-js-2.0
      # Two responsibilities, both viewer-response, on the preview
      # distribution only:
      #
      #   1. **Location-header stripping.** When the upstream rewriter
      #      prepended `/pr-N/` (or `/cms-<slug>/`) to the request URI,
      #      S3's same-prefix `/admin → /admin/` redirect leaks the
      #      internal path back into the response Location. Strip
      #      same-host prefixes; leave cross-host prefixes visible so
      #      misrouted responses fail loudly.
      #
      #   2. **noindex header.** Preview environments must NEVER show
      #      up in search results — they're per-PR ephemeral copies of
      #      the production site's content, often with future-dated canaries
      #      and unpublished posts. The shared `robots.txt` allows
      #      crawling on the production host, but per-host robots
      #      files aren't reliable across crawlers, so we add an
      #      `X-Robots-Tag: noindex, nofollow` HTTP header on every
      #      response from this distribution. The header is more
      #      authoritative than robots.txt and applies to all asset
      #      types (HTML, images, feeds, etc.).
      #
      # Production responses don't pass through this function (the
      # production distribution doesn't attach it), so the production apex
      # itself stays default-indexable.
      FunctionCode: !Sub |
        function handler(event) {
          var response = event.response;

          // (2) noindex header — applies to EVERY response from this
          // distribution, regardless of status code or path. Use
          // `value` per CloudFront Functions header API.
          response.headers['x-robots-tag'] = {
            value: 'noindex, nofollow'
          };

          // (1) Location-header stripping for redirects only.
          var status = Number(response.statusCode);
          if (status < 300 || status >= 400) return response;

          var loc = response.headers && response.headers.location;
          if (!loc || !loc.value) return response;

          var host = event.request.headers.host && event.request.headers.host.value;
          if (!host) return response;

          var suffix = '.${ProductionDomainName}';
          if (host.slice(-suffix.length) !== suffix) return response;
          var label = host.slice(0, host.length - suffix.length);
          if (label.indexOf('preview-pr') === 0) {
            var pr = label.slice(10);            // 'preview-pr'.length
            if (pr.length > 0 && /^[0-9]+$/.test(pr)) {
              stripPrefix(loc, '/pr-' + pr);
            }
          } else if (label.indexOf('preview-cms-') === 0) {
            var slug = label.slice(12);          // 'preview-cms-'.length
            if (slug.length > 0 && /^[a-z0-9-]+$/.test(slug)) {
              stripPrefix(loc, '/cms-' + slug);
            }
          }

          return response;
        }

        function stripPrefix(loc, prefix) {
          if (loc.value === prefix || loc.value.indexOf(prefix + '/') === 0) {
            var stripped = loc.value.slice(prefix.length);
            loc.value = stripped.length === 0 ? '/' : stripped;
          }
        }

  # ── Response headers policies (cms-platform#515) ─────────────────────────
  #
  # S3 website hosting sends no security headers, so CloudFront adds them.
  # A cache behavior takes ONE policy, so the /admin/* policy repeats the
  # baseline and adds the admin CSP. Both policies serve both distributions;
  # names derive from ResourcePrefix because they are unique per account
  # (and an account holds at most 20 custom response headers policies).
  #
  # frame-ancestors 'self' / X-Frame-Options SAMEORIGIN: nothing frames these
  # pages from another origin. Decap's preview pane is a srcdoc iframe inside
  # /admin, embedded tool pages use same-origin /assets/tools/ iframes, the
  # live preview is a separate tab on a BroadcastChannel, and the
  # visual-regression harness navigates top-level.
  BaselineResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ResourcePrefix}-baseline-headers"
        Comment: "HSTS, nosniff, referrer policy, same-origin framing (cms-platform#515)"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: !Ref HstsMaxAgeSeconds
            IncludeSubdomains: !If [HstsIncludesSubdomains, true, false]
            Preload: !If [HstsPreloads, true, false]
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: "frame-ancestors 'self'"
            Override: true

  # The admin CSP, built from what theme/admin actually loads:
  #   script-src  Decap from unpkg (SRI-pinned in the shells); 'unsafe-eval'
  #               because the bundle calls `new Function`; 'unsafe-inline'
  #               because both render paths inject per-site window.CMS_*
  #               into inline scripts, so a hash would differ per site and
  #               per render and would have to be redeployed on every bump.
  #   style-src   Decap injects inline styles.
  #   connect-src the GitHub API, githubstatus.com (Decap's status probe),
  #               and the apex + its subdomains (commit.json, config.yml, the
  #               dashboards' preview-pr<N> regression.json). The OAuth proxy
  #               is NOT here: sign-in is a popup plus postMessage, which
  #               connect-src does not govern, so no per-site parameter.
  #               blob: is Decap's fetch() of an uploaded image's object URL
  #               before it commits the file (#627).
  #   img-src     GitHub avatars; blob:/data: for media Decap reads through
  #               the API.
  #   media-src   the dashboards' preview-pr<N> regression.mp4.
  # The Report-Only copy leaves out frame-ancestors only because it is
  # already enforced by the Content-Security-Policy header in both modes, so
  # reporting it as well would add nothing.
  AdminResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${ResourcePrefix}-admin-headers"
        Comment: "Baseline headers plus the /admin Content-Security-Policy (cms-platform#515)"
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: !Ref HstsMaxAgeSeconds
            IncludeSubdomains: !If [HstsIncludesSubdomains, true, false]
            Preload: !If [HstsPreloads, true, false]
            Override: true
          ContentTypeOptions:
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: strict-origin-when-cross-origin
            Override: true
          FrameOptions:
            FrameOption: SAMEORIGIN
            Override: true
          ContentSecurityPolicy:
            ContentSecurityPolicy: !If
              - AdminCspEnforced
              - !Sub "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://${ProductionDomainName} https://*.${ProductionDomainName} https://avatars.githubusercontent.com; media-src 'self' blob: https://${ProductionDomainName} https://*.${ProductionDomainName}; connect-src 'self' blob: https://${ProductionDomainName} https://*.${ProductionDomainName} https://api.github.com https://www.githubstatus.com; font-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'"
              - "frame-ancestors 'self'"
            Override: true
        CustomHeadersConfig: !If
          - AdminCspEnforced
          - !Ref AWS::NoValue
          - Items:
              - Header: Content-Security-Policy-Report-Only
                Value: !Sub "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://${ProductionDomainName} https://*.${ProductionDomainName} https://avatars.githubusercontent.com; media-src 'self' blob: https://${ProductionDomainName} https://*.${ProductionDomainName}; connect-src 'self' blob: https://${ProductionDomainName} https://*.${ProductionDomainName} https://api.github.com https://www.githubstatus.com; font-src 'self' data:; frame-src 'self'; object-src 'none'; base-uri 'none'"
                Override: true

  # ── CloudFront distribution for preview-pr*.<apex> ───────────────────────
  #
  # Uses the S3 website endpoint as a custom origin (not OAC) so that S3
  # website hosting features (index documents per directory) work correctly.
  #
  PreviewDistribution:
    Type: AWS::CloudFront::Distribution
    # DependsOn: PreviewCertificate removed — the Ref at
    # DistributionConfig/ViewerCertificate/AcmCertificateArn already enforces
    # this ordering; an explicit DependsOn is redundant (W3005).
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "PR previews for ${GitHubOrg}/${GitHubRepo}"
        Aliases:
          - !Ref PreviewDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref PreviewCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultCacheBehavior:
          TargetOriginId: s3-website
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
          ResponseHeadersPolicyId: !Ref BaselineResponseHeadersPolicy
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt PreviewRouterFunction.FunctionARN
            - EventType: viewer-response
              FunctionARN: !GetAtt PreviewLocationFixerFunction.FunctionARN
        # Identical to DefaultCacheBehavior except for the headers policy. A
        # behavior is chosen from the viewer's path before the router rewrites
        # it, so this matches /admin/* on every preview host, and it must
        # carry the same functions or preview /admin stops routing
        # (e2e/cloudfront-security-headers.test.js holds the two equal).
        CacheBehaviors:
          - PathPattern: /admin/*
            TargetOriginId: s3-website
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            ResponseHeadersPolicyId: !Ref AdminResponseHeadersPolicy
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt PreviewRouterFunction.FunctionARN
              - EventType: viewer-response
                FunctionARN: !GetAtt PreviewLocationFixerFunction.FunctionARN
        Origins:
          - Id: s3-website
            DomainName: !Sub "${PreviewBucketName}.s3-website-${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultRootObject: index.html
        HttpVersion: http2and3
        # issue #324 — every 404 on a preview host used to fall through to
        # S3's raw website error document, whose lookup is relative to the
        # BUCKET ROOT and never matches a per-PR `pr-<N>/404.html` (or
        # `cms-<slug>/404.html`) key — so the viewer got S3's bare XML error
        # (bucket key layout, RequestId) plus a second nested
        # "could not retrieve custom error document" failure, on exactly the
        # links sent to a non-technical reviewer.
        #
        # Fix: point every preview 404/403 at ONE generic object kept at the
        # previews bucket root (deploy-preview.yml's "Ensure preview 404
        # error page exists at bucket root" step keeps it there — see that
        # step for why nothing reaps it).
        #
        # Non-obvious: CloudFront fetches ResponsePagePath directly from the
        # origin at the CloudFront layer, NOT as a fresh viewer request — so
        # PreviewRouterFunction's viewer-request `/pr-<N>` prefix rewrite
        # (above) does NOT re-apply to this fetch. ResponsePagePath is
        # therefore resolved against the origin's root as-is, which is
        # exactly why the target must live at the bucket ROOT rather than
        # under any `pr-<N>/`/`cms-<slug>/` prefix — and why the naive fix of
        # reusing `/404.html` would collide with a real per-PR object at that
        # same relative path. `/preview-404.html` cannot collide with a
        # `pr-<N>/…` or `cms-<slug>/…` key (both prefixes are reserved shapes
        # the PreviewRouterFunction above recognizes; a bare root path is
        # neither).
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /preview-404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /preview-404.html
            ErrorCachingMinTTL: 0

  # ── Route53 wildcard alias for *.<apex> → preview distribution ──────────
  #
  # The wildcard matches every single-label subdomain not explicitly
  # claimed by another record in this zone. The apex (`<apex>`) and
  # `www.<apex>` have their own specific records pointing at the
  # production distribution, so they take precedence over the wildcard.
  #
  PreviewDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref PreviewDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt PreviewDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront's fixed hosted zone ID

  # ── ACM certificate for production domain ─────────────────────────────────
  #
  # Covers both the apex (<apex>) and www subdomain. Must be in
  # us-east-1 for CloudFront. DNS validation via Route53.
  #
  ProductionCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ProductionDomainName
      SubjectAlternativeNames:
        - !Sub "www.${ProductionDomainName}"
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref ProductionDomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub "www.${ProductionDomainName}"
          HostedZoneId: !Ref HostedZoneId

  # ── CloudFront Function: send /admin on the apex to the admin host ───────
  #
  # Exists only when AdminDomainName is set (cms-platform#517), on the
  # production distribution. /admin and /admin/* on the apex, www (or the
  # distribution's own cloudfront.net name) get a 302 to the same path and
  # query on the admin host; every other path is untouched. The match is the
  # exact complement of what AdminSiteFunction sends back here, so the two
  # cannot bounce a request between them.
  #
  # The query string is rejoined verbatim the way AWS's own redirect example
  # does; the fragment (Decap's #/collections/... route) never reaches
  # CloudFront and the browser carries it across the redirect. 302, not 301:
  # a browser caches a 301 indefinitely, which would outlive a rollback.
  ApexAdminRedirectFunction:
    Type: AWS::CloudFront::Function
    Condition: HasAdminDomain
    Properties:
      Name: !Sub "${AWS::StackName}-admin-redirect"
      AutoPublish: true
      FunctionConfig:
        Comment: "302 /admin and /admin/* on the public site to the admin host"
        Runtime: cloudfront-js-2.0
      # `!Sub` bakes the admin host in; the body has no other `${`.
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/admin' || uri.indexOf('/admin/') === 0) {
            return redirect('https://${AdminDomainName}' + uri, request.querystring);
          }
          return request;
        }

        function redirect(target, querystring) {
          var parts = [];
          for (var name in querystring) {
            var param = querystring[name];
            var values = param.multiValue ? param.multiValue : [param];
            for (var i = 0; i < values.length; i++) {
              parts.push(values[i].value === '' ? name : name + '=' + values[i].value);
            }
          }
          return {
            statusCode: 302,
            statusDescription: 'Found',
            headers: { location: { value: target + (parts.length ? '?' + parts.join('&') : '') } }
          };
        }

  # ── CloudFront distribution for <apex> (production) ──────────────────────
  #
  # Uses the S3 website endpoint as a custom origin (not OAC) so that S3
  # website hosting features (index documents per directory) work correctly.
  #
  ProductionDistribution:
    Type: AWS::CloudFront::Distribution
    # DependsOn: ProductionCertificate removed — the Ref at
    # DistributionConfig/ViewerCertificate/AcmCertificateArn already enforces
    # this ordering; an explicit DependsOn is redundant (W3005).
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Production site for ${ProductionDomainName}"
        Aliases:
          - !Ref ProductionDomainName
          - !Sub "www.${ProductionDomainName}"
        ViewerCertificate:
          AcmCertificateArn: !Ref ProductionCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultCacheBehavior:
          TargetOriginId: s3-website
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          ResponseHeadersPolicyId: !Ref BaselineResponseHeadersPolicy
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Opt-in admin origin (#517). Any cache behavior that matches /admin
          # paths must carry this same association, or the apex /admin
          # requests it matches are served here instead of redirected.
          FunctionAssociations: !If
            - HasAdminDomain
            - - EventType: viewer-request
                FunctionARN: !GetAtt ApexAdminRedirectFunction.FunctionARN
            - !Ref "AWS::NoValue"
        # Identical to DefaultCacheBehavior except for the headers policy
        # (e2e/cloudfront-security-headers.test.js holds the two equal),
        # including the opt-in admin redirect (#517): without it the apex
        # would keep serving /admin/* instead of redirecting it.
        CacheBehaviors:
          - PathPattern: /admin/*
            TargetOriginId: s3-website
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
            ResponseHeadersPolicyId: !Ref AdminResponseHeadersPolicy
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            Compress: true
            FunctionAssociations: !If
              - HasAdminDomain
              - - EventType: viewer-request
                  FunctionARN: !GetAtt ApexAdminRedirectFunction.FunctionARN
              - !Ref "AWS::NoValue"
        Origins:
          - Id: s3-website
            DomainName: !Sub "${ProductionBucketName}.s3-website-${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultRootObject: index.html
        HttpVersion: http2and3
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 0

  # ── Route53 alias records for <apex> (GO-LIVE cutover — gated) ───────────
  # Gated on CreateApexDnsRecords so infra can be stood up before go-live
  # without repointing (or colliding with) the live apex/www records.
  ProductionDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateApexDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ProductionDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ProductionDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2  # CloudFront's fixed hosted zone ID

  ProductionWwwDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: ShouldCreateApexDnsRecords
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${ProductionDomainName}"
      Type: A
      AliasTarget:
        DNSName: !GetAtt ProductionDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ── The editor on its own origin (opt-in, #517) ──────────────────────────
  #
  # Everything below exists only when AdminDomainName is set. The editor keeps
  # GitHub tokens in localStorage, which every script on its origin can read,
  # so the admin host must never return a document that runs a public page's
  # script (the RUM client, an editor's HTML embed, a site's own includes).
  # It is its own distribution rather than an alias on the production one
  # because a distribution's CustomErrorResponses cannot vary by host: as an
  # alias, a missing /admin/<x> was answered with the public /404.html, RUM
  # and all, on the admin origin.
  #
  # Its own certificate, so opting in or out never replaces
  # ProductionCertificate. Must be in us-east-1 for CloudFront.
  AdminCertificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasAdminDomain
    Properties:
      DomainName: !Ref AdminDomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref AdminDomainName
          HostedZoneId: !Ref HostedZoneId

  # Viewer-request on AdminDistribution. Its origin is the bucket's REST
  # endpoint, which (unlike the website endpoint) resolves no index document,
  # so this function does that part too:
  #
  #   GET/HEAD /admin/<segments>[/]  → served; a trailing / maps to index.html,
  #                                    an extensionless last segment (/admin,
  #                                    /admin/reviews) gets a 302 to its / form
  #   GET/HEAD /admin/<anything else> → 404, no body: a %-escape, a dot
  #                                    segment, a // or a character outside
  #                                    [A-Za-z0-9._-] never reaches S3 (and is
  #                                    not sent to the apex, which would only
  #                                    send it back)
  #   GET /                          → 302 to /admin/ on this host
  #   GET any other path             → 302 to the same path and query on the
  #                                    apex; never reaches the origin
  #   HEAD any other path            → served, with the same index mapping:
  #                                    slug-pin.js probes /blog/<slug>/
  #                                    same-origin with HEAD, and a HEAD
  #                                    response has no body to run
  #
  # A segment may not START with a dot, which excludes `.` and `..`. Paths
  # are case-sensitive, as S3 keys are: /Admin/ goes to the apex, where it is
  # an ordinary missing page. The host is not inspected; only the admin host
  # (and this distribution's cloudfront.net name) reach this function.
  AdminSiteFunction:
    Type: AWS::CloudFront::Function
    Condition: HasAdminDomain
    Properties:
      Name: !Sub "${AWS::StackName}-admin-site"
      AutoPublish: true
      FunctionConfig:
        Comment: "Serve only /admin/ on the admin host, with index documents; send every other GET to the apex"
        Runtime: cloudfront-js-2.0
      # `!Sub` bakes both hosts in; the body has no other `${`.
      FunctionCode: !Sub |
        var ADMIN_PATH = /^\/admin(\/[A-Za-z0-9_-][A-Za-z0-9._-]*)*\/?$/;

        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          if (uri === '/admin' || uri.indexOf('/admin/') === 0) {
            if (!ADMIN_PATH.test(uri)) return { statusCode: 404, statusDescription: 'Not Found' };
            if (uri.charAt(uri.length - 1) === '/') {
              request.uri = uri + 'index.html';
              return request;
            }
            if (uri.slice(uri.lastIndexOf('/') + 1).indexOf('.') === -1) {
              return redirect('https://${AdminDomainName}' + uri + '/', request.querystring);
            }
            request.uri = uri;  // pin the value just checked
            return request;
          }
          if (request.method === 'HEAD') {
            if (uri.charAt(uri.length - 1) === '/') request.uri = uri + 'index.html';
            return request;
          }
          if (uri === '/') return redirect('https://${AdminDomainName}/admin/', {});
          return redirect('https://${ProductionDomainName}' + uri, request.querystring);
        }

        function redirect(target, querystring) {
          var parts = [];
          for (var name in querystring) {
            var param = querystring[name];
            var values = param.multiValue ? param.multiValue : [param];
            for (var i = 0; i < values.length; i++) {
              parts.push(values[i].value === '' ? name : name + '=' + values[i].value);
            }
          }
          return {
            statusCode: 302,
            statusDescription: 'Found',
            headers: { location: { value: target + (parts.length ? '?' + parts.join('&') : '') } }
          };
        }

  # The origin is the production bucket's REST endpoint, read anonymously:
  # ProductionBucketPolicy already grants public s3:GetObject, so this needs
  # no OAC and no change to that (retained) policy, and confidentiality is no
  # different from the website endpoint. What the REST endpoint changes is
  # the error path: it has no website ErrorDocument, so a missing key is S3's
  # own XML error (403 for an anonymous reader without s3:ListBucket), never
  # an HTML page from the site. No origin request policy, so no viewer query
  # string reaches S3 (whose REST API reads some, such as versionId).
  #
  # CachingDisabled: the deploy invalidates only ProductionDistribution, and
  # an editor must never get a stale admin bundle; the admin is small and
  # used by a handful of people.
  AdminDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: HasAdminDomain
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Editor for ${ProductionDomainName} on its own origin"
        Aliases:
          - !Ref AdminDomainName
        ViewerCertificate:
          AcmCertificateArn: !Ref AdminCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultCacheBehavior:
          TargetOriginId: s3-rest
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          # The same admin policy the apex's /admin/* behavior sends (#515):
          # HSTS, nosniff, frame-ancestors 'self' and the admin CSP, so
          # opting in never drops a header the editor had on the apex. It
          # also covers the not-found page and the HEAD responses.
          ResponseHeadersPolicyId: !Ref AdminResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AdminSiteFunction.FunctionARN
        Origins:
          - Id: s3-rest
            DomainName: !GetAtt ProductionBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
        HttpVersion: http2and3
        # A miss is answered by a static page shipped in the gem that runs no
        # script and loads nothing. CloudFront fetches it from the origin
        # directly (AdminSiteFunction does not run for that fetch). If it is
        # missing too (a site that deployed this before bumping the gem),
        # CloudFront returns the status S3 gave for the page, with S3's XML
        # error: still no HTML from the site.
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /admin/not-found.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /admin/not-found.html
            ErrorCachingMinTTL: 0

  # Not gated on CreateApexDnsRecords: the admin host is a new name, so it
  # neither repoints nor collides with a live record. As a name of its own it
  # takes precedence over the *.<apex> preview wildcard record, and
  # CloudFront sends a request for it to the distribution with the more
  # specific alias, this one, not to PreviewDistribution's *.<apex>.
  AdminDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasAdminDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref AdminDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt AdminDistribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

  # ── GitHub OIDC identity provider ─────────────────────────────────────────
  #
  # Allows GitHub Actions to assume IAM roles without long-lived credentials.
  # AWS validates the full certificate chain for GitHub's OIDC provider, so the
  # thumbprint value is not security-critical — but the property is required.
  #
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  # ── IAM role for GitHub Actions ───────────────────────────────────────────
  #
  # Trust policy: only workflows in ${GitHubOrg}/${GitHubRepo} can assume this
  # role, and only when GitHub's OIDC token audience is sts.amazonaws.com.
  #
  # Permissions: scoped to <prefix>-* prefixed resources wherever possible.
  #
  GitHubActionsRole:
    Type: AWS::IAM::Role
    # cfn-lint W3037: apigateway:TagResource in the APIGatewayAccess policy is
    # a legitimate API Gateway V2 (HTTP API) IAM action. cfn-lint 1.51.2
    # conflates it with the old REST-API management plane whose action set uses
    # HTTP-verb names (GET/POST/…) and doesn't include TagResource. The action
    # is real and required; suppress the false-positive warning here (it is
    # reported against the enclosing resource, not the inline policy item).
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3037]
    Properties:
      RoleName: !Sub "${ResourcePrefix}-github-actions"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - ShouldCreateOIDCProvider
                - !GetAtt GitHubOIDCProvider.Arn
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
              StringLike:
                "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubOrg}/${GitHubRepo}:*"
      Policies:

        # ── S3: artifacts + preview + production buckets ──────────────────
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                Resource:
                  - !Sub "arn:aws:s3:::${ArtifactBucketName}"
                  - !Sub "arn:aws:s3:::${ArtifactBucketName}/*"
                  - !Sub "arn:aws:s3:::${PreviewBucketName}"
                  - !Sub "arn:aws:s3:::${PreviewBucketName}/*"
                  - !Sub "arn:aws:s3:::${ProductionBucketName}"
                  - !Sub "arn:aws:s3:::${ProductionBucketName}/*"
              # READ-ONLY, and a separate statement on purpose: the deploy
              # copies an opted-in PDF OUT of the archive, and must never be
              # able to write to or delete from the only copy of it. Present
              # only when the archive exists -- an empty bucket name would
              # otherwise render `arn:aws:s3:::` and fail validation.
              - !If
                - ShouldCreateMediaArchive
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:ListBucket
                  Resource:
                    - !Sub "arn:aws:s3:::${MediaArchiveBucketName}"
                    - !Sub "arn:aws:s3:::${MediaArchiveBucketName}/*"
                - !Ref "AWS::NoValue"

        # ── CloudFormation: manage stacks with <prefix>- prefix ────────────
        - PolicyName: CloudFormationAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:TagResource
                Resource:
                  - !Sub "arn:aws:cloudformation:*:${AWS::AccountId}:stack/${ResourcePrefix}-*/*"
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                Resource:
                  - "arn:aws:cloudformation:*:aws:transform/*"

        # ── CloudFront: manage distributions ───────────────────────────────
        - PolicyName: CloudFrontAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:UpdateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:ListDistributions
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                  - cloudfront:ListInvalidations
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:ListOriginAccessControls
                Resource: "*"

        # ── ACM: manage certificates (must be us-east-1 for CloudFront) ────
        - PolicyName: ACMAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - acm:RequestCertificate
                  - acm:DescribeCertificate
                  - acm:ListCertificates
                  - acm:DeleteCertificate
                  - acm:AddTagsToCertificate
                  - acm:ListTagsForCertificate
                Resource: "*"

        # ── Route53: manage DNS records ────────────────────────────────────
        - PolicyName: Route53Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - route53:ChangeResourceRecordSets
                  - route53:GetHostedZone
                  - route53:ListResourceRecordSets
                  - route53:GetChange
                  - route53:ListHostedZones
                Resource:
                  - "arn:aws:route53:::hostedzone/*"
                  - "arn:aws:route53:::change/*"

        # ── IAM: manage roles created by SAM for Lambda execution ──────────
        - PolicyName: IAMAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ResourcePrefix}-*"

        # ── Lambda: manage functions ───────────────────────────────────────
        - PolicyName: LambdaAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:ListFunctions
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:aws:lambda:*:${AWS::AccountId}:function:${ResourcePrefix}-*"

        # ── API Gateway: manage HTTP APIs ──────────────────────────────────
        - PolicyName: APIGatewayAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                  - apigateway:TagResource
                Resource:
                  # Plain strings — no Sub variables needed (W1020 fix).
                  - "arn:aws:apigateway:*::/apis/*"
                  - "arn:aws:apigateway:*::/apis"
                  - "arn:aws:apigateway:*::/tags/*"

        # ── CloudWatch Logs: manage log groups ─────────────────────────────
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DescribeLogGroups
                  - logs:TagResource
                Resource:
                  - !Sub "arn:aws:logs:*:${AWS::AccountId}:log-group:/aws/lambda/${ResourcePrefix}-*"

Outputs:

  RoleArn:
    Description: >
      IAM role ARN for GitHub Actions. Add this as a GitHub Actions secret
      named AWS_ROLE_ARN.
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-RoleArn"

  ArtifactsBucketName:
    Description: "S3 bucket for CloudFormation/SAM deployment artifacts"
    Value: !Ref CfnArtifactsBucket

  PreviewURL:
    Description: >
      HTTPS URL template for PR preview deployments. Substitute the PR
      number into `preview-pr${N}` to reach a specific preview.
    Value: !Sub "https://preview-pr<N>.${ProductionDomainName}"

  PreviewDistributionId:
    Description: "CloudFront distribution ID for preview cache invalidation"
    Value: !Ref PreviewDistribution

  PreviewDistributionDomain:
    Description: "CloudFront domain name for the preview distribution"
    Value: !GetAtt PreviewDistribution.DomainName

  ProductionURL:
    Description: "HTTPS URL for the production site"
    Value: !Sub "https://${ProductionDomainName}"

  ProductionDistributionId:
    Description: "CloudFront distribution ID for production cache invalidation"
    Value: !Ref ProductionDistribution

  ProductionDistributionDomain:
    Description: "CloudFront domain name for the production distribution"
    Value: !GetAtt ProductionDistribution.DomainName

  AdminURL:
    Description: "HTTPS URL of the editor on its own origin (set as cms.admin_origin plus /admin/)"
    Condition: HasAdminDomain
    Value: !Sub "https://${AdminDomainName}/admin/"

  MediaArchiveBucketName:
    Description: >
      Private bucket holding archived media PDFs. Pass it to the deploy
      workflows as `media_archive_bucket` to enable publishing opted-in PDFs.
    Condition: ShouldCreateMediaArchive
    Value: !Ref MediaArchiveBucket

  OIDCProviderArn:
    Description: "GitHub OIDC identity provider ARN"
    Value: !If
      - ShouldCreateOIDCProvider
      - !GetAtt GitHubOIDCProvider.Arn
      - "N/A (provider not created by this stack)"
