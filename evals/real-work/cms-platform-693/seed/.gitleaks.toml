# gitleaks configuration. Extends the default ruleset with allowlist
# entries for known test fixtures so CI doesn't flag them as leaks.
#
# Real secrets (cloud-provider keys, GitHub PATs, JWTs, generic
# high-entropy strings) still trigger findings; only the literal
# fixtures below are suppressed.
#
# When adding a new test that hardcodes a fake-looking token, add it
# here rather than disabling gitleaks. See AGENTS.md "Secrets scan".
#
# Suppress by `regexes` — NEVER by `paths` (issue #260). A `paths` entry
# is not a finding filter: gitleaks skips the file entirely, before any
# rule runs, so a REAL credential pasted into it is never reported. This
# config used to exclude oauth-proxy/test_lambda.py, the two
# e2e/admin-reviews-*.spec.js files and scripts/scrub-secrets.js that
# way — 29,326 bytes unscanned in a public repo, and measurement showed
# the exclusions were suppressing nothing: with the default ruleset and
# no `paths` at all, those four files produce zero findings. The
# `regexes` below already cover every fixture shape they contain.
#
# Narrowing a `paths` entry does not work either: `regexTarget = "secret"`
# is ACCEPTED — it names the allowlist's DEFAULT target, so it narrows
# nothing (measured on 8.30.1: the config loads cleanly and behaves exactly
# like omitting the key; only a value outside match/line/secret is fatal) —
# and gitleaks SILENTLY IGNORES unknown TOML keys, so a `condition = "AND"`
# is dropped without warning and the path alone re-suppresses the whole file.
#
# Scoping a suppression to ONE RULE is not a way around that either — it
# is the rule-scoped half of the same hazard. Several shapes remove a
# single rule from a file rather than the file from the scan; among them
# `[[rules.allowlists]].paths`, the singular `[rules.allowlist].paths`, an
# `[[allowlists]]` block carrying `targetRules`, and a `regexes` entry
# with `regexTarget = "match"` broad enough to match the credential
# itself. That list is not exhaustive — measured on 8.30.1, a per-rule
# `stopwords` entry, a per-rule `regexes` + `regexTarget = "match"` entry
# and `[extend] disabledRules` each blind one rule the same way, and the
# canary catches all three. Each is quieter than a blanket `paths` entry
# — the file keeps reporting under some other rule — and each is TOTAL
# for the class it blinded: measured on 8.30.1, with `github-pat`
# blinded, a bare `ghp_` token in prose disappears from the scan
# completely. Suppress the fixture's literal TEXT, as below, and every
# rule stays live on the file.
#
# The "Allowlist canary" step in .github/workflows/secrets-scan.yml enforces
# all of it: it plants a detectable credential at every allowlisted path,
# compares (file, RuleID) PAIRS against a bare-ruleset baseline, and fails if
# the config cannot see one — whether it lost the file or just one rule.

[extend]
useDefault = true

[allowlist]
description = "CMS platform test fixtures"
regexes = [
  # Belt-and-braces: any ghp_*test*/ghp_*fake* literal anywhere.
  '''ghp_(test|fake)[A-Za-z0-9_]*''',
  # OAuth client placeholder pair used in test_lambda.py.
  '''test_client_(id|secret)''',
]
