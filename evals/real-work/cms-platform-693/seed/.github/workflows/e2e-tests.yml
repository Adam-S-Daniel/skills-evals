# Reusable e2e Playwright suite for platform sites.
#
# A consuming site calls this from a thin wrapper that owns the trigger
# + run-name (see examples/site/.github/workflows/e2e-tests.yml). The
# Playwright harness, specs, configs, and the post-failure-comment
# composite action all live in the PLATFORM repo, not the site, so this
# workflow checks the platform out into `.cms-platform/` (a dot-dir
# Jekyll ignores) and runs the suite from there:
#
#   cd .cms-platform/e2e && npm ci, then the install-playwright-browsers
#   composite for this project's <engine> (bounded + retried — see its header)
#   npx playwright test --project=<project> [--shard=<i>/<n> for an admin project]
#
# PARALLELISM — one job per Playwright PROJECT (an admin project: one per shard),
# one required check:
#   * The `project` matrix runs each of playwright.config.js's projects on its
#     own 4-vCPU runner, so the suite's wall clock is its slowest PROJECT rather
#     than the sum of all of them. The matrix list, each job's browser engine,
#     and each job's worker count all come from `e2e/ci-matrix.js`, which
#     derives them from the config — nothing is hand-tuned here.
#   * `--shard` is used ONLY within the two ADMIN projects (3 jobs each), which
#     are the whole critical path once the apt tail is cached. Sharding the
#     whole suite stays rejected — it balances by test COUNT while per-test
#     durations span 5 ms → 90 s (a measured 4-way shard put 71% of the work in
#     one shard) — but inside one admin project the tests are of similar
#     weight: measured 40-72 s per shard vs ~150 s unsharded.
#   * Workers are raised to 150% of the runner's vCPUs (6 on a 4-vCPU box)
#     because Playwright's 50% default is too few once a job runs a single
#     project — much of a project's time is spent WAITING (Decap boot, editor
#     mount, page loads), not on CPU. Measurements: docs/E2E-PARALLELISM.md.
#   The `e2e` job at the bottom is the single required status context; the
#   per-project contexts are not named by any ruleset.
#
# The specs read their site identity from env — the central helpers
# (e2e/base.js, e2e/cms-host.js) are parameterized on CMS_PROD_URL /
# CMS_APEX / CMS_REPO / TARGET, so a new site needs only to pass its
# deployed URLs as workflow inputs. Pin `platform_ref` to the same
# tag/sha the caller pins this workflow to so the harness matches the
# workflow version.
#
# Two lanes, selected by `target`:
#   * preview / prod — hit the DEPLOYED surface (no build). Run from the
#     platform checkout (`.cms-platform/e2e`); e2e/base.js resolves baseURL
#     from CMS_PROD_URL / CMS_APEX.
#   * local — run the FULL matrix against a freshly-built SITE: a real
#     `jekyll build` of the site + `npx serve _site` + `decap-server`, incl.
#     the @admin-write CMS round-trips. Because ~50 specs resolve the SITE
#     via `path.resolve(<harness>/e2e, "..")`, the harness is PLACED at
#     `<site>/e2e` (copied from the platform checkout) and SITE_ROOT is set
#     to $GITHUB_WORKSPACE so playwright.config.js's webServer builds/serves
#     the SITE. The site must exclude `e2e` + `.cms-platform` from its Jekyll
#     build (scaffold/create-site.js does this) and have a working Gemfile.
#
# This is the FIRST of the e2e workflow family to be ported; the rest
# (cms-publish-loop-*, visual-regression, parity-preview, etc.) follow
# the same checkout-platform-into-.cms-platform pattern.
name: E2E Tests (reusable)

on:
  workflow_call:
    inputs:
      target:
        description: "TARGET for the suite: local | preview | prod. Selects how e2e/base.js resolves baseURL."
        required: false
        type: string
        default: prod
      prod_url:
        description: "Deployed production URL, e.g. https://example.com (scheme included). Wired to CMS_PROD_URL."
        required: false
        type: string
        default: ""
      apex:
        description: "Site apex domain, e.g. example.com (no scheme). Used to build preview-pr<N>.<apex> hosts; wired to CMS_APEX."
        required: false
        type: string
        default: ""
      browser:
        description: "Playwright browser to install with system deps (chromium | firefox | webkit | all). `all` = whatever each project job needs, one engine per job."
        required: false
        type: string
        default: chromium
      pr_number:
        description: "PR number to resolve a preview target / post failure comments against. Empty on non-PR triggers."
        required: false
        type: string
        default: ""
      platform_repo:
        description: "owner/name of the platform repo holding the e2e harness + composite action."
        required: false
        type: string
        default: Adam-S-Daniel/cms-platform
      platform_ref:
        description: "Tag/sha of the platform repo to fetch the harness from (pin to the same ref as this workflow)."
        required: false
        type: string
        default: main
      prod_playground_mode:
        description: "Wired to PROD_PLAYGROUND_MODE in the job env. Prod-mutate / real-loop specs gate on it; leave empty for normal runs."
        required: false
        type: string
        default: ""
      workers:
        description: "Override Playwright's worker count for EVERY project job (e.g. '2', '50%'). Empty = the value e2e/ci-matrix.js sets. The no-release dial-down if a project gets flaky under load."
        required: false
        type: string
        default: ""
    secrets:
      # Optional PAT for the GitHub API calls e2e/base.js makes when
      # TARGET=preview discovers the latest open PR, and for any real-lane
      # CMS specs. Optional: when unset, preview discovery falls back to
      # the job's GITHUB_TOKEN and real-lane specs that gate on a PAT
      # self-skip.
      CMS_E2E_PAT:
        required: false

permissions:
  contents: read
  # Needed by the post-failure-comment composite so it can post / update
  # the failure-summary comment on the PR.
  pull-requests: write

jobs:
  # ── The suite, one runner per Playwright project ──────────────────
  # Each job builds/serves the site and runs exactly one project, installing
  # only that project's browser engine.
  #
  # The `include` list below MUST equal `node e2e/ci-matrix.js --matrix` — that
  # module is the single source of truth (it reads playwright.config.js's own
  # projects and expands each admin project into ADMIN_SHARDS shards) and
  # `e2e/ci-matrix.test.js` parses this file and fails the platform's CI if the
  # two drift. A project (or a shard) missing from this list would SILENTLY
  # STOP RUNNING, which is the one way this design can break; an unknown name
  # here fails loudly at run time. `slot` is each job's unique name: artifact
  # names and failure-comment markers key on it, because two shards of one
  # project would otherwise clobber each other's.
  #
  # `fail-fast: false` so one red project doesn't cancel the others: a cancelled
  # sibling hides the second bug and reads as infrastructure noise.
  project:
    # Named by slot so a check reads `e2e / project (chromium-laptop)` or
    # `e2e / project (chromium-desktop-3k-shard-1-of-3)`, not the default
    # rendering of every `include` field.
    name: project (${{ matrix.slot }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium-desktop-3k, shard: "1/3", slot: chromium-desktop-3k-shard-1-of-3 }
          - { project: chromium-desktop-3k, shard: "2/3", slot: chromium-desktop-3k-shard-2-of-3 }
          - { project: chromium-desktop-3k, shard: "3/3", slot: chromium-desktop-3k-shard-3-of-3 }
          - { project: webkit-iphone16, shard: "1/3", slot: webkit-iphone16-shard-1-of-3 }
          - { project: webkit-iphone16, shard: "2/3", slot: webkit-iphone16-shard-2-of-3 }
          - { project: webkit-iphone16, shard: "3/3", slot: webkit-iphone16-shard-3-of-3 }
          - { project: chromium-desktop-1080, shard: "", slot: chromium-desktop-1080 }
          - { project: chromium-laptop, shard: "", slot: chromium-laptop }
          - { project: chromium-mobile, shard: "", slot: chromium-mobile }
          - { project: firefox-desktop, shard: "", slot: firefox-desktop }
          - { project: webkit-tablet, shard: "", slot: webkit-tablet }
          - { project: chromium-large-text, shard: "", slot: chromium-large-text }
          - { project: chromium-light, shard: "", slot: chromium-light }
          - { project: chromium-forced-colors, shard: "", slot: chromium-forced-colors }
    runs-on: ubuntu-latest
    env:
      # Read by the install step, the suite step, and (so the browser self-heal
      # can't re-download the engines this job deliberately skipped)
      # e2e/install-browsers-on-miss.js.
      PW_PROJECT: ${{ matrix.project }}
      # The `--shard` value for an admin-project job ("1/3"…), "" otherwise.
      # Read back through env, never spliced into `run:` (workflow-injection-lint).
      PW_SHARD: ${{ matrix.shard }}
      # Site identity → the parameterized central helpers (e2e/base.js,
      # e2e/cms-host.js). See the workflow header for the env contract.
      TARGET: ${{ inputs.target }}
      CMS_PROD_URL: ${{ inputs.prod_url }}
      CMS_APEX: ${{ inputs.apex }}
      # The specs query the SITE repo's PRs (preview discovery, real-lane
      # CMS work), not the platform repo — so CMS_REPO is the caller's
      # repository, which github.repository resolves to in a reusable
      # workflow.
      CMS_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      # Gate for prod-mutate / real-loop specs (they self-skip unless this
      # is set to the value they expect). Inert when empty — the default.
      PROD_PLAYGROUND_MODE: ${{ inputs.prod_playground_mode }}
    steps:
      - name: Checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Checkout platform (e2e harness + composite action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          path: .cms-platform

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Install harness deps
        working-directory: .cms-platform/e2e
        run: npm ci

      - name: Resolve this project's browser engine
        id: engine
        working-directory: .cms-platform/e2e
        env:
          PW_BROWSER: ${{ inputs.browser }}
        run: |
          set -euo pipefail
          # This job runs ONE project, so it needs ONE engine — installing all
          # three cost ~58 s (39 s of apt + 19 s of downloads) on every job, on
          # the critical path. `all` therefore means "whatever this project
          # needs", derived from the config so it can't drift; an explicit
          # `browser:` input still pins a single engine for callers that want
          # one.
          if [ "$PW_BROWSER" = "all" ]; then
            PW_BROWSER="$(node ci-matrix.js --engine "$PW_PROJECT")"
          fi
          echo "project=$PW_PROJECT engine=$PW_BROWSER"
          echo "engine=$PW_BROWSER" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser + system deps
        uses: ./.cms-platform/.github/actions/install-playwright-browsers
        with:
          browser: ${{ steps.engine.outputs.engine }}

      # ── LOCAL lane only: build + serve the SITE and run the FULL matrix ──
      # The local lane (target: local) runs a real `jekyll build` of the
      # SITE + decap-server + the @admin-write CMS round-trips, with the
      # harness checked out from the platform. The site-file reads in ~50
      # specs resolve the SITE via `path.resolve(<harness>/e2e, "..")`
      # (e2e/base.js's REPO_ROOT + each spec's own copy of that line). For
      # that to land on the consuming SITE, the harness must sit at
      # `<site>/e2e` — so we PLACE the npm-ci'd harness there. The
      # workspace root IS the checked-out site (the first checkout step), and
      # the consuming site removed its own `e2e/` in the dogfood (and excludes
      # `e2e`/`.cms-platform` from the Jekyll build), so there's no collision.
      # playwright.config.js's local webServer reads SITE_ROOT to know which
      # tree to `jekyll build` + serve + point decap-server at.
      - name: Place harness at site root (local lane)
        if: ${{ inputs.target == 'local' }}
        run: |
          set -euo pipefail
          # Copy the prepared harness (specs, config, AND node_modules from
          # `npm ci` above) to <workspace>/e2e so REPO_ROOT == the site.
          cp -a .cms-platform/e2e "$GITHUB_WORKSPACE/e2e"

      - name: Setup Ruby + Bundler (local lane)
        if: ${{ inputs.target == 'local' }}
        uses: ruby/setup-ruby@e8944e80fb94b20106697132f8c20c665fab29e9
        with:
          ruby-version: "3.2"
          bundler-cache: true   # bundle install + cache, keyed on the SITE Gemfile

      - name: Run Playwright suite
        id: pw
        # Local lane runs from the placed <site>/e2e so REPO_ROOT resolves
        # to the site; preview/prod run from the platform checkout (no build).
        working-directory: ${{ inputs.target == 'local' && 'e2e' || '.cms-platform/e2e' }}
        env:
          # Self-skip / API auth for preview discovery + real-lane CMS
          # specs. Falls back to the job GITHUB_TOKEN when no PAT is set.
          CMS_E2E_PAT: ${{ secrets.CMS_E2E_PAT }}
          GITHUB_TOKEN: ${{ secrets.CMS_E2E_PAT || secrets.GITHUB_TOKEN }}
          # SITE_ROOT — the CONSUMING site's checkout (github.workspace), in BOTH
          # lanes. Local lane: tells playwright.config.js's webServer which tree to
          # build + serve + run decap-server against (harness placed at <site>/e2e,
          # so github.workspace == that site). Preview/prod lane: the harness runs
          # from .cms-platform/e2e, so WITHOUT this the base_collections / single-
          # page guards' `__dirname/..` fallback resolves to the PLATFORM checkout
          # and a single-page consumer's guarded specs never skip (they read the
          # platform's five collections). github.workspace is the consumer root in
          # both lanes, so one unconditional value is correct. (It was previously
          # `|| ''` for non-local — a latent gap mirroring the loop reusables /
          # parity-preview #35.) Locked by e2e/loop-site-root-lint.test.js.
          SITE_ROOT: ${{ github.workspace }}
          # A caller-supplied `workers` wins; otherwise take the value from
          # ci-matrix.js (see its header for the measurements).
          WORKERS_INPUT: ${{ inputs.workers }}
          # Skip e2e/base.js's per-navigation full-page frame capture. Its only
          # consumer is scripts-side video assembly (e2e/generate-test-videos.js)
          # that no reusable invokes, so on CI every navigation in every test was
          # paying for frames nothing reads — worst on the link-crawling admin
          # specs. Failure evidence is unaffected: `screenshot: "on"` and
          # `video: "retain-on-failure"` still produce the artifacts a red run is
          # diagnosed from. Unset it locally to get the frames back.
          DISABLE_PER_TEST_VIDEOS: "1"
        run: |
          # -e so an unknown project fails HERE with ci-matrix.js's message
          # rather than as an opaque "project not found" later.
          set -eo pipefail
          PW_WORKERS="${WORKERS_INPUT:-$(node ci-matrix.js --workers)}"
          export PW_WORKERS
          echo "project=$PW_PROJECT workers=${PW_WORKERS:-<playwright default>}"
          shard_args=()
          if [ -n "${PW_SHARD:-}" ]; then shard_args=(--shard="$PW_SHARD"); fi
          echo "shard=${PW_SHARD:-<none>}"
          export PLAYWRIGHT_JSON_OUTPUT_FILE=/tmp/playwright-output.log.json
          status=0
          npx playwright test --project="$PW_PROJECT" "${shard_args[@]}" --reporter=list,html,json > /tmp/playwright-output.log 2>&1 || status=$?
          node summarize-playwright.js "${PLAYWRIGHT_JSON_OUTPUT_FILE}"
          exit "$status"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # Project-scoped: upload-artifact v4+ errors on a duplicate name,
          # and every matrix job uploads.
          name: playwright-report-${{ matrix.slot }}
          # Local lane reports under <site>/e2e; preview/prod under the
          # platform checkout. Upload both globs; if-no-files-found: ignore
          # makes the absent one a no-op. test-results/ carries the failure
          # screenshots/videos/error-context — without it a red run leaves
          # no visual evidence (the v0.1.66 occlusion failures uploaded
          # nothing, forcing blind diagnosis).
          path: |
            e2e/playwright-report
            e2e/test-results
            .cms-platform/e2e/playwright-report
            .cms-platform/e2e/test-results
            /tmp/playwright-output.log
            /tmp/playwright-output.log.json
          if-no-files-found: ignore
          retention-days: 7

      # ── Failure summary on the PR ────────────────────────────────
      # Two call sites (post on failure / resolve on success), gated by
      # the caller-side failure()/success() primitives per the action's
      # v3 design. The composite is checked out under .cms-platform, so
      # reference it by that local path.
      #
      # The marker is PROJECT-SCOPED: markers must be unique or the matrix jobs
      # would clobber each other's comment, and a marker that names the project
      # tells a reader which one went red before they open a log.
      - name: Post failure summary
        if: ${{ failure() && inputs.pr_number != '' }}
        uses: ./.cms-platform/.github/actions/post-failure-comment
        with:
          mode: post
          log-file: /tmp/playwright-output.log
          marker: e2e-failure-summary-${{ matrix.slot }}
          title: E2E tests (${{ matrix.slot }})
          pr-number: ${{ inputs.pr_number }}

      - name: Resolve failure summary on success
        if: ${{ success() && inputs.pr_number != '' }}
        # FAIL-OPEN: this step only stamps an EXISTING failure comment as
        # resolved. It runs on success(), so its own failure says nothing about
        # the tests — but without this it turns a fully GREEN job red, and via
        # the aggregating gate that blocks merges. Observed 2026-08-12:
        # adamdaniel.ai e2e run 31569023550 passed its tests, failed HERE, reddened
        # `e2e / e2e`, blocked seed PR #3063, timed out cms-scheduled-publish-loop
        # after 25 min and filed health-audit issue #3064. Same fail-open rationale
        # the ephemeral-branch cleanup steps already carry. Locked by
        # e2e/resolve-summary-fail-open.test.js.
        continue-on-error: true
        uses: ./.cms-platform/.github/actions/post-failure-comment
        with:
          mode: resolve
          marker: e2e-failure-summary-${{ matrix.slot }}
          title: E2E tests (${{ matrix.slot }})
          pr-number: ${{ inputs.pr_number }}

  # ── The single required status context ────────────────────────────
  # Branch protection requires `<caller-job> / e2e` (e.g. `e2e / e2e`). The
  # matrix above surfaces one context PER PROJECT, which no ruleset names, so
  # this job keeps the contract: it is the ONLY thing the ruleset (and the
  # e2e-required-stub companion, which emits the same `e2e` job name on
  # docs-only PRs) has to know about. Do NOT rename it.
  #
  # `always()` so a red/cancelled project still reports here instead of leaving
  # the required check pending forever ("Waiting for status to be reported" —
  # the missing-check trap). `needs.project.result` is the matrix's rolled-up
  # result: `success` only when EVERY project succeeded.
  e2e:
    needs: project
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the project matrix
        env:
          MATRIX_RESULT: ${{ needs.project.result }}
        run: |
          set -euo pipefail
          echo "e2e project matrix result: ${MATRIX_RESULT}"
          if [ "${MATRIX_RESULT}" != "success" ]; then
            echo "::error::At least one e2e project job did not succeed (${MATRIX_RESULT}) — see the per-project jobs above."
            exit 1
          fi
          echo "Every e2e project passed."
