prompt: |-
  Tags that differ only by case (quotes / Quotes) show as two identical cards and one tag page drops the other's posts

  Found in an exploratory pass over the adamdaniel.ai visitor flow, in a local build.

  **Severity:** minor (no live post has a case-variant tag today, but when one appears, a post silently drops off its own tag page).

  ## Steps

  1. Have one post tagged `quotes` and another tagged `Quotes`.
  2. Open `/tags/`, the home Tags row, and `/tags/quotes/`.

  Viewport: 1440×900 Chromium (also seen in Firefox home).

  ## Seen

  - Two identical cards, both "QUOTES 1", both linking to `/tags/quotes/`.
  - `/tags/quotes/` lists only the `Quotes` post; the `quotes` post is gone from its own tag page.

  ## Expected

  Tags that slugify the same are one tag: one card with the combined count, and one archive (and tag feed) listing every post.

  ## Task

  Fix this in the theme so that tags which slugify the same are one tag everywhere they appear.

  ## Interface the reviewer's tests use

  The reviewer's tests run a real Jekyll build of a small site with several tags in two spellings, and read `site.config['all_tags']`, whose rows carry `slug`, `name` and `count`. Each tag appears in it once, however many spellings the posts use; its count is of posts, so a post that has both spellings among its tags is counted once. On `/tags/` each tag is a single `tag-list-item` card (`tag-list-name`, `tag-list-link`, `tag-list-count`) labelled with whichever spelling most posts use. The page at `/tags/<slug>/` lists every matching post as `post-item` entries with a `post-title` link, newest first, and the number on a card equals how many it lists. Exactly one page and one `feed.xml` (Atom `entry` per post) exist at each tag's URL. A tag nobody has posted under still gets a page and a feed, both without entries.
