prompt: |-
  **N2 — major — Tags that differ only by case show as two identical cards, and one tag page hides the other tag's posts**
  - Where: /tags/, home Tags row, /tags/quotes/. cms-platform theme tag pages. Related to cms-platform#735 (editors can create "quote"/"Quotes" duplicates; its text is below). New.
  - Steps: with posts tagged `quotes` (real Opus post) and `Quotes` (scratch post), opened /tags/ and clicked the second QUOTES card, then /tags/quotes/.
  - Saw: two cards both reading "QUOTES 1", both linking to /tags/quotes/ (`s4-desk-tags.png`, home Tags row in `s1-firefox-desk-home-full.png`). The tag page lists only the scratch post: the original Opus post vanishes from its own tag page (`s5-tag-quotes-merged.png`).
  - Expected: tags normalized (case-insensitively) so they merge, or at least both posts listed on the shared page; no indistinguishable duplicate cards.

  Issue cms-platform#735, as it stood when this was reported:

  # Tags field doesn't suggest existing tags, so "quote" and "Quotes" duplicates are easy to create

  Found in the 2026-10-05 exploratory round on a local adamdaniel.ai admin (simple mode, platform v0.1.144), 1440×900.

  ## Steps

  1. New post. In **Tags**, type `quo` — the site already has a tag `quotes`.

  ## What happens

  No suggestion appears. Tags show as a plain comma-separated string, with a trailing comma after the last one. Nothing stops a writer from creating `quote` or `Quotes` next to `quotes`, and each would get its own archive page.

  **Severity:** minor (enhancement).

  ## Suggested direction

  - [ ] Offer existing tags as you type (for example a relation-style or custom widget fed from the tags already used in `_posts`), while still allowing a new tag.
  - [ ] Normalize case on save, or warn when a new tag differs from an existing one only by case or plural.

  Related: https://github.com/Adam-S-Daniel/cms-platform/issues/638 (closed) fixed the Tags hint and comma splitting.

  Interface the reviewer's tests use: `Jekyll::AutoTagPages.summarise(curated:, post_tag_lists:, slugify:)` returns `[missing, all]`, where `missing` is a list of names and `all` is a list of rows with `name`, `slug`, `url`, `description`, and `count`; `Jekyll::AutoTagPages.posts_by_slug(posts, slugify:)` returns a mapping from slugs to lists of distinct post objects.
interface_strings: ['Jekyll::AutoTagPages.summarise(curated:, post_tag_lists:, slugify:)', 'Jekyll::AutoTagPages.posts_by_slug(posts, slugify:)']
