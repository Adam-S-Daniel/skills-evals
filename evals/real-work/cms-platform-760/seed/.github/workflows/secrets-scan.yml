# Gitleaks secrets scanning. Runs on every PR (diff scan), on every
# push to main (incremental scan), and weekly (full-history sweep) so
# a leak introduced via a force-push or rebase still surfaces.
#
# Runs the open-source gitleaks BINARY directly rather than the
# gitleaks-action wrapper: that action requires a paid GITLEAKS_LICENSE
# for ORGANIZATION-owned repos (e.g. jodidaniel/*) — it fails closed with
# "missing gitleaks license" — while the binary itself is MIT-licensed and
# free for every repo. Using the binary keeps this reusable portable across
# both user- and org-owned consumer sites. (Public-vs-private is irrelevant;
# the action's gate is account type.)
#
# Allowlist for known test fixtures lives in .gitleaks.toml — read with
# --config when the consumer ships one; the upstream default ruleset is
# used otherwise.
name: Secrets scan (reusable)
on:
  workflow_call:
permissions:
  contents: read
  pull-requests: read

# NO `concurrency:` BLOCK — a deliberate, load-bearing ABSENCE. Do not add one.
#
# AGENTS.md states the rule categorically: a job that publishes a REQUIRED status
# context and can fire more than once on the same head SHA gets no `concurrency`
# block AT ALL. The `scan` job below publishes `scan / scan`, which
# repo-settings.yml's `ruleset_library.consumer-main` REQUIRES on both consumer
# mains — so the rule binds here (cms-platform#285) — and, since #525,
# `ruleset_library.platform-main` requires on this repo's own main too, through
# self-secrets-scan.yml.
#
# THE CARVE-OUT THAT LOOKS LIKE AN ESCAPE HATCH IS FALSE. AGENTS.md adds that
# jobs triggered only by `push` / `synchronize` are "safe to cancel", and an
# earlier pass at #285 leaned on it by narrowing the callers' `types:`. Measured
# in production, its premise does not hold: on adamdaniel.ai PR #3006
# (2026-08-09) the PR opened at 01:57:10Z, a force-push moved the head at
# 01:57:38Z, and BOTH visual-regression runs 31289327061 (cancelled) and
# 31289327099 (skipped) were created at 01:57:41Z carrying the SAME
# head_sha 68d7c777 — webhook latency dispatches the `opened` run after the
# force-push has already advanced the ref. `opened` and `synchronize` cannot be
# narrowed away either (without them the required context never reports at all),
# so NO trigger set makes a shared key collision-free. Only having no key does.
#
# WHAT RE-ADDING A GROUP WOULD COST. A cancelled run shadowing a successful one
# for the same context+SHA hard-blocks the merge: the API answers
# `405 Required status check "scan / scan" is cancelled`, and NOTHING overrides
# it — not native auto-merge, not an explicit merge call, not a nudge bot, not an
# admin. GitHub picks between the two runs NON-DETERMINISTICALLY, so the PR reads
# all-green, never lands, and the failure does not reproduce on demand.
# `cancel-in-progress: false` is not a fix: GitHub keeps the in-progress run plus
# only the LATEST pending run in a group and cancels the other pending
# duplicates, so a same-SHA burst still strands cancelled runs.
#
# WHAT THE ABSENCE COSTS, AND WHY IT IS WORTH IT. Superseded runs now finish
# instead of being cancelled — a PR pushed to five times burns five full gitleaks
# scans of runner minutes rather than one. Runner minutes are recoverable; a
# wedged required check has no operator remedy at all. Locked by
# e2e/required-context-cancellable.test.js and its CONSUMER-mode sibling
# e2e/consumer-required-context-cancellable.test.js.

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # fetch-depth: 0 so the scan can diff base..head on PRs and walk
          # full history on schedule/push events. A shallow clone produces
          # incomplete results.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          # Pin the binary so behaviour is reproducible across runs.
          # scripts/secrets-scan.sh parses this exact line — keep the
          # `GITLEAKS_VERSION: 'X.Y.Z'` shape. Bump deliberately.
          GITLEAKS_VERSION: '8.30.1'  # 2026-03-21
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -fsSL --retry 3 "$url" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # ── Allowlist canary (issue #260) ───────────────────────────────────────
      # A `paths` entry in a gitleaks allowlist is NOT a finding filter: it makes
      # gitleaks skip the file entirely, BEFORE any rule runs. Measured on 8.30.1
      # against this repo's own config, three fixture `paths` entries removed
      # 29,326 bytes — four files — from every scan, so a real credential pasted
      # into any of them would never have been reported, in a public repo.
      #
      # Two behaviours keep that invisible: `regexTarget = "secret"` is ACCEPTED
      # but only names the allowlist's DEFAULT target, so it narrows nothing, and
      # gitleaks SILENTLY IGNORES unknown TOML keys — so a `condition = "AND"`
      # added to scope a `paths` entry is dropped without warning. A config can
      # look correct, load cleanly, and change nothing.
      #
      # So measure it instead of reading it: plant a freshly generated,
      # detectable `ghp_`-shaped credential at every path the caller's allowlist
      # covers, scan that tree with the caller's own config, and require every
      # plant to come back as a finding. A plant the config cannot see is a file
      # a real secret could hide in.
      #
      # The comparison is DIFFERENTIAL — the same tree is also scanned with a
      # bare `useDefault` config, and only what the bare scan reports is held
      # against the caller's — so gitleaks' own upstream path exclusions can
      # never be misread as the caller's blind spot. Both scans pass --config
      # explicitly, because gitleaks auto-loads `.gitleaks.toml` FROM THE SCAN
      # TARGET: a "no config" control would silently load the very config under
      # test (the trap that invalidated the first measurement in #260).
      #
      # …and it compares (file, RuleID) PAIRS, never files. An allowlist can
      # blind ONE RULE instead of the whole file, and the file then still
      # reports: measured on 8.30.1, `github_token = "ghp_…"` with `github-pat`
      # blinded comes back as `generic-api-key`, so a FILE-level comparison sees
      # nothing wrong. Several shapes do it; these four printed OK here while
      # the comparison was per FILE — `[[rules.allowlists]].paths`, the singular
      # `[rules.allowlist].paths`, a GLOBAL `[[allowlists]]` carrying
      # `targetRules`, and a global `regexes` entry with `regexTarget = "match"`
      # broad enough to match the credential itself. That list is not
      # exhaustive: measured on 8.30.1, a per-rule `stopwords` entry, a per-rule
      # `regexes` + `regexTarget = "match"` entry and `[extend] disabledRules`
      # each blind one rule with no `paths` entry anywhere in the config, which
      # is why a blind pair the collector cannot attribute falls back to a
      # generic origin below instead of naming an entry that is not there. A
      # three-line id-only `[[rules]]` stanza is enough to attach one to an
      # inherited default rule, and it works directory-wide. The loss is TOTAL
      # for the blinded class: a bare `ghp_` token in prose (no `key = value`
      # around it) vanishes from the scan entirely, because `generic-api-key`
      # never saw it. Collecting those entries without moving to pairs is not a
      # fix — measured, it still prints OK.
      #
      # gitleaks DEDUPES overlapping rules: a bare-ruleset scan of the plant
      # returns exactly ONE finding (`github-pat`), and `generic-api-key` only
      # surfaces once `github-pat` is blinded. So this check can only measure
      # entries scoped to the rule the baseline names; an entry on any other
      # rule passes with an explicit "NOT measurable" note instead of a verdict,
      # which is what keeps the OK line from overstating what was proved.
      #
      # Fails soft, never noisy: a caller with no `.gitleaks.toml` has no
      # allowlist to test, and an unparseable one is reported by the real scan
      # below rather than twice.
      #
      # The probe body is extracted and executed against fixture configs by
      # e2e/gitleaks-allowlist-canary.test.js — keep the `<<'PYEOF'` delimiter.
      # The canary below needs tomllib (3.11+); pin the interpreter through
      # setup-python rather than the runner image's system python3.
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Allowlist canary
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json
          import os
          import pathlib
          import re
          import secrets
          import shutil
          import string
          import subprocess
          import sys
          import tempfile
          import tomllib

          # Where a plant is written that no sane allowlist should ever cover.
          # It doubles as the proof that the scan itself is functional: if the
          # bare ruleset cannot see this, the canary — not the config — is broken.
          CONTROL = "__gitleaks_canary_control__/control.txt"
          # A pattern matching a whole tree shouldn't plant thousands of files;
          # the blind spot is provable from a sample. Per PATTERN, and a
          # rule-scoped entry is naturally directory-wide, so a green run proves
          # the sampled files are scanned — not every file under the pattern.
          PER_PATTERN_CAP = 25
          # The two verdicts need DIFFERENT remedies: telling someone whose
          # over-broad `regexes` entry blinded a rule to "narrow it to a regexes
          # match" is telling them to do exactly what they already did.
          FIX_FILE = ('Narrow the entry to a `regexes` match (regexTarget '
                      '"match"/"line" to match beyond the secret) instead of '
                      'excluding the path.')
          FIX_RULE = ("Suppress the fixture's literal text rather than the "
                      "credential SHAPE — a `regexes` entry matching that text "
                      "leaves the rule live for real credentials on the file.")

          def annotate(kind, msg):
              print(f"::{kind}::{msg}", flush=True)

          workspace = pathlib.Path(os.environ.get("GITHUB_WORKSPACE") or os.getcwd())
          runner_temp = pathlib.Path(os.environ.get("RUNNER_TEMP") or tempfile.mkdtemp())
          config = workspace / ".gitleaks.toml"

          if not config.is_file():
              print("No .gitleaks.toml — no allowlist to canary.")
              sys.exit(0)

          try:
              doc = tomllib.loads(config.read_text(encoding="utf-8"))
          except (tomllib.TOMLDecodeError, UnicodeDecodeError, OSError) as exc:
              annotate("warning", f"allowlist canary skipped: .gitleaks.toml did not "
                                  f"parse ({type(exc).__name__}); the scan step reports "
                                  f"config errors")
              sys.exit(0)

          # GLOBAL allowlists ([allowlist] and [[allowlists]]). One with no
          # `targetRules` removes the FILE from every rule; one WITH it removes
          # only the rules it names, so the two are scoped differently below.
          def global_allowlists(parsed):
              top = parsed.get("allowlist")
              if isinstance(top, dict):
                  yield top
              for block in parsed.get("allowlists") or []:
                  if isinstance(block, dict):
                      yield block

          # PER-RULE allowlists, BOTH spellings — handling only one leaves half
          # the bypass open. Measured on 8.30.1: the singular `[rules.allowlist]`
          # and the plural `[[rules.allowlists]]` silence the containing rule
          # identically, and a `targetRules` key inside one is ignored — the
          # CONTAINING rule is what gets silenced either way.
          def rule_allowlists(parsed):
              for rule in parsed.get("rules") or []:
                  if not isinstance(rule, dict):
                      continue
                  rule_id = rule.get("id")
                  if not isinstance(rule_id, str) or not rule_id:
                      continue
                  one = rule.get("allowlist")
                  if isinstance(one, dict):
                      yield rule_id, one
                  for block in rule.get("allowlists") or []:
                      if isinstance(block, dict):
                          yield rule_id, block

          # Every `paths` entry, tagged with what it removes: scope None = the
          # whole file, a rule id = just that one rule. The phrase that names the
          # entry is fixed here, at collection time, so a failure message can
          # never invent an origin for an entry it did not actually collect.
          def path_entries(parsed):
              for block in global_allowlists(parsed):
                  scoped = [r for r in block.get("targetRules") or []
                            if isinstance(r, str)]
                  for entry in block.get("paths") or []:
                      if not isinstance(entry, str):
                          continue
                      if not scoped:
                          yield entry, None, f"paths entry {entry!r}"
                          continue
                      for rule_id in scoped:
                          yield entry, rule_id, (f"the `targetRules` allowlist "
                                                 f"entry {entry!r} on rule "
                                                 f"{rule_id!r}")
              for rule_id, block in rule_allowlists(parsed):
                  for entry in block.get("paths") or []:
                      if isinstance(entry, str):
                          yield entry, rule_id, (f"the per-rule `paths` entry "
                                                 f"{entry!r} on rule {rule_id!r}")

          # Materialise each pattern against the files it actually covers today.
          # gitleaks compiles these with Go's RE2 and Python with `re`; the two
          # agree on everything these configs use, and gitleaks is the authority
          # anyway — an over-match here just plants a probe that passes.
          cache = {}
          compiled = []
          for src, scope, origin in path_entries(doc):
              if src not in cache:
                  try:
                      cache[src] = re.compile(src)
                  except re.error as exc:
                      annotate("warning", f"allowlist canary: path pattern {src!r} "
                                          f"did not compile in Python ({exc}); not "
                                          f"probed")
                      cache[src] = None
              if cache[src] is not None:
                  compiled.append((scope, origin, cache[src]))

          tracked = []
          try:
              proc = subprocess.run(["git", "-C", str(workspace), "ls-files", "-z"],
                                    capture_output=True, check=True)
              tracked = [f for f in proc.stdout.decode("utf-8", "replace").split("\0") if f]
          except (OSError, subprocess.CalledProcessError) as exc:
              annotate("warning", f"allowlist canary: could not list tracked files "
                                  f"({type(exc).__name__}); probing the control only")

          # rel -> {scope: origin}. Every scope covering a file is kept: measured,
          # two entries can blind two different rules on the same file.
          plants = {}
          for scope, origin, rx in compiled:
              hits = [f for f in tracked if rx.search(f)]
              for rel in hits[:PER_PATTERN_CAP]:
                  plants.setdefault(rel, {}).setdefault(scope, origin)
              if len(hits) > PER_PATTERN_CAP:
                  print(f"  note: {origin} covers {len(hits)} tracked files; "
                        f"probing the first {PER_PATTERN_CAP}")

          # Freshly generated every run, so nothing credential-shaped is ever
          # committed to the repo this workflow scans. Avoid the `test`/`fake`
          # prefixes that fixture allowlists commonly (and legitimately) suppress.
          alphabet = string.ascii_letters + string.digits
          while True:
              body = "".join(secrets.choice(alphabet) for _ in range(36))
              if not body.startswith(("test", "fake")):
                  break
          token = "gh" + "p_" + body

          canary = runner_temp / "gitleaks-allowlist-canary"
          if canary.exists():
              shutil.rmtree(canary)
          targets = [CONTROL] + sorted(plants)
          root = canary.resolve()
          for rel in targets:
              dest = (canary / rel).resolve()
              if not str(dest).startswith(str(root) + os.sep):
                  annotate("warning", f"allowlist canary: refusing to plant outside the "
                                      f"canary tree: {rel}")
                  continue
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_text(f'github_token = "{token}"\n', encoding="utf-8")

          # Kept OUTSIDE the canary tree: a config inside it would be auto-loaded
          # as the scan target's own .gitleaks.toml.
          bare = runner_temp / "gitleaks-canary-bare.toml"
          bare.write_text("[extend]\nuseDefault = true\n", encoding="utf-8")

          def scan(config_path, report_path):
              run = subprocess.run(
                  ["gitleaks", "dir", "--no-banner", "--redact",
                   "--config", str(config_path),
                   "--report-format", "json", "--report-path", str(report_path),
                   str(canary)],
                  capture_output=True, text=True)
              try:
                  findings = json.loads(report_path.read_text(encoding="utf-8") or "[]") or []
                  readable = True
              except (OSError, json.JSONDecodeError):
                  findings = []
                  readable = False
              # (file, RuleID) PAIRS, never bare files. An allowlist that removes
              # ONE rule leaves the file reported by another — measured, a plant
              # with `github-pat` blinded still comes back as `generic-api-key` —
              # so a file-level comparison is blind to exactly the shape this
              # canary has to catch, even once the entries are collected.
              seen = set()
              for finding in findings:
                  try:
                      rel = pathlib.Path(finding.get("File", "")).resolve().relative_to(root)
                  except (ValueError, OSError):
                      continue
                  seen.add((str(rel).replace(os.sep, "/"), str(finding.get("RuleID", ""))))
              return run, seen, readable

          _, bare_found, _ = scan(bare, runner_temp / "canary-bare.json")
          # Deliberately a FILE-level question: "can the default ruleset still see
          # the plant at all". Asked per-rule, a gitleaks rule RENAME would read
          # as a caller's blind spot — the opposite of this branch's purpose.
          if CONTROL not in {f for f, _ in bare_found}:
              annotate("error", "allowlist canary is BROKEN, not the config: gitleaks' "
                                "default ruleset no longer reports the synthetic "
                                "credential this check plants. Update the canary's token "
                                "shape in .github/workflows/secrets-scan.yml.")
              sys.exit(1)

          repo_run, repo_found, repo_readable = scan(config, runner_temp / "canary-repo.json")
          # A config gitleaks cannot LOAD writes no report and exits non-zero
          # (measured: a `[[rules]]` id matching no rule, or a `targetRules` id
          # that does not exist, is fatal). That is a config error, not an
          # allowlist blind spot — the Scan step below hard-fails on the same
          # config, and reporting it here would send the reader hunting an
          # allowlist that is not the problem.
          if not repo_readable and repo_run.returncode != 0:
              annotate("warning", f"allowlist canary skipped: gitleaks could not load "
                                  f".gitleaks.toml (no report written, exit "
                                  f"{repo_run.returncode}); the scan step reports the "
                                  f"config error")
              sys.exit(0)
          if repo_run.returncode == 0:
              annotate("error", "allowlist canary: .gitleaks.toml found NOTHING in a tree "
                                "of planted credentials (exit 0) — the allowlist suppresses "
                                "everything this scan is supposed to catch.")

          # Only what the BARE scan attributed to a planted file is held against
          # the caller's config; anything gitleaks' own defaults skip, or never
          # attribute to a rule, is not the caller's blind spot. That differential
          # is what bounds this check's false positives to near zero.
          target_set = set(targets)
          expected = {(f, r) for f, r in bare_found if f in target_set}

          # Honest limit, not a failure. gitleaks DEDUPES overlapping rules, so
          # the baseline names exactly one rule per plant; an entry scoped to any
          # other rule is real but unmeasurable here, and says so out loud.
          for rel in sorted(plants):
              for scope, origin in sorted(plants[rel].items(),
                                          key=lambda kv: (kv[0] is None, kv[0] or "")):
                  if scope is None or (rel, scope) in expected:
                      continue
                  print(f"  note: {origin} covers {rel}, but the canary's bare-scan "
                        f"baseline does not attribute its synthetic credential to rule "
                        f"{scope!r} (gitleaks reports the most specific matching rule "
                        f"only), so this entry is NOT measurable by this check.")

          blind = sorted(expected - repo_found)
          still_scanned = {f for f, _ in repo_found}
          for rel, rule in blind:
              scopes = plants.get(rel, {})
              # Which verdict applies is MEASURED, never inferred from the key
              # that planted the file: entries blinding every rule that sees the
              # plant DO leave the file unscanned, and a rule-scoped entry does
              # not. Choosing by key printed a false sentence in both directions.
              if rel not in still_scanned:
                  if rel == CONTROL:
                      origin = " (the control path)"
                  elif None in scopes:
                      origin = f" ({scopes[None]})"
                  else:
                      origin = ""
                  annotate("error", f"allowlist blind spot: {rel} is skipped ENTIRELY by "
                                    f".gitleaks.toml{origin} — no rule ever runs against "
                                    f"it, so a real credential in that file would not be "
                                    f"reported. {FIX_FILE}")
                  continue
              # No `None in scopes` arm here, deliberately. Scope None comes only
              # from an UNSCOPED global `paths` entry, which removes the file from
              # every rule — so it is never still_scanned and always leaves through
              # the whole-file branch above. Measured: a config carrying BOTH a
              # blanket `paths` entry and a per-rule entry on the same file prints
              # "skipped ENTIRELY", and poisoning a `None` arm here left every
              # canary test green. The honest fallback beats an unreachable guess.
              # The `else` fallback below, by contrast, IS live and IS asserted —
              # a per-rule `stopwords` entry reaches it (see the canary spec).
              if rule in scopes:
                  origin = scopes[rule]
              else:
                  origin = "an entry in .gitleaks.toml"
              others = ", ".join(sorted(r for f, r in repo_found if f == rel))
              annotate("error", f"allowlist blind spot: rule {rule!r} reports nothing at "
                                f"{rel} — {origin} silences it, so a real {rule} "
                                f"credential there would not be reported. Other rules "
                                f"still scan this file (reported by {others}), so the "
                                f"blind spot is scoped to one credential class. "
                                f"{FIX_RULE}")
          if blind:
              sys.exit(1)

          print(f"gitleaks allowlist canary: OK — {len(targets)} planted credential(s) "
                f"({len(plants)} at allowlisted path(s)), {len(expected)} rule match(es) "
                f"expected, all reported by .gitleaks.toml.")
          PYEOF

      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(git --redact --no-banner --verbose)
          if [ -f .gitleaks.toml ]; then
            echo "Using repo .gitleaks.toml"
            args+=(--config .gitleaks.toml)
          else
            echo "No .gitleaks.toml — using gitleaks' upstream default ruleset"
          fi
          # On PRs scan only the commits the PR introduces (base..head); on
          # push / schedule / workflow_dispatch scan the full reachable
          # history. Fall back to a full scan if the base commit isn't
          # present (e.g. a force-pushed base).
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${BASE_SHA:-}" ] \
             && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Scanning PR range ${BASE_SHA}..${HEAD_SHA}"
            args+=("--log-opts=${BASE_SHA}..${HEAD_SHA}")
          else
            echo "Scanning full history"
          fi
          # gitleaks exits non-zero when it finds leaks (default --exit-code 1),
          # which fails the job — exactly the gate we want.
          gitleaks "${args[@]}" .
