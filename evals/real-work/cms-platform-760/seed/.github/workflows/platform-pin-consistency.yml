# Reusable ANTI-SKEW guard (issue #29) — single platform-version pin.
#
# A consuming repo references the cms-platform version in MANY places (every
# reusable-workflow `uses:@<tag>`, every composite action's `uses:@<tag>` — they
# are TAG-pinned too since 2026-08-20, and no comment is read anywhere; see
# docs/PIN-CONSISTENCY.md — the Gemfile gem `tag:`, the Gemfile.lock git-source
# `tag:`, and platform.lock `platform_ref`). Skew no longer comes from
# Dependabot — it now `ignore`s every cms-platform ref in both ecosystems
# (#242 + #244) — but from a hand-edit, a partially-applied platform-bump
# run, a `platform_ref:` input that never got stamped (#220), or an edited
# bump PR. Historical: this guard was written after a real piecemeal-bump
# drift (observed live: adamdaniel.ai pinned @v0.1.0 loop/deploy callers,
# gem @v0.1.5, others @v0.1.3/@v0.1.6 at once).
#
# This guard was modelled on the since-deleted platform-drift-guard.yml's shape
# — checkout the CONSUMER, checkout cms-platform at the consumer's platform_ref
# into `.cms-platform/` (a dot-dir Jekyll ignores), then run a PLATFORM-OWNED
# script against the consumer tree — but it guards VERSION CONSISTENCY (every
# reference == the platform.lock platform_ref) rather than file CONTENT (which
# was drift-guard's job). A mismatch fails the job with a precise per-file diff.
# It used to be described as complementing platform-drift-guard.yml; that
# workflow was DELETED in v0.1.83 with the transport that vendored the files it
# byte-compared, so this is now the only cross-repo guard left. See
# docs/SYNC.md.
#
# A consumer wires the thin caller in examples/site (pull_request). Pin
# `platform_ref` to the same tag/sha the caller pins this workflow to.
name: Platform pin consistency (reusable)

on:
  workflow_call:
    inputs:
      platform_repo:
        description: "owner/name of the platform repo (also the slug whose uses:@ refs are checked)."
        required: false
        type: string
        default: Adam-S-Daniel/cms-platform
      platform_ref:
        description: "Tag/sha of the platform repo to fetch the checker script from (pin to the same ref as this workflow)."
        required: false
        type: string
        default: main

permissions:
  contents: read

jobs:
  pin-consistency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch the consistency checker from the platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.platform_repo }}
          ref: ${{ inputs.platform_ref }}
          # Sparse: the checker script + the canonical consumer workflow SET
          # (examples/site/.github/workflows) the script diffs the consumer's set
          # against for the workflow-set parity check. No other platform-internal
          # deps beyond the `yaml` parser, installed below.
          sparse-checkout: |
            scripts/check-platform-pin-consistency.js
            examples/site/.github/workflows
          sparse-checkout-cone-mode: false
          path: .cms-platform

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Install the YAML parser
        # The checker parses workflows with the `yaml` lib (anchors resolved) —
        # NOT regex. `--prefix .cms-platform` installs it into the PLATFORM
        # checkout, NOT the consumer root, and that placement is load-bearing:
        # npm resolves the entire dependency tree of whatever package.json sits
        # at its prefix, so installing at the consumer root made this guard
        # depend on every devDependency the consumer happens to declare — and
        # `--no-package-lock` re-resolves those ranges from the registry,
        # bypassing the lockfile that pins them to versions known to work. One
        # broken upstream publish then turns a REQUIRED check red on every PR.
        # Not theoretical: decap-cms-lib-util@3.8.1 (2026-09-08) shipped
        # unresolved pnpm `catalog:` specifiers, npm exited
        # EUNSUPPORTEDPROTOCOL, and every adamdaniel.ai editorial PR was
        # blocked until this step stopped reading the consumer's package.json.
        # `.cms-platform` carries no package.json, so npm resolves `yaml` and
        # nothing else; the script's loadYaml() already probes
        # `<script>/../node_modules`. Pinned to the version the platform's e2e
        # harness uses.
        run: npm install --prefix .cms-platform --no-save --no-package-lock yaml@2.9.1

      - name: Check single-version pin consistency
        # Owner/repo + canonical-source default from the consumer's platform.lock
        # (platform_repo / platform_ref). Aggregates ALL violations, names each
        # offending file + found/expected value, exits non-zero on any mismatch.
        #
        # `--require-canonical`: the step above ALWAYS checks
        # examples/site/.github/workflows out into `.cms-platform/`, so this lane
        # always has a canonical set — a parity SKIP here can only mean that
        # checkout silently broke. Without the flag the checker would degrade to
        # the pin-only subset (61 of 96 checks, dropping exactly the workflow-SET
        # and workflow-CONTENT parity that police a consumer's `secrets:` map) and
        # still exit 0, so the one lane that exists to verify parity must fail
        # loudly instead of passing with fewer checks.
        run: node .cms-platform/scripts/check-platform-pin-consistency.js --require-canonical
