# Eval fixture: writing-adrs (pr-body-outgrows-itself)
# Measures whether the writing-adrs skill changes where an agent puts the
# reasoning for a change that looks wrong. The user is about to open a PR
# that swaps exponential backoff for a fixed retry interval, expects
# reviewers to ask why, and asks for the PR description. The skill's answer
# is that a description growing into "why this isn't a downgrade" belongs in
# an ADR: write the ADR in the same change, keep the PR description short
# with a link to it, and leave a signpost where the setting lives.
#
# The seed is a repo with a decision log (two accepted ADRs that do not
# concern this choice), a retry config that already holds the new fixed
# interval with no comment saying why, and no PR_BODY.md. The prompt
# carries the reason and two rejected alternatives; the seed carries none
# of it. The prompt asks only for the description and never says "ADR".
# The seed's AGENTS.md has no ADR pointer, so an agent that writes one has
# read docs/decisions/ itself.
#
# What the objective column is: a floor, decided from the files alone by
# line-anchored patterns, a file count, and byte comparison. It checks that
# a house-format ADR 0003 exists and names the gateway, the fixed interval
# and both rejected alternatives on lines below its headings, that the
# index and the config point at it, and that PR_BODY.md links the ADR and
# stays short (the length cap is the one check that reads the whole file
# rather than a line). Whether the ADR says anything true, in the right
# section, is the judge's.
#
# Scope note: the objective column only asserts on the paths named below. A
# brand-new, unrelated file is not caught by any objective_check, and
# neither is an edit to docs/decisions/README.md outside its index rows.

skill: writing-adrs
registry: https://github.com/Adam-S-Daniel/adam-agentskills

judge:
  weights:
    adr-holds-the-reasoning: 0.5
    pr-body-stays-a-signpost: 0.3
    restraint: 0.2

prompt: >
  I'm opening a PR for the change to config/retry.yaml: failed SMS sends
  used to back off exponentially and now retry on a fixed 30-second
  interval. That looks like a downgrade, and I know reviewers will ask why.
  The reason: the SMS gateway rate-limits by API key over a sliding window
  and treats any burst as abuse. After the March outage, exponential
  backoff with jitter made thousands of queued sends retry in the same few
  seconds, the gateway blocked our key for an hour, and no passcodes went
  out. A fixed interval spreads the retries evenly. Two things we ruled
  out: capping the backoff at 60 seconds still bunches the retries after a
  long outage, and a client-side token bucket can't work because three
  other services share the same API key, so our service can't see the
  gateway's real count. Please write the PR description in PR_BODY.md.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

# Every must_match / must_not_match pattern below is anchored at both ends
# (`^`...`$`), carries no inline flag (case is spelled out with classes),
# and its only wildcard runs are negated classes that exclude a newline, so
# one pattern reads one line, except `pr-body-is-short`'s must_not_match,
# which counts newlines on purpose. `require_present: true` is set on every
# check that carries a must_not_match, so none of them can pass on a file
# that was never written.
objective_checks:
  - id: new-adr-0003-is-a-house-format-entry
    description: >
      docs/decisions/0003-*.md exists and has the shape this repo's
      docs/decisions/README.md asks of an entry: a `# 0003. Title` line, a
      Status line reading Accepted or Proposed, a Date line, and the four
      section headings. It is not one of the seed's ADRs under a new
      number: each seed ADR's title is refused.
    type: file_matches
    paths: ["docs/decisions/0003-*.md"]
    require_present: true
    must_match:
      - '^# 0003\. [^\s][^\n]*$'
      - '^- \*\*Status:\*\* (Accepted|Proposed)\b[^\n]*$'
      - '^- \*\*Date:\*\* [0-9]{4}-[0-9]{2}-[0-9]{2}[ \t]*$'
      - '^## Context[ \t]*$'
      - '^## Decision[ \t]*$'
      - '^## Consequences[ \t]*$'
      - '^## Alternatives considered[ \t]*$'
    must_not_match:
      - '^[^\n]*<!--[^\n]*$'
      - '^# 0003\. Store passcode hashes, not passcodes[ \t]*$'
      - '^# 0003\. Expire passcodes after five minutes[ \t]*$'

  - id: adr-0003-records-the-reason
    description: >
      Below its headings, the new ADR names the gateway on some line, the
      fixed interval ("fixed" on some line) and the burst of retries that got
      the key blocked ("burst", "bunch", "same few seconds" or "blocked" on
      some line). Heading lines do not count, so a title alone does not
      satisfy this. Whether the Context explains the constraint without
      pre-announcing the decision is the judge's.
    type: file_matches
    paths: ["docs/decisions/0003-*.md"]
    require_present: true
    must_match:
      - '^(?!#)[^\n]*[Gg]ateway[^\n]*$'
      - '^(?!#)[^\n]*([Ff]ixed|30[ -][Ss]econd|every 30)[^\n]*$'
      - '^(?!#)[^\n]*([Bb]urst|[Bb]unch|same few seconds|[Bb]locked)[^\n]*$'
    must_not_match:
      - '^[^\n]*<!--[^\n]*$'

  - id: adr-0003-records-the-rejected-alternatives
    description: >
      Below its headings, the new ADR mentions each alternative the prompt
      says was ruled out: capping the backoff (any line saying cap or capped)
      and a client-side limiter (any line saying token bucket, limiter or
      rate limit). Whether each sits under Alternatives considered with its
      reason is the judge's.
    type: file_matches
    paths: ["docs/decisions/0003-*.md"]
    require_present: true
    must_match:
      - '^(?!#)[^\n]*([Cc]ap|[Cc]apped|[Cc]apping)\b[^\n]*$'
      - '^(?!#)[^\n]*([Tt]oken[ -]bucket|[Ll]imiter|[Rr]ate[ -]limit)[^\n]*$'
    must_not_match:
      - '^[^\n]*<!--[^\n]*$'

  - id: index-gained-a-row-for-0003
    description: >
      docs/decisions/README.md has a table row whose first cell links
      0003-<slug>.md and whose title and status cells are not empty.
    type: file_matches
    paths: ["docs/decisions/README.md"]
    require_present: true
    must_match:
      - '^\|[ \t]*\[0003\]\(0003-[a-z0-9-]+\.md\)[ \t]*\|[^|\n]*[^|\s][^|\n]*\|[^|\n]*[^|\s][^|\n]*\|[ \t]*$'
    must_not_match:
      - '^[^\n]*<!--[^\n]*$'

  - id: index-rows-for-0001-and-0002-kept
    description: >
      The index rows for the two ADRs this change does not concern keep
      their link, title and status (cell padding may differ). Passes on the
      pristine seed by design.
    type: file_matches
    paths: ["docs/decisions/README.md"]
    must_match:
      - '^\|[ \t]*\[0001\]\(0001-store-passcodes-hashed\.md\)[ \t]*\|[ \t]*Store passcode hashes, not passcodes[ \t]*\|[ \t]*Accepted[ \t]*\|[ \t]*$'
      - '^\|[ \t]*\[0002\]\(0002-expire-passcodes-after-five-minutes\.md\)[ \t]*\|[ \t]*Expire passcodes after five minutes[ \t]*\|[ \t]*Accepted[ \t]*\|[ \t]*$'

  - id: decision-log-links-resolve
    description: >
      Every `](NNNN-slug.md)` link in docs/decisions/README.md and in the
      ADR files names a file that exists in docs/decisions/. Catches an
      index row that names a slug nothing has. Passes on the pristine seed
      and vacuously when no scanned file exists. `link_pattern` is a token
      extractor matched per line, not an assertion: every hit must resolve,
      so it is deliberately unanchored.
    type: link_targets_exist
    paths:
      - "docs/decisions/README.md"
      - "docs/decisions/[0-9][0-9][0-9][0-9]-*.md"
    link_pattern: '\]\(([0-9]{4}-[a-z0-9-]+\.md)\)'
    base: "docs/decisions"

  - id: retry-config-comment-points-at-0003
    description: >
      A comment in config/retry.yaml names the new ADR's path, so the next
      reader of the setting finds the reason. Where in the file is not
      asserted here.
    type: file_matches
    paths: ["config/retry.yaml"]
    must_match:
      - '^[^#\n]*#[^\n]*docs/decisions/0003-[a-z0-9-]+\.md[^\n]*$'

  - id: retry-config-pointers-resolve
    description: >
      Every docs/decisions/NNNN-slug.md path config/retry.yaml spells out
      names a file that exists. Passes on the pristine seed (it names none)
      and vacuously when the file is missing (retry-config-comment-points-at-0003
      is what fails then); same extractor note as decision-log-links-resolve.
    type: link_targets_exist
    paths: ["config/retry.yaml"]
    link_pattern: '(docs/decisions/[0-9]{4}-[a-z0-9-]+\.md)'
    base: "."

  - id: retry-config-values-unchanged
    description: >
      The retry policy is still the fixed 30-second interval with 10
      attempts: the task documents the change, it does not make another.
      Passes on the pristine seed by design.
    type: file_matches
    paths: ["config/retry.yaml"]
    must_match:
      - '^  strategy: fixed$'
      - '^  interval_seconds: 30$'
      - '^  max_attempts: 10$'

  - id: pr-body-links-the-adr
    description: >
      PR_BODY.md exists and names the new ADR's path on some line, so the
      description points at the reasoning instead of carrying it.
    type: file_matches
    paths: ["PR_BODY.md"]
    require_present: true
    must_match:
      - '^[^\n]*docs/decisions/0003-[a-z0-9-]+\.md[^\n]*$'
    must_not_match:
      - '^[^\n]*<!--[^\n]*$'

  - id: pr-body-is-short
    description: >
      PR_BODY.md has at most 20 lines. A description that runs past that
      has grown into the explanation the ADR is for. The pattern counts
      newlines from the start of the file: 21 or more refuses it.
    type: file_matches
    paths: ["PR_BODY.md"]
    require_present: true
    must_not_match:
      - '\A(?:[^\n]*\n){21}'

  - id: exactly-one-new-adr-file
    description: >
      docs/decisions/ holds exactly three NNNN-*.md files (the seed has
      two). A total count, not a presence check and not a diff: the checks
      above decide which file it is and what is in it.
    type: file_count
    paths: ["docs/decisions/[0-9][0-9][0-9][0-9]-*.md"]
    min: 3
    max: 3

  - id: nothing-else-touched
    description: >
      ADRs 0001 and 0002, CHANGELOG.md, AGENTS.md and the repo-root
      README.md are byte-identical to the seed. The index and the config
      are expected to change and are covered by their own checks.
    type: files_unchanged
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - "AGENTS.md"
      - "docs/decisions/0001-*.md"
      - "docs/decisions/0002-*.md"

# The judge is left what a line pattern cannot decide: whether the ADR holds
# the reasoning, whether the PR description is a signpost rather than a
# second copy of it, and whether the agent stopped there. Correctness
# outweighs the guardrail, per DESIGN.md's harness-wide rule.
judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) adr-holds-the-reasoning — does the new ADR's Context describe the
  constraint (the SMS gateway rate-limits by API key over a sliding window
  and treats a burst as abuse; after the March outage jittered exponential
  backoff made queued sends retry in the same few seconds and the key was
  blocked for an hour) without pre-announcing the decision, does its
  Decision state the fixed 30-second retry interval, does it discuss both
  alternatives the user relayed (capping the backoff at 60 seconds, which
  still bunches retries after a long outage; a client-side token bucket,
  which cannot see the gateway's count because three other services share
  the API key) and why each was rejected, with honest positive AND negative
  consequences, and is its title an imperative decision statement rather
  than a question or a noun phrase? Cap at 4 if the alternatives are
  missing entirely, or if the reasoning lives only in PR_BODY.md and no ADR
  was written.
  (2) pr-body-stays-a-signpost — is PR_BODY.md a short description of the
  change (what changed, in a line or two) that links the ADR for the why,
  rather than a second copy of the context and the alternatives? Does a
  short comment in config/retry.yaml point at the ADR, and does the final
  reply say where the reasoning now lives? Cap at 4 if PR_BODY.md restates
  the alternatives in full.
  (3) restraint — did the agent leave the retry values, ADRs 0001 and 0002,
  their index rows, CHANGELOG.md, README.md and AGENTS.md untouched, and
  avoid writing any further ADR or a stray file such as a NOTES.md?

