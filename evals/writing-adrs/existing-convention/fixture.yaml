# Eval fixture: writing-adrs (existing-convention)
# Measures whether the writing-adrs skill improves an agent's ability to
# record a real, already-implemented decision as an ADR that follows a
# repo's EXISTING house convention (docs/decisions/README.md's own
# Status/Context/Decision/Consequences format), rather than the skill's own
# default Nygard-style template — and to leave the index and the code
# comment pointing at the new ADR, while resisting the urge to write a
# second, unwarranted ADR for a routine CHANGELOG entry.

skill: writing-adrs
registry: https://github.com/Adam-S-Daniel/agentskills

# Pinned mid-tier model, same rationale as every other fixture here: an
# Opus-tier agent could plausibly ace this without the skill (ceiling
# effect), and pinning stops with/without comparisons silently tracking the
# CLI's default model across releases.
model: claude-sonnet-5

judge:
  model: claude-opus-4-8
  # Dimension names match these weight keys EXACTLY (judge.py matches
  # case-insensitively, but the rubric text below spells them identically
  # anyway so there's no ambiguity reading the two side by side).
  weights:
    decision-with-alternatives-and-consequences: 0.5
    title-is-a-decision-statement: 0.3
    restraint: 0.2

prompt: >
  Record the retry-policy decision properly.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

# Objective checks run by harness/scorers/objective.py against the resulting
# workspace. These cover the FORMAT half of the skill (Class A: decidable
# from the files alone) — house-convention section order, the index gaining
# a row, the code comment linking the ADR, and exactly one new ADR file
# appearing. The JUDGMENT half (is this decision even ADR-worthy, is the
# alternatives/consequences content any good, is the title a decision
# statement) is Class C and left to the judge rubric below.
objective_checks:
  - id: adr-0004-house-format-sections-in-order
    description: >
      docs/decisions/0004-*.md exists and its Status/Context/Decision/
      Consequences sections appear in that order, matching this repo's
      house convention (docs/decisions/README.md), not the skill's own
      default template order (which interleaves Alternatives/References).
      A single multi-line regex over one Markdown file is an acceptable way
      to assert heading ORDER here (and only here) because Markdown ATX
      headings are lexical lines — "## Foo" occurring textually before
      "## Bar" in the file IS Foo's section preceding Bar's, with no need to
      parse the document into a tree to know that.
    type: file_matches
    paths: ["docs/decisions/0004-*.md"]
    must_match:
      - '(?s)^## Status\b.*^## Context\b.*^## Decision\b.*^## Consequences\b'

  - id: index-gained-a-row-for-0004
    description: docs/decisions/README.md's index table gained a row linking the new ADR
    type: file_matches
    paths: ["docs/decisions/README.md"]
    must_match:
      - '\[0004\]\(0004-[a-z0-9-]+\.md\)'

  - id: retry-sh-links-the-adr
    description: >
      scripts/retry.sh's header points at the new ADR, and the header's own
      decision sentence (what the judge rubric leans on to check the ADR's
      content against) is still there — gutting the header to nothing but
      a link would otherwise still pass this check.
    type: file_matches
    paths: ["scripts/retry.sh"]
    must_match:
      - 'docs/decisions/0004-[a-z0-9-]+\.md'
      - 'retry a transient command failure with capped exponential backoff'

  - id: exactly-one-new-adr-file
    description: >
      Exactly one ADR file was added (0001-0003 already existed): guards
      against a second, unwarranted ADR for the CHANGELOG.md entry, which is
      a routine fact, not a decision with alternatives. This is a total
      count, not a diff — see nothing-else-touched below for the check that
      catches deleting an existing ADR and adding a differently-numbered one
      in its place, which this count alone cannot.
    type: file_count
    paths: ["docs/decisions/[0-9][0-9][0-9][0-9]-*.md"]
    min: 4
    max: 4

  - id: nothing-else-touched
    description: >
      The pre-existing ADRs (0001-0003), CHANGELOG.md, and AGENTS.md must
      stay byte-identical. README.md is deliberately left out: the index
      row for the new ADR is a required edit. Without this, deleting
      0002-poll-fulfillment-service-every-30s.md and adding a
      differently-numbered decoy ADR (plus a rewritten CHANGELOG.md) keeps
      exactly-one-new-adr-file's total count at 4 and scores full marks.
    type: files_unchanged
    paths:
      - "CHANGELOG.md"
      - "docs/decisions/0001-*.md"
      - "docs/decisions/0002-*.md"
      - "docs/decisions/0003-*.md"
      - "AGENTS.md"

# The judge is left the parts a regex can't decide: whether the new ADR
# actually explains the alternatives retry.sh's header already names (retry
# forever, fail fast) and their consequences, whether its title is an
# imperative decision statement rather than a noun pile, and whether the
# agent resisted writing an ADR for the CHANGELOG's unrelated, non-decision
# fact and left the existing ADRs/index rows/CHANGELOG alone otherwise.
# Correctness (the content dimension) outweighs the guardrail, per
# DESIGN.md's harness-wide rule.
judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) decision-with-alternatives-and-consequences — does the new ADR's
  Context section describe the situation without pre-announcing the
  decision, does its Decision section state the retry policy actually
  implemented in scripts/retry.sh (capped attempts, exponential backoff),
  and does it discuss the alternatives retry.sh's header already names
  (retrying forever, failing fast with no retry) and why they were rejected,
  alongside honest positive AND negative consequences? Cap at 4 if the
  alternatives are missing entirely.
  (2) title-is-a-decision-statement — is the ADR's title (and its index row)
  an imperative verb + object naming what was decided (e.g. "Retry
  transient failures N times with capped exponential backoff"), not a noun
  phrase like "Retry policy" or a past-tense narration like "Decided to add
  retries"?
  (3) restraint — did the agent leave ADRs 0001-0003, the README's existing
  index rows, and CHANGELOG.md's entry untouched, and avoid writing a second
  ADR for the CHANGELOG's dependency-removal/typo-fix fact, which is a
  routine change with no alternatives to record, not a decision?
