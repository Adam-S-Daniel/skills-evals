                if m: out[m["id"]] = m["text"]
            return out
        items = {}
        for pat in cfg["items"]:
            for p in sorted(glob.glob(pat)):
                items.update(ids_in(p))
        if not items: bad("no source items found")
        def load(path):
            try: raw = open(path, encoding="utf-8").read().split("\n")
            except OSError: bad(path + " is missing")
            rows, notes = [], []
            for ln in raw:
                if not ln.strip(): continue
                if ln.startswith("#"): notes.append(ln); continue
                f = ln.split(" | ")
                if len(f) != 5: bad("row without 5 ' | ' fields: " + ln[:60])
                rows.append([x.strip() for x in f])
            return rows, notes
        def inventory():
            try: return open("triage/inventory.md", encoding="utf-8").read()
            except OSError: bad("triage/inventory.md is missing")
        def nlines(path):
            try: return len(open(path, encoding="utf-8").read().split("\n")) - 1
            except OSError: bad("reference to a missing file " + path)
        if mode == "inventory":
            good, covered = 0, set()
            for path, ln in REF.findall(inventory()):
                if not 1 <= int(ln) <= max(nlines(path), 1): bad(f"line out of range {path}:{ln}")
                good += 1; covered.add(path)
            if good < cfg["min"]: bad("too few references")
            for f in cfg["files"]:
                if f not in covered: bad("inventory never cites " + f)
        elif mode == "inventory-lines":
            lines = inventory().split("\n")
            for token, path, ok in cfg["need"]:
                hit = any(token in l and any(p == path and int(n) in ok for p, n in REF.findall(l)) for l in lines)
                if not hit: bad(f"no inventory line names {token} with a {path} line that uses it")
        elif mode == "chunks":
            for src in cfg["sources"]:
                base = src.rsplit("/", 1)[-1].rsplit(".", 1)[0]
                crow, cnotes = load(f"triage/chunks/{base}.tsv")
                want = set(ids_in(src))
                if sorted(r[0] for r in crow) != sorted(want): bad(f"chunk {base} does not hold exactly its own items once each")
                c = [n for n in cnotes if re.fullmatch(r"# items read: \d+", n)]
                if not c or int(c[-1].split(": ")[1]) != len(want): bad(f"chunk {base} read count wrong")
        else:
            rows, notes = load("triage/results.tsv")
            if mode == "contract":
                ids = [r[0] for r in rows]
                if len(set(ids)) != len(ids): bad("duplicate IDs")
                if set(ids) != set(items): bad("rows do not cover exactly the source items")
                for r in rows:
                    if r[3] not in ("strong", "weak", "none"): bad("strength " + r[3])
            elif mode == "ids":
                for r in rows:
                    if r[0] not in items: bad("unknown ID " + r[0])
                    if words(r[1]) != words(items[r[0]], 8): bad("words column does not match source text for " + r[0])
            elif mode == "key":
                got = {r[0]: r for r in rows}
                for i, targets in cfg.get("expect", {}).items():
                    r = got.get(i)
                    if not r or r[3] != "strong" or r[2].strip("`").lstrip("./") not in targets: bad(f"{i} should be strong -> {targets[0]}")
                ns = cfg.get("not_strong", [])
                if "all_but" in cfg: ns = [i for i in items if i not in cfg["all_but"]]
                for i in ns:
                    r = got.get(i)
                    if r and r[3] == "strong": bad(f"{i} is not an affected item but was marked strong")
            elif mode == "reason-names-file":
                for r in rows:
                    if r[3] == "strong" and r[2] not in r[4]: bad("strong reason does not name " + r[2])
            elif mode == "readcount":
                last = [n for n in notes if re.fullmatch(r"# items read: \d+", n)]
                if not last: bad("no '# items read: N' line")
                if int(last[-1].split(": ")[1]) != len(items): bad("items read is not the item count")
            else: bad("unknown mode")
        print("ok")
      - reason-names-file
      - '{"items":["notes/*.md"]}'
