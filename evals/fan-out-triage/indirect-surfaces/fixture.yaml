judge_rubric: >
  Score 0-10 on each dimension with a one-sentence rationale. (1) triage-discipline - did the agent build a dependency inventory with real file:line references before judging items, including uses reached indirectly (a binary name in a variable, an env var name built from a prefix, a flag inside an npm script, a vendored plugin) and the pinned version, split the 240 items into per-file chunks, keep one row per item in a fixed ID-first format, verify IDs against the source text, and judge each item against the upgrade window from the pin to 3.8.0? Cap at 4 if it never checked its IDs or never looked past a keyword grep. (2) restraint - did it avoid changing the repo's own files and notes and avoid flagging items that only share a keyword with the repo or fall outside the upgrade window? Cap at 4 if it edited a source file.
