# Thresholds of the eval scope pass's ceiling and floor pauses, read by
# scripts/eval_scope.py (`scope_policy`, which refuses a missing, unknown or
# out-of-range key). What each rule does: scripts/eval_scope.py's docstring.
# Current values in plain English: docs/rules.md (generated from this file).
#
#   ceiling_min_runs  runs since the fixture last changed before either rule
#                     may pause it (every roster model's own runs).
#   ceiling_share     the without arm's mean share of checks passed at or
#                     above which a fixture is paused as `ceiling`.
#   ceiling_judge     the without arm's judge score (0 to 10) a ceiling pause
#                     also needs, when the arm has judge figures.
#   floor_share       both arms' share of checks passed at or below which a
#                     fixture is paused as `floor`.
#   keep_guard        a subject whose explorer confidence that it helps is at
#                     least this, or whose verdict is keep, is never paused
#                     for ceiling or floor.
ceiling_min_runs: 4
ceiling_share: 0.85
ceiling_judge: 8.5
floor_share: 0.10
keep_guard: 0.5
