<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Features</title>
  <meta name="description" content="Drafts, scheduling, roles and a page history.">
</head>
<body>
  <h1>Features</h1>
  <h2 id="drafts">Drafts</h2>
  <p>Keep a draft beside the live page until it is ready.</p>
  <h2 id="schedule">Scheduling</h2>
  <p>Pick a time and the page publishes itself.</p>
  <img src="/img/schedule.png" alt="The scheduling dialog">
  <h2 id="history">History</h2>
  <p>Every published version is kept, so you can roll back.</p>
  <img src="/img/history.png">
</body>
</html>
