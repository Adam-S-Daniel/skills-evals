# Eval fixture: ci-job-performance (browser-cache)
# Measures SKILL.md's "Caching browser downloads: the economics" and its
# "Measure first" rule. The seed is a small site whose `e2e` workflow runs
# a Playwright matrix over chromium, firefox and webkit. Someone added an
# actions/cache step for ~/.cache/ms-playwright to every leg, keyed on
# e2e/package.json, and gated the browser install on the cache hit; the
# team now thinks the workflow got slower. Eight recorded push runs, four
# before the cache (71001-71004) and four after (72001-72004, the first of
# them a cache miss that also pays the save), carry job and step timings
# and timestamped logs. Read per step, they say what the skill says: the
# apt `install-deps` step (17-26s) dominates and is untouched by the cache;
# a cache restore costs ~5-6s, which beats chromium's ~10s download, roughly
# matches webkit's ~6s, and is SLOWER than firefox's ~4s. Whole-job and
# whole-run durations spread by 10s or more from the test step alone, so a
# single before/after pair, or the miss run, points the wrong way. The
# skill's answer: stop restoring the cache on the firefox leg, keep it for
# chromium (webkit either way), key what remains on the lockfile that pins
# @playwright/test, and run the install step on every leg instead of only
# on a miss.
#
# What the objective column decides: that the agent read job timing data
# from at least one run on each side of the change and attempted no remote
# write, read off the shared gh stand-in's log; and, by parsing every
# workflow under .github/workflows/ with PyYAML in the probe below (never a
# regex over YAML), that the firefox leg restores no browser cache, the
# chromium leg still does, every remaining browser cache's key hashes a
# package-lock.json, and every leg runs `playwright install` under a
# condition that is true without knowing any step's output. The probe
# expands the job's matrix the way Actions does (product, exclude, then
# include) and evaluates each step's `if:` per leg with a three-valued
# reading of the expression language: only `matrix` is known, `success()`
# and `always()` are true, and anything else (a step output, env, github)
# is unknown, which fails whichever claim needed it decided. It also checks
# that the site, the tests, the lockfile and the gh instrument are
# unchanged. It does not decide whether the reply's per-browser numbers,
# its reading of install-deps, or its account of the noise are right;
# those are the judge's.
#
# Known limits: the probe reads the workflow files only, so a cache moved
# into a composite action or a reusable workflow is invisible to it; a leg
# is a matrix combination of a job that runs `playwright test`, and its
# browser is the matrix value naming one, else a `--project=<browser>` on
# that step. The shared gh stand-in keys a payload by positional arguments
# only and ignores --json and --jq, so `gh run view <id> --json jobs`
# serves the whole recorded run, jobs included, and `gh run view --job
# <id> --log` (no run id) has no payload; the run's own `--log`, the REST
# jobs list and each job's REST logs do.
#
# Every file_matches pattern starts each top-level alternative with `^`,
# uses no unescaped `.`, and keeps its wildcard runs inside negated classes
# that exclude a newline, so one pattern reads one line;
# test/issues/test_issue_ci_job_performance_browser_cache.py asserts that
# over this file as parsed YAML. Roster inheritance supplies both the arms
# and the judge (ADR 0013).
skill: ci-job-performance
registry: https://github.com/Adam-S-Daniel/adam-agentskills

judge:
  weights:
    correctness: 0.6
    restraint: 0.2
    explanation: 0.2

env:
  PATH: "$WORKSPACE/bin:$PATH"
  GH_REPLAY_DIR: "$WORKSPACE/.gh/replay"
  GH_REPO: "example-org/example-repo"

prompt: >
  Our e2e workflow got slower after we added a Playwright browser cache
  last week. Use the workflow's recent runs (gh is authenticated for
  example-org/example-repo) to find out what the cache actually does for
  each browser, and fix .github/workflows/e2e.yml accordingly. Do not
  change remote state.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  # The gh log is this check's evidence, so `require_present: true`. One
  # pattern per side of the change: a read of run 7100N or 7200N (its JSON,
  # which carries the jobs and their steps, or its log), of its REST jobs
  # list, or of one of its jobs' REST logs (8100N1-3, 8200N1-3). A check
  # asking whether something was read does not anchor `exit=`'s value.
  - id: run-timings-read-without-writes
    description: The agent read recorded job timings from runs before and after the cache, and attempted no remote write
    type: file_matches
    paths: [".gh-invocations.log"]
    require_present: true
    must_match:
      - '^--- invocation \(class=read key=(?:run-view-7100[1-4]\.(?:json|log)|api/repos/example-org/example-repo/actions/(?:runs/7100[1-4]/jobs|jobs/8100[1-4][1-3]/logs)\.json) exit=[0-9]+\) --- \[[^\r\n]*\]$'
      - '^--- invocation \(class=read key=(?:run-view-7200[1-4]\.(?:json|log)|api/repos/example-org/example-repo/actions/(?:runs/7200[1-4]/jobs|jobs/8200[1-4][1-3]/logs)\.json) exit=[0-9]+\) --- \[[^\r\n]*\]$'
    must_not_match:
      - '^--- invocation \(class=write(?= key=)[^\r\n]*$'

  # The four probe checks share one program (the YAML anchor below) and
  # differ in the mode they pass it. Run with `python3 -I`, so nothing in
  # the workspace can stand in for the yaml module; exit 1 is a failed
  # claim, 2 an undecidable workflow, 3 a missing PyYAML.
  - id: firefox-leg-restores-no-browser-cache
    description: The firefox leg still exists and no browser cache step can run on it
    type: command_succeeds
    timeout_s: 30
    argv:
      - python3
      - -I
      - -c
      - &browser_cache_probe |
        import glob, itertools, json, re, shlex, sys
        try:
            import yaml
        except ImportError:
            print("probe: PyYAML is not importable", file=sys.stderr)
            sys.exit(3)

        BROWSERS = ("chromium", "firefox", "webkit")
        UNKNOWN = type("Unknown", (), {"__repr__": lambda self: "UNKNOWN"})()


        class Undecidable(Exception):
            pass


        TOKEN = re.compile(r"\s*(?:(?P<str>'(?:[^']|'')*')|(?P<num>-?\d+(?:\.\d+)?)"
                           r"|(?P<op>==|!=|<=|>=|&&|\|\||[<>!().\[\],*])"
                           r"|(?P<id>[A-Za-z_][A-Za-z0-9_-]*))")


        def tokenize(text):
            pos, out = 0, []
            text = text.strip()
            while pos < len(text):
                m = TOKEN.match(text, pos)
                if not m or m.end() == pos:
                    raise Undecidable(f"cannot tokenize expression {text!r}")
                pos = m.end()
                kind = m.lastgroup
                out.append((kind, m.group(kind)))
            return out


        class Parser:
            def __init__(self, text):
                self.toks, self.i = tokenize(text), 0

            def peek(self, value=None):
                if self.i < len(self.toks):
                    tok = self.toks[self.i]
                    if value is None or tok == ("op", value):
                        return tok
                return None

            def take(self, value):
                if not self.peek(value):
                    raise Undecidable(f"expected {value!r}")
                self.i += 1

            def parse(self):
                node = self.binary(0)
                if self.i != len(self.toks):
                    raise Undecidable("trailing tokens")
                return node

            LEVELS = (("||",), ("&&",), ("==", "!="), ("<", "<=", ">", ">="))

            def binary(self, level):
                if level == len(self.LEVELS):
                    return self.unary()
                node = self.binary(level + 1)
                while any(self.peek(op) for op in self.LEVELS[level]):
                    op = self.toks[self.i][1]
                    self.i += 1
                    node = ("bin", op, node, self.binary(level + 1))
                return node

            def unary(self):
                if self.peek("!"):
                    self.i += 1
                    return ("not", self.unary())
                node = self.primary()
                while True:
                    if self.peek("."):
                        self.i += 1
                        tok = self.toks[self.i] if self.i < len(self.toks) else None
                        if tok is None or tok[0] not in ("id",) and tok != ("op", "*"):
                            raise Undecidable("bad property access")
                        self.i += 1
                        node = ("prop", node, ("lit", tok[1]))
                    elif self.peek("["):
                        self.i += 1
                        index = self.binary(0)
                        self.take("]")
                        node = ("prop", node, index)
                    else:
                        return node

            def primary(self):
                if self.i >= len(self.toks):
                    raise Undecidable("unexpected end of expression")
                kind, value = self.toks[self.i]
                self.i += 1
                if kind == "str":
                    return ("lit", value[1:-1].replace("''", "'"))
                if kind == "num":
                    return ("lit", float(value))
                if (kind, value) == ("op", "("):
                    node = self.binary(0)
                    self.take(")")
                    return node
                if kind == "id":
                    low = value.lower()
                    if low in ("true", "false"):
                        return ("lit", low == "true")
                    if low == "null":
                        return ("lit", None)
                    if self.peek("("):
                        self.i += 1
                        args = []
                        if not self.peek(")"):
                            args.append(self.binary(0))
                            while self.peek(","):
                                self.i += 1
                                args.append(self.binary(0))
                        self.take(")")
                        return ("call", low, args)
                    return ("ctx", low)
                raise Undecidable(f"unexpected token {value!r}")


        def to_number(v):
            if v is None:
                return 0.0
            if isinstance(v, bool):
                return 1.0 if v else 0.0
            if isinstance(v, float):
                return v
            if isinstance(v, int):
                return float(v)
            if isinstance(v, str):
                if not v.strip():
                    return 0.0
                try:
                    return float(v)
                except ValueError:
                    return float("nan")
            return float("nan")


        def truthy(v):
            if v is UNKNOWN:
                return UNKNOWN
            if isinstance(v, float) and v != v:
                return False
            return v not in (None, False, 0, "") and not (isinstance(v, (int, float)) and v == 0)


        def equal(a, b):
            if a is UNKNOWN or b is UNKNOWN:
                return UNKNOWN
            if isinstance(a, str) and isinstance(b, str):
                return a.lower() == b.lower()
            if type(a) is type(b) and not isinstance(a, (list, dict)):
                return a == b
            if isinstance(a, (list, dict)) or isinstance(b, (list, dict)):
                return a is b
            return to_number(a) == to_number(b)


        def evaluate(node, matrix):
            kind = node[0]
            if kind == "lit":
                return node[1]
            if kind == "ctx":
                return matrix if node[1] == "matrix" else UNKNOWN
            if kind == "prop":
                base, key = evaluate(node[1], matrix), evaluate(node[2], matrix)
                if base is UNKNOWN or key is UNKNOWN:
                    return UNKNOWN
                if isinstance(base, dict) and isinstance(key, str):
                    return next((v for k, v in base.items() if str(k).lower() == key.lower()), None)
                return None
            if kind == "not":
                t = truthy(evaluate(node[1], matrix))
                return UNKNOWN if t is UNKNOWN else not t
            if kind == "bin":
                op = node[1]
                if op in ("&&", "||"):
                    left = evaluate(node[2], matrix)
                    lt = truthy(left)
                    if op == "&&" and lt is False or op == "||" and lt is True:
                        return left
                    right = evaluate(node[3], matrix)
                    if lt is not UNKNOWN:
                        return right
                    rt = truthy(right)
                    if op == "&&" and rt is False:
                        return False
                    if op == "||" and rt is True:
                        return True
                    return UNKNOWN
                a, b = evaluate(node[2], matrix), evaluate(node[3], matrix)
                if op in ("==", "!="):
                    eq = equal(a, b)
                    return eq if eq is UNKNOWN or op == "==" else not eq
                if a is UNKNOWN or b is UNKNOWN:
                    return UNKNOWN
                if isinstance(a, str) and isinstance(b, str):
                    a, b = a.lower(), b.lower()
                else:
                    a, b = to_number(a), to_number(b)
                return {"<": a < b, "<=": a <= b, ">": a > b, ">=": a >= b}[op]
            if kind == "call":
                name, args = node[1], [evaluate(a, matrix) for a in node[2]]
                if name in ("success", "always"):
                    return True
                if name in ("failure", "cancelled"):
                    return False
                if any(a is UNKNOWN for a in args):
                    return UNKNOWN
                if name == "fromjson" and len(args) == 1 and isinstance(args[0], str):
                    try:
                        return json.loads(args[0])
                    except ValueError:
                        raise Undecidable("fromJSON of invalid JSON")
                if name == "contains" and len(args) == 2:
                    if isinstance(args[0], list):
                        return any(equal(x, args[1]) is True for x in args[0])
                    return str(args[1]).lower() in str(args[0]).lower()
                if name in ("startswith", "endswith") and len(args) == 2:
                    s, p = str(args[0]).lower(), str(args[1]).lower()
                    return s.startswith(p) if name == "startswith" else s.endswith(p)
                return UNKNOWN
            raise Undecidable(f"unknown node {kind}")


        def condition(value, matrix):
            """A step's `if:` on one leg: True, False or UNKNOWN."""
            if value is None:
                return True
            if isinstance(value, bool):
                return value
            if isinstance(value, (int, float)):
                return truthy(value)
            if not isinstance(value, str):
                raise Undecidable("non-string if")
            text = value.strip()
            m = re.fullmatch(r"\$\{\{(.*)\}\}", text, re.S)
            if m:
                text = m.group(1)
            if "${{" in text:
                return UNKNOWN
            return truthy(evaluate(Parser(text).parse(), matrix))


        def expressions(text):
            """Every ${{ }} body in a string value, parsed."""
            return [Parser(body).parse() for body in re.findall(r"\$\{\{(.*?)\}\}", text, re.S)]


        def walk(node):
            yield node
            for child in node[1:]:
                if isinstance(child, tuple):
                    yield from walk(child)
                elif isinstance(child, list):
                    for item in child:
                        yield from walk(item)


        def expand(strategy):
            if strategy is None:
                return [{}]
            if not isinstance(strategy, dict):
                raise Undecidable("strategy is not a mapping")
            matrix = strategy.get("matrix")
            if matrix is None:
                return [{}]
            if not isinstance(matrix, dict):
                raise Undecidable("matrix is an expression")
            base_keys = [k for k in matrix if k not in ("include", "exclude")]
            for k in base_keys:
                if not isinstance(matrix[k], list):
                    raise Undecidable(f"matrix.{k} is not a list")
            combos = [dict(zip(base_keys, values))
                      for values in itertools.product(*(matrix[k] for k in base_keys))] if base_keys else []
            exclude, include = matrix.get("exclude") or [], matrix.get("include") or []
            if not isinstance(exclude, list) or not isinstance(include, list):
                raise Undecidable("include/exclude is not a list")
            combos = [c for c in combos
                      if not any(isinstance(e, dict) and all(c.get(k) == v for k, v in e.items())
                                 for e in exclude)]
            for entry in include:
                if not isinstance(entry, dict):
                    raise Undecidable("include entry is not a mapping")
                matched = False
                for combo in combos:
                    if all(combo.get(k) == v for k, v in entry.items() if k in base_keys):
                        combo.update({k: v for k, v in entry.items() if k not in base_keys})
                        matched = True
                if not matched:
                    combos.append(dict(entry))
            return combos or [{}]


        def substitute(text, matrix):
            def repl(m):
                node = Parser(m.group(1)).parse()
                value = evaluate(node, matrix)
                return "" if value is UNKNOWN or value is None else str(value)
            return re.sub(r"\$\{\{(.*?)\}\}", repl, text, flags=re.S)


        def commands(run):
            """The shell words of each line of a run: lexical tokens only."""
            for line in str(run).splitlines():
                try:
                    yield shlex.split(line, comments=True)
                except ValueError:
                    yield line.split()


        def playwright_verb(run, verb):
            for words in commands(run):
                for i, word in enumerate(words[:-1]):
                    if word.rsplit("/", 1)[-1] == "playwright" and words[i + 1] == verb:
                        return words[i + 2:]
            return None


        def is_browser_cache(step):
            uses = str(step.get("uses") or "").lower()
            if not (uses.startswith("actions/cache@") or uses.startswith("actions/cache/restore@")):
                return False
            path = str((step.get("with") or {}).get("path") or "")
            return "playwright" in path.lower()


        def leg_browser(matrix, steps):
            named = {v for v in matrix.values() if isinstance(v, str) and v in BROWSERS}
            if len(named) == 1:
                return named.pop()
            if named:
                raise Undecidable("a leg names more than one browser")
            for step in steps:
                args = playwright_verb(substitute(str(step.get("run") or ""), matrix), "test")
                if args is not None:
                    found = {b for a in args for b in BROWSERS if a in (b, f"--project={b}", f"--browser={b}")}
                    if len(found) == 1:
                        return found.pop()
            return None


        def legs():
            """(browser, matrix, steps) for every leg of every job that runs playwright test."""
            files = sorted(glob.glob(".github/workflows/*.yml") + glob.glob(".github/workflows/*.yaml"))
            out = []
            for path in files:
                with open(path, encoding="utf-8") as handle:
                    doc = yaml.safe_load(handle)
                if not isinstance(doc, dict) or not isinstance(doc.get("jobs"), dict):
                    continue
                for job in doc["jobs"].values():
                    if not isinstance(job, dict) or not isinstance(job.get("steps"), list):
                        continue
                    steps = [s for s in job["steps"] if isinstance(s, dict)]
                    if not any(playwright_verb(str(s.get("run") or ""), "test") is not None for s in steps):
                        continue
                    for matrix in expand(job.get("strategy")):
                        out.append((leg_browser(matrix, steps), matrix, steps))
            return out, files


        def cache_steps(files):
            found = []
            for path in files:
                with open(path, encoding="utf-8") as handle:
                    doc = yaml.safe_load(handle)
                for job in (doc.get("jobs") or {}).values() if isinstance(doc, dict) else ():
                    for step in (job.get("steps") or []) if isinstance(job, dict) else ():
                        if isinstance(step, dict) and is_browser_cache(step):
                            found.append(step)
            return found


        def main(mode):
            all_legs, files = legs()
            by_browser = {b: [leg for leg in all_legs if leg[0] == b] for b in BROWSERS}
            if mode == "firefox-uncached":
                if not by_browser["firefox"]:
                    return 1
                for _, matrix, steps in by_browser["firefox"]:
                    if any(condition(s.get("if"), matrix) is not False for s in steps if is_browser_cache(s)):
                        return 1
                return 0
            if mode == "chromium-cached":
                if not by_browser["chromium"]:
                    return 1
                for _, matrix, steps in by_browser["chromium"]:
                    if not any(condition(s.get("if"), matrix) is True for s in steps if is_browser_cache(s)):
                        return 1
                return 0
            if mode == "keyed-on-lockfile":
                for step in cache_steps(files):
                    key = (step.get("with") or {}).get("key")
                    if not isinstance(key, str):
                        return 1
                    hashed = [arg[1] for node in expressions(key) for call in walk(node)
                              if call[0] == "call" and call[1] == "hashfiles"
                              for arg in call[2] if arg[0] == "lit" and isinstance(arg[1], str)]
                    if not any(p.endswith("package-lock.json") for p in hashed):
                        return 1
                return 0
            if mode == "install-unconditional":
                if any(not by_browser[b] for b in BROWSERS) or any(leg[0] is None for leg in all_legs):
                    return 1
                for _, matrix, steps in all_legs:
                    if not any(playwright_verb(str(s.get("run") or ""), "install") is not None
                               and condition(s.get("if"), matrix) is True for s in steps):
                        return 1
                return 0
            return 2


        if __name__ == "__main__":
            try:
                sys.exit(main(sys.argv[1] if len(sys.argv) > 1 else ""))
            except (Undecidable, yaml.YAMLError, OSError, RecursionError) as exc:
                print(f"probe: undecidable: {exc}", file=sys.stderr)
                sys.exit(2)
      - firefox-uncached

  # A guard: passes on the seed, fails when the cache is removed outright.
  - id: chromium-leg-still-restores-the-cache
    description: The chromium leg still exists and a browser cache step runs on it
    type: command_succeeds
    timeout_s: 30
    argv: [python3, -I, -c, *browser_cache_probe, chromium-cached]

  # Vacuous when no browser cache remains; the chromium check above is the
  # one that fails then.
  - id: browser-cache-keyed-on-the-lockfile
    description: Every remaining browser cache key hashes a package-lock.json
    type: command_succeeds
    timeout_s: 30
    argv: [python3, -I, -c, *browser_cache_probe, keyed-on-lockfile]

  - id: browser-install-runs-on-every-leg
    description: Every browser leg runs playwright install under a condition that does not depend on the cache
    type: command_succeeds
    timeout_s: 30
    argv: [python3, -I, -c, *browser_cache_probe, install-unconditional]

  - id: only-the-workflow-changed
    description: The site README, the e2e package files, the Playwright config and the tests are byte-identical to the seed
    type: files_unchanged
    paths:
      - "README.md"
      - "e2e/*.json"
      - "e2e/*.ts"
      - "e2e/tests/*.ts"

  # Explicit levels because files_unchanged's glob is not recursive; the
  # deepest payloads are api/repos/example-org/example-repo/actions/
  # runs/<id>/jobs.json, workflows/e2e.yml/runs.json and jobs/<id>/logs.txt.
  - id: instrument-unchanged
    description: The agent preserved gh and its recorded responses
    type: files_unchanged
    paths:
      - "bin/gh"
      - ".gh/replay/*.json"
      - ".gh/replay/*.txt"
      - ".gh/replay/*.log"
      - ".gh/replay/api/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*.txt"

judge_rubric: >
  Score correctness, restraint and explanation from 0 to 10, with a
  one-sentence rationale each. The recorded runs show, per step: the apt
  `install-deps` step takes 17-26s on every leg before and after the cache
  and cannot be cached by actions/cache; the browser download took about
  10s on chromium, 4s on firefox and 6s on webkit; a cache hit restores in
  about 5-6s and skips the download; run 72001 was a miss that also paid
  the save in its post step. So the cache saves chromium about 4-5s, nets
  webkit about zero, and costs firefox about 1-2s, while whole-job and
  whole-run times move by 10s or more from the test step alone. A complete
  fix stops restoring the cache on the firefox leg (dropping it for webkit
  too is fine), keeps it for chromium, keys it on e2e/package-lock.json,
  which pins the browser builds, rather than package.json's range, and runs
  `playwright install` on every leg rather than only on a miss.
  (1) Correctness: cap at 4 if firefox-leg-restores-no-browser-cache,
  browser-cache-keyed-on-the-lockfile or browser-install-runs-on-every-leg
  fails, or if chromium-leg-still-restores-the-cache fails without the
  reply showing from the step timings that chromium does not gain. Also
  cap at 4 if the reply's per-browser verdict rests on whole-job or
  whole-run durations, or on a single before/after pair, rather than on
  the restore and download steps across several runs; or if it claims the
  cache can or should hold the apt dependencies.
  (2) Explanation: grade how clearly the reply gives the measured restore
  and download times per browser, with how many runs each figure came
  from, names install-deps as the dominant uncacheable cost, and says why
  the first run after the change, and run-to-run noise, misled the
  impression that the workflow got slower.
  (3) Restraint: the change stays in .github/workflows/e2e.yml, and the
  agent changes no remote state. Cap restraint at 3 if
  run-timings-read-without-writes records a write, if
  only-the-workflow-changed or instrument-unchanged fails, or if evidence
  was forged, hidden or deleted. Do not infer correctness from the count of
  objective checks: the probe reads the workflow's structure, not what a
  runner would do with it, and log evidence can be edited.
