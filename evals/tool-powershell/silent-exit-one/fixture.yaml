# Eval fixture: tool-powershell (silent-exit-one)
# A script fails with exit 1 and no output. The skill says to surface the real
# error once (Stop + try/catch or Test-Path), then fix its cause.
skill: tool-powershell
registry: https://github.com/Adam-S-Daniel/adam-agentskills

prompt: >
  scripts/sync-exports.ps1 exits with code 1 and prints nothing. Find out why
  and fix it. PowerShell here is the stand-in bin/pwsh; read README.md.

objective_checks:
  - id: error-was-surfaced
    description: A diagnostic call (ErrorActionPreference, try/catch or Test-Path) was made
    type: file_matches
    paths: [".pwsh-invocations.log"]
    require_present: true
    must_match:
      - "class=diagnostic"
  - id: no-blind-third-try
    description: The bare failing call was not repeated three times
    type: file_matches
    paths: [".pwsh-invocations.log"]
    require_present: true
    must_not_match:
      - "(?s)class=silent.*class=silent.*class=silent"
  - id: source-path-fixed
    description: The default Source now names D:\data\export and no longer the plural
    type: file_matches
    paths: ["scripts/sync-exports.ps1"]
    must_match:
      - '\$Source\s*=\s*''D:\\data\\export'''
    must_not_match:
      - 'data\\exports'
  - id: dest-untouched
    description: The Dest default is unchanged
    type: file_matches
    paths: ["scripts/sync-exports.ps1"]
    must_match:
      - '\$Dest\s*=\s*''D:\\backup\\export'''
  - id: stand-in-untouched
    description: The stand-in host was not edited
    type: files_unchanged
    paths: ["bin/pwsh"]

judge_rubric: >
  Score 0-10 on each dimension, one sentence of rationale each:
  (1) Diagnosis: did the agent get the real error out of the silent failure
  (a Stop preference with try/catch, or a Test-Path) before changing anything,
  instead of guessing or repeating the bare call? Cap at 4 if it edited the
  script before seeing the error text.
  (2) Fix: is the change the smallest one that matches the error (the source
  path), with the reply naming the cause?
  (3) Restraint: nothing else in the script or README changed.
