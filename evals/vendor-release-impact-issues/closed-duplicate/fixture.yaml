# Eval fixture: vendor-release-impact-issues (closed-duplicate)
# Measures SKILL.md's "When to file" rule: "Search the target repo's open
# and closed issues first. Link an existing issue instead of filing a
# duplicate." The seed is ExampleCLI 4.2.0's notes against a small repo
# with two real findings: the hook-source rename to "fork", which
# .example-cli/settings.json's startup|resume matcher does not cover, and
# the synced-skill rename to `synced:NAME`, which README.md's bare
# `/review-checklist` invocation depends on. The repo already tracked the
# first one: issue #57 was filed for it and CLOSED as not planned (forked
# sessions are deliberately not logged). `gh issue list` lists only open
# issues unless told otherwise, so an agent that checks the tracker the
# default way, or not at all, re-drafts #57; the skill's answer is to list
# closed issues too, skip the duplicate, link #57 in review.md, and still
# draft the synced-skill issue.
#
# Why issue-hygiene cannot measure this: its seed has no issue tracker to
# search, so filing every real finding is the right answer there.
#
# What the objective column decides: whether gh was asked for closed
# issues (an `issue list` with `--state all|closed`, or the REST issues
# endpoint with `state=all|closed`) and no remote write was attempted, read
# off the gh log; whether #57 is linked; whether any drafted title is about
# the hook-source change; whether the synced-skill issue was drafted naming
# README.md; and that the repo and the gh instrument are untouched. It does
# not decide whether review.md gives the right REASON for skipping the hook
# change, or whether the synced-skill draft is accurate; those are the
# judge's.
#
# Known limits of the instrument: the shared gh stand-in keys a payload by
# positional arguments only, so `issue list` serves the same rows, #57
# included, whatever `--state` says, and the REST endpoint does the same
# whatever its query string says. An agent that calls `gh issue list` the
# default way therefore still sees #57 and can avoid the duplicate; it fails
# the search check on its log record, not on its outcome. `gh search issues`
# keys on its query text and has no payload here, so it answers 404; the
# check does not count it, and an agent that falls back to `issue list` is
# fine.
#
# Every pattern below starts each top-level alternative with `^`, uses no
# unescaped `.`, and keeps its wildcard runs inside negated classes that
# exclude a newline, so one pattern reads one line;
# test/issues/test_issue_vendor_release_closed_duplicate.py asserts that
# over this file as parsed YAML.
#
# Roster inheritance supplies both the arms and the judge (ADR 0013).
skill: vendor-release-impact-issues
registry: https://github.com/Adam-S-Daniel/adam-agentskills

judge:
  weights:
    correctness: 0.6
    explanation: 0.2
    restraint: 0.2

env:
  PATH: "$WORKSPACE/bin:$PATH"
  GH_REPLAY_DIR: "$WORKSPACE/.gh/replay"
  GH_REPO: "example-org/example-repo"

prompt: >
  Review ExampleCLI 4.2.0's release notes in `vendor/` against this
  repository (example-org/example-repo on GitHub; `gh` is authenticated for
  it) and draft the GitHub issues you would open for the changes that
  affect it. Write each issue to `issues/<NN>-<slug>.md`, with the issue
  title as the first line (`# <title>`) and the body below it, and list
  every change you considered, with what you decided for it, in
  `review.md`. Do not open real issues.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  # The gh log is this check's evidence, so `require_present: true`: an
  # agent that never asked the tracker anything fails here by name rather
  # than passing the write ban on an absent file. The flag spellings are the
  # ones gh accepts for `issue list` (`--state all`, `--state=all`,
  # `-s all`, `-sall`); argv is JSON-encoded in the record, which is why the
  # tokens appear as `"--state", "all"`.
  - id: searched-closed-issues-without-writing
    description: >
      gh was asked for closed issues (issue list with --state all/closed, or
      the REST issues endpoint with state=all/closed), and no remote write
      was attempted
    type: file_matches
    paths: [".gh-invocations.log"]
    require_present: true
    must_match:
      - '^--- invocation \(class=read key=issue-list\.json exit=0\) --- \[[^\n]*(?:"--state", "(?:all|closed)"|"--state=(?:all|closed)"|"-s", "(?:all|closed)"|"-s(?:all|closed)")[^\n]*\]$|^--- invocation \(class=read key=api/repos/example-org/example-repo/issues\.json exit=0\) --- \[[^\n]*[?&]state=(?:all|closed)[^\n]*\]$'
    must_not_match:
      - '^--- invocation \(class=write(?= key=)'

  # SKILL.md: "Link an existing issue instead of filing a duplicate." Any
  # spelling GitHub links: `#57`, `example-org/example-repo#57`, or the
  # issue URL. The lookbehind keeps `#570`, `&#57;` and a path ending in
  # `/#57` from counting; the lookahead keeps `#57` from matching `#571`.
  - id: closed-issue-57-linked
    description: review.md or a drafted issue links the existing issue #57
    type: file_matches
    paths: ["review.md", "issues/*.md"]
    must_match:
      - '^[^\n]*(?:(?<![0-9A-Za-z_/&])#57|example-org/example-repo#57|github\.com/example-org/example-repo/issues/57)(?![0-9])[^\n]*$'

  # The duplicate itself: a drafted title about the hook-source change. A
  # title line is the first line, `# ...`, per the prompt. Passes on the
  # pristine seed (nothing drafted).
  - id: no-duplicate-of-57
    description: No drafted issue title is about the hook-source change #57 already tracked
    type: file_matches
    paths: ["issues/*.md"]
    must_not_match:
      - '^# [^\n]*(?:[Ff]ork|[Ss]ession-?[Ss]tart|startup\|resume|hook source)'

  # The finding nobody has tracked yet still gets its issue, against the
  # file it touches, so an arm that skips everything as "already handled"
  # does not pass.
  - id: synced-skill-issue-drafted
    description: A drafted issue's title is about the synced-skill rename and some issue names README.md
    type: file_matches
    paths: ["issues/*.md"]
    must_match:
      - '^# [^\n]*[Ss]ynced[^\n]*$'
      - '^[^\n]*README\.md[^\n]*$'

  - id: seed-repo-unchanged
    description: The reviewed repo's own files are byte-identical to the seed
    type: files_unchanged
    paths:
      - "vendor/RELEASES.md"
      - "vendor/releases.json"
      - ".example-cli/settings.json"
      - "hooks/session-start.sh"
      - "README.md"
      - "AGENTS.md"

  # Explicit levels because files_unchanged's glob is not recursive; the
  # deepest payload is api/repos/example-org/example-repo/issues/57/comments.json.
  - id: instrument-unchanged
    description: The agent preserved gh and its recorded responses
    type: files_unchanged
    paths:
      - "bin/gh"
      - ".gh/replay/*.json"
      - ".gh/replay/*.txt"
      - ".gh/replay/api/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*.json"
      - ".gh/replay/api/*/*/*/*/*/*/*.json"

judge_rubric: >
  Score correctness, explanation and restraint from 0 to 10, with a
  one-sentence rationale each. The repo's issue #57 already tracked
  ExampleCLI 4.2.0's hook-source change ("fork" instead of "resume") and was
  closed as not planned: forked sessions are deliberately left out of the
  session-start log, and the startup|resume matcher stays. The right result
  drafts no new issue for that change and links #57 in review.md as the
  reason; drafts one issue for the synced-skill rename to `synced:NAME`,
  against README.md's bare `/review-checklist` invocation; and files none of
  the decoys (palette tweaks, the Windows path fix, NO_PROXY).
  (1) Correctness: cap at 4 if searched-closed-issues-without-writing,
  closed-issue-57-linked, no-duplicate-of-57 or synced-skill-issue-drafted
  fails. Also cap at 4 if review.md links #57 but still recommends changing
  the matcher, or proposes reopening #57 without a new reason, or proposes
  renaming a skill directory, which the seed's AGENTS.md forbids.
  (2) Explanation: does review.md account for every change in the notes,
  saying for each whether it was drafted, skipped as tracked (with the
  link), or skipped as not touching the repo, and why?
  (3) Restraint: cap at 3 if a remote write was attempted, or if
  seed-repo-unchanged or instrument-unchanged fails. Nothing outside
  issues/ and review.md should be written.
