# Eval fixture: github-actions-sha-pinning
# Measures whether the github-actions-sha-pinning skill improves an agent's
# ability to bring a repo's `uses:` pins into line with the fleet policy:
# every third-party action goes to a bare full 40-character commit SHA with
# NO trailing version comment, while a cross-repo reference to this account's
# own cms-platform (a reusable workflow OR a composite action) stays on its
# release TAG instead. Resurrects the retired `pin-actions-to-sha` instrument
# (see DESIGN.md's "Reference eval" section) and retargets it at the skill
# that survived cms-platform's 2026-08-20 comment-convention reversal.
#
# WHICH SCOPE CASE THIS SEED EXERCISES (review #133, S4): the skill's own
# "Scope" section names two shapes — cms-platform itself (third-party
# actions only, no cross-repo cms-platform ref ever fires) and a full
# CONSUMER (adamdaniel.ai / jodidaniel.com), where "there is nothing in a
# consumer for Rule 1 to fix" because every `uses:` targets cms-platform on
# its tag and none is third-party. This seed is neither: it is the THIRD
# shape the fleet actually has — cms-platform's own AGENTS.md notes "ten
# repos call a cms-platform reusable; only the two consumers have a
# platform.lock, a gem and a pin-consistency gate" (the #283 section). A
# repo in that wider set calls one cms-platform reusable workflow
# (deploy.yml) and one cms-platform composite action (the gate action) on
# their release tag, exactly like a consumer — but carries no `platform.lock`
# and is free to run its own CI with real third-party actions (ci.yml),
# which a full consumer never does. A with-skill arm that read the Scope
# section as "this is a consumer, there's nothing to fix" would wrongly
# leave ci.yml's third-party pins alone; this seed is shaped so that
# reading is wrong.
#
# One more gap this header should name (review round 2, N7): the skill's own
# Scope section states it ships, today, only to cms-platform and the two
# named consumers via their `skills.lock` — nothing installs it in this
# wider ten-repo set for real. The with_skill arm runs it here anyway (the
# harness's `install: copy` puts the skill in whatever workspace it is
# given), so this fixture tests whether the skill's stated rules generalize
# correctly to a repo shape its own Scope section doesn't name — it is not
# asserting that the skill is actually installed there in the real fleet.
#
# Left to the harness lane, not this fixture (review round 5, N7): two
# pre-existing gaps in harness/scorers/objective.py that predate this PR and
# are out of this fixture's scope to close — `_workflow_uses` (reached only
# by `non_remote_refs_unchanged`, unused by any check here) still raises
# `IsADirectoryError` on a directory match, and `run_checks` has no
# per-check `try/except`, so one check raising would abort the whole run
# rather than reporting that one check as failed.

skill: github-actions-sha-pinning
registry: https://github.com/Adam-S-Daniel/cms-platform

# Agent arms run on a pinned mid-tier model, deliberately NOT Opus-tier: an
# Opus-tier agent would likely ace this task WITHOUT the skill, and a ceiling
# effect leaves the with/without comparison signal-free. Pinning also stops
# the arms silently tracking Claude Code's default model as it changes across
# CLI releases, which is what makes week-over-week badge comparisons
# meaningful. `--model` on the command line overrides this.
model: claude-sonnet-5

# The judge is pinned to a strong model: judgment consistency matters more
# than agent-arm parity, and two short judge calls per run cost pennies.
judge:
  model: claude-opus-5
  # Weighted overall — the harness recomputes it from these and ignores the
  # judge's own arithmetic. Carve-out handling carries the correctness axis
  # (the fixture's whole reason for existing is the one shape a naive
  # "pin everything" pass gets wrong), so it outweighs the other two.
  #
  # These keys must equal the dimension NAMES the judge returns:
  # `_weighted_overall` matches on the casefolded name, so `carve_out`
  # against a rubric labelled "Carve-out handling" matched nothing and that
  # dimension (and `comment_removal`, against "Comment removal") silently
  # kept weight 1.0 — only `restraint` applied, measuring 6.52 where these
  # weights actually intend 6.80. The rubric below labels its dimensions
  # with exactly these strings and says to use them verbatim.
  weights:
    carve_out: 0.4
    comment_removal: 0.3
    restraint: 0.3

prompt: >
  Bring this repo's action pins into line with the pinning policy.

arms:
  with_skill:
    # The harness copies the flat skills/github-actions-sha-pinning/ dir
    # (cms-platform's registry layout, see harness/registries.yml) into
    # .claude/skills/github-actions-sha-pinning/.
    install: copy
  without_skill:
    install: none          # same prompt, no skill

# Objective checks run by harness/scorers/objective.py against the resulting
# workspace. Each check has an id, a description, and a type the scorer knows.
objective_checks:
  - id: third-party-actions-sha-pinned
    description: >
      Every third-party `uses:` ref in ci.yml is a full 40-character commit
      SHA — not a tag, not an abbreviated SHA. A cms-platform ref landing in
      ci.yml (this check is scoped to ci.yml only) is exempted by
      `platform_prefix`, the same way `pins_match_reference` below is
      exempted: it stays on its release tag, and staying there is
      `cms-platform-refs-stay-on-tag`'s business, checked separately over
      paths that include this file.
    type: uses_refs_sha_pinned
    paths: [".github/workflows/ci.yml"]
    platform_prefix: "Adam-S-Daniel/cms-platform/"

  - id: third-party-pins-match-pins-md
    description: >
      Every action PINS.md lists is pinned in ci.yml to exactly the SHA
      PINS.md's table gives it for that action — not merely a well-formed
      40-character hex value. PINS.md is the only offline source of truth
      here, so a plausible-looking invented SHA must fail even though it
      passes the shape check above; and an action missing its `uses:` line
      entirely (e.g. a stub reduced to a comment naming it) must fail too,
      not pass vacuously.
      # platform_prefix excludes a cms-platform ref from this check's
      # closure leg (round 4, N4, see the sibling cms-platform-refs-stay-
      # on-tag check's own note below): PINS.md is a third-party ledger, and
      # a platform ref staying on its tag is that check's business, not
      # this one's — an agent that moves the platform ref into whichever
      # file this check scans must not be failed twice for one carve-out.
    type: pins_match_reference
    paths: [".github/workflows/ci.yml"]
    reference: "PINS.md"
    platform_prefix: "Adam-S-Daniel/cms-platform/"

  - id: no-trailing-comments
    description: >
      No `uses:` line anywhere carries a trailing comment (e.g. "# v4.1.0")
      — the fleet rule is "nothing after it", reversed 2026-08-20, see the
      skill's Rule 2. Applies fleet-wide, including a cms-platform ref
      pinned by tag.
    type: pin_comment_absent
    paths: [".github/workflows/*.yml", ".github/workflows/*.yaml",
           ".github/actions/*/action.yml", ".github/actions/*/action.yaml"]

  - id: cms-platform-refs-stay-on-tag
    description: >
      The carve-out: a cross-repo reference to this account's own
      cms-platform — the reusable-workflow call in deploy.yml, the
      composite-action call in the gate action, and every `platform_ref:`
      value carrying the same version literal — stays pinned to the release
      tag `v0.1.104` and must NOT be converted to a SHA, nor skewed to a
      different tag. Checked structurally (every `uses:` value node naming
      cms-platform, and every `platform_ref:` value node, compared to the
      tag literal by parsed value) rather than by regex over raw text, so a
      stale `# was ...v0.1.104` comment left above a drifted live value
      cannot satisfy it, and quoting/spacing around a correct value cannot
      defeat it. `platform_ref:` is matched at any key depth (e.g. under
      `env:`, or inside a `matrix: include:` entry), not just directly under
      a job's `with:` — deliberately kept broad, since the input is a
      version literal wherever it appears, not only in the one shape this
      seed happens to use. A `platform_ref:` key bound to an input
      DECLARATION rather than a version value (a composite's own
      `inputs: {platform_ref: {...}}` block) is a MappingNode, not a
      scalar, and is skipped rather than compared — only a scalar value is
      ever a version literal to check.
      # min_refs is a VALUE guard, not a file-existence guard (round 6, F1):
      # it asserts the platform refs found across these paths were not
      # stripped out of files that exist, so "every platform ref found is on
      # the tag" cannot pass vacuously by finding zero refs where content was
      # quietly gutted or a cms-platform ref was routed to a local `./`
      # path. It is a FUNGIBLE floor across all of this check's `paths`,
      # though: a count of at least 2 satisfied by two refs in deploy.yml
      # alone, or one in deploy.yml and one in the gate action, or one in
      # ci.yml and one in the gate action, all pass it equally — a third
      # correctly tag-pinned platform ref elsewhere still passes too, it is
      # a floor, not an exact count. That fungibility means it CANNOT prove
      # any ONE file still exists: deleting the gate action entirely while
      # deploy.yml happens to carry two distinct platform refs clears this
      # floor with nothing left in the gate action at all. Whether a
      # specific file was deleted is decided by an existence tripwire on
      # that file instead, never by this count — see
      # `deploy-workflow-not-deleted` and `gate-action-not-deleted` below,
      # each a `file_matches` guard in the same shape as
      # `ci-workflow-not-deleted`, one per file. `platform_ref:` values are
      # not counted here, since a min_refs miscount on a value that has no
      # fixed cardinality (an agent may add or drop `with:` blocks freely)
      # would be its own false positive.
    type: platform_refs_on_tag
    paths: [".github/workflows/ci.yml", ".github/workflows/deploy.yml",
           ".github/actions/*/action.yml", ".github/actions/*/action.yaml"]
    # paths names deploy.yml literally, with no `.yaml` counterpart: a
    # rename to deploy.yaml stops THIS check from seeing that file's
    # platform ref(s) at all, and a stray SHA or skewed tag left behind by
    # such a rename would go unpoliced here too. The gate composite is
    # different (round 7, N2, corrected): its glob already covers both
    # spellings (`.github/actions/*/action.yml` and `.../action.yaml`), so
    # renaming action.yml to action.yaml does NOT hide its ref from this
    # check — the carve-out still finds and validates it. Either rename
    # DOES fail its own file_matches existence tripwire, though
    # (`deploy-workflow-not-deleted` / `gate-action-not-deleted`), since
    # each names its one literal filename, no glob. Nor is a brand NEW
    # workflow file (say `release.yml`), outside these literal paths
    # entirely: a cms-platform ref SHA-pinned there is not policed
    # objectively either (round 6, N4) — pre-existing, and left to the
    # judge's restraint dimension, same as the deploy.yml rename case.
    #
    # ci.yml is one of these paths too (S1(a), round 6, N2): an
    # expression-valued `platform_ref: ${{ inputs.platform_ref }}` written
    # into ci.yml now fails this check — a ScalarNode whose literal text
    # isn't `v0.1.104` — where before ci.yml was added here it passed
    # unseen. A genuine `inputs: {platform_ref: {...}}` DECLARATION in
    # ci.yml is still correctly skipped by the scalar guard documented
    # above, exactly as in the gate action.
    platform_prefix: "Adam-S-Daniel/cms-platform/"
    tag: "v0.1.104"
    min_refs: 2

  - id: local-and-docker-refs-untouched
    description: >
      lint.yml's local (./) and docker:// refs have nothing to pin and must
      be left byte-identical to the seed.
    type: files_unchanged
    paths: [".github/workflows/lint.yml"]

  - id: reference-files-untouched
    description: >
      PINS.md is input/reference material, not something the fix touches.
    type: files_unchanged
    paths: ["PINS.md"]

  - id: ci-workflow-not-deleted
    description: >
      ci.yml still exists and still carries the four actions it started
      with (actions/checkout, actions/setup-node, actions/upload-artifact,
      actions/cache) — otherwise every glob-driven check above passes
      vacuously against a deleted file. The id names the common cause
      (deletion), not the only one: an edit that leaves the file in place
      but strips one of the four names (e.g. folding a step into another
      job under a different action) fires this same tripwire.
    type: file_matches
    paths: [".github/workflows/ci.yml"]
    must_match:
      - "actions/checkout"
      - "actions/setup-node"
      - "actions/upload-artifact"
      - "actions/cache"

  - id: deploy-workflow-not-deleted
    description: >
      Certifies exactly one thing: deploy.yml is present and its text still
      names the cms-platform reusable workflow it calls. `min_refs` on
      `cms-platform-refs-stay-on-tag` is a fungible floor across ALL of
      that check's paths (round 6, F1), so it alone cannot prove THIS file
      wasn't deleted if enough platform refs survive elsewhere to clear it;
      this is an existence tripwire on deploy.yml specifically, the same
      shape as `ci-workflow-not-deleted`. The single `must_match` token
      (round 7, F1) is the repo path up to and excluding `@`, matched
      case-insensitively (`(?i)`, since a GitHub owner/repo path is
      case-insensitive — see `cms-platform-refs-stay-on-tag`'s own
      case-folding note). It is deliberately just the one token: it never
      constrains anything a correct audit may edit — a job key (renaming
      `e2e:` to `end-to-end:`), a `with:` block (dropping `platform_ref:`
      from it), the owner's letter case on the tag — none of those change
      what file this is or whether it still calls cms-platform. The match
      is lexical, not structural: a comment carrying the path satisfies it
      too. That's by design — the carve-out check (`cms-platform-refs-stay-
      on-tag`), which reads the composed YAML tree, is what certifies the
      LIVE value; this tripwire only certifies presence. And the id names
      the common cause (deletion), not the only one: the same failure
      fires when the file exists but the reusable-workflow call is edited
      out (stubbed to a plain run step, or its ref routed to a local `./`
      path).
    type: file_matches
    paths: [".github/workflows/deploy.yml"]
    must_match:
      - "(?i)Adam-S-Daniel/cms-platform/.github/workflows/e2e-tests.yml"

  - id: gate-action-not-deleted
    description: >
      Certifies exactly one thing: the gate action's action.yml is present
      and its text still names the cms-platform composite it wraps — same
      reasoning as `deploy-workflow-not-deleted`: `min_refs` cannot prove
      this directory wasn't deleted if deploy.yml's refs alone clear the
      floor. The single `must_match` token (round 7, F1) is the repo path
      up to and excluding `@`, matched case-insensitively for the same
      reason as the deploy tripwire; it never constrains a job key, a
      `with:` block, or the owner's letter case, only that this file exists
      and still carries its cms-platform call — the lexical/structural
      split is the same as `deploy-workflow-not-deleted`'s. The id names
      the common cause (deletion), not the only one: it also fires when the
      file exists but the composite's cross-repo ref is routed to a local
      `./` path instead.
    type: file_matches
    paths: [".github/actions/gate/action.yml"]
    must_match:
      - "(?i)Adam-S-Daniel/cms-platform/.github/actions/recursion-gate"

  # N5 (round 7): no must_match token beyond the repo path is bound by a
  # test on either tripwire above — the list is kept to exactly that one
  # token because every additional token these two used to carry
  # (`platform_ref:`, `e2e:`, `runs:`) constrained an edit a correct audit
  # is free to make, without adding any deletion coverage the repo-path
  # token didn't already supply on its own.

  - id: workflows-still-parse
    description: All workflow and composite-action files still parse as YAML
    type: yaml_parses
    paths: [".github/workflows/*.yml", ".github/workflows/*.yaml",
           ".github/actions/*/action.yml", ".github/actions/*/action.yaml"]

# Judge scoring: 3 dimensions, 0-10 each. What's objectively decidable above
# (SHA shape, comment absence, carve-out ref VALUE, and file restraint —
# deletion of ci.yml, deploy.yml, or the gate action is an existence
# tripwire per file, never left to a fungible count) is never left to the
# judge; it grades only what genuinely needs judgment.
judge_rubric: >
  Score 0-10 on each of exactly three dimensions, with a one-sentence
  rationale per dimension. Name them in your JSON with exactly these strings,
  lower-case and underscored: carve_out, comment_removal, restraint.
  (1) carve_out — did the agent correctly leave BOTH cms-platform refs (the
  reusable-workflow call and the composite-action call) on their release tag
  rather than resolving them to a SHA, and explain why they are different
  from the third-party actions it did pin? Cap this dimension at 4 if either
  cms-platform ref was converted to a SHA — that is not a partial success, it
  breaks cms-platform's pin-consistency lint and platform-bump's rewrite, per
  the skill.
  (2) comment_removal — did the agent strip the pre-existing trailing version
  comment rather than leaving it or "fixing" it to match the new SHA, and
  avoid adding a NEW version comment on any ref it pinned?
  (3) restraint — did the agent leave the local/docker refs and PINS.md
  alone, and avoid touching files or workflows the prompt didn't call for?
  (The 7-day cooling-off rule governs adopting a NEW release, which this
  fixture's pins already are — a response that raises it as a consideration
  when picking versions is a restraint signal, not a requirement graded
  elsewhere.)
