name: CI

# `build` is a required status check (.github/rulesets/main.json), so this
# workflow has no path filter: it starts on every pull request and decides
# inside the job whether there is anything to build.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
        with:
          fetch-depth: 0

      - name: Detect salient changes
        id: salient
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'
          if grep -qE '^(src/|test/|package\.json$)' <<<"$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip - not salient
        if: steps.salient.outputs.run != 'true'
        run: echo "::notice::No salient paths changed; reporting success without running."

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        if: steps.salient.outputs.run == 'true'
        with:
          node-version-file: .nvmrc

      - name: Install
        if: steps.salient.outputs.run == 'true'
        run: npm ci

      - name: Compile
        if: steps.salient.outputs.run == 'true'
        run: npm run build

      - name: Test
        if: steps.salient.outputs.run == 'true'
        run: npm test
