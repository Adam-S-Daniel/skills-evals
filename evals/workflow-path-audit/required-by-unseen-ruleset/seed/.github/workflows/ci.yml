name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "test/**"
      - "eslint.config.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22
      - run: npm ci
      # eslint reads eslint.config.js from the repository root.
      - run: npm run lint

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
