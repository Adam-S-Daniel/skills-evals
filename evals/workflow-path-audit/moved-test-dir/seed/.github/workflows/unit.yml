name: Unit tests

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/unit/**"
      - "package*.json"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/unit/**"
      - "package*.json"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:unit
