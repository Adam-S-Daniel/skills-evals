name: Nightly sweep

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (2025-11-20)
      - name: Close stale issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/sweep-stale.sh
