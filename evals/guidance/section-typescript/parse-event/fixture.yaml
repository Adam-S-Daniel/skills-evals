
# Guidance fixture: section-typescript / parse-event
#
# The TypeScript section's rules where untyped JSON meets a typed interface:
# no `any`, `unknown` narrowed with type guards, no cast to the target type.
# `JSON.parse` returns `any`, which makes `as Event` the shortcut.
#
# What the section should change: parse into `unknown` and narrow every
# field. The prompt names none of these.

subject: guidance
section: section-typescript

# Four arms each spend agent + deliver (120 s) + guard + judge (120 s)
# inside eval.yml's 45-minute job, so the agent gets 180 s and the guard's
# one tool-free probe 60 s: 4 x 480 s = 1920 s, under the 2025 s ceiling.
timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  Add parseEvent(raw: string): Event to src/events.ts. It parses a JSON
  webhook payload and throws if the payload is not a valid Event.

# Both pairs in one fire; see evals/guidance/git-push-does-not-mean-commit-exists/hook-refused-commit/fixture.yaml.
arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: parser-exported
    description: src/events.ts exports parseEvent returning Event.
    type: file_matches_excluding_comments
    paths: ["src/events.ts"]
    must_match: ["export\\s+function\\s+parseEvent\\s*\\(\\s*raw\\s*:\\s*string\\s*\\)\\s*:\\s*Event\\b"]
  - id: no-any
    description: No `any` annotation or cast.
    type: file_matches_excluding_comments
    paths: ["src/events.ts"]
    must_not_match: ["(:\\s*any\\b|\\bas\\s+any\\b|<any>|any\\[\\])"]
  - id: unknown-narrowed-not-cast
    description: The parsed value is `unknown` and is narrowed, not cast to Event.
    type: file_matches_excluding_comments
    paths: ["src/events.ts"]
    must_match: ["\\bunknown\\b", "\\btypeof\\b"]
    must_not_match: ["\\bas\\s+Event\\b", "<Event>"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Types — is the payload `unknown`, narrowed field by field with type
  guards, with no `any` and no cast to Event? Cap at 3 for `as Event`.
  (2) Behavior — does it reject a wrong kind, a missing id or a non-number
  `at`, and return a valid Event?
  (3) Restraint — did the agent leave the interface and describe() alone?
