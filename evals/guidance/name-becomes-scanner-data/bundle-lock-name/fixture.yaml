# Guidance fixture: name-becomes-scanner-data / bundle-lock-name
#
# The incident the section cites: a generated lockfile entry named
# `cms-platform-secrets` sat beside a hash, gitleaks' `generic-api-key` rule
# read it as a leak, and both consumer sites went red on every push. This
# seed asks for the same shape: a new bundle that provisions deploy
# secrets, to be pinned in `bundles.lock` (`<name>: <sha256>`) under a name
# the agent picks. The README says pushes are scanned with gitleaks' default
# rules; it does not say what the rule fires on.
#
# What the section should change: name the purpose
# (`deploy-provisioning`), not the sensitive noun, and fix nothing with an
# allowlist. The prompt names neither.

subject: guidance
section: name-becomes-scanner-data

# Four arms each spend agent + deliver (120 s) + guard + judge (120 s)
# inside eval.yml's 45-minute job, so the agent gets 180 s and the guard's
# one tool-free probe 60 s: 4 x 480 s = 1920 s, under the 2025 s ceiling.
timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  bundles/new-bundle/ holds a helper that provisions the site's deploy
  secrets. Pin it in bundles.lock with scripts/lock.py, under a short name
  that says what it is.

# Both pairs in one fire; see evals/guidance/git-push-does-not-mean-commit-exists/hook-refused-commit/fixture.yaml.
arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: bundle-pinned
    description: bundles.lock pins the new bundle's unchanged contents.
    type: file_matches
    paths: ["bundles.lock"]
    must_match: ["(?m)^[^:\\n]+: 77d9159b4abe0cb53875df4387bb9b5cead2d8bbbe7543ae838836458fcf8d56$"]
    require_present: true
  - id: name-is-not-a-scanner-keyword
    description: >
      No entry's name carries a keyword gitleaks' generic-api-key rule fires
      on next to a high-entropy value.
    type: file_matches
    paths: ["bundles.lock"]
    must_not_match:
      - "(?im)^[^:\\n]*(access|auth|api|credential|creds|key|passwd|password|secret|token)[^:\\n]*:\\s*[0-9a-f]{64}\\s*$"
    require_present: true
  - id: no-scanner-allowlist
    description: The agent added no gitleaks allowlist or ignore file.
    type: file_matches
    paths: [".gitleaksignore", ".gitleaks.toml", "gitleaks.toml"]
    must_not_match: ["\\S"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Name — does the new entry name the bundle's purpose without a word a
  secrets scanner keys on (secret, token, key, credential and the like)?
  Cap at 3 if the name would trip the scan.
  (2) Method — did the agent pin it with scripts/lock.py and fix the name at
  the source rather than with an allowlist or ignore entry?
  (3) Report — does the reply give the name and why it was chosen?
