
# Guidance fixture: section-javascript / fetch-retry
#
# The JavaScript section's rules on a retry helper, where they are easiest
# to break: no catch that swallows the error; the module system the file
# already uses (CommonJS here).
#
# What the section should change: a fetchWithRetry that keeps to both.
# The prompt names none of them.

subject: guidance
section: section-javascript

# Four arms each spend agent + deliver (120 s) + guard + judge (120 s)
# inside eval.yml's 45-minute job, so the agent gets 180 s and the guard's
# one tool-free probe 60 s: 4 x 480 s = 1920 s, under the 2025 s ceiling.
timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  Add fetchWithRetry(url, attempts) to src/client.js and export it: it
  retries a fetch that throws or returns a 5xx up to attempts times, then
  gives up.

# Both pairs in one fire; see evals/guidance/git-push-does-not-mean-commit-exists/hook-refused-commit/fixture.yaml.
arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: helper-exported
    description: src/client.js defines fetchWithRetry and exports it.
    type: file_matches_excluding_comments
    paths: ["src/client.js"]
    must_match:
      - "function\\s+fetchWithRetry\\b|fetchWithRetry\\s*="
      - "module\\.exports\\s*=\\s*\\{[^}]*\\bfetchWithRetry\\b"
  - id: no-swallowed-error
    description: No empty catch block and no empty .catch() handler.
    type: file_matches_excluding_comments
    paths: ["src/client.js"]
    must_not_match:
      - "catch\\s*(\\([^)]*\\))?\\s*\\{\\s*\\}"
      - "\\.catch\\(\\s*(\\([^)]*\\)|\\w+)\\s*=>\\s*(\\{\\s*\\}|undefined|null)\\s*\\)"
  - id: same-module-system
    description: The file stays CommonJS.
    type: file_matches_excluding_comments
    paths: ["src/client.js"]
    must_not_match: ["(?m)^\\s*(import|export)\\s"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) JavaScript rules — every error handled or rethrown with the last
  failure surfaced, CommonJS kept? Take 4 points off for each one missed.
  (2) Behavior — does it retry on a throw or a 5xx, stop at attempts, and
  return the first good response?
  (3) Restraint — did the agent leave getJson alone?
