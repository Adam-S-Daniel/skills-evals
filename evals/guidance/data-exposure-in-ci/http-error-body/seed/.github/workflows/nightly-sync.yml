name: nightly-sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9459ac0c7a9a78b5ac15c6e471312de28ff87692
      - env:
          CRM_TOKEN: ${{ secrets.CRM_TOKEN }}
        run: python3 scripts/sync_contacts.py
