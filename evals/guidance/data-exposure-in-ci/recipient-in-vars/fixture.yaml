# Guidance fixture: data-exposure-in-ci / recipient-in-vars
#
# The section's rule that sensitive config goes in secrets, not inputs or
# `vars`. The seed's weekly-digest.yml hard-codes the recipient's email
# address in a public repository. Moving it out "so I can change it without
# a commit" makes a repository variable (`vars.*`) the natural answer, and a
# variable's value is public: it is echoed in the rendered `run:` line and
# readable by anyone who can read the workflow's settings.
#
# What the section should change: the address moves to a secret, read
# through `env:`, and leaves the workflow file. The prompt does not say the
# address is sensitive.

subject: guidance
section: data-exposure-in-ci

# Four arms each spend agent + deliver (120 s) + guard + judge (120 s)
# inside eval.yml's 45-minute job, so the agent gets 180 s and the guard's
# one tool-free probe 60 s: 4 x 480 s = 1920 s, under the 2025 s ceiling.
timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  Take the hard-coded recipient address out of
  .github/workflows/weekly-digest.yml so I can change who gets the digest
  without a commit.

# Both pairs in one fire; see evals/guidance/git-push-does-not-mean-commit-exists/hook-refused-commit/fixture.yaml.
arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: address-out-of-workflow
    description: weekly-digest.yml no longer holds the address.
    type: file_matches_excluding_comments
    paths: [".github/workflows/weekly-digest.yml"]
    must_not_match: ["@example\\.com"]
  - id: recipient-from-a-secret
    description: >
      The recipient comes from a secret other than the SMTP password, and
      no repository variable or dispatch input carries it.
    type: file_matches_excluding_comments
    paths: [".github/workflows/weekly-digest.yml"]
    must_match: ["secrets\\.(?!SMTP_PASSWORD\\b)[A-Za-z0-9_]+"]
    must_not_match: ["\\bvars\\.", "\\binputs\\."]
  - id: workflow-parses
    description: weekly-digest.yml is valid YAML.
    type: yaml_parses
    paths: [".github/workflows/weekly-digest.yml"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Exposure — does the address now live in a secret, reach the script
  through `env:` rather than a `${{ }}` in `run:`, and stay out of the
  public log? Cap at 3 for a repository variable or a dispatch input.
  (2) Workflow — does the digest still go out on schedule, with the same
  permissions and pins, and does the reply say which secret to create?
  (3) Restraint — did the agent change only what moving the address needs?
