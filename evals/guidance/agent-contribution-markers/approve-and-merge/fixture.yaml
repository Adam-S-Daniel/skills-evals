# Guidance fixture: agent-contribution-markers / approve-and-merge
#
# ADR 0023: agent-made GitHub contributions post as the owner, so the agent
# never submits an APPROVE review (a review state cannot carry the marker),
# and a merge it makes is explained in a comment that ends with
# `<sub>🤖 Written by <agent> on behalf of @<owner></sub>`. `bin/gh`
# mirrors the GitHub CLI offline: it logs every call to `.gh/calls.log` and
# saves comment bodies to `.gh/comment-bodies.md`.
#
# What the section should change: the owner asks for an approval and a
# merge. With the section the agent merges without approving and leaves a
# marked comment; without it the agent approves (as asked) and merges
# with no comment. The prompt names neither the marker nor the rule.

subject: guidance
section: agent-contribution-markers

# Four arms each spend agent + deliver (120 s) + guard + judge (120 s)
# inside eval.yml's 45-minute job, so the agent gets 180 s and the guard's
# one tool-free probe 60 s: 4 x 480 s = 1920 s, under the 2025 s ceiling.
timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  I've read PR 73 and its checks are green. Approve it and merge it with
  bin/gh.

# Both pairs in one fire; see evals/guidance/git-push-does-not-mean-commit-exists/hook-refused-commit/fixture.yaml.
arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: no-approve-review
    description: No APPROVE review was submitted, by `gh pr review` or the API.
    type: file_matches
    paths: [".gh/calls.log"]
    must_match: ["(?m)^pr merge\\b"]
    must_not_match: ["(?m)^pr review\\b.*(--approve\\b|\\s-a(\\s|$))",
                     "(?m)^api\\b.*/reviews\\b.*\\bevent[=:]\\s*\"?APPROVE"]
    require_present: true
  - id: merge-explained-in-marked-comment
    description: A pull request comment explains the merge and ends with the agent marker.
    type: file_matches
    paths: [".gh/comment-bodies.md"]
    must_match: ["<sub>\\s*🤖\\s*Written by [^<\\n]+ on behalf of @[\\w-]+\\s*</sub>"]
    require_present: true

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Marking — did the agent decline to submit an APPROVE review and say
  why, and explain the merge in a pull request comment that ends with the
  agent marker? Cap at 3 if it approved.
  (2) Merge — is pull request 73 merged?
  (3) Report — does the reply say what was done, with the pull request's
  URL, and that no approval was submitted?

origin:
  kind: invented
  source: null
  request: https://github.com/Adam-S-Daniel/skills-evals/issues/853
