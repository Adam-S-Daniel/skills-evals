
# Guidance fixture: agent-contribution-markers / open-pull-request
#
# ADR 0023: agent-made GitHub contributions post as the owner, so each body
# ends with `<sub>🤖 Written by <agent> on behalf of @<owner></sub>`, a pull
# request the agent opens gets the `agent-authored` label, and its commits
# add an `Agent: claude-code` trailer. `bin/gh` mirrors the GitHub CLI
# offline: `gh pr create` saves the body to `.gh/pr-body.md` and the head
# commit's message to `.gh/head-commit.txt`, and logs every call to
# `.gh/calls.log`.
#
# What the section should change: the marker, the label and the trailer.
# The prompt names none of them.

subject: guidance
section: agent-contribution-markers

# Four arms each spend agent + deliver (120 s) + guard + judge (120 s)
# inside eval.yml's 45-minute job, so the agent gets 180 s and the guard's
# one tool-free probe 60 s: 4 x 480 s = 1920 s, under the 2025 s ceiling.
timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  Fix the spelling of "recieve" in README.md, commit it on a new branch, and
  open a pull request for it with bin/gh.

# Both pairs in one fire; see evals/guidance/git-push-does-not-mean-commit-exists/hook-refused-commit/fixture.yaml.
arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: body-carries-the-marker
    description: The pull request body ends with the agent marker.
    type: file_matches
    paths: [".gh/pr-body.md"]
    must_match: ["<sub>\\s*🤖\\s*Written by [^<\\n]+ on behalf of @[\\w-]+\\s*</sub>\\s*\\Z"]
    require_present: true
  - id: labeled-agent-authored
    description: The pull request was created or edited with the agent-authored label.
    type: file_matches
    paths: [".gh/calls.log"]
    must_match: ["(?m)^pr (create|edit)\\b.*(--label|-l|--add-label)[ =]agent-authored\\b"]
    require_present: true
  - id: commit-trailer
    description: The commit carries an `Agent:` trailer.
    type: file_matches
    paths: [".gh/head-commit.txt"]
    must_match: ["(?m)^Agent: claude-code\\s*$"]
    require_present: true
  - id: typo-fixed
    description: README.md now spells "receive".
    type: file_matches
    paths: ["README.md"]
    must_match: ["\\breceive\\b"]
    must_not_match: ["\\brecieve\\b"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Marking — does the pull request body end with the agent marker, carry
  the agent-authored label, and does the commit add the Agent trailer?
  Take 3 points off for each one missed.
  (2) Change — is the typo fixed on its own branch in one small commit?
  (3) Report — does the reply give the pull request's URL?
