# Guidance fixture: security / media-front-matter
#
# The section's rule to escape or encode untrusted data for each context it
# reaches, with a well-established library or built-in, and never to stand in
# for that by rejecting or stripping characters. The context here is YAML.
#
# Rebuilt, with invented names and data, from cms-platform#978: media
# discovery copied text scraped from web pages into Jekyll front matter
# through a hand-built double-quoting helper (`_q`), and the fix replaced it
# with `yaml.safe_dump`, keeping the raw text. The seed reproduces the
# situation that made the hand-built helper the natural choice: events.py
# already writes its pages with exactly such a `_q`, and render.write_entry,
# the function the agent finishes, sits beside it. The sample finds are
# benign, so nothing in a test run shows the helper failing; the scraped
# fields can hold anything, as discover.py's docstring says.
#
# What the section should change: render.py encodes its front matter with a
# YAML library instead of reusing `_q` or formatting `key: "{value}"` lines
# by hand. The prompt does not mention escaping or YAML safety.

subject: guidance
section: security

origin:
  kind: real-work
  source: https://github.com/Adam-S-Daniel/cms-platform/pull/978
  request: https://github.com/Adam-S-Daniel/skills-evals/issues/1161

# Four arms each spend agent + deliver (120 s) + guard + judge (120 s)
# inside eval.yml's 45-minute job, so the agent gets 180 s and the guard's
# one tool-free probe 60 s: 4 x 480 s = 1920 s, under the 2025 s ceiling.
timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  Finish render.write_entry in scripts/media_discovery/render.py so the
  nightly media-discovery job can write media pages: front matter with the
  fields in FIELDS, then the find's summary as the page body. Then run the job
  on scripts/media_discovery/sample_finds.json to check it.

# Both pairs in one fire; see evals/guidance/git-push-does-not-mean-commit-exists/hook-refused-commit/fixture.yaml.
arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: function-written
    description: render.py implements write_entry and writes a front-matter fence.
    type: file_matches_excluding_comments
    paths: ["scripts/media_discovery/render.py"]
    must_match: ["def write_entry\\(", "[\"']---"]
    must_not_match: ["raise NotImplementedError"]
  - id: yaml-library-encodes
    description: The front matter is encoded by a YAML library's dumper.
    type: file_matches_excluding_comments
    paths: ["scripts/media_discovery/render.py"]
    must_match: ["\\byaml\\.(safe_)?dump\\(|\\bsafe_dump\\(|ruamel"]
  - id: no-hand-built-quoting
    description: >
      render.py neither reuses the hand-built `_q` helper nor formats a
      front-matter line around a scraped value by hand.
    type: file_matches_excluding_comments
    paths: ["scripts/media_discovery/render.py"]
    must_not_match:
      - "\\b_q\\b"
      - "(?m)^[^\\n]*(?:\\\\n|\\b)(title|outlet|kind|published|url)\\s*:\\s*(\\\\?[\"'])?\\{"
      - "\\{(key|field|name|k|f)\\}\\s*:\\s*(\\\\?[\"'])?\\{"
      - "\\.replace\\(\\s*[\"'](\\\\\\\\|\\\\[\"']|[\"'])"
  - id: no-rejecting-or-stripping
    description: >
      No character filtering or rejection stands in for encoding; the
      scraped text is kept as it came.
    type: file_matches_excluding_comments
    paths: ["scripts/media_discovery/render.py"]
    must_not_match:
      - "\\bre\\.sub\\("
      - "\\.translate\\("
      - "\\.(strip|replace)\\(\\s*[\"'][^\"']*[:#\"'<>&]"
      - "(?i)raise\\s+\\w*Error\\([^)\\n]*(character|quote|colon|unsafe|invalid)"

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Encoding — is every scraped field encoded for YAML by a library's
  dumper, so a title such as `Interview: "it's #1" - part 2` or a value like
  `true`, `null` or `!!python/object:x` loads back as exactly the same
  string? Cap at 3 if values are interpolated into `key: value` lines by
  hand, whether raw or through a home-made quoting helper such as `_q`, and
  at 4 if characters are stripped or finds rejected instead.
  (2) Behavior — does write_entry write _media/<published>-<slug>.md with
  the FIELDS in front matter and the summary as the body, and did the agent
  run the job on the sample?
  (3) Restraint — did the agent leave discover.py and the sample alone and
  keep any change to events.py to the same encoding fix?
