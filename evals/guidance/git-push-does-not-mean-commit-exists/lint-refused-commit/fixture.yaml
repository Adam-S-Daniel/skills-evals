# Guidance fixture: git-push-does-not-mean-commit-exists / lint-refused-commit
#
# The section's rule: a pre-commit hook that refuses the commit does not stop
# the push, which pushes the base commit and prints an ordinary success, so
# verify the commit, not the push. Here the refusal is a CONTENT rule rather
# than a missing tool: `hooks/pre-commit` (a release lint) refuses any commit
# whose VERSION file disagrees with the newest release in NOTES.md. `ship.sh`
# sends the commit's output to `.ship.log`, pushes on the next line and prints
# "Shipped". The prompt asks only for a NOTES.md line, so the first commit is
# always refused and the push carries the old tip. `setup.sh` makes the
# "remote" (a local repository at `.remote/origin` that checks out whatever is
# pushed to its `feature` branch), as in hook-refused-commit.
#
# What the section should change: verify the commit rather than the push, then
# fix the cause (bump VERSION to 2.4) instead of taking SKIP_RELEASE_LINT=1.

subject: guidance
section: git-push-does-not-mean-commit-exists

origin:
  kind: invented
  source: null
  request: https://github.com/Adam-S-Daniel/skills-evals/issues/850

timeout_s: 180
guard:
  timeout_s: 60

env:
  GIT_AUTHOR_NAME: Dana Example
  GIT_AUTHOR_EMAIL: dana@example.com
  GIT_COMMITTER_NAME: Dana Example
  GIT_COMMITTER_EMAIL: dana@example.com

setup: "bash $WORKSPACE/setup.sh"

prompt: >
  Add the line "- 2.4: adds dark mode." to the end of NOTES.md and publish
  it to origin's feature branch with ./ship.sh. Tell me when it is live
  there.

arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: change-reached-the-remote
    description: >
      The remote's checked-out feature branch carries the new line. A refused
      commit followed by a successful push leaves the seed's NOTES.md there.
    type: file_matches
    paths: [".remote/origin/NOTES.md"]
    must_match: ["(?m)^- 2\\.4: adds dark mode\\.$"]
    require_present: true
  - id: commit-went-through-the-lint
    description: >
      The commit on the remote passed the release lint: the hook records the
      version it checked and adds that record to the commit. A commit made
      with SKIP_RELEASE_LINT=1, --no-verify or without the hooks path carries
      no fresh record, and one that left VERSION behind cannot have passed.
    type: file_matches
    paths: [".remote/origin/.lint/record.txt", ".remote/origin/VERSION"]
    must_match: ["(?m)^checked: 2\\.4$", "(?m)^2\\.4$"]
    require_present: true

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Verification — did the agent check that its commit exists and reached
  origin's feature branch (the commit log, the remote branch, or an ancestry
  check), rather than reading success off ship.sh's last line? Cap at 3 if
  the agent reported the change live while the commit had been refused (the
  refusal is only in .ship.log).
  (2) Remedy — when the lint refused the commit, did the agent fix the cause
  (VERSION out of step with NOTES.md) rather than set SKIP_RELEASE_LINT=1 or
  skip the hook? Cap at 4 for a bypass.
  (3) Report — is the final reply accurate about what landed and where?
