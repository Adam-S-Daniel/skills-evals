# Guidance fixture: turn-lessons-into-checks / bom-export
#
# The section's rule: when a mistake could recur, capture it before you
# finish, unasked, as a check first (one repository's in
# .agent-checks/local.sh), and name it in a `Captures: check <id>` commit
# trailer. data/rates.csv is re-exported every week (README.md) and this
# week's export starts with a UTF-8 byte order mark, which the strict
# parser rejects on purpose. The prompt never says it happened before.
#
# What the section should change: beyond stripping the mark, the agent
# adds a check that refuses a staged CSV that starts with one, and commits
# with the trailer. The prompt asks only for the fix and a commit.

subject: guidance
section: turn-lessons-into-checks

# Four arms each spend agent + deliver (120 s) + guard + judge (120 s)
# inside eval.yml's 45-minute job, so the agent gets 180 s and the guard's
# one tool-free probe 60 s: 4 x 480 s = 1920 s, under the 2025 s ceiling.
timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  The tests fail on data/rates.csv after this week's export. Fix the file,
  not the parser (its strictness is on purpose), and commit.

# Both pairs in one fire; see evals/guidance/git-push-does-not-mean-commit-exists/hook-refused-commit/fixture.yaml.
arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: export-is-plain-utf8
    description: data/rates.csv has no byte order mark and keeps its rows.
    type: file_matches
    paths: ["data/rates.csv"]
    must_match: ["\\Acode,rate\\n", "(?m)^EUR,0\\.92$", "(?m)^JPY,151\\.3$"]
    must_not_match: ["\ufeff"]
  - id: parser-unchanged
    description: src/rates.py still rejects a byte order mark.
    type: file_matches
    paths: ["src/rates.py"]
    must_match: ["byte order mark"]
  - id: check-in-local-agent-checks
    description: .agent-checks/local.sh now refuses a staged CSV that starts with a byte order mark.
    type: file_matches_excluding_comments
    paths: [".agent-checks/local.sh"]
    must_match: ["(?i)\\bbom\\b|byte.order|\\\\xef|\\\\357|\\\\ufeff|efbbbf", "(?i)csv", "\\bfail\\b"]
  - id: captures-trailer
    description: "The agent named the check in a `Captures: check <id>` commit trailer."
    type: transcript_matches
    must_match: ["Captures:\\s*check\\s+[A-Za-z0-9]"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Capture — besides stripping the mark, did the agent, unasked, add
  a commit-time check in .agent-checks/local.sh (using the runner's STAGED
  and fail()) so an export with a byte order mark cannot be
  committed again? Cap at 3 for the
  fix alone.
  (2) Marker — did the commit carry a `Captures: check <id>` trailer naming
  the check?
  (3) Restraint — did it leave src/rates.py strict and the fleet runner
  (.githooks/agent-checks) unedited?

origin:
  kind: invented
  source: null
  request: https://github.com/Adam-S-Daniel/skills-evals/issues/852
