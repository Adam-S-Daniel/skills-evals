# Guidance fixture: git-practices / merge-method-and-closing-keyword
#
# Two of the section's rules, each from a cited incident: merge with a merge
# commit (squash strands commits a lockfile pins by sha, 2026-08-15), and a
# closing keyword before `#N` in any commit message closes it (cms-platform
# #283). `bin/gh` is an offline stand-in for the GitHub CLI on one approved,
# green pull request whose repository allows merge commits only, as the
# fleet's do: `--squash` and `--rebase` fail the way GitHub refuses them.
# Every call, with its subject and body, is appended to `.gh/calls.log`.
#
# What the section should change: merge with `--merge` the first time, and
# mention the issue that stays open without a closing keyword. The prompt
# names neither rule.

subject: guidance
section: git-practices

# Four arms each spend agent + deliver (120 s) + guard + judge (120 s)
# inside eval.yml's 45-minute job, so the agent gets 180 s and the guard's
# one tool-free probe 60 s: 4 x 480 s = 1920 s, under the 2025 s ceiling.
timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  PR 7 in example-org/widgets is approved and green; merge it with bin/gh.
  It is one step of issue #12, which still has work left, so mention #12 in
  the merge commit.

# Both pairs in one fire; see evals/guidance/git-push-does-not-mean-commit-exists/hook-refused-commit/fixture.yaml.
arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: merged-with-a-merge-commit-first-time
    description: >
      A merge was asked for with --merge (or -m), and no merge call ever
      asked for a squash or a rebase.
    type: file_matches
    paths: [".gh/calls.log"]
    must_match: ["(?m)^pr merge\\b.*(--merge|\\s-m)(\\s|$)"]
    must_not_match: ["(?m)^pr merge\\b.*(--squash|--rebase|\\s-s(\\s|$)|\\s-r(\\s|$))"]
    require_present: true
  - id: issue-mentioned-without-closing-it
    description: >
      A merge call mentions #12, and none puts a closing keyword (close,
      fix, resolve and their forms) before it, which would close the issue
      on merge.
    type: file_matches
    paths: [".gh/calls.log"]
    must_match: ["(?m)^pr merge\\b.*#12\\b"]
    must_not_match: ["(?i)\\b(close[sd]?|fix(e[sd])?|resolve[sd]?)\\b[:\\s]+(#12|https://github\\.com/example-org/widgets/issues/12)\\b"]
    require_present: true

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Merge method — did the agent merge with a merge commit, without first
  trying or offering a squash or a rebase? Cap at 4 if it tried one.
  (2) Issue state — does the merge commit mention #12 in a way that leaves
  it open, and did the agent check or say that #12 stays open? Cap at 2 if a
  closing keyword precedes #12.
  (3) Report — is the final reply accurate about what was merged and how?
