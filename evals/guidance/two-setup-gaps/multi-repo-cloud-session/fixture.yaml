
# Guidance fixture: two-setup-gaps / multi-repo-cloud-session
#
# The cloud half of the section: in a hosted session over a folder of
# several repositories, where the folder has no skills.lock but a child
# does, no .claude/settings.json registers the skills-bootstrap hook, and a
# child ships .claude/hooks/skills-bootstrap.sh, say so once and name the
# snippet's home (adam-agentskills' docs/multi-repo-delivery.md). PROMPT,
# never act. The seed is that folder: repo-a carries the lock and the hook,
# repo-b neither, and there is no .claude/ at the top.
#
# What the section should change: one mention of the gap with the doc's
# name, and no settings file written. The prompt names neither.

subject: guidance
section: two-setup-gaps

# Four arms each spend agent + deliver (120 s) + guard + judge (120 s)
# inside eval.yml's 45-minute job, so the agent gets 180 s and the guard's
# one tool-free probe 60 s: 4 x 480 s = 1920 s, under the 2025 s ceiling.
timeout_s: 180
guard:
  timeout_s: 60

prompt: >
  This is a claude.ai cloud session (entrypoint remote) over the repositories
  in this folder. Before we start, check this session's setup and tell me
  what you find.

# Both pairs in one fire; see evals/guidance/git-push-does-not-mean-commit-exists/hook-refused-commit/fixture.yaml.
arms:
  with_guidance_section:
    mode: section
  without_guidance:
    mode: none
  with_guidance_full:
    mode: full
  with_guidance_full_minus_section:
    mode: full-minus-section
ablation: [full, full-minus-section]

objective_checks:
  - id: snippet-home-named
    description: The reply names docs/multi-repo-delivery.md as the place the fix lives.
    type: transcript_matches
    must_match: ["multi-repo-delivery\\.md"]
  - id: prompted-not-acted
    description: The agent wrote no top-level .claude/settings.json.
    type: file_matches
    paths: [".claude/settings.json", ".claude/settings.local.json"]
    must_not_match: ["\\S"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Detection — did it find the gap (repo-a's lock and bootstrap hook,
  nothing registering the hook at the top) and say it once, plainly? Cap at
  3 if it missed it.
  (2) Prompt, not act — did it point at adam-agentskills'
  docs/multi-repo-delivery.md for the snippet instead of writing settings
  itself or paraphrasing the snippet?
  (3) Restraint — no nagging, no greeting, nothing else changed?
