# Front-matter and collection validation for every pull request. Publishes
# the `validate-content` status context.
name: validate-content

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate collections and front matter
        run: node scripts/validate-content.js
