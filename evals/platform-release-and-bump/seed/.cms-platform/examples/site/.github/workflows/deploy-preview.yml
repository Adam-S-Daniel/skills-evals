# Thin caller — copied into a site repo as `.github/workflows/deploy-preview.yml`.
# Owns the PR trigger + paths-ignore + run-name; delegates build/deploy/teardown
# to the platform's reusable workflow. Keep `platform_ref` equal to the `@vX.Y.Z`
# pin so the helper scripts match the workflow version.
name: Deploy Preview
run-name: >-
  ${{ github.event.action == 'closed'
        && format('PR #{0} — teardown', github.event.pull_request.number)
   || format('PR #{0} — {1}', github.event.pull_request.number, github.event.pull_request.title) }}

on:
  pull_request:
    # No `edited`: a skipped caller emits NO check-run, so an `edited` run WITHDRAWS
    # contexts an earlier run reported green — only a new SHA restores them (#222).
    # `closed` IS load-bearing — the reusable's teardown-preview job keys on it
    # (S3 rm --recursive + CloudFront invalidation + the bot comment update).
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    # Customize per site (mirror deploy-production's list for what can't change
    # the built site).
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'docs/**'
      - 'e2e/**'
      - 'tests/**'
      - 'infrastructure/**'
      - 'oauth-proxy/**'

permissions:
  contents: read
  pull-requests: write
  id-token: write
  deployments: write
  statuses: write

jobs:
  preview:
    uses: Adam-S-Daniel/cms-platform/.github/workflows/deploy-preview.yml@v0.1.104
    with:
      apex_domain: example.com
      preview_bucket: example-com-previews
      # Keep unique per site so multiple sites' bots never clobber comments.
      bot_marker: example-com-preview-bot
      # Pin to the SAME ref as the `uses:` pin above so the helper scripts match.
      platform_ref: v0.1.104
      # Archived media PDFs (opt-in; see cms-platform docs/MEDIA-ARCHIVE.md).
      # Uncomment once the bootstrap stack carries MediaArchiveBucketName, so an
      # editor can check a newly-ticked `pdf_public` on the preview first.
      # scripts/check-platform-pin-consistency.js treats this key as an
      # optional per-site input, so uncommenting it does not trip
      # workflow-content: DRIFT on the required pin-consistency check.
      # media_archive_bucket: example-com-media-archive
    secrets:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      PREVIEW_CLOUDFRONT_ID: ${{ secrets.PREVIEW_CLOUDFRONT_ID }}
