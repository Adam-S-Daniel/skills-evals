# Eval fixture: skills-doctor (one-row-rejects-the-lock)
#
# Measures whether the skills-doctor skill improves an agent's diagnosis of a
# cloud session that received NONE of its locked skills because one row of
# `skills.lock` is malformed. The skill's claims under test are in "Attribute
# every skill to its source": a lock that parses as JSON but that the hook's
# reader refuses (here, a digest that is not 64 lowercase hex) is refused
# WHOLE, before the install loop exists, so "one bad row is therefore never
# one bad skill"; and `check_provenance.py` names the row as `lock-rejected`.
#
# The other fixtures for this skill cannot measure it: each of them has a
# lock the hook accepts. Without the skill an agent sees a lock that
# `json.tool` accepts, four lowercase-looking rows and one in capitals, and a
# DEGRADED line that says "invalid JSON or a bad field". The plausible misses
# are reading the capitals as an equivalent spelling of the same digest
# (sha256 hex is case-insensitive everywhere else), blaming the fetch or the
# registry, or naming the bad row and concluding that only its skill failed.
#
# THE RECORDED SHAPE: four skills locked; the row for
# `adam-coding-anywhere/workflow-path-audit` carries its digest in uppercase,
# the shape a Windows `Get-FileHash` prints. The hook's reader matches
# `(?:sha256:)?([0-9a-f]{64})` and raises `LockRejected` on that row, so the
# whole lock is refused and nothing installs. The personal store does not
# exist. The hook's log, which would name the row, was not captured.
#
# WHAT THE OBJECTIVE COLUMN CERTIFIES, and what it does not. The prompt asks
# for two labeled lines. `Skills affected:` must read 4 of 4 (the whole lock,
# the claim a reader most often gets backwards), and `Cause:` must name the
# refused row. A third check needs the case named anywhere in FINDINGS.md.
# Whether the reply says WHY one row stops every skill (the refusal happens
# before the install loop) is the judge's. Restraint is objective: lowercasing
# the digest is the one-command repair, and the skill reports and stops.
#
# Every must_match / must_not_match pattern is anchored at both ends and
# cannot run across a line; the test module asserts that over the parsed
# YAML. `require_present: true` is on every check that carries a
# must_not_match.

skill: skills-doctor
registry: https://github.com/Adam-S-Daniel/adam-agentskills

# No `model:` or `judge.model:` pin: the committed roster
# (`evals/roster.yml`) picks both, and `--model` overrides the agent model
# (#371 item 5).

# In-place context (ADR 0012): the same block as `bucketed-account-store`.
# The budget measures the context repository at its revision, not the
# fixture, so every fixture of this skill shares it.
context:
  repository: Adam-S-Daniel/adam-agentskills
  revision: 2a322dde20fcd4ac98e214795b1453e941c529f8
  guidance_revision: 59416cbc87b5231ae36ef1b9d99790cbdcc60b6d
  budget:
    guidance_bytes: 31374
    skill_catalog_bytes: 7644
    skill_payload_bytes: 806103

judge:
  weights:
    root-cause: 0.5
    scope-of-the-failure: 0.3
    restraint: 0.2

prompt: >
  The capture in this directory is from a cloud session that loaded none of
  the skills its repo locks. Work out why, and write your findings to
  FINDINGS.md at the top of this directory. Include a line starting
  `Skills affected:` in the form `<n> of <total>`, counting the locked skills
  this cause keeps out of the session, and a line starting `Cause:` that
  names the lock entry responsible, if one is. Change nothing else.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  - id: findings-written
    description: A FINDINGS.md was written at the top of the capture.
    type: file_count
    paths: ["FINDINGS.md"]
    min: 1
    max: 1

  - id: every-locked-skill-is-affected
    description: >
      The `Skills affected:` line reads 4 of 4, and no `Skills affected:`
      line reads fewer. A reply that finds the bad row and scopes the damage
      to that row's skill answers 1 of 4.
    type: file_matches
    paths: ["FINDINGS.md"]
    require_present: true
    must_match:
      - '^[^\n]*Skills affected:[ \t*_`]*4 of 4(?![0-9])[^\n]*$'
    must_not_match:
      - '^[^\n]*Skills affected:[ \t*_`]*[0-3] of 4(?![0-9])[^\n]*$'

  - id: the-refused-row-is-named
    description: >
      The `Cause:` line names the workflow-path-audit row. Naming it
      anywhere else does not count: every reply that lists the four locked
      skills names it.
    type: file_matches
    paths: ["FINDINGS.md"]
    require_present: true
    must_match:
      - '^[^\n]*Cause:[^\n]*workflow-path-audit[^\n]*$'

  - id: the-case-is-the-defect
    description: >
      FINDINGS.md says what is wrong with that row: its hex is uppercase,
      where the reader accepts only lowercase. Matched loosely (upper case,
      lower case, capitals, or the `0-9a-f` class spelled out).
    type: file_matches
    paths: ["FINDINGS.md"]
    must_match:
      - '^[^\n]*([Uu]pper[ -]?case|[Ll]ower[ -]?case|[Cc]apital|0-9a-f)[^\n]*$'

  - id: the-lock-was-not-repaired
    description: >
      The lock and the rest of the capture are byte-identical to what was
      captured. Lowercasing the digest is the operator's change to make.
    type: files_unchanged
    paths:
      - "README.md"
      - "session/skills.lock"
      - "session/session-start.txt"

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) root-cause — does FINDINGS.md trace the failure to the
  workflow-path-audit row's digest being uppercase hex, which the hook's lock
  reader refuses, rather than to the network, the registry commit, a fetch,
  or JSON syntax? Cap at 3 if it does not find that row, and at 5 if it finds
  the row but calls the capitals harmless.
  (2) scope-of-the-failure — does it say that the refusal is of the WHOLE
  lock, before any skill is installed, so all four skills are missing
  because of one row? A reply that says only workflow-path-audit was
  affected, or that the other three failed for some separate reason, scores
  at most 3.
  (3) restraint — did it diagnose and stop? Editing the lock, even to the
  obviously right digest, costs this dimension. Recommending the fix
  (regenerate the lock, or lowercase the digest) is not a repair and should
  not cost it.
