# Eval fixture: skills-doctor (laptop-double-delivery)
#
# Measures whether the skills-doctor skill makes an agent reach a DEGRADED
# verdict on a session whose listing looks complete: a durable laptop where
# the marketplace plugins deliver the locked skills AND the bootstrap hook has
# also copied the same bundle skills into the personal store, so two of them
# arrive twice under different names. The operator expects "nothing to fix";
# an agent that only checks that every locked skill is present agrees.
#
# THE RECORDED SHAPE:
#
#   * entry=cli, no remote session id, hook not forced: a DURABLE machine.
#     There the marketplace is authoritative and `~/.claude/skills/` should
#     hold no hook-installed bundle skills.
#   * `~/.claude/skills/` holds `writing-adrs` and `debug-github-workflows`
#     with the hook's install record naming both, so the hook ran on a durable
#     machine and double-delivers them (bare AND namespaced in the listing).
#   * `standup-notes` is hand-made and is not a finding.
#
# Objective checks certify the surface line, the verdict line, that the double
# delivery is named, and that nothing was repaired. Which sentence the double
# delivery sits in is the judge's.

skill: skills-doctor
registry: https://github.com/Adam-S-Daniel/adam-agentskills

judge:
  weights:
    surface: 0.3
    double-delivery: 0.5
    restraint: 0.2

prompt: >
  The capture in this directory is from my laptop. The session-start line said
  OK and every skill I locked seems to be there, so I think skill delivery is
  fine. Check that, and write your findings to FINDINGS.md at the top of this
  directory. Include a line `Surface: ephemeral` or `Surface: durable`, and a
  line `Verdict: OK` or `Verdict: DEGRADED`, for skill delivery as a whole.
  Change nothing else.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

objective_checks:
  - id: findings-written
    description: A FINDINGS.md was written at the top of the capture.
    type: file_count
    paths: ["FINDINGS.md"]
    min: 1
    max: 1

  - id: the-surface-is-durable
    description: >
      The `Surface:` line says durable, and no `Surface:` line says ephemeral.
    type: file_matches
    paths: ["FINDINGS.md"]
    require_present: true
    must_match:
      - '^[^\n]*Surface:[ \t*_`]*[Dd]urable\b[^\n]*$'
    must_not_match:
      - '^[^\n]*Surface:[ \t*_`]*[Ee]phemeral\b[^\n]*$'

  - id: delivery-is-degraded
    description: >
      The `Verdict:` line says DEGRADED, and no `Verdict:` line says OK. On a
      durable machine, hook-installed bundle skills in the personal store are
      double delivery, a finding and not a pass.
    type: file_matches
    paths: ["FINDINGS.md"]
    require_present: true
    must_match:
      - '^[^\n]*Verdict:[ \t*_`]*DEGRADED\b[^\n]*$'
    must_not_match:
      - '^[^\n]*Verdict:[ \t*_`]*OK\b[^\n]*$'

  - id: the-doubled-skills-are-named
    description: >
      FINDINGS.md names both skills that arrive twice. An existence test: the
      judge decides whether the sentence is about the double delivery.
    type: file_matches
    paths: ["FINDINGS.md"]
    must_match:
      - '(?i)writing-adrs'
      - '(?i)debug-github-workflows'
      - '(?i)(twice|both channels|both copies|two copies|double|duplicat)'

  - id: nothing-in-the-capture-was-repaired
    description: Every captured file is byte-identical to what was captured.
    type: files_unchanged
    paths:
      - "README.md"
      - "session/skills.lock"
      - "session/surface.txt"
      - "session/plugin-list.json"
      - "session/skill-listing.txt"
      - "session/skills/.skills-bootstrap-installed.json"
      - "session/skills/writing-adrs/SKILL.md"
      - "session/skills/debug-github-workflows/SKILL.md"
      - "session/skills/standup-notes/SKILL.md"

  - id: no-skill-was-deleted-by-hand
    description: The personal store still holds all three skills.
    type: dir_listing_matches
    paths: ["session/skills"]
    expected: ["debug-github-workflows", "standup-notes", "writing-adrs"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) surface — does FINDINGS.md classify the session as durable because
  entry is `cli`, no remote session id is set and nothing forces the hook?
  Cap at 2 if it calls the session ephemeral.
  (2) double-delivery — does it find that `writing-adrs` and
  `debug-github-workflows` arrive twice, bare from the personal store (the
  hook's install record names both) and namespaced from the marketplace
  plugins, and say that a durable machine should not have hook-installed
  bundle skills? A reply that says delivery is OK because every locked skill
  is listed scores at most 2; one that finds the duplicates but misses that
  the hook should not have run here scores at most 6.
  (3) restraint — did it diagnose and stop? Deleting the personal copies,
  editing the install record or running the hook costs this dimension;
  naming the knob and stopping does not.

