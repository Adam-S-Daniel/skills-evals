# Eval fixture: adam-writing-style — recruiter reply
#
# Class C (DESIGN.md, "Four instruments, one harness"): the judge carries
# the load, the few decidable bits stay objective, and the comparison is a
# pairwise preference against committed reference samples rather than an
# absolute rubric score. DESIGN.md's own warning applies — expect noise here
# and run N>=5 trials per arm.
#
# Everything in seed/ is invented: Dana Whitcombe, Northgate Bell Talent
# Group and the client behind REQ-4417 are not real people or companies, and
# the only addresses are example.com / example.net.
#
# The two facts the objective check looks for (REQ-4417, March 2027) sit in
# the MATERIAL — the recruiter's own email and a personal note — and the
# brief never asks for them to be quoted. That is deliberate: a brief that
# said "cite these" would score instruction-following, which both arms pass,
# instead of the skill's specificity move, which is the thing under test.
#
# References live beside this file, NOT in seed/: seed/ is copied into the
# agent's workspace, so a reference in there would hand the agent the answer.
#
# Known failure mode — commentary. Every check reads the agent's whole
# final reply minus its quoted lines, so anything the agent wraps around
# the writing is scored as if it were the writing: "I kept it free of
# 'leverage'" fails no-avoid-list-words, and an unquoted trailing note that
# supplies a fact the reply itself omitted passes cites-both-facts. The
# first direction is the one that bites, because the arm that knows the
# avoid list is the arm that mentions it. BRIEF.md asks for the reply alone
# with nothing before or after it and nothing quoted, which keeps it rare;
# the judge's register dimension backstops what is left.

skill: adam-writing-style
registry: https://github.com/Adam-S-Daniel/agentskills

# Arms pinned mid-tier, judge pinned strong — DESIGN.md's harness-wide
# rules. A ceiling-effect arm is signal-free, and an unpinned arm silently
# tracks the CLI's default model across releases.
model: claude-sonnet-5

judge:
  mode: pairwise
  model: claude-opus-4-8
  # Blind, shuffled per trial, score = rank. No `weights:` — the score is a
  # rank, not a weighted mean, and harness/scorers/judge.py rejects a
  # fixture that carries both rather than half-honouring it.
  references:
    - name: in-voice
      path: references/in-voice.md
    - name: generic
      path: references/generic.md

prompt: >
  Reply to this recruiter's cold email in my voice, declining but leaving
  the door open

objective_checks:
  # The avoid list, verbatim from the skill's "Avoid (almost always)"
  # section. test/run_tests.py::TestIssue81 reads that section out of the
  # agentskills checkout at TEST time and fails if a term there is not
  # covered here, so the two cannot drift apart.
  #
  # Every pattern only looks at non-quoted lines, here and below: a reply
  # that quotes the recruiter's email back is not using her words as its
  # own, and the seed material is not the agent's writing.
  - id: no-avoid-list-words
    description: None of the skill's avoid-list buzzwords survived into the reply
    type: transcript_matches
    must_not_match:
      - '(?im)^(?!>).*\bleverag(?:e|es|ed|ing)\b'
      - '(?im)^(?!>).*\bsynerg(?:y|ies|istic)\b'
      - '(?im)^(?!>).*\brobust(?:ly|ness)?\b'
      - '(?im)^(?!>).*\bbest[- ]in[- ]class\b'
      - '(?im)^(?!>).*\bworld[- ]class\b'
      - '(?im)^(?!>).*\bdeep[- ]dives?\b'
      - '(?im)^(?!>).*\bdeep expertise in\b'
      - '(?im)^(?!>).*\bthought[- ]leader(?:ship)?s?\b'
      - '(?im)^(?!>).*\bcircl(?:e|es|ed|ing) back\b'
      - '(?im)^(?!>).*\btouch(?:es|ed|ing)? base\b'
      - '(?im)^(?!>).*\bping me\b'

  # Core move 1: greet warmly, by name — in the greeting, not anywhere in
  # the reply. Anchored to the first non-quoted paragraph: a reply that
  # greets nobody and quotes her signature underneath used to pass on the
  # name in that footer. Leading quoted lines are skipped, then the name
  # must appear within the first three non-quoted lines.
  - id: greets-the-recruiter-by-name
    description: The reply greets the recruiter by name in its opening
    type: transcript_matches
    must_match:
      - '\A(?:>[^\n]*\n|[ \t]*\n)*(?:(?!>)[^\n]*\n){0,2}(?!>)[^\n]*\bDana\b'

  # Core move 2: open with a hedge or apology. Any of the skill's shapes
  # counts, but it has to be the AGENT'S and it has to be near the top. The
  # pattern skips a leading quoted block, allows up to five non-quoted
  # lines, and requires the hedge to start a sentence — the skill lists
  # these as sentence openers ("I'm guessing you're the right person",
  # "Sorry, just realized"), and a mid-sentence "and I think" is rarely the
  # disarming move it is after.
  #
  # It used to be a flat 400-character window over the whole reply, which
  # the recruiter's own email satisfied whenever an agent quoted it at the
  # top: her "I think your background lines up well" is a hedge inside the
  # window and nothing of the agent's.
  #
  # Residual, accepted: "I think" is still a hedge shape in an assertive
  # sentence ("I think you'd be a great fit"). Sentence-anchoring narrows
  # that; the judge's register dimension carries the rest.
  - id: opens-with-a-hedge
    description: The reply opens with one of the skill's hedges rather than an assertion
    type: transcript_matches
    must_match:
      - '\A(?:>[^\n]*\n|[ \t]*\n)*(?:(?!>)[^\n]*\n){0,5}(?!>)(?:[^\n]*?[.!?—][ \t]+)?(?:I[''’]m guessing|I think\b|[Aa]s far as I can tell|[Ss]orry\b|[Mm]y apologies|[Aa]pologies\b)'

  # Core move 3: be specific — paste the ID verbatim, name the date. Both
  # facts are in the seed material; neither is asked for. Anchored to
  # non-quoted lines: a reply that quotes her email back carries REQ-4417
  # in the quote, and a fact the agent merely echoed is not the agent
  # being specific.
  - id: cites-both-facts
    description: The reply quotes the requisition number and the contract end date
    type: transcript_matches
    must_match:
      - '(?m)^(?!>).*\bREQ-4417\b'
      - '(?im)^(?!>).*\bMarch 2027\b'

# Pairwise: the judge ranks this reply against the two committed references
# without being told which is which, and the rank is the score. The
# dimensions sit beside the rank as the "why". The last line is this
# fixture's version of the harness-wide rule that a decidable failure caps
# the judge — here it caps the rank instead of a dimension.
judge_rubric: >
  Rank the drafts best to worst as a reply that declines a recruiter's cold
  approach without closing the door, judged as writing rather than
  formatting. Score every draft 0-10 on each dimension with a one-sentence
  rationale.
  (1) Specificity — does the draft use the concrete material available (the
  requisition number, the date the writer's current commitment ends, the
  on-site expectation) instead of vague paraphrase like "my current
  commitments"?
  (2) Register match — warm but direct; greets by name; opens by hedging or
  apologising rather than asserting; em dashes for asides but not in every
  sentence; a plain sign-off; at most one exclamation mark; no "Dear" for
  ordinary correspondence.
  (3) Absence of corporate filler — no buzzwords, no résumé-headline
  language, no closing "let me know if you have any questions" with nothing
  behind it.
  A draft that omits either concrete fact must not rank first, however well
  it reads.
