# Eval fixture: review-bash-ci-reliability (test-runner-assertions)
# Measures the "Test harnesses" paragraph of SKILL.md checklist item 7: an
# assertion or diagnostic helper must never be able to abort the run,
# because one failing assertion that kills the runner mid-file prints no
# summary line and hides every test after it, instead of recording a single
# FAIL. That is the incident behind item 7 (adam-agentskills#20, cited by the
# skill's PURPOSE.md): a test runner under `set -euo pipefail` whose
# `grep | head | cut` capture died on a file without its marker.
#
# The seed's test/run-tests.sh is green today, so nothing in a passing run
# shows the defect. Each of its three helpers captures a command that exits
# non-zero exactly when the assertion should fail: `assert_line` captures
# `grep -n ... | head -1 | cut ...` (grep exits 1 on no match and pipefail
# carries it), `assert_golden` captures `cmp` (exits 1 when files differ), and
# `assert_slug` captures the script under test (a crash exits non-zero). In
# each case `set -e` kills the runner: no FAIL line, no Results line, and the
# tests after it never run. The value-mismatch path of `assert_slug`, which
# compares captured output, already records a FAIL and is the control.
#
# Why the other fixtures cannot measure this: `release-pipeline` has no test
# harness and no capture of grep, diff or cmp; `drift-report-capture`
# measures item 7's main claim in a production script, where the abort costs
# a report, not a suite's remaining tests. Neither breaks a test to see
# whether the runner survives it.
#
# What the objective column decides, and how: every behavior and restraint
# check RUNS the final test/run-tests.sh through the `repo_tests` scorer.
# The probe (checker/.probe/runner.sh) is an overlay laid over a scratch copy
# of the workspace, so the agent never sees it. It breaks exactly one of the
# five tests in a named way (a README line removed, a golden file changed,
# the script under test crashing on one input, or printing one wrong slug),
# runs the suite, and passes only when the runner exited non-zero, printed
# `Results: 4 passed, 1 failed`, printed a FAIL line for the broken test and
# a PASS line for each of the other four, the last one included. What it
# cannot decide: whether a guard is scoped to the command whose non-zero exit
# is expected (an `|| true` on the cmp and a `set +e` over the whole runner
# both pass), and whether the reply explains the failure mode; those are the
# judge's. A rewrite that renames the runner, its tests, or its PASS / FAIL /
# Results line format fails the probe; the prompt asks for none of that.

skill: review-bash-ci-reliability
registry: https://github.com/Adam-S-Daniel/adam-agentskills

# No `model:` or `judge.model:` pin: the committed roster (`evals/roster.yml`)
# picks both (ADR 0013).

# In-place context (ADR 0012): the same block as `release-pipeline`, measured
# there on 2026-10-10. Every figure is a property of the context repository
# and the skill, not of the fixture, so it holds for each fixture of this
# skill unchanged.
context:
  repository: Adam-S-Daniel/cms-platform
  revision: 28f2b6ed98837757417e058dd21047df046dadc7
  guidance_revision: 59416cbc87b5231ae36ef1b9d99790cbdcc60b6d
  budget:
    guidance_bytes: 31374
    skill_catalog_bytes: 7603
    skill_payload_bytes: 857047

judge:
  # Correctness carries the axis that matters; restraint is the guardrail and
  # must not outvote it (DESIGN.md, "Harness-wide rules").
  weights:
    correctness: 0.5
    restraint: 0.2
    explanation: 0.3

prompt: >
  Review the shell in this repo's CI for reliability problems and fix what
  you find.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

# `repo_tests` requires a `fail_to_pass` list; that is the scorer's key name,
# and both groups must exit 0. The restraint check puts its cases there too
# and passes on the pristine seed by design.
objective_checks:
  - id: workflow-yaml-parses
    description: The test workflow still parses as YAML
    type: yaml_parses
    paths: [".github/workflows/*.yml", ".github/workflows/*.yaml"]

  - id: workflow-file-present
    description: The test workflow itself is still present (yaml_parses passes on a deleted file)
    type: file_matches
    paths: [".github/workflows/test.yml"]
    require_present: true
    must_match:
      - '^name: Tests[ \t]*$'

  - id: grep-miss-recorded
    description: >
      With the README's Usage line removed, the runner records FAIL for
      readme-usage, still runs and passes the other four tests, prints
      `Results: 4 passed, 1 failed` and exits non-zero. The pristine runner
      dies inside assert_line's `grep | head | cut` capture.
    type: repo_tests
    overlay: checker
    argv: [bash, .probe/runner.sh]
    fail_to_pass:
      - grep-miss-recorded

  - id: cmp-difference-recorded
    description: >
      With the golden file changed, the runner records FAIL for golden-path
      and otherwise behaves as above. The pristine runner dies inside
      assert_golden's `cmp` capture.
    type: repo_tests
    overlay: checker
    argv: [bash, .probe/runner.sh]
    fail_to_pass:
      - cmp-difference-recorded

  - id: crash-recorded
    description: >
      With the script under test exiting non-zero on one input, the runner
      records FAIL for punctuation and otherwise behaves as above. The
      pristine runner dies inside assert_slug's capture of the script.
    type: repo_tests
    overlay: checker
    argv: [bash, .probe/runner.sh]
    fail_to_pass:
      - crash-recorded

  - id: green-run-and-mismatch-unchanged
    description: >
      Restraint: the unbroken suite still passes all five tests and exits 0,
      and a wrong slug (the failure path that already worked) is still one
      FAIL with a non-zero exit. A fix that makes the runner survive by
      making it pass fails here. Passes on the pristine seed.
    type: repo_tests
    overlay: checker
    argv: [bash, .probe/runner.sh]
    fail_to_pass:
      - green-run
      - mismatch-recorded

  - id: code-and-fixtures-untouched
    description: >
      The script under test, the golden file and the README are
      byte-identical to the seed: the defect is in the runner.
    type: files_unchanged
    paths:
      - "scripts/slugify.sh"
      - "test/golden/*.txt"
      - "README.md"

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Correctness — did the agent find that test/run-tests.sh's helpers can
  abort the whole run under `set -euo pipefail` (assert_line's grep capture
  exits 1 when the pattern is missing, assert_golden's cmp capture exits 1
  when the files differ, and assert_slug's capture of the script under test
  exits non-zero when that script fails), so a failing assertion kills the
  runner with no FAIL line, no Results line and no later tests, and fix each
  so the failure is recorded as one FAIL while the run continues and still
  exits non-zero? A guard scoped to the command whose non-zero exit is
  expected is better than disabling `set -e` for the whole runner. Cap at 4
  if grep-miss-recorded, cmp-difference-recorded or crash-recorded is
  failing.
  (2) Restraint — did the agent keep the tests, their names, the output
  format and the non-zero exit on failure, leave the script under test and
  its fixtures alone, and avoid unrelated rewrites? Cap at 4 if
  green-run-and-mismatch-unchanged or code-and-fixtures-untouched is
  failing.
  (3) Explanation — did the reply name the actual failure mode (a helper
  whose command substitution exits non-zero on the very result it should
  report aborts the runner under set -e, hiding the summary and every later
  test), rather than just "made the tests more robust"?
