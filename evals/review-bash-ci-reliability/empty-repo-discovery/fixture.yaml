# Eval fixture: review-bash-ci-reliability (empty-repo-discovery)
# Measures SKILL.md checklist item 3, "Silent Success on Empty Results": a
# script that handles "no items found" by exiting 0 shows a green check even
# when the discovery command itself failed, so it must tell "genuinely found
# nothing" apart from "the command failed". The seed's nightly
# scripts/audit-visibility.sh is the skill's own DANGEROUS example in a
# working repo: `mapfile -t REPOS < <(gh repo list ...)` under `set -euo
# pipefail`, then "nothing to audit" and exit 0 on an empty array. A gh
# failure (an expired token, a 502) runs in the process substitution, where
# set -e cannot see it, so the audit goes green every night it cannot run,
# and a listing that fails halfway audits only what arrived and passes.
# There is no `|| true`, `2>/dev/null` or `set +e` anywhere in the script.
#
# Why the other fixtures cannot measure this: `release-pipeline`'s gh api
# finding is swallowed by an explicit `|| true` (item 4's suppressed error),
# which an agent can find by searching for the token; its process
# substitution finding wraps `gh run watch`, whose result is printed, not
# counted, so no "empty means done" branch exists there. Neither has an
# empty-result branch that must stay green while a failure turns red.
# `drift-report-capture` and `test-runner-assertions` measure item 7.
#
# What the objective column decides, and how: the four behavior and
# restraint checks RUN the final scripts/audit-visibility.sh through the
# `repo_tests` scorer, against a stand-in gh (checker/.probe/bin/gh) put
# first on PATH by the probe (checker/.probe/audit.sh). Both are an overlay
# laid over a scratch copy of the workspace, so the agent never sees them.
# The stand-in answers `gh repo list` in one of five modes (fails, fails
# after one name, empty, only allowlisted names, one name off the allowlist)
# and succeeds silently for anything else. What it cannot decide: whether the
# reply explains the failure mode, and whether a rewrite onto a different gh
# command (`gh api orgs/.../repos`) is correct; the stand-in answers only
# `gh repo list`, so such a rewrite reads as "empty" and fails the two
# behavior checks. The prompt asks for no such rewrite.
#
# Known trap, measured by empty-org-still-green and kept on purpose: the
# skill's own SAFE snippet, `mapfile -t REPOS <<< "$repo_list"`, turns an
# empty capture into ONE empty element, so `${#REPOS[@]}` is 1, the empty
# branch is skipped and the audit flags `example-org/` and fails. Copied
# verbatim, the skill's fix fails the restraint check here; a correct fix
# guards the empty capture before mapfile (or tests the capture itself).
#
# The arms get the shared offline gh (harness/fakes/gh) on PATH, answering
# `gh repo list example-org` from .gh/replay with the two allowlisted names,
# so running the script in the workspace passes, as it does in CI today.

skill: review-bash-ci-reliability
registry: https://github.com/Adam-S-Daniel/adam-agentskills

# No `model:` or `judge.model:` pin: the committed roster (`evals/roster.yml`)
# picks both (ADR 0013).

# In-place context (ADR 0012): the same block as `release-pipeline`, measured
# there on 2026-10-10. Every figure is a property of the context repository
# and the skill, not of the fixture, so it holds for each fixture of this
# skill unchanged.
context:
  repository: Adam-S-Daniel/cms-platform
  revision: 28f2b6ed98837757417e058dd21047df046dadc7
  guidance_revision: 59416cbc87b5231ae36ef1b9d99790cbdcc60b6d
  budget:
    guidance_bytes: 31374
    skill_catalog_bytes: 7603
    skill_payload_bytes: 857047

env:
  PATH: "$WORKSPACE/bin:$PATH"
  GH_REPLAY_DIR: "$WORKSPACE/.gh/replay"
  GH_REPO: "example-org/audit-tools"

judge:
  # Correctness carries the axis that matters; restraint is the guardrail and
  # must not outvote it (DESIGN.md, "Harness-wide rules").
  weights:
    correctness: 0.5
    restraint: 0.2
    explanation: 0.3

prompt: >
  Review the shell in this repo's CI for reliability problems and fix what
  you find.

arms:
  with_skill:
    install: copy
  without_skill:
    install: none

# `repo_tests` requires a `fail_to_pass` list; that is the scorer's key name,
# and both groups must exit 0. The restraint checks put their cases there too
# and pass on the pristine seed by design.
objective_checks:
  - id: workflow-yaml-parses
    description: The audit workflow still parses as YAML
    type: yaml_parses
    paths: [".github/workflows/*.yml", ".github/workflows/*.yaml"]

  - id: workflow-file-present
    description: The audit workflow itself is still present (yaml_parses passes on a deleted file)
    type: file_matches
    paths: [".github/workflows/visibility-audit.yml"]
    require_present: true
    must_match:
      - '^name: Visibility audit[ \t]*$'

  - id: gh-failure-fails-the-job
    description: >
      When `gh repo list` fails with no output, the audit exits non-zero and
      does not report "nothing to audit". The pristine script reads the
      failure as an empty organization and exits 0.
    type: repo_tests
    overlay: checker
    argv: [bash, .probe/audit.sh]
    fail_to_pass:
      - gh-failure-fails

  - id: partial-listing-fails-the-job
    description: >
      When `gh repo list` prints one name and then fails, the audit exits
      non-zero. The pristine script audits the one name and passes.
    type: repo_tests
    overlay: checker
    argv: [bash, .probe/audit.sh]
    fail_to_pass:
      - partial-listing-fails

  - id: empty-org-still-green
    description: >
      Restraint: when `gh repo list` succeeds with no output, the audit still
      exits 0 and flags nothing. A fix that fails on every empty result, or
      that turns the empty capture into one empty name, fails here. Passes on
      the pristine seed.
    type: repo_tests
    overlay: checker
    argv: [bash, .probe/audit.sh]
    fail_to_pass:
      - empty-org-passes

  - id: listed-repos-still-audited
    description: >
      Restraint: allowlisted names still pass, and a public name off the
      allowlist is still flagged on its own UNEXPECTED PUBLIC line and fails
      the job. Passes on the pristine seed.
    type: repo_tests
    overlay: checker
    argv: [bash, .probe/audit.sh]
    fail_to_pass:
      - allowed-repos-pass
      - unexpected-repo-flagged

  - id: allowlist-untouched
    description: The allowlist is byte-identical to the seed
    type: files_unchanged
    paths: ["config/public-allowlist.txt"]

judge_rubric: >
  Score 0-10 on each dimension, with a one-sentence rationale per dimension:
  (1) Correctness — did the agent find that the `gh repo list` call runs
  inside process substitution, where `set -euo pipefail` cannot see its exit
  status, so a failed listing becomes an empty array and the audit reports
  "nothing to audit" and exits 0 (or audits a partial list and passes), and
  fix it so a failed listing fails the job while an organization with no
  public repositories still passes? Cap at 4 if gh-failure-fails-the-job or
  partial-listing-fails-the-job is failing.
  (2) Restraint — did the agent keep the empty-organization path green, keep
  flagging unexpected public repositories, leave the allowlist and the
  workflow's behavior alone, and avoid unrelated rewrites? Cap at 4 if
  empty-org-still-green, listed-repos-still-audited or allowlist-untouched is
  failing.
  (3) Explanation — did the reply name the actual failure mode (process
  substitution hides the discovery command's failure, so "the command
  failed" and "found nothing" become the same green result), rather than
  just "added error handling"?
