# How the improvement gate lands an accepted candidate in adam-agentskills,
# read by scripts/improve_gate.py (`prepare`) in routine-improve-gate.yml.
#
# `improve_merge_mode` is `auto` or `draft`:
#
#   * `auto` (Adam, 2026-10-26: accepted improvements merge with no human in
#     the loop): the gate opens a ready pull request and enables auto-merge
#     (merge commit). adam-agentskills' required checks still gate it.
#   * `draft`: the gate opens a draft pull request and a person merges or
#     closes it.
#
# A missing key means `auto`. An unreadable file, a value other than those
# two, or any other key means `draft`. Whatever this says, the gate falls
# back to `draft` for a skill whose plugin runs code (hooks, bin/, settings
# or a package manifest), so a pull request it auto-merges never needs
# adam-agentskills' plugin-runtime-review. See adam-agentskills ADR 0021 and
# this repository's ADR 0005, "Automatic merge addendum (2026-10-26)".
improve_merge_mode: auto
