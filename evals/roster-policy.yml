# Model roster policy — the thresholds `harness/roster.py` reads.
#
# The roster answers "which models should this harness be running against
# today?" from two inputs: what the Models API says is AVAILABLE, and what the
# fleet is actually USING (the census published to `eval-results` as
# `usage/latest.json`). Arms pinned as literals in each fixture went stale
# silently — nothing here noticed when a model shipped or retired — which is
# the problem this file exists to close (#67).
#
# Rationale and the numbers' provenance belong in an ADR, not in a comment
# block: see ADR (to be written under #73) —
# https://github.com/Adam-S-Daniel/skills-evals/issues/73
#
# NO MODEL IDS LIVE HERE, deliberately, and none live in roster.py either. A
# tier is inferred from the family word in a model's own id, matched against
# the ladder below; that is the whole of the harness's model knowledge, and it
# is why a model that ships after this file was written needs no edit here.
# test/run_tests.py::TestIssue67::test_no_model_ids_are_hardcoded_outside_fixtures
# is the guard.

# Capability ladder, weakest first. A model's tier is the first of these words
# to appear as a dash-separated token in its id; a model whose id carries none
# of them is unranked and takes no roster seat (it can still be measured — it
# simply cannot be ordered against the others without a capability claim the
# Models API does not make).
tiers:
  - haiku
  - sonnet
  - opus
  - fable

# A model becomes an arm if it carries at least this share of census usage
# over the trailing window...
arm_enter_usage_pct: 10
arm_enter_window_weeks: 4

# ...or if it is the newest model in its tier AND has been out at least this
# long. The cooling-off is the fleet's standing convention for new versions:
# day-one models move, and a roster that chases them re-baselines the eval
# every week.
cooling_off_days: 7

# An arm keeps its seat until it falls under this share for the whole trailing
# window (or disappears from the Models API, which is immediate). Hysteresis,
# not a second entry bar: without it a model hovering at the entry threshold
# joins and leaves the arm set on alternate runs and every week-over-week
# comparison is against a different arm.
arm_exit_usage_pct: 2
arm_exit_window_weeks: 8

# A census older than this is not evidence of anything current. Past it the
# roster falls back to "newest per tier" and says so, in words, in every arm's
# reason — degrading loudly rather than publishing a stale-usage roster that
# looks exactly like a fresh one.
census_max_age_days: 14
