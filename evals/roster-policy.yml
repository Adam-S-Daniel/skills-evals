# Model roster policy — the thresholds `harness/roster.py` reads.
#
# The roster answers "which models should this harness be running against
# today?" from two inputs: what the Models API says is AVAILABLE, and what the
# fleet is actually USING (the census published to `eval-results` as
# `usage/latest.json`). Arms pinned as literals in each fixture went stale
# silently — nothing here noticed when a model shipped or retired — which is
# the problem this file exists to close (#67).
#
# Rationale and the numbers' provenance belong in an ADR, not in a comment
# block: see ADR (to be written under #73) —
# https://github.com/Adam-S-Daniel/skills-evals/issues/73
#
# NO MODEL IDS LIVE HERE, deliberately, and none live in roster.py either. A
# tier is inferred from the family word in a model's own id, matched against
# the ladder below; that is the whole of the harness's model knowledge, and it
# is why a model that ships after this file was written needs no edit here.
# test/run_tests.py::TestIssue67::test_no_model_ids_are_hardcoded_outside_fixtures
# is the guard.

# Capability ladder, weakest rung first. A model's tier is the WEAKEST rung
# below whose word appears as a dash-separated token anywhere in its id —
# `rung_of()` walks the ladder from the top of this list down and returns on
# the first rung that matches, not the first word to appear positionally in
# the id string itself. A rung may be written as a bare word or as a LIST OF
# PEERS that rank identically — same tier, same price, different access
# programme — which is what `[fable, mythos]` is below.
#
# A model whose id carries none of these words is UNRANKED. It takes no roster
# seat, it is listed under `unranked` in the published roster with that reason,
# and — this is the part that bites — its usage is excluded from the share
# denominator. Leaving it in pushed every ranked model's share towards zero
# (measured: a model at 60 turns a week computed at 5.7% against 1000 unranked
# turns a week) and quietly emptied the arm set. Adding a rung here is how a
# new family becomes visible; there is nothing else to change.
tiers:
  - haiku
  - sonnet
  - opus
  - [fable, mythos]

# ASSUMPTION, recorded here because the code acts on it: an id that is another
# id plus a `-YYYYMMDD` suffix is a dated SNAPSHOT of that model, not a second
# model. Both are collapsed onto the undated alias for ranking, seating and
# usage — otherwise one model takes two arm seats and its usage splits across
# two census keys, halving both shares. The collapse only happens when the
# undated alias is itself in the catalogue; a catalogue that publishes only
# dated ids has nothing to collapse onto and every id stands on its own.

# A since-retired model's usage still counts toward the denominator when
# this harness's own history says it was once in the catalogue: the
# published roster carries `catalogue_seen`, the union of every id the
# Models API has ever listed across runs. A model's usage stops counting
# only once no run has ever observed it — FIRST-RUN CAVEAT: with no
# `catalogue_seen` history yet (a genuine first run, a previous roster that
# could not be read, OR THE MIGRATION CASE — the `previous.json` already
# published on `eval-results` predates this field entirely, so the first
# run after it merges behaves exactly like a genuine first run), a model
# retired before this harness's first run is unattributable, and its usage
# silently drops from the denominator until a run observes it directly. An
# earlier approach inferred this from the id's SHAPE instead; withdrawn
# because shape cannot tell a since-retired real model from a
# plausibly-named proxy alias. A SECOND migration applies to
# `catalogue_seen`'s own shape (below): the bare id string it used to
# publish is accepted for one run and rewritten with an age.

# A model becomes an arm if it carries at least this share of census usage
# over the trailing window...
arm_enter_usage_pct: 10
arm_enter_window_weeks: 4

# ...or if it is the newest model in its tier AND has been out at least this
# long. The cooling-off is the fleet's standing convention for new versions:
# day-one models move, and a roster that chases them re-baselines the eval
# every week.
cooling_off_days: 7

# An arm keeps its seat until it falls under this share for the whole trailing
# window (or disappears from the Models API, which is immediate). Hysteresis,
# not a second entry bar: without it a model hovering at the entry threshold
# joins and leaves the arm set on alternate runs and every week-over-week
# comparison is against a different arm.
arm_exit_usage_pct: 2
arm_exit_window_weeks: 8

# A census older than this is not evidence of anything current. Past it the
# roster falls back to "newest per tier" and says so, in words, in every arm's
# reason — degrading loudly rather than publishing a stale-usage roster that
# looks exactly like a fresh one.
census_max_age_days: 14

# A census can hold a nonzero ranked, attributable total that is still not
# enough to be evidence of anything — almost the whole fleet routed through
# Bedrock/Vertex/a proxy (landing under `other`) with one stray direct-API
# turn leaves `ranked_total` at 1, which used to read as CENSUS_FRESH and
# could retire a previous arm with no counted usage of its own at a false
# 0.0%. Below this many ranked, attributable turns over the window, the
# census falls back the same way an entirely-unranked one does. Applied per
# window, not only over the 8-week union: a handful of ranked turns can
# clear this floor over the union while the 4-week enter window carries
# next to none of them, which used to compute a false 100.0% entry share on
# one lone turn.
min_ranked_turns: 20

# ...and a RELATIVE floor beside the absolute one above: the ranked,
# attributable total must also be at least this fraction of the RAW window
# total. The absolute floor alone passes `{other: 100000/wk, some-model: 20
# turns total}` as usable evidence over 800,020 raw turns — 20 turns clears
# min_ranked_turns while being a vanishing fraction of what the fleet
# actually did, which used to retire a previous arm with no counted usage
# of its own at a literal 0.0%. Applied per window (enter AND exit), not
# only over the 8-week union: a handful of ranked turns elsewhere in the
# union can clear this floor while one window's OWN ranked/raw ratio still
# fails it — which used to compute a false 100.0% entry share on 25 turns
# out of 4,000,025 raw ones in the 4-week enter window alone.
min_ranked_share: 0.01

# `catalogue_seen` — the roster's record of every model id the Models API
# has EVER listed, across runs (see roster.py's module docstring, property
# 5) — lives in the COMMITTED `evals/roster.yml`, on `main`. `main` is
# ruleset-protected and pull-request-only, so an entry cannot appear there
# or vanish from there without a reviewed commit. That is
# docs/decisions/0001-roster-trusted-on-main.md, and it is what replaced
# reading the history back from `roster/latest.json` on `eval-results` —
# a branch other jobs on other machines write to, which this harness
# treated as untrusted input (issue #147).
#
# Every entry carries a `last_seen` date, refreshed to today whenever the
# Models API actually returns that id THIS run. An entry is DROPPED once
# its `last_seen` is older than this many days, and that is the ONLY way
# an entry leaves. Picked at roughly 6 months: long enough that a model
# still genuinely in occasional use across the harness's own weekly
# cadence keeps counting, short enough that an id nobody has observed in
# half a year stops propping up a denominator. This run's own live ids
# are never aged out (they get `last_seen` = today every run) — only
# accumulated history can be.
#
# WHAT USED TO SIT HERE, AND WHY IT IS GONE. Six review rounds of #129
# built machinery in this position and it is all deleted (ADR 0001,
# decision 4, which names each of the deleted constants by identifier —
# nothing else in the tree does, because a name that no longer resolves is
# a name a reader will go looking for):
#
#   * TWO EXEMPTIONS from the age — keep an entry this run's census still
#     names, and keep an entry the usage alias map needs as a HOP on the
#     chain from a census key to the numerator that collects its turns.
#     Both existed because `last_seen` was a field the untrusted previous
#     roster itself wrote, so a back-dated date could drop a real model's
#     turns out of the attributable denominator and no local rule could
#     tell that apart from an honest expiry. A `last_seen` is a date a
#     reviewer merged now, so there is only one reading of an old one left
#     — the true one — and an exemption exists to disbelieve a date.
#
#   * TWO 500-ENTRY LENGTH CAPS, one over each list, the two-tier ordering
#     they evicted by, and the 10,000-entry carry ceiling past which the
#     run refused to publish at all. They bounded an unbounded public input, and the
#     order they used — rank by the live catalogue and the census, carry
#     whole anything neither names — was built so that the writer of
#     `previous.json` could not choose its own survivors. The input is
#     bounded by review now, so every remaining effect of a cap was on
#     honest data: a repository with more than 500 genuinely observed
#     models would have had its own reviewed history evicted, by an order
#     chosen to defeat an attacker who can no longer write the file. The
#     denial-of-service the ceiling documented — 10,001 planted lines
#     refusing the refresh for good — goes with them, because those lines
#     would now have to be merged.
#
#   * THE ANCHORED DENOMINATOR, the retirement veto keyed on it, and the
#     count-only notice beside them.
#     They measured how much of a window's denominator rested on
#     `previous.json`. With `previous` reviewed, that fraction measures
#     how much of the usage belongs to models this repository has a merged
#     record of — so a veto keyed on it refuses precisely the honest case
#     (a real since-retired arm with in-window turns) and refuses nothing
#     an attacker can still reach, because the attacker's remaining reach
#     is the census, which sits in both denominators at once and cancels
#     out of the difference.
#
# THE ONE INPUT STILL WRITTEN BY ANOTHER MACHINE IS THE CENSUS.
# `.github/workflows/eval.yml` takes it from
# `origin/eval-results:usage/latest.json` — and takes the previous roster
# from the COMMITTED `evals/roster.yml` instead, which is the whole of
# #147: one write to `eval-results` used to grant both, and now it grants
# only this one. The census is trusted for nothing:
# it can shape a PROPOSAL and nothing else. What guards it is named rather
# than assumed — the freshness window and the ranked/raw floors below, the
# schema validation in `_clean_counts` (a bad row or cell is a named
# one-line skip, never a traceback and never an echoed value), and a SIZE
# BOUND, `CENSUS_MAX_KEYS` / `CENSUS_MAX_BYTES` in roster.py, past which
# the run refuses with a named error rather than let an untrusted document
# decide how much work it does.
#
# A FORGED CENSUS IS STILL A FORGED MEASUREMENT OF THE QUANTITY BEING
# MEASURED, and no ordering rule ever defended against that. What changed
# is what a forgery can reach: the roster it distorts is a proposal,
# published with each seat's numerator and denominator in words, pushed to
# the bot-owned `roster/proposal` branch and filed as one tracking issue.
# A person merges it or does not. The defence is that the distortion is
# visible in a diff on `main`'s history rather than silent on a branch
# nobody reads, and that reverting the merge undoes it — the two
# properties `eval-results` never had.
#
# Ageing out is not a repair, and that has not changed. It ends a plant's
# future effect; it does not undo a retirement the plant already caused —
# by the time it expires the model is no longer an arm, so the exit bar no
# longer applies to it and a trickle of real usage never re-seats it. It
# returns by clearing the ENTRY bar, by being the newest in its tier, or
# by hand.
catalogue_seen_max_age_days: 180
