# Model roster policy — the thresholds `harness/roster.py` reads.
#
# The roster answers "which models should this harness be running against
# today?" from two inputs: what the Models API says is AVAILABLE, and what the
# fleet is actually USING (the census published to `eval-results` as
# `usage/latest.json`). Arms pinned as literals in each fixture went stale
# silently — nothing here noticed when a model shipped or retired — which is
# the problem this file exists to close (#67).
#
# Rationale and the numbers' provenance belong in an ADR, not in a comment
# block: see ADR (to be written under #73) —
# https://github.com/Adam-S-Daniel/skills-evals/issues/73
#
# NO MODEL IDS LIVE HERE, deliberately, and none live in roster.py either. A
# tier is inferred from the family word in a model's own id, matched against
# the ladder below; that is the whole of the harness's model knowledge, and it
# is why a model that ships after this file was written needs no edit here.
# test/run_tests.py::TestIssue67::test_no_model_ids_are_hardcoded_outside_fixtures
# is the guard.

# Capability ladder, weakest rung first. A model's tier is the WEAKEST rung
# below whose word appears as a dash-separated token anywhere in its id —
# `rung_of()` walks the ladder from the top of this list down and returns on
# the first rung that matches, not the first word to appear positionally in
# the id string itself. A rung may be written as a bare word or as a LIST OF
# PEERS that rank identically — same tier, same price, different access
# programme — which is what `[fable, mythos]` is below.
#
# A model whose id carries none of these words is UNRANKED. It takes no roster
# seat, it is listed under `unranked` in the published roster with that reason,
# and — this is the part that bites — its usage is excluded from the share
# denominator. Leaving it in pushed every ranked model's share towards zero
# (measured: a model at 60 turns a week computed at 5.7% against 1000 unranked
# turns a week) and quietly emptied the arm set. Adding a rung here is how a
# new family becomes visible; there is nothing else to change.
tiers:
  - haiku
  - sonnet
  - opus
  - [fable, mythos]

# ASSUMPTION, recorded here because the code acts on it: an id that is another
# id plus a `-YYYYMMDD` suffix is a dated SNAPSHOT of that model, not a second
# model. Both are collapsed onto the undated alias for ranking, seating and
# usage — otherwise one model takes two arm seats and its usage splits across
# two census keys, halving both shares. The collapse only happens when the
# undated alias is itself in the catalogue; a catalogue that publishes only
# dated ids has nothing to collapse onto and every id stands on its own.

# A since-retired model's usage still counts toward the denominator when
# this harness's own history says it was once in the catalogue: the
# published roster carries `catalogue_seen`, the union of every id the
# Models API has ever listed across runs. A model's usage stops counting
# only once no run has ever observed it — FIRST-RUN CAVEAT: with no
# `catalogue_seen` history yet (a genuine first run, or a previous roster
# that could not be read), a model retired before this harness's first run
# is unattributable, and its usage silently drops from the denominator
# until a run observes it directly. An earlier approach inferred this from
# the id's SHAPE instead; withdrawn because shape cannot tell a
# since-retired real model from a plausibly-named proxy alias.

# A model becomes an arm if it carries at least this share of census usage
# over the trailing window...
arm_enter_usage_pct: 10
arm_enter_window_weeks: 4

# ...or if it is the newest model in its tier AND has been out at least this
# long. The cooling-off is the fleet's standing convention for new versions:
# day-one models move, and a roster that chases them re-baselines the eval
# every week.
cooling_off_days: 7

# An arm keeps its seat until it falls under this share for the whole trailing
# window (or disappears from the Models API, which is immediate). Hysteresis,
# not a second entry bar: without it a model hovering at the entry threshold
# joins and leaves the arm set on alternate runs and every week-over-week
# comparison is against a different arm.
arm_exit_usage_pct: 2
arm_exit_window_weeks: 8

# A census older than this is not evidence of anything current. Past it the
# roster falls back to "newest per tier" and says so, in words, in every arm's
# reason — degrading loudly rather than publishing a stale-usage roster that
# looks exactly like a fresh one.
census_max_age_days: 14

# A census can hold a nonzero ranked, attributable total that is still not
# enough to be evidence of anything — almost the whole fleet routed through
# Bedrock/Vertex/a proxy (landing under `other`) with one stray direct-API
# turn leaves `ranked_total` at 1, which used to read as CENSUS_FRESH and
# could retire a previous arm with no counted usage of its own at a false
# 0.0%. Below this many ranked, attributable turns over the window, the
# census falls back the same way an entirely-unranked one does. Applied per
# window, not only over the 8-week union: a handful of ranked turns can
# clear this floor over the union while the 4-week enter window carries
# next to none of them, which used to compute a false 100.0% entry share on
# one lone turn.
min_ranked_turns: 20

# ...and a RELATIVE floor beside the absolute one above: the ranked,
# attributable total must also be at least this fraction of the RAW window
# total. The absolute floor alone passes `{other: 100000/wk, some-model: 20
# turns total}` as usable evidence over 800,020 raw turns — 20 turns clears
# min_ranked_turns while being a vanishing fraction of what the fleet
# actually did, which used to retire a previous arm with no counted usage
# of its own at a literal 0.0%. Applied per window (enter AND exit), not
# only over the 8-week union: a handful of ranked turns elsewhere in the
# union can clear this floor while one window's OWN ranked/raw ratio still
# fails it — which used to compute a false 100.0% entry share on 25 turns
# out of 4,000,025 raw ones in the 4-week enter window alone.
min_ranked_share: 0.01

# `catalogue_seen` (the published roster's record of every model id the
# Models API has EVER listed, across runs — see roster.py's module
# docstring, property 5) is read back from `previous.json` on
# `eval-results`, a branch OTHER JOBS ON OTHER MACHINES write to and this
# harness treats as untrusted input, not an invariant. Every entry carries
# a `last_seen` date, refreshed to today whenever the Models API actually
# returns that id THIS run; an id that stops being genuinely observed
# — including one planted directly on the branch, which the Models API
# will never return — ages out and is dropped once its `last_seen` is
# older than this many days. Without an age at all, a single planted id
# stayed attributable forever and was republished by this harness as its
# own output on every later run, diluting a real held-over arm's measured
# share to a false 0.1% and retiring it on no evidence — reverting the
# plant on the branch did not undo that, because the harness's own prior
# output had already carried it forward. Picked at roughly 6 months: long
# enough that a model still genuinely in occasional use across the
# harness's own weekly cadence keeps counting, short enough that a
# one-time plant cannot persist indefinitely. This run's own live ids are
# never aged out by this (they get `last_seen` = today every run) — only
# accumulated history can. See also the length cap in roster.py's
# `CATALOGUE_SEEN_CAP` (currently 500 entries, oldest-by-id-sorted-out
# first among non-live entries; this run's own live ids are exempt from
# it too). The previous roster's `arms` list is capped the same way, at
# the same 500, by roster.py's `PREVIOUS_ARMS_CAP` (N3, #129 review round
# 6) — neither list has any other bound on how large a public branch
# could otherwise grow it.
catalogue_seen_max_age_days: 180
