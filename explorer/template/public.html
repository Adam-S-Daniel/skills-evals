<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evals Explorer</title>
<style>
/*__CSS__*/
:root {
  color-scheme: light;
  /* Cold white poster stock, jet ink and three spot inks (cobalt, magenta,
     teal) that are also the chart series. */
  --page: #E8ECF1;
  --surface: #FFFFFF;
  --ink: #0A0C12;
  --ink-2: #2F3644;
  --muted: #535B6A;
  --axis: #737B8C;
  --grid: #D3D9E1;
  --base: #B4BCC8;
  --ring: #0A0C12;
  --s1: #1F3AE0;
  --s2: #B80F78;
  --s3: #006E7A;
  --good: #17702A;
  --good-ink: #125C22;
  --warning: #8A4F00;
  --critical: #C4160F;
  --link: #1A30C4;
  --chip-bg: #DCE2EA;
  --hover: #DDE4FA;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    /* The same poster under blacklight: the inks glow on blue-black. */
    --page: #090A10;
    --surface: #12141D;
    --ink: #F1F3F8;
    --ink-2: #C2C7D4;
    --muted: #9299AB;
    --axis: #6D7488;
    --grid: #232736;
    --base: #343A4D;
    --ring: #434A60;
    --s1: #7090FF;
    --s2: #FF5FB6;
    --s3: #2ED3CC;
    --good: #72DC62;
    --good-ink: #8BE87C;
    --warning: #FFC044;
    --critical: #FF6A55;
    --link: #93AAFF;
    --chip-bg: #1A1D29;
    --hover: #191D30;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #090A10;
  --surface: #12141D;
  --ink: #F1F3F8;
  --ink-2: #C2C7D4;
  --muted: #9299AB;
  --axis: #6D7488;
  --grid: #232736;
  --base: #343A4D;
  --ring: #434A60;
  --s1: #7090FF;
  --s2: #FF5FB6;
  --s3: #2ED3CC;
  --good: #72DC62;
  --good-ink: #8BE87C;
  --warning: #FFC044;
  --critical: #FF6A55;
  --link: #93AAFF;
  --chip-bg: #1A1D29;
  --hover: #191D30;
}
/* The page color fills the whole window, outside the column and below short
   pages. Flat: nothing sits behind the charts. */
html { -webkit-text-size-adjust: 100%; background: var(--page); min-height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); min-height: 100vh; }
</style>
</head>
<body>
<main id="app" class="ex">
  <h1>Evals Explorer</h1>
  <p id="loading">Loading the latest results.</p>
</main>
<div class="ex-tip" id="tip" role="tooltip" hidden></div>
<noscript>
  <div style="max-width:640px;margin:16px auto;padding:16px">
    This page needs JavaScript to read the latest test results and draw its charts.
    Please turn JavaScript on, or read the raw results file at
    {{DATA_URL}}
  </div>
</noscript>
<script>
/*__BUNDLE__*/
</script>
</body>
</html>
