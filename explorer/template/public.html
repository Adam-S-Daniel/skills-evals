<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evals Explorer</title>
<style>
/*__CSS__*/
:root {
  color-scheme: light;
  /* A lab notebook on graph paper: warm paper, blue-black ink and three pens
     (teal, vermilion, olive) that are also the chart series. */
  --page: #F3F0E6;
  --surface: #FBFAF5;
  --ink: #17252A;
  --ink-2: #3D4B4F;
  --muted: #5B6769;
  --axis: #7A8481;
  --grid: #E3DFD2;
  --base: #D3CEBD;
  --ring: #DCD7C7;
  --s1: #1B6E78;
  --s2: #C2502A;
  --s3: #5E7F2E;
  --good: #3D7D3A;
  --good-ink: #2E672B;
  --warning: #8A5808;
  --critical: #B53F28;
  --link: #17636C;
  --chip-bg: #ECE8DB;
  --hover: #EEEADD;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    /* The same pens glowing on a bench-black instrument panel. */
    --page: #0F1614;
    --surface: #16201D;
    --ink: #E2ECE5;
    --ink-2: #B6C5BC;
    --muted: #8E9F95;
    --axis: #6C7D75;
    --grid: #22302B;
    --base: #33443D;
    --ring: #27352F;
    --s1: #5CC8C0;
    --s2: #F08A5D;
    --s3: #A9CF6A;
    --good: #8FD180;
    --good-ink: #A6E097;
    --warning: #E3B261;
    --critical: #F07B62;
    --link: #7FD6CF;
    --chip-bg: #1D2925;
    --hover: #1B2622;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0F1614;
  --surface: #16201D;
  --ink: #E2ECE5;
  --ink-2: #B6C5BC;
  --muted: #8E9F95;
  --axis: #6C7D75;
  --grid: #22302B;
  --base: #33443D;
  --ring: #27352F;
  --s1: #5CC8C0;
  --s2: #F08A5D;
  --s3: #A9CF6A;
  --good: #8FD180;
  --good-ink: #A6E097;
  --warning: #E3B261;
  --critical: #F07B62;
  --link: #7FD6CF;
  --chip-bg: #1D2925;
  --hover: #1B2622;
}
/* The page color fills the whole window, outside the column and below short
   pages, ruled as faint graph paper in the first pen's color. */
html { -webkit-text-size-adjust: 100%; background: var(--page); min-height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); min-height: 100vh;
  background-image: linear-gradient(color-mix(in srgb, var(--s1) 6%, transparent) 1px, transparent 1px),
    linear-gradient(90deg, color-mix(in srgb, var(--s1) 6%, transparent) 1px, transparent 1px);
  background-size: 24px 24px; background-position: -1px -1px; }
</style>
</head>
<body>
<main id="app" class="ex">
  <h1>Evals Explorer</h1>
  <p id="loading">Loading the latest results.</p>
</main>
<div class="ex-tip" id="tip" role="tooltip" hidden></div>
<noscript>
  <div style="max-width:640px;margin:16px auto;padding:16px">
    This page needs JavaScript to read the latest test results and draw its charts.
    Please turn JavaScript on, or read the raw results file at
    {{DATA_URL}}
  </div>
</noscript>
<script>
/*__BUNDLE__*/
</script>
</body>
</html>
