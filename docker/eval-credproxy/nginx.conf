# Credential-injecting reverse proxy for the eval-runner: the arm's CLI sets
# ANTHROPIC_BASE_URL=http://<this sidecar>:8080 and holds only a dummy token;
# every request leaves here with `Authorization: Bearer <the real token>`,
# which only this container can read. The log records header PRESENCE and
# whether the arm's header was the dummy, never a value.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }

http {
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server_tokens off;

    map $http_authorization $auth_in { "" "absent"; "Bearer dummy-not-a-token" "dummy"; default "other"; }
    map $http_x_api_key $api_key_in { "" "absent"; default "present"; }
    log_format inject escape=json
        '{"time":"$time_iso8601","method":"$request_method","path":"$uri",'
        '"status":$status,"upstream_status":"$upstream_status",'
        '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
        '"authorization_in":"$auth_in","x_api_key_in":"$api_key_in",'
        '"anthropic_beta":"$http_anthropic_beta","anthropic_version":"$http_anthropic_version",'
        '"user_agent":"$http_user_agent","host_in":"$http_host"}';
    access_log /dev/stdout inject;

    # Docker's embedded DNS; this container is also on a network with a route
    # out, so it forwards external names.
    resolver 127.0.0.11 valid=300s ipv6=off;

    server {
        listen 8080;
        client_max_body_size 64m;

        # Only the Messages API the CLI's model calls use (measured on
        # CLI 2.1.318 with CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1: POST
        # /v1/messages only), so an arm cannot spend the token on any other
        # endpoint through this proxy.
        location / {
            return 403;
        }

        location ~ ^/v1/messages(/count_tokens)?$ {
            limit_except POST { deny all; }
            set $api_upstream https://api.anthropic.com;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host api.anthropic.com;
            proxy_set_header Connection "";
            proxy_set_header X-Api-Key "";
            include /tmp/credproxy/authorization.conf;
            proxy_ssl_server_name on;
            proxy_ssl_name api.anthropic.com;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 900s;
            proxy_send_timeout 900s;
        }
    }
}
