# Registry name -> URL -> skill-directory layout, for resolving the
# `with_skill` arm's skill dir across every registry layout the fleet uses.
#
# Seeded from agentskills' scripts/skills_registries.yml (agentskills#55) but
# NOT imported from it at run time: this harness must resolve using only its
# own checkout plus the registry under test, so `url` and `layout` are kept
# in step by hand. test/run_tests.py::TestIssue63 asserts the two agree on
# names and layouts whenever an agentskills checkout is present as a sibling
# of this repo, and skips (with a printed reason, never silently) otherwise.
#
# `url` matches a fixture's `registry:` field. `layout` is a glob ending in
# `*/SKILL.md`; the `*` immediately before `SKILL.md` (the second-to-last
# path segment) is the skill-name placeholder substituted by `_skill_md_glob`
# in harness/run_eval.py, any earlier `*` (a bundle/plugin name) stays a
# wildcard.
registries:
  - name: agentskills
    url: https://github.com/Adam-S-Daniel/agentskills
    layout: "plugins/*/skills/*/SKILL.md"
  - name: cms-platform
    url: https://github.com/Adam-S-Daniel/cms-platform
    layout: "skills/*/SKILL.md"
  - name: adamdaniel.ai
    url: https://github.com/Adam-S-Daniel/adamdaniel.ai
    layout: ".claude/skills/*/SKILL.md"
  - name: agentskills-private
    url: https://github.com/Adam-S-Daniel/agentskills-private
    layout: "plugins/*/skills/*/SKILL.md"
